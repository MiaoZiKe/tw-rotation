# 還沒驗證的改動（唯一一份）
#
# 為什麼有這個檔（Andy 2026-09-21）
# ----------------------------------
# > 「我想要把效率的問題處理…你改完之後可以先不用推上去，先在 Claude 這邊展示給我，
# >   並且還沒驗證的部分先記錄下來，並且接下來都會持續紀錄哪些沒有驗證，
# >   之後我說驗證，再全部一起執行。初步功能我先人為測試，我確認後你再看細項」
#
# 所以流程變成：
#   改 → `python scripts/_show.py` 截圖給他看 → 他說「這樣對」→ **登記在這裡** →
#   累積 → 他說「驗證」→ 一次把所有該跑的段落跑完 → 推 → 清空這個檔
#
# ★ 沒有推上去的東西，在這個容器被回收之後就不見了。
#   所以「先不推」＝「先推到 wip 分支」（`claude/wip`）——
#   `pages.yml` 只在 main 觸發，推 wip 不會部署、也不會動到他看的網站。
#
# 欄位：
#   id       流水號
#   what     改了什麼（一句話，用 Andy 看得懂的話）
#   files    動到哪些檔
#   gates    「驗證」時要跑哪些（pytest / preview / 段落名，照 CLAUDE.md 的對照表挑）
#   shown    已經截圖給他看過了嗎（true/false）
#   ok       他看過說對了嗎（true/false/null＝還沒回）
#   at       登記時間

