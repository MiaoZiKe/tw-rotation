    shot: 2026-09-19-A4-輪動時鐘.png
    note: >-
      八條全做完。★ 第 8 條「一天的差距卻歪曲」的根因**跟我原本的假設不同** ——
      我猜是 rs_mom 的 5 日窗口太短，實測把它拉到 10/20/30 日，一日步長完全沒變
      （中位數都是 1.60），因為 Δrs_ratio ≈ rs 的當日報酬，跟窗口長度無關。
      真正的兩個根因：(1) rs 的日報酬根本沒被平滑就直接畫上去；
      (2) rs_mom 幾乎是 rs_ratio 的複製品（Δ 相關係數 +0.90），兩個軸是同一個數字，
      點只會沿 45 度對角線來回彈、根本不會繞圈。
      改成標準 RRG 兩層：rs 先 EMA(10) → RS-Ratio 相對 SMA(40) → RS-Momentum 用 ROC(10)。
      一日步長（以盤緣為 1）中位數 0.1272 → 0.0431，最大 0.8898 → 0.2838，
      30 天軌跡直線度 0.07 → 0.38。
      順便修掉一個真 bug：後端 trail 只存 30 筆，前端取「第 30 天前」索引會是 -1 →
      拉到最大值大圈會默默停在今天，看起來就像拉 Bar 壞了。改存 31 筆。

