#
# 為什麼用 YAML 而不是直接寫 Markdown（2026-09-20）
# ------------------------------------------------
# Andy 選了「在網站上多一頁任務板」，所以同一份資料要出現在兩個地方：
# 網站的 #tasks 頁，以及 obsidian/100-任務板.md。
# 兩邊各維護一份，第三天就會對不起來 —— 所以這裡是唯一的來源，
# 網站的 JSON 由 build_payload 產出，Markdown 由 scripts/gen_taskboard.py 產出。
#
# status 只准這五種（跟 obsidian/000-開始這裡.md 的規則一致）：
#   todo    ⬜ 未開始
#   doing   🔵 進行中
#   review  🟡 改完待驗／待推   ★「改完但還沒 push」一律是這個，不准標 done
#   done    ✅ 已上線
#   blocked ⛔ 被擋住
#
# 欄位：
#   id       編號（Andy 講話時用的那個，例如 A4、C3）
#   title    需求，**用 Andy 的原話**，不要改寫成我自己的講法
#   status   上面五種
#   files    改到哪些檔
#   spent    花了多久（人話，例如「agent 56 分 ＋ 整合 25 分」）
#   note     做到哪／卡在什麼／代價是什麼
#   shot     截圖檔名（放在 obsidian/attachments/）
#   ask      要 Andy 回答或動手的事

