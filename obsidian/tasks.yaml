tasks:
  - id: E1
    title: "軌跡線不能比圓圈還動的快"
    status: doing
    files: [site/app.js, scripts/_uitest.py]
    shot: 2026-09-21-E1-輪動時鐘軌跡線.png
    note: >-
      根因已量出來（不是猜的）：尾巴是 line series，時間軸每前進一天，
      `trail(r)` 回傳的**點數會變多**（實測 span=5 是 259 點、span=10 是 519 點）。
      ECharts 在 merge 更新時只補間「新舊都存在的索引」，新長出來那一段沒有舊位置可對應，
      所以尾巴尖端**瞬移**到新那一天，而大圈是 420ms linear 慢慢補過去 —— 看起來就是線比圓圈快。
      修法：讓 `trail()` 永遠回傳**固定點數**（重取樣），每個索引都有新舊對應，
      整條線就會跟大圈用同一個 duration 一起滑。
