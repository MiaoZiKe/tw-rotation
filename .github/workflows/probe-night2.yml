name: 臨時探測 夜盤轉打（probe/night2）
on:
  push:
    branches: ["probe/night2"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: curl 標頭與內容
        continue-on-error: true
        run: |
          set +e
          for u in https://miaozike.github.io/tw-rotation/taifex_bridge.html https://liguligu-puipui.com/taifex_bridge.html https://liguligu-puipui.com/ https://miaozike.github.io/tw-rotation/; do
            echo "=== HEAD $u"; curl -sS -I -L --max-time 20 "$u" | grep -iE "^(HTTP|content-type|x-frame|content-security|location|cache-control|age|last-modified|cross-origin|permissions-policy|referrer)" ; done
          echo "=== BODY github.io bridge"; curl -sS -L --max-time 20 https://miaozike.github.io/tw-rotation/taifex_bridge.html | head -c 3000; echo
          echo "=== _headers"; curl -sS --max-time 20 https://liguligu-puipui.com/_headers | head -40
          for o in https://miaozike.github.io https://liguligu-puipui.com; do for path in "/fut?session=night" "/futchart?symbol=TXFK6-M" "/fut?session=day"; do
            echo "=== Deno $path Origin=$o"; curl -sS -D - -o /tmp/b --max-time 20 -H "Origin: $o" "https://tw-taifex.miaozike.deno.net$path" | grep -iE "^(HTTP|access-control)"; head -c 300 /tmp/b; echo; done; done
          echo "=== Deno OPTIONS"; curl -sS -D - -o /dev/null -X OPTIONS -H "Origin: https://miaozike.github.io" -H "Access-Control-Request-Method: GET" https://tw-taifex.miaozike.deno.net/fut?session=night | grep -iE "^(HTTP|access-control)"
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 裝 Playwright
        run: pip install playwright==1.48.0 && python -m playwright install --with-deps chromium webkit
      - name: 真實瀏覽器（強制夜盤）
        continue-on-error: true
        env: { OUT: out_force, FORCE: "1" }
        run: python probe/live_probe.py
      - name: WebKit iPhone 13（不強制時鐘）
        continue-on-error: true
        env: { OUT: out_webkit, FORCE: "1", BRW: webkit, DEV: "iPhone 13", WAIT: "25000" }
        run: python probe/live_probe.py
      - name: Chromium 手機 + 舊合約代號 TXFJ6-M
        continue-on-error: true
        env: { OUT: out_oldsym, FORCE: "1", DEV: "Pixel 7", WAIT: "25000", EXTRA_LS: '{"tw.m3.futsym":"TXFJ6-M"}' }
        run: python probe/live_probe.py
      - name: 存結果到 probe-log 分支
        if: always()
        run: |
          git config user.name probe-bot; git config user.email probe@users.noreply.github.com
          mkdir -p /tmp/keep && cp -r out_* /tmp/keep/ 2>/dev/null || true
          git checkout --orphan probe-log/night2-${{ github.run_id }}
          git rm -rfq . >/dev/null 2>&1 || true
          cp -r /tmp/keep/* . 2>/dev/null || true
          git add -A && git commit -qm "probe night2 ${{ github.run_id }}" && git push -q origin HEAD
