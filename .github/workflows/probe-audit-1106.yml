name: 臨時稽核 11-06（probe 分支專用，不合併）
on:
  push:
    branches: ["probe/audit-1106"]
    paths: ["probe_audit/**", ".github/workflows/probe-audit-1106.yml"]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: probe/audit-1106
          sparse-checkout: |
            probe_audit
            .github
      - name: 第三輪補查（當沖、法人）
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python3 probe_audit/fetch3.py
        continue-on-error: true
      - name: 打包帶回
        run: |
          cat raw3/status.txt
          tar czf probe_audit/raw3.tgz raw3
          git config user.name "audit-bot"; git config user.email "audit-bot@users.noreply.github.com"
          git add probe_audit/raw3.tgz
          git commit -m "稽核原始資料 $(TZ=Asia/Taipei date '+%F %T')（臨時，不合併）"
          git push origin HEAD:probe/audit-1106
