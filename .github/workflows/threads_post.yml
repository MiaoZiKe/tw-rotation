name: Threads 排程發文

# 每 15 分鐘看一次 social/threads/queue/：只發「status: approved 且 publish_at 已到」的檔案。
# 金鑰只用 GitHub Secret THREADS_ACCESS_TOKEN，不寫進任何檔案或 log。
# 失敗不重發（避免重複貼文）：檔案標成 status: error，工作流程以失敗結束，GitHub 會寄通知。
# GitHub 的排程可能延遲數分鐘到十幾分鐘，這是平台特性，不是 bug。
on:
  schedule:
    - cron: "*/15 * * * *"
    # 保險：固定時點（台北 08:50、12:31、18:00、20:30、21:00 附近，分散避開整點壅塞）。
    # 每個時點前後各挑一兩個時刻；GitHub 延遲時至少有一輪會落在附近。
    - cron: "47 0 * * 1-5"    # 台北 08:47
    - cron: "53 0 * * 1-5"    # 台北 08:53
    - cron: "28 4 * * 1-5"    # 台北 12:28
    - cron: "34 4 * * 1-5"    # 台北 12:34
    - cron: "57 9 * * 1-5"    # 台北 17:57
    - cron: "3 10 * * 1-5"    # 台北 18:03
    - cron: "27 12 * * 1-5"   # 台北 20:27
    - cron: "33 12 * * 1-5"   # 台北 20:33
    - cron: "57 12 * * 1-5"   # 台北 20:57
    - cron: "3 13 * * 1-5"    # 台北 21:03
  workflow_dispatch:
    inputs:
      file:
        description: "只處理這個檔名（queue 內，例如 2026-10-25_test.md）；留空＝全部到點的"
        type: string
        default: ""
      now:
        description: "忽略 publish_at，立刻發（檔案仍須是 status: approved）"
        type: boolean
        default: false
      wait_max:
        description: "publish_at 還沒到時，job 內最多等幾分鐘（上限 20）；0＝不等"
        type: string
        default: "0"

# 備援：寫 queue 的流程（social_news／social_daily）結束時會用 gh workflow run 直接叫醒本流程，
# 並帶 wait_max=20：publish_at 還沒到但 20 分鐘內會到的，job 內等到點再發；更久的交給下一輪。
# 發文流程自己一個 group（不要和每日資料管線共用鎖，否則會被它卡住好幾十分鐘）；寫回 queue 時用 pull --rebase 重試處理 push 衝突。
concurrency:
  group: social-post-threads
  cancel-in-progress: false

permissions:
  contents: write     # 只為了把發文結果（status: posted／error）寫回 queue 檔

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 先檢查格式（不連外）
        run: python scripts/threads_post.py --check

      - name: 發出到點且已核准的貼文
        id: post
        continue-on-error: true
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          IN_FILE: ${{ inputs.file }}
          IN_NOW: ${{ inputs.now }}
          IN_WAIT: ${{ inputs.wait_max }}
        run: |
          args=""
          if [ -n "$IN_FILE" ]; then args="$args --file $IN_FILE"; fi
          if [ "$IN_NOW" = "true" ]; then args="$args --now"; fi
          case "$IN_WAIT" in ''|*[!0-9.]*) ;; *) args="$args --wait-max $IN_WAIT" ;; esac
          python scripts/threads_post.py $args

      - name: 回寫發文結果（只 add queue）
        if: always()
        run: |
          git config user.name  "tw-rotation-bot"
          git config user.email "actions@github.com"
          git add social/threads/queue
          if git diff --staged --quiet; then
            echo "沒有變動，跳過 commit"
            exit 0
          fi
          git commit -m "Threads 發文結果 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3 4; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && break
            sleep $((i*2))
          done

      - name: 發文失敗就讓整個流程失敗（會收到 GitHub 通知）
        if: steps.post.outcome == 'failure'
        run: |
          echo "發文失敗，請看上一步的訊息；檔案已標 status: error"
          exit 1
