name: probe tape gap
on:
  push:
    branches: ["probe/**"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/probe_tape_gap.py
            data/tape_5m
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install yfinance pandas pyarrow requests
      - name: probe
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python scripts/probe_tape_gap.py
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with: { name: tape-gap-probe, path: probe_out/ }
