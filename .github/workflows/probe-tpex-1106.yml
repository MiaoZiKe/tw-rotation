name: probe-tpex-1106
on:
  push:
    branches: [probe/tpex-1106]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          python3 - <<'PY'
          import json, re, time, requests
          H={"User-Agent":"Mozilla/5.0","Accept":"application/json","Referer":"https://www.tpex.org.tw/"}
          for p in ("tpex_mainboard_margin_balance","tpex_margin_trading_margin_used","tpex_margin_trading_short_sell","tpex_short_sell"):
              for t in range(4):
                  try:
                      j=requests.get("https://www.tpex.org.tw/openapi/v1/"+p,headers=H,timeout=60).json(); break
                  except Exception as e: j=str(e)[:80]
              if isinstance(j,list):
                  print("EP",p,"n=",len(j)); print("EP0",json.dumps(j[0],ensure_ascii=False)[:700]); print("EPL",json.dumps(j[-1],ensure_ascii=False)[:400])
              else: print("EP",p,j)
          PY
