name: 部署 Worker（即時報價代理）

# 把 workers/quote-proxy/worker.js 自動部署到 Cloudflare，取代「到 dash 手動重貼再按 Deploy」。
#
# 為什麼要有這條：即時報價那一層是 Cloudflare Worker（瀏覽器抓不到 mis.twse.com.tw，被 CORS 擋，
# 中間要有一手代理）。以前 worker.js 一改，Andy 就得自己開 dash.cloudflare.com →
# Workers → tw-quote → Edit code → 全選刪掉 → 貼上 → Deploy。
# 2026-09-14 與 09-15 兩批都栽在這裡：程式碼推上去了、Worker 還是舊版，
# 網站上三張大盤圖直接不出現（market3.js 會印「Worker 還是舊版（只有 /quote）」）。
#
# ★ 沒設金鑰時「跳過並印出待辦」，不要紅燈（Andy 2026-09-18 指定，同 data-steward 的三態原則）：
#   「沒設定」「還沒到」「真的壞了」要分得開 —— 天天紅燈就再也沒人看紅燈。

on:
  push:
    branches: [main]
    paths: ['workers/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 金鑰還沒設的時候不要紅燈：印出待辦、正常結束
      - id: guard
        name: 檢查 Cloudflare 金鑰
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # ★ 要講出「缺的是哪一個」。2026-09-18 踩到：Andy 說「都好了」但這步還是跳過，
          #   而摘要只寫「缺少 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID」這句死字串，
          #   看不出到底是哪一個沒設、還是兩個都沒設，等於要他自己一個一個猜。
          miss=""
          [ -z "$CF_TOKEN" ] && miss="$miss CLOUDFLARE_API_TOKEN"
          [ -z "$CF_ACCOUNT" ] && miss="$miss CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$miss" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "缺少：$miss"
            {
              echo "### Worker 尚未自動部署"
              echo ""
              echo "**缺少這些 Secret：**$miss"
              echo ""
              echo "設定位置：Settings → Secrets and variables → Actions → New repository secret。"
              echo "注意名稱大小寫要一模一樣，而且要放在 **Repository secrets**（不是 Environment secrets、也不是 Variables）。"
              echo "在那之前，worker.js 的改動要到 Cloudflare 手動重貼才會生效。"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 部署
        if: steps.guard.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/quote-proxy

      - name: 驗證真的活著
        if: steps.guard.outputs.ok == 'true'
        run: |
          sleep 5
          code=$(curl -s -o /tmp/q.json -w '%{http_code}' \
            "https://tw-quote.kcq01010909.workers.dev/quote?ex_ch=tse_2330.tw")
          echo "HTTP $code"
          head -c 300 /tmp/q.json
          test "$code" = "200"
          grep -q '"c"' /tmp/q.json
          echo "### Worker 部署成功並回得出報價" >> "$GITHUB_STEP_SUMMARY"
