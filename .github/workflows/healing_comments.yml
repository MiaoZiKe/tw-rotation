name: healing_comments
# 頻道④「談晴說礙」IG：讀主留言 → 檢查有沒有追蹤 → 自動私訊（Private Replies）。
# 2026-11-08 Andy：「讀主留言我自動傳訊息功能，傳之前還會檢查是否有追蹤」。說明：docs/marketing/channels/healing/comment_dm.md
# - 輪詢（不用 webhook、免架伺服器）：主力是 gh-cron Worker 每 10 分鐘派一次（2026-11-20 起，xx:x4，dry_run=false）；下面的 GitHub 排程只是保底（實測 6～9 小時才跑一次）。
# - 設定 docs/marketing/channels/healing/dm_config.json（enabled／only_followers／unknown_follow／max_per_run／文案）。
# - 沒有權杖 → 空跑、以成功結束，摘要寫「等待權杖」。
# - 紀錄 state/comments_dm.json 只存留言編號雜湊、時間、結果（不存留言全文與使用者名稱），寫回 main。
# - 自傷關鍵字 → 改送關懷資源訊息，摘要與 ::warning:: 提醒 CEO 依 legal.md 2-7 人工處理。
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "空跑（true＝只讀留言、印出會做什麼，不私訊、不寫紀錄；false＝真的私訊）"
        type: boolean
        default: true
permissions:
  contents: write   # 把 state/comments_dm.json 推回 main（不含權杖）
concurrency:
  group: healing_comments
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # 2026-11-20 只拉程式與設定，不拉資料湖和影音圖檔（整包 2.9GB、checkout 要 100 秒以上；留言要 10 分鐘內回，工作流要輕）
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/
            !/site/
            !*.mp4
            !*.mov
            !*.jpg
            !*.jpeg
            !*.png
            !*.webp
            !*.gif
            !*.parquet
            !*.zip
            !*.pdf
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q requests
      - name: 判斷空跑
        id: mode
        run: |
          DRY=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" != "false" ]; then DRY="--dry-run"; fi
          echo "dry=$DRY" >> "$GITHUB_OUTPUT"
      - name: 讀留言、查追蹤、私訊（失敗會紅燈）
        env:
          HEALING_IG_ACCESS_TOKEN: ${{ secrets.HEALING_IG_ACCESS_TOKEN }}
          HEALING_IG_ACCESS_TOKEN_AUTO: ${{ secrets.HEALING_IG_ACCESS_TOKEN_AUTO }}
          HEALING_IG_USER_ID: ${{ secrets.HEALING_IG_USER_ID }}
          # 2026-11-16 專屬留言關鍵字：Threads 沒有私訊 API，設了 comment_keyword 的貼文改公開回覆（threads_read_replies／threads_manage_replies）
          HEALING_THREADS_ACCESS_TOKEN: ${{ secrets.HEALING_THREADS_ACCESS_TOKEN }}
          HEALING_THREADS_ACCESS_TOKEN_AUTO: ${{ secrets.HEALING_THREADS_ACCESS_TOKEN_AUTO }}
          HEALING_THREADS_USER_ID: ${{ secrets.HEALING_THREADS_USER_ID }}
        run: python scripts/healing_comments.py ${{ steps.mode.outputs.dry }}
      - name: 私訊紀錄寫回 main（只有雜湊、時間、結果，沒有權杖）
        if: always() && steps.mode.outputs.dry == ''
        env:
          D: docs/marketing/channels/healing/state
        run: |
          FILES=""
          for f in comments_dm.json threads_replied.json; do [ -f "$D/$f" ] && FILES="$FILES $f"; done
          [ -n "$FILES" ] || { echo "沒有紀錄檔（等待權杖或本輪沒動）"; exit 0; }
          git config user.name  "tw-rotation-bot"
          git config user.email "actions@github.com"
          MSG="談晴說礙：留言私訊紀錄 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          for f in $FILES; do cp "$D/$f" "$RUNNER_TEMP/$f"; git add -- "$D/$f"; done
          if git diff --staged --quiet; then echo "沒有變動"; exit 0; fi
          git commit -q -m "$MSG"
          for i in 1 2 3 4; do
            if git push origin HEAD:main; then echo "推送成功"; exit 0; fi
            sleep $((2 ** i))
            git fetch -q origin main && git reset -q --hard origin/main
            mkdir -p "$D"
            for f in $FILES; do cp "$RUNNER_TEMP/$f" "$D/$f"; git add -- "$D/$f"; done
            git diff --staged --quiet && { echo "遠端已是同一份"; exit 0; }
            git commit -q -m "$MSG"
          done
          echo "::error::推不上 main"; exit 1
