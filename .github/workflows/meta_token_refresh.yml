name: meta_token_refresh
# 2026-11-01 Andy：「好像可以幫忙免費自動發文 不用 60 天後 重新申請權杖一次」
# Meta（Threads／IG；頻道①、②TC、④談晴說礙、TECH／CAFFAINE）長效權杖每週自動續期一次（官方：滿 24 小時、未過期即可再延 60 天）。
# 設計與風險：docs/security/20261101_meta_token_refresh.md
# - 權杖只在環境變數；腳本對每個值印 ::add-mask::，log 只有狀態與天數。
# - Meta 回傳新字串時，用 META_SECRETS_PAT（只限本 repo、只有 Secrets 讀寫）寫回 *_ACCESS_TOKEN_AUTO；
#   Andy 原本設的 THREADS_ACCESS_TOKEN／IG_ACCESS_TOKEN 永遠不動。
# - 手動觸發預設 dry_run＝true：只用 /me 驗證權杖能用，不續期、不寫回、不寫狀態檔。
on:
  schedule:
    - cron: "23 2 * * 0"   # 每週日 02:23 UTC＝台北 10:23（避開盤前／盤中／盤後發文時段）
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只驗證不續期（true＝安全試跑；false＝真的續期並寫回）"
        type: boolean
        default: true
permissions:
  contents: write   # 把 data/_state/meta_token.json 推回 main（不含權杖）
  issues: write     # 到期前 10 天仍未續期成功 → 開 issue 提醒（GitHub 會寄信給 repo 擁有者）
concurrency:
  group: meta-token-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q requests
      - name: 續期（失敗會紅燈）
        id: r
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_ACCESS_TOKEN_AUTO: ${{ secrets.THREADS_ACCESS_TOKEN_AUTO }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_ACCESS_TOKEN_AUTO: ${{ secrets.IG_ACCESS_TOKEN_AUTO }}
          # 2026-11-08 頻道④談晴說礙（docs/marketing/channels/healing/auto_post.md）：一起續期，新字串寫回 HEALING_*_ACCESS_TOKEN_AUTO
          HEALING_THREADS_ACCESS_TOKEN: ${{ secrets.HEALING_THREADS_ACCESS_TOKEN }}
          HEALING_THREADS_ACCESS_TOKEN_AUTO: ${{ secrets.HEALING_THREADS_ACCESS_TOKEN_AUTO }}
          HEALING_IG_ACCESS_TOKEN: ${{ secrets.HEALING_IG_ACCESS_TOKEN }}
          HEALING_IG_ACCESS_TOKEN_AUTO: ${{ secrets.HEALING_IG_ACCESS_TOKEN_AUTO }}
          # 2026-11-08 頻道②「科技透明圈」：TC_* 這一組（AUTO 優先；還沒收件就安靜略過）
          TC_THREADS_ACCESS_TOKEN: ${{ secrets.TC_THREADS_ACCESS_TOKEN }}
          TC_THREADS_ACCESS_TOKEN_AUTO: ${{ secrets.TC_THREADS_ACCESS_TOKEN_AUTO }}
          TC_IG_ACCESS_TOKEN: ${{ secrets.TC_IG_ACCESS_TOKEN }}
          TC_IG_ACCESS_TOKEN_AUTO: ${{ secrets.TC_IG_ACCESS_TOKEN_AUTO }}
          TECH_THREADS_ACCESS_TOKEN: ${{ secrets.TECH_THREADS_ACCESS_TOKEN }}
          TECH_THREADS_ACCESS_TOKEN_AUTO: ${{ secrets.TECH_THREADS_ACCESS_TOKEN_AUTO }}
          TECH_IG_ACCESS_TOKEN: ${{ secrets.TECH_IG_ACCESS_TOKEN }}
          TECH_IG_ACCESS_TOKEN_AUTO: ${{ secrets.TECH_IG_ACCESS_TOKEN_AUTO }}
          CAFFAINE_THREADS_ACCESS_TOKEN: ${{ secrets.CAFFAINE_THREADS_ACCESS_TOKEN }}
          CAFFAINE_THREADS_ACCESS_TOKEN_AUTO: ${{ secrets.CAFFAINE_THREADS_ACCESS_TOKEN_AUTO }}
          CAFFAINE_IG_ACCESS_TOKEN: ${{ secrets.CAFFAINE_IG_ACCESS_TOKEN }}
          CAFFAINE_IG_ACCESS_TOKEN_AUTO: ${{ secrets.CAFFAINE_IG_ACCESS_TOKEN_AUTO }}
          # 共用：Threads 續期失敗（多半是 1 小時短效）時自動換 60 天長效（只對 HEALING／TECH／CAFFAINE 這幾組）
          THREADS_APP_SECRET: ${{ secrets.THREADS_APP_SECRET }}
          META_SECRETS_PAT: ${{ secrets.META_SECRETS_PAT }}
        run: |
          DRY=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" != "false" ]; then DRY="--dry-run"; fi
          python scripts/meta_token_refresh.py $DRY
      - name: 狀態寫回 main（只有日期與天數，沒有權杖）
        if: always() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run != false)
        run: |
          [ -f data/_state/meta_token.json ] || { echo "沒有狀態檔"; exit 0; }
          git config user.name  "tw-rotation-bot"
          git config user.email "actions@github.com"
          git add data/_state/meta_token.json
          if git diff --staged --quiet; then echo "狀態沒變"; exit 0; fi
          git commit -q -m "Meta 權杖續期狀態 $(date -u '+%Y-%m-%d')"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then echo "推送成功"; exit 0; fi
            # 被拒：對齊遠端最新 main，只把這一個狀態檔放回去重新 commit（不碰別人的檔案）
            cp data/_state/meta_token.json "$RUNNER_TEMP/meta_token.json"
            git fetch -q origin main && git reset -q --hard origin/main
            cp "$RUNNER_TEMP/meta_token.json" data/_state/meta_token.json
            git add data/_state/meta_token.json
            git diff --staged --quiet && { echo "遠端已是同一份狀態"; exit 0; }
            git commit -q -m "Meta 權杖續期狀態 $(date -u '+%Y-%m-%d')"
            sleep $((i * 5))
          done
          echo "::warning::狀態檔推不上 main（不影響續期本身）"
      - name: 到期前 10 天仍未續期成功 → 開 issue 提醒
        if: always() && steps.r.outputs.alert == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          REASONS: ${{ steps.r.outputs.reasons }}
        run: |
          T="⚠️ Meta 權杖續期需要處理"
          if gh issue list -R "${{ github.repository }}" --state open --search "in:title Meta 權杖續期需要處理" --json number -q '.[0].number' | grep -q .; then
            N=$(gh issue list -R "${{ github.repository }}" --state open --search "in:title Meta 權杖續期需要處理" --json number -q '.[0].number')
            gh issue comment "$N" -R "${{ github.repository }}" --body "$(date -u '+%Y-%m-%d') 仍未解決：${REASONS}（run：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}）"
          else
            gh issue create -R "${{ github.repository }}" --title "$T" --body "原因：${REASONS}

          這次執行：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          處理方式：docs/security/20261101_meta_token_refresh.md 第 6 節。" || echo "::warning::開 issue 失敗"
          fi
