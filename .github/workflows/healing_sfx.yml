name: healing_sfx
# 頻道④ 影片後製音效（規則 38）：只混音軌、不重渲畫面。不讀任何 secret。
# 觸發：① 手動（輸入資料夾清單與分支）② 推 healing/** 分支且改了 queue/_sfx_request.txt
#   _sfx_request.txt 格式：每行一個佇列資料夾名（例 20261203v_minwage）；可選第一行 branch=healing/xxx（省略＝觸發的分支）
on:
  workflow_dispatch:
    inputs:
      folders:
        description: "佇列資料夾名，空白分隔（例：20261203v_minwage 20261204v_xxx）"
        required: true
      branch:
        description: "要處理並 commit 回去的分支（例：healing/sfx）"
        required: true
  push:
    branches: ['healing/**']
    paths: ['docs/marketing/channels/healing/queue/_sfx_request.txt']
permissions:
  contents: write
concurrency:
  group: healing-sfx-${{ github.ref }}
  cancel-in-progress: false
jobs:
  sfx:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      Q: docs/marketing/channels/healing/queue
      V: docs/marketing/channels/healing/templates_tqsa_v3/video/v9
    steps:
      - name: 決定分支與資料夾
        id: req
        env:
          IN_FOLDERS: ${{ github.event.inputs.folders }}
          IN_BRANCH: ${{ github.event.inputs.branch }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "branch=$IN_BRANCH" >> $GITHUB_OUTPUT; echo "folders=$IN_FOLDERS" >> $GITHUB_OUTPUT
          else
            echo "branch=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.req.outputs.branch }}
          fetch-depth: 0
      - name: 讀請求檔
        id: list
        run: |
          F="${{ steps.req.outputs.folders }}"; B="${{ steps.req.outputs.branch }}"
          if [ -z "$F" ]; then
            R=$Q/_sfx_request.txt
            L=$(grep -m1 -E '^\s*branch=' $R || true); [ -z "$L" ] || { B=$(echo "${L#*branch=}" | tr -d '[:space:]'); sed -i -E '/^\s*branch=/d' $R; }
            F=$(grep -vE '^\s*(#|$)' $R | tr '\n' ' ')
          fi
          [ -n "$F" ] || { echo "沒有資料夾"; exit 1; }
          case "$B" in healing/*) ;; *) echo "只處理 healing/** 分支，收到：$B"; exit 1;; esac
          echo "folders=$F" >> $GITHUB_OUTPUT; echo "branch=$B" >> $GITHUB_OUTPUT
          [ "$B" = "${{ steps.req.outputs.branch }}" ] || git checkout -B "$B" "origin/$B"
      - name: 裝依賴
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q numpy
      - name: 取封存分支（原片 video_nosfx.mp4 存這裡，不進工作分支）
        run: |
          mkdir -p /tmp/arch
          if git ls-remote --exit-code --heads origin renders/healing >/dev/null 2>&1; then
            git fetch -q origin renders/healing && git worktree add /tmp/arch/wt FETCH_HEAD --detach
          else
            git worktree add --detach /tmp/arch/wt HEAD && (cd /tmp/arch/wt && git checkout -q --orphan renders-healing && git rm -rfq . && git commit -q --allow-empty -m "封存分支 renders/healing 初始化")
          fi
      - name: 逐支加音效
        run: |
          set -eo pipefail; FAIL=0
          for N in ${{ steps.list.outputs.folders }}; do
            D=$Q/$N; A=/tmp/arch/wt/$N
            echo "::group::$N"
            for f in script.json segments.json; do [ -f $D/$f ] || { echo "::error::$N 缺 $f"; FAIL=1; continue 2; }; done
            mkdir -p $A
            # 原片：一律取「該資料夾最近一次 healing_render 的輸出」（renders/healing 的 renders/<資料夾>.latest 指標 → renders/<資料夾>.<sha>.mp4），
            # 不再沿用舊 video_nosfx 封存（第 6 輪：重渲後沒更新，成片疊在舊畫面上）。沒有指標（舊資料夾）才退回舊行為並警告。
            LATEST=""; [ -f /tmp/arch/wt/renders/$N.latest ] && LATEST=$(tr -d '[:space:]' < /tmp/arch/wt/renders/$N.latest)
            if [ -n "$LATEST" ] && [ -f /tmp/arch/wt/renders/$LATEST.mp4 ]; then
              echo "底片來源：renders/healing 的 renders/$LATEST.mp4（最新渲染輸出，指標 $N.latest）" | tee $D/sfx_base.txt
              cp /tmp/arch/wt/renders/$LATEST.mp4 /tmp/in_$N.mp4; cp /tmp/in_$N.mp4 $A/video_nosfx.mp4
            elif [ -f $A/video_nosfx.mp4 ]; then
              echo "::warning::$N 沒有 renders/$N.latest 指標，退回舊 video_nosfx 封存" | tee $D/sfx_base.txt; cp $A/video_nosfx.mp4 /tmp/in_$N.mp4
            else [ -f $D/video.mp4 ] || { echo "::error::$N 沒有 video.mp4"; FAIL=1; continue; }
                 echo "::warning::$N 沒有指標也沒封存，取工作分支 video.mp4" | tee $D/sfx_base.txt
                 cp $D/video.mp4 $A/video_nosfx.mp4; cp $D/video.mp4 /tmp/in_$N.mp4; fi
            for f in narration.wav video_outro_sfx.mp3; do [ -f $D/$f ] || { echo "::error::$N 缺 $f"; FAIL=1; continue 2; }; done
            # 乾淨底片：原片音軌裡渲染時 sfx_v3 已烤進 60～80 個物件音效，不能再疊。
            # 只用資料夾的 narration.wav（互相關對齊到原片音軌，誤差 ≤10 ms，寫進 log）＋片尾卡音效 mp3，影像 -c:v copy 封回。
            python3 $V/rebuild_clean.py $D /tmp/in_$N.mp4 /tmp/clean_$N.mp4 /tmp/nar_$N.wav 2>&1 | tee $D/sfx_guard.txt || { echo "::error::$N 乾淨底片重建失敗（旁白對齊不合格）"; FAIL=1; continue; }
            OSTART=$(python3 -c "import json;print(round(json.load(open('/tmp/clean_$N.align.json'))['outro_start'],2))")
            # make_cues 要讀 <資料夾>/video.mp4 量片長：暫時換成乾淨底片
            cp /tmp/clean_$N.mp4 $D/video.mp4
            python3 $V/make_cues.py $D --voice /tmp/nar_$N.wav --cues /tmp/cues_$N.json --table $D/sfx_table.md --outro-start $OSTART
            END=$(python3 -c "import json;print(json.load(open('/tmp/cues_$N.json'))['endCardSec'] or '')")
            # 官方 add-sfx.sh（main 同步 ai-mp4 e8cfbc3）：講話段音效上限＝旁白 −15.5 dB、AAC 320k
            bash scripts/sfx/add-sfx.sh /tmp/clean_$N.mp4 /tmp/cues_$N.json /tmp/out_$N.mp4 2>&1 | tee -a $D/sfx_guard.txt || { echo "::error::$N add-sfx 不合格，不輸出"; cp /tmp/in_$N.mp4 $D/video.mp4; FAIL=1; continue; }
            # 出片檢查：以「對齊後的原始 narration.wav」當人聲基準（不是渲染成品音軌），最差窗 ≥14 dB 才過
            ffmpeg -loglevel error -y -i /tmp/out_$N.mp4 -vn -ac 2 -ar 48000 -c:a pcm_s16le /tmp/dec_$N.wav
            echo "【對原始旁白的出片檢查】" | tee -a $D/sfx_guard.txt
            python3 scripts/sfx/sfx-synth.py check /tmp/nar_$N.wav /tmp/dec_$N.wav ${END:+--end $END} 2>&1 | tee -a $D/sfx_guard.txt; RC=${PIPESTATUS[0]}
            [ $RC = 0 ] || { echo "::error::$N 對原始旁白最差窗 <14 dB，不輸出"; cp /tmp/in_$N.mp4 $D/video.mp4; FAIL=1; continue; }
            LUFS=$(ffmpeg -nostats -i /tmp/out_$N.mp4 -af ebur128 -f null - 2>&1 | grep "I:" | tail -1 | awk '{print $2}')
            echo "全片響度 $LUFS LUFS" | tee -a $D/sfx_guard.txt
            python3 -c "import sys;v=float('$LUFS');sys.exit(0 if abs(v+16)<=1.0 else 1)" || { echo "::error::$N 響度 $LUFS 偏離 −16 LUFS"; cp /tmp/in_$N.mp4 $D/video.mp4; FAIL=1; continue; }
            # 畫面逐像素比對：成片抽 3 幀（第 0、741 與中段）對渲染輸出，不同就失敗不 commit
            NF=$(ffprobe -v error -select_streams v:0 -count_packets -show_entries stream=nb_read_packets -of csv=p=0 /tmp/out_$N.mp4)
            PIXOK=1
            for FR in 0 $(( NF > 741 ? 741 : NF/2 )) $(( NF/2 )); do
              M1=$(ffmpeg -loglevel error -i /tmp/in_$N.mp4 -vf "select=eq(n\,$FR)" -frames:v 1 -f md5 - 2>&1); M2=$(ffmpeg -loglevel error -i /tmp/out_$N.mp4 -vf "select=eq(n\,$FR)" -frames:v 1 -f md5 - 2>&1)
              echo "畫面比對 第 $FR 幀：渲染 $M1 / 成片 $M2" | tee -a $D/sfx_guard.txt
              [ "$M1" = "$M2" ] && [ -n "$M1" ] || PIXOK=0
            done
            [ $PIXOK = 1 ] || { echo "::error::$N 成片畫面與渲染輸出不一致，不輸出"; cp /tmp/in_$N.mp4 $D/video.mp4; FAIL=1; continue; }
            echo "畫面逐像素比對通過（3 幀）" | tee -a $D/sfx_guard.txt
            cp /tmp/out_$N.mp4 $D/video.mp4; cp /tmp/cues_$N.json $D/cues.json
            echo "::endgroup::"
          done
          [ $FAIL = 0 ] || { echo "有資料夾失敗，不 commit"; git checkout -- $Q 2>/dev/null || true; exit 1; }
      - name: commit 回工作分支與封存分支
        run: |
          B="${{ steps.list.outputs.branch }}"
          git config user.name "healing-sfx"; git config user.email "healing-sfx@users.noreply.github.com"
          git add $Q
          git diff --cached --quiet || git commit -q -m "④ 影片加動作音效（healing_sfx）：${{ steps.list.outputs.folders }}"
          git -c rebase.autoStash=true pull --rebase origin "$B" || true
          git push origin "HEAD:$B"
          cd /tmp/arch/wt && git add -A && (git diff --cached --quiet || git commit -q -m "封存 video_nosfx：${{ steps.list.outputs.folders }}") && git push origin "HEAD:refs/heads/renders/healing"
