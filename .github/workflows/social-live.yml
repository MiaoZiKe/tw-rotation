name: 社群即時貼文（Threads／IG 限動）

# Andy 2026-10-20：「我需要在盤中發布當下即時狀況在 Threads 上和 IG 限動：資金輪盤、分流樹即時截圖（含旁邊的長條圖）、
# 熱力圖（也要即時）、盤後提供當天法人買賣超；需要串接自動發布系統；排版只需要提供當前狀況。」
#
# 做的事：scripts/social_snap.py 把 checkout 的 site/ 在 runner 本機（127.0.0.1）跑起來、資料從正式站下載 → 切「即時」
#         → 截圖＋排版（IG 限動用手機版面 1080×1920、Threads 用桌機寬圖）→ 產 manifest.json
#         → 圖推到孤兒分支 social-snaps（Meta 要公開網址才抓得到圖）→ scripts/social_publish.py 發布。
# 說明文件：docs/marketing/social_unit/live_posts.md
#
# ★ 2026-10-25：準時派工改由 Cloudflare Worker（workers/gh-cron，docs/gh_cron_setup.md）呼叫 workflow_dispatch（kind=intraday、dry_run=false）；
#   下面這些 GitHub 排程留作備援（GitHub 的 schedule 實測會延遲數小時或整輪不觸發）。
#   防重複：盤中一天一個時段鍵 intraday-YYYY-MM-DD（scripts/social_publish.py slot_key）。
#
# 排程（GitHub 的 cron 一律用 UTC；週一到週五）：
#   盤中  台北 12:01 ＝ UTC 04:01（一天一篇，2026-10-26 Andy：「時間都需要固定中午 12:00」）
#   盤後  不排固定時間，接在「每日盤後管線」每一輪結束（含部署）之後（workflow_run），
#         只有網站 meta.json 的法人資料日（inst_date）＝今天才發，而且同一天只發一次（social-snaps 分支 state/posted.json 已有 close-日期 就跳過）。
#   ★ 2026-10-26 Andy：盤後法人與融資融券合成一篇（kind=close），融資到齊那輪才發；kind=credit 只留手動用。以下為舊說明：
#   盤後融資 同樣接在每日管線每一輪之後（kind=credit，跟盤後法人分開兩篇，2026-10-21）：
#         融資比法人晚很多才到齊 —— 整體市場融資（FinMind）約台北 21:30～22:00、上市個股融資要到隔天清晨。
#         以前融資卡綁在法人那篇，法人一到那篇就發掉，融資卡一律「資料未更新」被略過（10/21 22:13 那輪就是這樣只剩 5 張）。
#         現在融資自己一篇：market_fut.json 的融資日＝網站最新交易日、維持率算得出來、排行同一天才發（social_snap.py 的 credit_ready），
#         鍵是 credit-<融資資料日>，同一天只發一次；隔天清晨 05:07、09:07、12:07 的管線（news）也會接到，資料晚到照樣補發。
# ★ 即時閘門：不用任何登入權杖。本機站注入 TW_LIVE_OVERRIDE（site/livegate.js 只在 127.0.0.1／localhost 認的後門，正式站不受影響）；
#   報價請求由 Playwright 補上正式站的 Origin（Worker 看 Origin）。即時沒套上就不發，不拿盤後圖冒充。
#         為什麼不固定時間：三大法人傍晚才落地（daily.yml 台北 18:30 那輪 phase=full 才有；15:30 那輪只抓價量），
#         GitHub 排程又常延遲數十分鐘；接在管線後面，資料一定已經部署到網站，再用資料日期把關，延遲多久都不會發到舊資料。
# ★ 非交易日不發：看「資料」＋休市日表（pipeline/calendar/tw_holidays.yaml），不看執行當下的星期幾（scripts/social_gate.py，2026-10-26）：
#   盤後法人＝每張卡的資料日都要是今天；盤後融資＝最近一個已收盤交易日、下一個交易日 09:00 前才發；盤中＝交易日 09:00～13:30 且報價成交日是今天。
# ★ 即時沒套上（抓不到報價）的那張不發，不拿盤後舊圖冒充即時。
on:
  schedule:
    - cron: "1 4 * * 1-5"     # 台北 12:01 盤中（一天一篇，備援；準時由 Cloudflare Worker 12:00 派）
    - cron: "20 0 * * 1-5"    # 台北 08:20 盤前（2026-10-27 Andy「開始發」；休市日由 social_premarket.py 自己不發）
    - cron: "50 0 * * 1-5"    # 台北 08:50 盤前備援 1（08:20 那輪被 GitHub 吃掉時補發；已發過就跳過）
    - cron: "40 1 * * 1-5"    # 台北 09:40 盤前備援 2（2026-10-27 Andy：「晚到也不能不發，有問題就Mail通知」→ 晚到照發；10-27 晚：只有發不成功才寄信）
  workflow_run:
    workflows: ["每日盤後管線"]
    types: [completed]        # 每日管線跑完（含部署）→ 盤後法人；資料日不是今天就自己跳過
  workflow_dispatch:
    inputs:
      kind:
        description: "premarket（盤前）、intraday（盤中）、close（盤後）或 credit（舊：盤後融資）"
        type: choice
        options: [premarket, intraday, close, credit]
        default: intraday
      dry_run:
        description: "只演練：照常截圖排版，但不真的發布"
        type: boolean
        default: true
      force:
        description: "略過盤中時段／交易日／資料日期檢查（測試用）"
        type: boolean
        default: false
      only:
        description: "只發哪個平台（測試補發用）：all、ig、threads"
        type: choice
        options: [all, ig, threads]
        default: all
      live_test:
        description: "測試真發一篇（2026-10-27 Andy：「全部發一篇測試」）：不管總開關、用最近一次資料、不寫發布紀錄（不會擋掉當天正式那篇）"
        type: boolean
        default: false

# 排隊不取消：兩輪不會互相截斷；發布一半被砍掉比晚一點發更糟
concurrency:
  group: social-live
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snap-and-post:
    # 每日管線失敗就不接（資料可能是舊的）
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 管線接力（workflow_run）一次跑兩篇：盤後法人、盤後融資，各自把關、各自防重複。
    # max-parallel: 1 —— 兩篇都要重建並 force push social-snaps 分支，同時跑會互相蓋掉對方的圖與發布紀錄。
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        kind: ${{ fromJSON(github.event_name == 'workflow_run' && '["close"]' || (github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.kind) || (github.event.schedule == '1 4 * * 1-5' && '["intraday"]' || '["premarket"]'))) }}
    env:
      TZ: Asia/Taipei
    steps:
      - uses: actions/checkout@v4

      - name: 決定這一輪是盤中還是盤後
        id: kind
        run: |
          echo "kind=${{ matrix.kind }}" >> "$GITHUB_OUTPUT"
          echo "stamp=$(date '+%Y%m%d-%H%M')" >> "$GITHUB_OUTPUT"
          echo "today=$(date '+%Y%m%d')" >> "$GITHUB_OUTPUT"

      - name: 盤後已經發過了就不重複（每日管線一天跑三輪都會接到這裡）
        id: done
        # 盤中也要讀發布紀錄（2026-10-25）：Cloudflare Worker 準時派的與 GitHub 備援排程晚到的，同一時段只發一次
        # 2026-10-27：盤後改由每日管線 inst 輪直接派（workflow_dispatch），這一步每一種、每一個觸發來源都要跑，否則會重複發
        if: always()
        run: |
          if git ls-remote --exit-code --heads origin social-snaps >/dev/null 2>&1; then
            git fetch --depth=1 origin social-snaps
            # 盤後融資的鍵是「融資資料日」，要截之前才知道 → 把發布紀錄交給 social_snap.py 的 --posted-json 自己比
            git show FETCH_HEAD:state/posted.json > "$RUNNER_TEMP/posted.json" 2>/dev/null || echo '{}' > "$RUNNER_TEMP/posted.json"
            # 近幾天落點紀錄（2026-10-27）：貼文網址「同一落點連續 2 天就換」靠它
            git show FETCH_HEAD:state/landing_recent.json > "$RUNNER_TEMP/landing_recent.json" 2>/dev/null || echo '{}' > "$RUNNER_TEMP/landing_recent.json"
            if [ "${{ steps.kind.outputs.kind }}" != "close" ]; then exit 0; fi
            KEY="close-$(date '+%F')"
            if git show FETCH_HEAD:state/posted.json 2>/dev/null | grep -q "\"$KEY\""; then
              echo "今天的盤後法人已經發過（$KEY）→ 跳過"
              echo "skip=1" >> "$GITHUB_OUTPUT"
            fi
          fi

      - uses: actions/setup-python@v5
        if: steps.done.outputs.skip != '1'
        with:
          python-version: "3.12"

      # 2026-10-27：Ubuntu 套件伺服器（azure.archive.ubuntu.com）半夜很慢，apt 裝字型卡 8 分鐘以上兩次 →
      # 字型改從 GitHub 直接下載並快取（第二次起秒過）；Chromium 系統函式庫 ubuntu-latest 本來就有，先不裝，啟動失敗才補 install-deps
      - name: 字型快取
        if: steps.done.outputs.skip != '1'
        id: fontcache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/fonts/tw-rotation
          key: social-fonts-v2

      - name: 安裝 Playwright、Pillow 與中文字型
        if: steps.done.outputs.skip != '1'
        timeout-minutes: 8
        run: |
          pip install playwright pillow requests
          if [ "${{ steps.kind.outputs.kind }}" = "premarket" ] || [ "${{ steps.kind.outputs.kind }}" = "close" ]; then pip install -r requirements.txt; fi      # 盤前、盤後要讀資料湖（pandas／pyarrow）
          # 2026-10-29：盤中文案也加「📰 新聞焦點」（讀資料湖 news ＋當場抓一次）→ 只裝讀湖與抓新聞要的幾個套件，比整份 requirements 快
          if [ "${{ steps.kind.outputs.kind }}" = "intraday" ]; then pip install "pandas>=2.2" "pyarrow>=16.0" "PyYAML>=6.0" "feedparser>=6.0" || echo "::warning::盤中新聞焦點套件裝失敗（照發、少新聞段）"; fi
          python -m playwright install chromium
          F=~/.local/share/fonts/tw-rotation
          mkdir -p "$F"
          if [ ! -s "$F/NotoSansCJKtc-Regular.otf" ]; then
            for w in Regular Bold; do
              curl -fsSL --retry 3 -o "$F/NotoSansCJKtc-$w.otf" "https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/TraditionalChinese/NotoSansCJKtc-$w.otf"
            done      # 圖上已不用表情圖示（10-27 Andy 拿掉昨日事件的圖示），不裝彩色表情字型
          fi
          fc-cache -f >/dev/null
          fc-list | grep -c "Noto Sans CJK TC" || true
          python -c "from playwright.sync_api import sync_playwright as P; p=P().start(); p.chromium.launch().close(); p.stop()" \
            || { echo "Chromium 缺系統函式庫 → 補 install-deps"; sudo timeout 300 python -m playwright install-deps chromium; }

      - name: 截圖＋排版＋產 manifest
        id: snap
        if: steps.done.outputs.skip != '1'
        run: |
          OUT="snaps/${{ steps.kind.outputs.kind }}-${{ steps.kind.outputs.stamp }}"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"
          FORCE=""
          if [ "${{ inputs.force }}" = "true" ] || [ "${{ inputs.live_test }}" = "true" ]; then FORCE="--force"; fi
          POSTED=""
          if [ -f "$RUNNER_TEMP/posted.json" ] && [ "${{ inputs.live_test }}" != "true" ]; then POSTED="--posted-json $RUNNER_TEMP/posted.json"; fi
          LAND=""
          if [ -f "$RUNNER_TEMP/landing_recent.json" ]; then LAND="--landing-json $RUNNER_TEMP/landing_recent.json"; fi
          set +e
          if [ "${{ steps.kind.outputs.kind }}" = "premarket" ]; then
            # 盤前：讀 checkout 的資料湖（data/），不需要網站；融資 3 張讀正式站 market_fut.json
            python scripts/social_premarket.py --out "$OUT" $FORCE $POSTED $LAND --save-site
          else
            SKIP=""
            if [ "${{ inputs.live_test }}" = "true" ]; then SKIP="--skip-live"; fi      # 測試在盤後時段跑，沒有即時報價
            OVL=""
            # 2026-10-27 Andy：「盤後貼文資料到就發」→ 盤後直接從資料湖算那幾份 JSON 蓋上去，不等整站重算＋部署
            if [ "${{ steps.kind.outputs.kind }}" = "close" ] && python -m pipeline.social_close_payload "$RUNNER_TEMP/close_overlay"; then OVL="--data-overlay $RUNNER_TEMP/close_overlay"; fi
            python scripts/social_snap.py --kind "${{ steps.kind.outputs.kind }}" --out "$OUT" \
              --serve site --data-url https://miaozike.github.io/tw-rotation/data,https://tw-rotation.pages.dev/data,https://liguligu-puipui.com/data --spoof-origin --fresh-news $FORCE $POSTED $LAND $SKIP $OVL
          fi
          RC=$?
          set -e
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          if [ "$RC" = "10" ]; then
            echo "### ${{ steps.kind.outputs.kind }}：本輪刻意不發（法人／融資資料未到齊、已發過、非交易日或不在盤中時段），正常結束" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$RC" != "0" ]; then
            echo "::error::產圖程式結束碼 $RC（2＝一張都沒截成／讀不到資料、3＝版面有重疊、4＝盤前美股資料太舊）"
            exit "$RC"
          fi
          echo "### ${{ steps.kind.outputs.kind }}：本輪產出" >> "$GITHUB_STEP_SUMMARY"
          cat "$OUT/manifest.json" >> "$GITHUB_STEP_SUMMARY"

      - name: 存成 Actions artifact（保留 7 天）
        if: steps.snap.outcome == 'success' && steps.snap.outputs.rc == '0'
        uses: actions/upload-artifact@v4
        with:
          name: social-${{ steps.kind.outputs.kind }}-${{ steps.kind.outputs.stamp }}
          path: |
            ${{ steps.snap.outputs.out }}
            !${{ steps.snap.outputs.out }}/raw
          retention-days: 7

      # 推到孤兒分支 social-snaps：Meta 要抓得到的公開圖片網址（raw.githubusercontent.com）。
      # 這條分支只放截圖與「今天發過沒」的標記，沒有任何程式；每次重建成單一 commit 後 force push（只有這條分支這樣做，
      # 否則每天幾十張 PNG 的歷史會把 repo 撐爆）；保留最近 3 天的圖與 state/posted.json。
      - name: 推圖到 social-snaps 分支
        id: pub
        if: steps.snap.outcome == 'success' && steps.snap.outputs.rc == '0'
        run: |
          OUT="${{ steps.snap.outputs.out }}"
          NAME="$(basename "$OUT")"
          WORK="$(mktemp -d)"
          mkdir -p "$WORK/snaps" "$WORK/state"
          if git ls-remote --exit-code --heads origin social-snaps >/dev/null 2>&1; then
            git fetch --depth=1 origin social-snaps
            git archive FETCH_HEAD | tar -x -C "$WORK"
            find "$WORK/snaps" -mindepth 1 -maxdepth 1 -type d -mtime +3 -exec rm -rf {} + 2>/dev/null || true
          fi
          mkdir -p "$WORK/snaps/$NAME"
          cp "$OUT"/*.png "$OUT"/manifest.json "$WORK/snaps/$NAME/"
          # 防重複紀錄（發布程式把 posted.json 寫在 manifest 旁）：把上一輪的帶進來，發完再寫回 state/
          if [ -f "$WORK/state/posted.json" ]; then cp "$WORK/state/posted.json" "$OUT/posted.json"; fi
          cd "$WORK"
          git init -q
          git checkout -q --orphan social-snaps
          git config user.name  "tw-rotation-bot"
          git config user.email "actions@github.com"
          git add -A
          git commit -q -m "社群截圖 $NAME"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" social-snaps
          echo "base=https://raw.githubusercontent.com/${{ github.repository }}/social-snaps/snaps/$NAME" >> "$GITHUB_OUTPUT"
          echo "圖片公開網址前綴：https://raw.githubusercontent.com/${{ github.repository }}/social-snaps/snaps/$NAME/"

      # ★ 總開關（2026-10-26）：repo 檔 docs/marketing/social_unit/LIVE_ENABLED 存在才真的發；不存在＝一律 dry-run（即使 Secrets 有金鑰）。
      #   THREADS_USER_ID／IG_USER_ID 空白時，social_publish.py 會用權杖自動查帳號編號（log 只印末 4 碼）。
      - name: 發布（總開關關閉或沒有金鑰會自動 dry-run）
        id: post
        if: steps.snap.outcome == 'success' && steps.snap.outputs.rc == '0'
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          SOCIAL_LIVE_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.live_test && '1' || '' }}
          SOCIAL_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.only != 'all' && inputs.only || '' }}
        run: |
          DRY=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then DRY="--dry-run"; fi
          if [ ! -f docs/marketing/social_unit/LIVE_ENABLED ] && [ "${{ inputs.live_test }}" != "true" ]; then
            echo "總開關關閉（docs/marketing/social_unit/LIVE_ENABLED 不存在）→ dry-run，不真的發布"
            echo "### 總開關關閉 → dry-run（要開始真的發，在 repo 建立 docs/marketing/social_unit/LIVE_ENABLED）" >> "$GITHUB_STEP_SUMMARY"
            DRY="--dry-run"
          fi
          # 真發布失敗 exit 1（這一步會紅）；dry-run、缺金鑰 exit 0
          python scripts/social_publish.py --manifest "${{ steps.snap.outputs.out }}/manifest.json" \
            --base-url "${{ steps.pub.outputs.base }}" $DRY
          if [ -z "$DRY" ] && [ -f "${{ steps.snap.outputs.out }}/posted.json" ]; then echo "save=1" >> "$GITHUB_OUTPUT"; fi
          # 測試不寫發布紀錄：live_test 或 force（略過時段／資料日檢查＝測試）都不寫。
          # 2026-10-27 事故：凌晨測試補發寫進 intraday-2026-10-27，12:00 正式盤中被當成「已發過」跳過
          if [ "${{ inputs.live_test }}" = "true" ] || [ "${{ inputs.force }}" = "true" ]; then rm -f "${{ steps.snap.outputs.out }}/posted.json"; fi

      # 盤前：今日焦點寫進網站「精選文章 → 盤前消息」（site/articles/premarket.json，進版控）→ 推回 main，網站部署後就看得到
      - name: 盤前消息寫回網站
        if: steps.kind.outputs.kind == 'premarket' && steps.snap.outcome == 'success' && steps.snap.outputs.rc == '0' && inputs.live_test != true
        run: |
          if git diff --quiet -- site/articles/premarket.json; then echo "盤前消息沒有變動"; exit 0; fi
          git config user.name  "tw-rotation-bot"
          git config user.email "actions@github.com"
          git add site/articles/premarket.json
          git commit -q -m "盤前消息 $(date '+%F')"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          echo "::warning::盤前消息推回 main 失敗（不影響已發的貼文）"

      # ★ 2026-10-27 Andy：「有問題就Mail通知」→ 晚上改「只有發不成功才需要」：晚到／昨日事件 0 則（alert.txt）只記摘要；
      #   任何一步紅燈，GitHub 都會寄「Run failed」信到 MiaoZiKe 帳號的信箱（github.com/settings/notifications → Actions 要勾 Email）。
      #   下一步「寫回 posted.json」是 always()，這一步標紅不影響防重複紀錄。
      - name: 晚到／昨日事件 0 則：記在摘要（有發出就不寄信）
        if: always() && steps.snap.outcome == 'success' && steps.snap.outputs.rc == '0'
        run: |
          F="${{ steps.snap.outputs.out }}/alert.txt"
          # 2026-10-27 Andy：「這Mail 只有發不成功才需要 不要一直發」→ 晚到／昨日事件 0 則但有發出去：只寫摘要、不標紅、不寄信
          if [ -f "$F" ]; then
            echo "::warning::$(cat "$F")"
            { echo "### ⚠ ${{ steps.kind.outputs.kind }} 貼文有狀況（已發出）"; echo ""; cat "$F"; } >> "$GITHUB_STEP_SUMMARY"
          fi

      # 發布程式的防重複紀錄 posted.json 要寫回 social-snaps，下一輪（含盤後那三次接力）才知道發過了；
      # 發布失敗也要寫（已成功的那一半不能重發）
      - name: 把 posted.json 寫回 social-snaps
        if: always() && steps.pub.outcome == 'success'
        run: |
          OUT="${{ steps.snap.outputs.out }}"
          if [ ! -f "$OUT/posted.json" ]; then echo "沒有 posted.json（dry-run 或沒發）→ 不寫回"; exit 0; fi
          WORK="$(mktemp -d)"
          git fetch --depth=1 origin social-snaps
          git archive FETCH_HEAD | tar -x -C "$WORK"
          mkdir -p "$WORK/state"
          cp "$OUT/posted.json" "$WORK/state/posted.json"
          # 這一輪真的發了，才把選到的落點記下（dry-run 與測試不會走到這裡）
          if [ -f "$OUT/landing_recent.json" ]; then cp "$OUT/landing_recent.json" "$WORK/state/landing_recent.json"; fi
          cd "$WORK"
          git init -q
          git checkout -q --orphan social-snaps
          git config user.name  "tw-rotation-bot"
          git config user.email "actions@github.com"
          git add -A
          git commit -q -m "發布紀錄 ${{ steps.kind.outputs.stamp }}"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" social-snaps
