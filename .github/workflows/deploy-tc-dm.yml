name: 部署 Worker（頻道② IG 私訊 tc-dm）
# 2026-11-08 Andy：「讀主留言我自動傳訊息功能，傳之前還會檢查是否有追蹤」。說明：docs/marketing/channels/tc/autopost.md 第六節。
# - workers/tc-dm 有改就部署；每週日 03:41 UTC（續期之後）重新寫入 IG_TOKEN，讓 Worker 拿到續期後的權杖。
# - 沒有 Cloudflare 金鑰或 TC 權杖 → 跳過並在摘要寫待辦，不紅燈。
# - 手動觸發勾 subscribe：用 App 權杖向 Meta 註冊 webhook（callback＝這支 Worker、欄位 comments,messages），
#   verify token 每次隨機產生、只寫進 Worker Secret，不經過任何人手。要 Advanced Access 審過之後才有意義。
# ★ 2026-11-10：頻道② 改用 TECH_* 權杖，IG 是 EAA 系統用戶權杖（graph.facebook.com）。這支 Worker 走 graph.instagram.com（Instagram 登入版），
#   跟 EAA 不相容；EAA 的 IG 私訊要 Messenger Platform（粉絲專頁＋專頁權杖），目前帳號沒有粉絲專頁。所以這支先不部署、保留備用，
#   缺 TC_IG_* 會照舊安靜跳過。要用時：改成 Instagram 登入版權杖，或補粉絲專頁後改寫成 /{page-id}/messages。
on:
  push:
    branches: [main]
    paths: ['workers/tc-dm/**', '.github/workflows/deploy-tc-dm.yml']
  schedule:
    - cron: "41 3 * * 0"
  workflow_dispatch:
    inputs:
      subscribe:
        description: "向 Meta 註冊 webhook（Advanced Access 審過後才勾）"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: deploy-tc-dm
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Worker 測試（紅了就不准部署）
        run: node --test workers/tc-dm/test/worker.test.mjs
      - id: guard
        name: 檢查金鑰
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          IG_TOK: ${{ secrets.TC_IG_ACCESS_TOKEN_AUTO || secrets.TC_IG_ACCESS_TOKEN }}
          IG_SEC: ${{ secrets.TC_IG_APP_SECRET }}
        run: |
          miss=""
          [ -z "$CF_TOKEN" ] && miss="$miss CLOUDFLARE_API_TOKEN"
          [ -z "$CF_ACCOUNT" ] && miss="$miss CLOUDFLARE_ACCOUNT_ID"
          [ -z "$IG_TOK" ] && miss="$miss TC_IG_ACCESS_TOKEN_AUTO（先跑權杖收件）"
          [ -z "$IG_SEC" ] && miss="$miss TC_IG_APP_SECRET"
          if [ -n "$miss" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            { echo "### tc-dm 尚未部署"; echo ""; echo "缺少：$miss"; echo ""; echo "輪詢版（tc_post.yml 裡的 IG 私訊步驟）不受影響。"; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: 準備 KV（tw-tc-dm）
        if: steps.guard.outputs.ok == 'true'
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          tok, acc = os.environ["CF_TOKEN"], os.environ["CF_ACCOUNT"]
          base = f"https://api.cloudflare.com/client/v4/accounts/{acc}/storage/kv/namespaces"
          def call(method, url, body=None):
              req = urllib.request.Request(url, method=method, data=json.dumps(body).encode() if body is not None else None,
                                           headers={"Authorization": "Bearer " + tok, "Content-Type": "application/json"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)
          nid = next((n["id"] for n in call("GET", base + "?per_page=100").get("result", []) if n.get("title") == "tw-tc-dm"), None)
          nid = nid or call("POST", base, {"title": "tw-tc-dm"})["result"]["id"]
          p = "workers/tc-dm/wrangler.toml"
          s = open(p, encoding="utf-8").read().replace("__TC_DM_KV_ID__", nid)
          open(p, "w", encoding="utf-8").write(s)
          PY
      - name: 部署
        id: deploy
        if: steps.guard.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/tc-dm
      - name: 寫入 Worker Secret（IG_TOKEN、IG_APP_SECRET）
        if: steps.guard.outputs.ok == 'true'
        working-directory: workers/tc-dm
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          IG_TOK: ${{ secrets.TC_IG_ACCESS_TOKEN_AUTO || secrets.TC_IG_ACCESS_TOKEN }}
          IG_SEC: ${{ secrets.TC_IG_APP_SECRET }}
        run: |
          printf '%s' "$IG_TOK" | npx --yes wrangler@4 secret put IG_TOKEN
          printf '%s' "$IG_SEC" | npx --yes wrangler@4 secret put IG_APP_SECRET
      - name: 向 Meta 註冊 webhook（手動勾 subscribe 才跑）
        if: steps.guard.outputs.ok == 'true' && github.event_name == 'workflow_dispatch' && inputs.subscribe
        working-directory: workers/tc-dm
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APP_ID: ${{ secrets.TC_IG_APP_ID }}
          IG_SEC: ${{ secrets.TC_IG_APP_SECRET }}
          IG_TOK: ${{ secrets.TC_IG_ACCESS_TOKEN_AUTO || secrets.TC_IG_ACCESS_TOKEN }}
          WURL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          [ -n "$APP_ID" ] || { echo "::error::缺 TC_IG_APP_ID（Instagram 應用程式編號）"; exit 1; }
          [ -n "$WURL" ] || { echo "::error::拿不到 Worker 網址"; exit 1; }
          VT=$(openssl rand -hex 24); echo "::add-mask::$VT"
          printf '%s' "$VT" | npx --yes wrangler@4 secret put VERIFY_TOKEN
          sleep 10
          curl -fsS -X POST "https://graph.facebook.com/v24.0/${APP_ID}/subscriptions" \
            --data-urlencode "object=instagram" --data-urlencode "callback_url=${WURL%/}/ig-webhook" \
            --data-urlencode "fields=comments,messages" --data-urlencode "include_values=true" \
            --data-urlencode "verify_token=$VT" --data-urlencode "access_token=${APP_ID}|${IG_SEC}" -o /dev/null && echo "App webhook 註冊成功" || { echo "::error::App webhook 註冊失敗（多半是還沒有 Advanced Access 或 App 還沒上線）"; exit 1; }
          curl -fsS -X POST "https://graph.instagram.com/v24.0/me/subscribed_apps" \
            --data-urlencode "subscribed_fields=comments,messages" --data-urlencode "access_token=$IG_TOK" -o /dev/null && echo "帳號訂閱成功" || { echo "::error::帳號訂閱失敗"; exit 1; }
          echo "### webhook 已註冊。下一步：把 social/tc/dm_config.json 的 ig_dm.mode 改成 webhook（輪詢版會自動停手）" >> "$GITHUB_STEP_SUMMARY"
