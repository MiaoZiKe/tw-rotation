name: 歷史回補

# 把十年歷史補進資料湖。設計成「可以重跑」：
# - 已經補過的股票會自動跳過
# - FinMind 免費層 600 req/hr，額度用完（伺服器回 402）就停下、寫進度檔
# - 每小時排程自動接續，直到 progress 檔標記 complete 為止（之後排程會直接跳過）
# - 手動觸發永遠跑一輪（groups.yaml 新增成分股後按一次即可）
#
# 排程觸發跑的是 `--plan default`（run_backfill.PLAN_DEFAULT，依序多步驟：
# 財報 → 股利 → 融資券/股權分散 → 族群成分股 2000 年起的價量 → 每月重抓成分股股利公告）。
# 計畫的 done 旗標帶年月：跨月後月更新那一步的 tag 變了，排程會自動再跑一輪。
# 2026-09-28：三大法人、當沖＋借券、2009 起股利三步改成全市場普通股（scope=market，不吃 LIMIT），
# 守門看的是它們的新完成鍵（…@market）。
#
# 排程刻意避開 UTC 09:20 / 10:20：每日管線 10:30 也要用 FinMind 額度。
#
# 2026-09-26 加公司 Logo：每輪最多 300 家、15 分鐘（不吃 FinMind 額度），`data/logos/` 一起 commit。
# 計畫補齊後排程若發現 Logo 還沒補完或到期，改跑 `--datasets logos` 那一步就好。
#
# 2026-09-30 加個股 60 分 K 全市場回補（Yahoo，不吃 FinMind 額度）：每輪最多 400 檔、約 5 輪補完（要補 1,719 檔：新增約 1,440 ＋ 以前只有幾根的約 280），
# 進度 complete.intraday_60m（含 remaining）。計畫補齊後這一步沒補完就改跑 `--datasets intraday`（跟 Logo 可以同一輪）。

on:
  schedule:
    - cron: "20 0-8,11-23 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "本輪最多補幾檔（留空＝用剩餘額度補到滿）"
        type: string
        default: "500"
      start_date:
        description: "回補起始日（選 plan 時忽略，計畫各步驟自帶起始日）"
        type: string
        default: "2016-01-01"
      datasets:
        description: "要補的資料集（plan＝跑 default 計畫）"
        type: choice
        options: [plan, logos, intraday, price, price+inst, inst, per, revenue, financial+balance, revenue+financial+balance, dividend+divresult, margin+holding]
        default: plan
      relay_n:
        description: "接力棒次（工作流自己派下一輪時填；手動觸發留 0）"
        type: string
        default: "0"

# actions: write 是給「接力」工作用 GITHUB_TOKEN 派下一輪 workflow_dispatch（Andy 2026-10-05 授權）。
permissions:
  contents: write
  actions: write

env:
  DATASETS: ${{ inputs.datasets || 'plan' }}
  # ★ 2026-09-19：排程的 LIMIT 從 500 改成留空（＝整個市場）。
  #   原本排程每輪只把「成交值前 500 檔」丟進回補清單，所以第 501 名之後的股票
  #   **在設計上永遠補不到** —— 稽核實測：2,336 檔個股裡，價量有 250 個交易日以上的只有 392 檔，
  #   月營收算得出 YoY（13 個月以上）的只有 488 檔，1,933 個個股頁上那句
  #   「歷史價量還在回補，補齊後才會出現」是一句永遠不會兌現的承諾。
  #   真正該當節流閥的是 FinMind 額度（伺服器回 402 就停、寫進度檔、下一輪接續），
  #   那個機制本來就在，LIMIT 只是多押了一道把清單砍掉的上限。
  LIMIT: ${{ inputs.limit || '' }}
  START_DATE: ${{ inputs.start_date || '2016-01-01' }}

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # 上限 6 小時，留緩衝
    # 與每日管線共用，避免兩邊同時 push 造成衝突。
    # 2026-10-05 從工作流層搬到這個 job：接力 job 要睡一小時等額度，不能佔著寫入佇列擋住每日管線。
    # cancel-in-progress 絕對不能改 true（會出現 repo 已更新但網站是舊版）。
    concurrency:
      group: tw-rotation-data-write
      cancel-in-progress: false
    outputs:
      relay: ${{ steps.relay_check.outputs.relay }}
    steps:
      # 一定要 checkout 分支「現在的」最新 commit，而不是觸發當下的 SHA。
      # 排程/手動觸發的 run 可能在 concurrency 佇列裡等前一個 run 推完資料，
      # 用預設（github.sha）會拿到舊版資料湖，接著 rebase 時把別人剛推的東西蓋掉。
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: 排程觸發時，補齊了就直接結束
        id: guard
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, pathlib
          from datetime import datetime, timedelta, timezone
          ds = os.environ["DATASETS"]
          if ds == "plan":
              key = "plan:default"
          else:
              key = "+".join(sorted(ds.replace("+", ",").split(",")))
          skip = False
          p = pathlib.Path("data/_state/backfill_progress.json")
          if os.environ.get("GITHUB_EVENT_NAME") == "schedule" and p.exists():
              flag = json.loads(p.read_text()).get("complete", {}).get(key, {})
              done = bool(flag.get("done")) if isinstance(flag, dict) else bool(flag)
              if key == "plan:default":
                  # 計畫的 done 只在同一個月內有效（月更新步驟的 tag 每月不同）
                  month = datetime.now(timezone(timedelta(hours=8))).strftime("%Y-%m")
                  done = done and isinstance(flag, dict) and flag.get("month") == month
                  # 計畫補齊後才新增的步驟（例：2026-09-25 加的大盤分 K index_intraday）
                  # 不會被 plan:default 的 done 涵蓋；不看它的話排程一律跳過，新步驟永遠不會跑。
                  # 所以 index_intraday 還沒補完（台指期逐筆不可用時 run_backfill 自己會把 done 設成真），照樣放行一輪。
                  ii = json.loads(p.read_text()).get("complete", {}).get("index_intraday") or {}
                  if not (isinstance(ii, dict) and ii.get("done")):
                      done = False
                  # 2026-09-28：櫃買 Yahoo 代號改 IX0043.TWO（yahoo_v 3）＋加權真實 1 分 K（tse1m_v 1）是新步驟，
                  # 舊進度的 done 不涵蓋它們 —— 版本對不上就放行一輪，讓 run_backfill 自己重開。
                  if isinstance(ii, dict) and (ii.get("yahoo_v") != 3 or ii.get("tse1m_v") != 1):
                      done = False
                  # 2026-09-27：三大法人歷史步驟（計畫補齊後才加的，同上理由）＋法人每日續補
                  # （每天一次，complete.inst_fresh.date＝台北日期；當天還沒做完就放行一輪）。
                  # ★ 2026-09-28：這三步改成全市場（scope=market），完成鍵換成帶「@market」的新鍵。
                  #   舊鍵（inst、daytrade+sbl@2025-01-01…）是「只補前 500 檔」那一版標的 done，
                  #   留著看它只會讓排程以為補齊了、全市場那一版永遠不跑。
                  #   這張清單要跟 run_backfill.PLAN_DEFAULT 裡 scope=market 的步驟一致，
                  #   tests/test_backfill_market.py 會實際執行這段守門去比對。
                  cp = json.loads(p.read_text()).get("complete", {})
                  for k in ("inst@market", "daytrade+sbl@2025-01-01@market",
                            "dividend+divresult@2009-01-01@market",
                            # 2026-10-04：全市場日線（4561 健椿只有 15 根 K 線那件）
                            "price@2000-01-01@market",
                            # 2026-10-05：ETF 專區的配息與價量歷史（scope=etf）
                            "dividend+divresult@etf2009@etf", "price@2000-01-01@etf"):   # 10-05：配息鍵換 tag etf2009（舊鍵把 ETF 配息誤標完成）
                      st = cp.get(k) or {}
                      if not (isinstance(st, dict) and st.get("done")):
                          done = False
                  fr = cp.get("inst_fresh") or {}
                  today_tp = datetime.now(timezone(timedelta(hours=8))).strftime("%Y-%m-%d")
                  if not (isinstance(fr, dict) and fr.get("done") and fr.get("date") == today_tp):
                      done = False
              skip = done
          plan_done = skip and key == "plan:default"
          # 公司 Logo（2026-09-26）：計畫補齊之後也要讓 Logo 繼續補／到期重抓。
          # 只有 Logo 還有事做時，這一輪改跑 `--datasets logos`（不碰 FinMind，幾分鐘就結束）。
          logos_only = False
          if skip and key == "plan:default":
              lp = pathlib.Path("data/_state/logo_progress.json")
              today = datetime.now(timezone(timedelta(hours=8))).strftime("%Y-%m-%d")
              st = json.loads(lp.read_text()) if lp.exists() else {}
              if st.get("skipped") != "disabled":
                  nd = st.get("next_due")
                  if not st.get("done") or (nd and nd <= today):
                      skip, logos_only = False, True
                  # 第四版（DECISIONS #276）：兩種「狀態檔還寫著補齊了、其實有事做」的情況也放行一輪。
                  # ① 取圖策略升級（config.LOGO_STRATEGY 加一）：上一輪的狀態檔是舊版寫的，要重試的那批還沒輪到。
                  import re, hashlib
                  # config 讀不到（理論上 checkout 後一定在）就當沒升級 —— 守門本身絕不能因為讀檔失敗整步掛掉
                  cfg = pathlib.Path("pipeline/config.py")
                  m = re.search(r"^LOGO_STRATEGY\s*=\s*(\d+)", cfg.read_text(encoding="utf-8"), re.M) if cfg.exists() else None
                  if m and int(m.group(1)) != int(st.get("strategy") or 0):
                      skip, logos_only = False, True
                  # ② 人工指定的 Logo（data/logos/manual/）新增、換圖或刪除：索引裡的 manual_sha1 對不上就放行。
                  md = pathlib.Path("data/logos/manual")
                  ip = pathlib.Path("data/logos/_index.json")
                  items = (json.loads(ip.read_text(encoding="utf-8")).get("items") or {}) if ip.exists() else {}
                  files = {f.stem: f for f in md.glob("*") if f.is_file() and f.suffix.lower() in (".png", ".jpg", ".jpeg", ".webp", ".gif", ".svg")} if md.is_dir() else {}
                  for code, f in files.items():
                      rec = items.get(code) or {}
                      if rec.get("src") != "manual" or rec.get("manual_sha1") != hashlib.sha1(f.read_bytes()).hexdigest():
                          skip, logos_only = False, True
                  if any(r.get("src") == "manual" and c not in files for c, r in items.items()):
                      skip, logos_only = False, True
          # 個股 60 分 K 全市場回補（2026-09-30）：Yahoo、不吃 FinMind 額度，每輪最多 400 檔。
          # 計畫補齊之後這一步還沒補完（complete.intraday_60m.done 不是真）就放行一輪，只跑 `--datasets intraday`。
          # 計畫還沒補齊時不用特別處理：`--plan default` 那一輪本來就會先跑這一步。
          intraday_only = False
          if plan_done:
              im = (json.loads(p.read_text()).get("complete", {}).get("intraday_60m") or {}) if p.exists() else {}
              if not (isinstance(im, dict) and im.get("done")):
                  skip, intraday_only = False, True
          print(f"skip={'true' if skip else 'false'}")
          print(f"logos_only={'true' if logos_only else 'false'}")
          print(f"intraday_only={'true' if intraday_only else 'false'}")
          print(f"key={key}")
          PY
          echo "資料集 $DATASETS → 是否跳過：$(grep skip= $GITHUB_OUTPUT | tail -1)"

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - if: steps.guard.outputs.skip != 'true'
        run: pip install -r requirements.txt

      # Logo 第二版用 cairosvg 畫 SVG 版的頁首 Logo，它執行時要系統的 libcairo。
      # ubuntu 執行環境通常已經有（Chrome 的相依），已裝好時這一步幾秒就結束；
      # 裝不起來也不擋（|| true）—— 程式偵測不到 libcairo 會自動跳過 SVG，其他候選照常。
      - name: 確認 libcairo（Logo 的 SVG 用）
        if: steps.guard.outputs.skip != 'true'
        run: |
          if ldconfig -p | grep -q 'libcairo.so.2'; then echo "libcairo 已存在"
          else sudo apt-get install -y --no-install-recommends libcairo2 || echo "libcairo 裝不起來，這輪 Logo 會跳過 SVG"; fi
          python -c "import cairosvg; print('cairosvg 可用', cairosvg.__version__)" || echo "cairosvg 不可用，Logo 會跳過 SVG"

      - name: 回補
        if: steps.guard.outputs.skip != 'true'
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          BACKFILL_START: ${{ env.START_DATE }}
          LOGOS_ONLY: ${{ steps.guard.outputs.logos_only }}
          INTRADAY_ONLY: ${{ steps.guard.outputs.intraday_only }}
        run: |
          if [ "$LOGOS_ONLY" = "true" ] || [ "$INTRADAY_ONLY" = "true" ]; then
            EX=""
            if [ "$LOGOS_ONLY" = "true" ]; then EX="logos"; fi
            if [ "$INTRADAY_ONLY" = "true" ]; then EX="${EX:+$EX+}intraday"; fi
            python -m pipeline.run_backfill --datasets "$EX"
          elif [ "$DATASETS" = "plan" ]; then
            python -m pipeline.run_backfill --limit "$LIMIT" --plan default
          else
            python -m pipeline.run_backfill --limit "$LIMIT" --datasets "$DATASETS"
          fi

      - name: 回寫資料湖
        if: always() && steps.guard.outputs.skip != 'true'
        run: |
          git config user.name  "tw-rotation-bot"
          git config user.email "actions@github.com"
          git add data
          if git diff --staged --quiet; then
            echo "沒有資料變動，跳過 commit"
            exit 0
          fi
          git commit -m "歷史回補 $DATASETS $(date -u '+%Y-%m-%d %H:%M')"

          # Parquet 是二進位檔，rebase 遇到同檔修改會衝突而不是自動合併。
          # 所以退而求其次：重試時先把遠端抓下來，讓我們這邊的版本勝出
          # （資料層本來就是 append + 去重，下一輪會把缺的補回來）。
          for i in 1 2 3 4 5; do
            if git push origin "${{ github.ref_name }}"; then
              echo "推送成功"
              exit 0
            fi
            echo "推送被拒（第 $i 次），重新對齊遠端後再試…"
            git fetch origin "${{ github.ref_name }}"
            git checkout --ours -- data 2>/dev/null || true
            git rebase -X ours "origin/${{ github.ref_name }}" || {
              git rebase --abort || true
              git reset --soft "origin/${{ github.ref_name }}"
              git add data
              git commit -m "歷史回補 $DATASETS $(date -u '+%Y-%m-%d %H:%M') (合併重試)"
            }
            sleep $((i * 5))
          done
          echo "::error::推送連續失敗 5 次"
          exit 1

      # 接力判斷：計畫因 402 停下（plan:default.stopped_at 有值），或每日續補因 402 停下（quota_stopped）才接力。
      # 補齊了、或跑的是單一資料集／Logo／分 K，就交給排程。
      - name: 判斷要不要接力
        id: relay_check
        if: always() && steps.guard.outputs.skip != 'true'
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, pathlib
          p = pathlib.Path("data/_state/backfill_progress.json")
          relay = False
          only = os.environ.get("LO") == "true" or os.environ.get("IO") == "true"
          if os.environ["DATASETS"] == "plan" and not only and p.exists():
              st = json.loads(p.read_text()).get("complete", {}).get("plan:default") or {}
              relay = isinstance(st, dict) and not st.get("done") and bool(st.get("stopped_at"))
              # 計畫補齊後，每日續補（法人、融資券、當沖、借券）撞 402 也要接力（run_backfill._mark_quota_stopped）
              qs = json.loads(p.read_text()).get("quota_stopped") or {}
              relay = relay or (isinstance(qs, dict) and bool(qs.get("stopped")))
          print(f"relay={'true' if relay else 'false'}")
          PY
          cat "$GITHUB_OUTPUT" | grep relay=
        env:
          LO: ${{ steps.guard.outputs.logos_only }}
          IO: ${{ steps.guard.outputs.intraday_only }}

      - name: 執行摘要
        if: always()
        run: |
          {
            echo "### 歷史回補"
            echo "- 資料集：\`$DATASETS\`（key \`${{ steps.guard.outputs.key }}\`）"
            echo "- 觸發：${{ github.event_name }}；跳過：${{ steps.guard.outputs.skip }}"
            if [ -f data/_state/backfill_progress.json ]; then
              python3 - <<'PY'
          import json, pathlib, collections
          p = json.loads(pathlib.Path("data/_state/backfill_progress.json").read_text())
          # done 鍵的前綴＝資料集＋起始日：`dividend:` 是 2016 那一步，`dividend@2009-01-01:` 才是 2009 那一步，
          # 兩者不能混著看（2026-09-28 就是看錯前綴，把「每輪都在前進」誤判成「卡住」）。
          # 值是 "no_data" 的＝上游回空、確認無資料，不算「補到了」。
          c = collections.Counter(k.split(":")[0] for k in p.get("done", {}))
          nd = collections.Counter(k.split(":")[0] for k, v in p.get("done", {}).items() if v == "no_data")
          print("- 已處理檔數（其中確認無資料）：" + "、".join(
              f"{k} {v}" + (f"（{nd[k]}）" if nd.get(k) else "") for k, v in sorted(c.items())))
          plan = p.get("complete", {}).get("plan:default")
          if isinstance(plan, dict):
              steps = plan.get("steps") or {}
              print(f"- `plan:default`：{'補齊' if plan.get('done') else '未補齊'}"
                    f"（月份 {plan.get('month', '—')}，停在 {plan.get('stopped_at') or '—'}）")
              for k, v in steps.items():
                  print(f"  - `{k}`：{'補齊' if v else '未補齊'}")
          else:
              print("- `plan:default`：尚未跑過")
          for k, v in p.get("complete", {}).items():
              if k.startswith("plan:"):
                  continue
              ok = v.get('done') if isinstance(v, dict) else v
              rem = v.get('remaining') if isinstance(v, dict) else None
              tail = f"（還剩 {rem}）" if rem and any(rem.values()) else ""
              print(f"- `{k}`：{'補齊' if ok else '未補齊'}{tail}")
          PY
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # 接力（2026-10-05，Andy 授權「如果是自己補資料就做」；DECISIONS「接力」那條）：
  # GitHub 的 cron 常被延後或丟掉，一天實際只跑約 4 輪，每輪約 8 分鐘就用完 FinMind 600 次／小時，
  # 其餘額度閒著。這個 job 在額度用完時睡到下一個額度視窗，再用 GITHUB_TOKEN 派一輪 workflow_dispatch
  # （GITHUB_TOKEN 觸發 workflow_dispatch 是 GitHub 允許的例外，push 事件才不會連鎖）。
  # 不掛寫入佇列的 concurrency：睡覺時不能擋每日管線。
  relay:
    needs: backfill
    if: needs.backfill.outputs.relay == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: 等下一個額度視窗後派下一輪
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          N: ${{ inputs.relay_n || '0' }}
          LIMIT_IN: ${{ inputs.limit || '' }}
          START_IN: ${{ inputs.start_date || '2016-01-01' }}
        run: |
          set -u
          NEXT=$(( ${N:-0} + 1 ))
          if [ "$NEXT" -gt 30 ]; then echo "已接力 30 棒，停，交給排程"; exit 0; fi
          # FinMind 額度是一小時視窗：從這一輪開始算 62 分鐘後再派（這一輪在 402 前就已用掉大半小時的額度）。
          START=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .run_started_at)
          TARGET=$(( $(date -u -d "$START" +%s) + 62*60 ))
          WAIT=$(( TARGET - $(date -u +%s) ))
          if [ "$WAIT" -gt 0 ]; then echo "睡 $WAIT 秒到 $(date -u -d @$TARGET '+%H:%M') UTC"; sleep "$WAIT"; fi
          H=$(date -u +%H)
          if [ "$H" = "09" ] || [ "$H" = "10" ]; then
            echo "UTC $H 點：每日管線 18:30 那輪要用 FinMind，不派，交給 11:20 的排程"; exit 0; fi
          # 同一個 concurrency 群組只能有一個在排隊，新來的會把排隊中的取消掉：
          # 每日管線在排隊／等待，或已經有別的回補在排隊或在跑（排程補上來了），就不派。
          for wf in daily.yml backfill.yml; do
            for s in queued waiting pending in_progress; do
              C=$(gh api "repos/$REPO/actions/workflows/$wf/runs?status=$s&per_page=20" \
                    --jq "[.workflow_runs[] | select(.id != $RUN_ID)] | length")
              if [ "$wf" = "daily.yml" ] && [ "$s" = "in_progress" ]; then continue; fi
              if [ "${C:-0}" -gt 0 ]; then echo "$wf 有 $C 個 $s，不派，交給它／排程"; exit 0; fi
            done
          done
          gh api -X POST "repos/$REPO/actions/workflows/backfill.yml/dispatches" \
            -f ref="$REF" -f "inputs[datasets]=plan" -f "inputs[limit]=$LIMIT_IN" \
            -f "inputs[start_date]=$START_IN" -f "inputs[relay_n]=$NEXT"
          echo "### 接力：已派第 $NEXT 棒" >> "$GITHUB_STEP_SUMMARY"
