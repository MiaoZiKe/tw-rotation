name: ETF 成分股來源探測

# 只手動觸發。Claude 容器出口被擋，投信官網的 PCF／持股明細端點只有 Actions 打得到；
# 這支不寫資料湖、不動 main。2026-10-07 起 log 另推到 probe-log/<run id> 分支（只含 probe.log）：
# Claude 容器讀不到 Actions 的 log（log 放在 blob 主機，gh 只能連 api.github.com），不推出來就看不到探測結果。
# 看完就把那個分支刪掉（git push origin --delete probe-log/<run id>）。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "requests＝直接打網址；browser＝真瀏覽器開頁、記下回傳成分股的 XHR；selftest＝跑 pipeline/sources/etf_pcf.py 實抓（不寫湖）"
        type: choice
        options: [requests, browser, selftest, cert]
        default: requests
      extra:
        description: "額外要探測的網址（空白分隔；開頭加 --only-extra 只跑這些）"
        type: string
        default: ""

permissions:
  contents: write   # 只為了推 probe-log/<run id> 分支

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas openpyxl xlrd
      - name: 安裝瀏覽器
        if: inputs.mode == 'browser'
        run: pip install playwright && python -m playwright install --with-deps chromium
      - name: 探測（真瀏覽器）
        if: inputs.mode == 'browser'
        env:
          EXTRA: ${{ inputs.extra }}
        run: python scripts/probe_etf_pcf_browser.py $EXTRA 2>&1 | tee -a /tmp/probe.log
      - name: 實抓自我測試（不寫湖、不 commit）
        if: inputs.mode == 'selftest'
        env:
          EXTRA: ${{ inputs.extra }}
        run: pip install -q -r requirements.txt && python -m pipeline.sources.etf_pcf $EXTRA 2>&1 | tee -a /tmp/probe.log
      - name: 憑證鏈／條款探測（大華銀中繼憑證、玩股網與口袋的 robots 與條款）
        if: inputs.mode == 'cert'
        env:
          EXTRA: ${{ inputs.extra }}
        run: pip install -q certifi && python scripts/probe_etf_pcf_cert.py $EXTRA 2>&1 | tee -a /tmp/probe.log
      - name: 探測
        if: inputs.mode == 'requests'
        env:
          EXTRA: ${{ inputs.extra }}
        run: python scripts/probe_etf_pcf.py $EXTRA 2>&1 | tee -a /tmp/probe.log
      - name: 把 log 推到 probe-log/<run id>
        if: always()
        run: |
          mkdir /tmp/out && cd /tmp/out && git init -q && cp /tmp/probe.log .
          git config user.name probe-bot && git config user.email probe@users.noreply.github.com
          git add probe.log && git commit -qm "probe log ${{ github.run_id }}"
          git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/probe-log/${{ github.run_id }}
