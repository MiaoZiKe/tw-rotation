name: 部署網站

# 程式碼（site/ 或 pipeline/）一推上來就重新產出前端 JSON 並部署。
# v3 起 site/data/ 不進版控（每天重寫幾十 MB 的 JSON 會把 repo 撐爆），
# 所以這裡要先從資料湖把 JSON 算出來再上傳。
# 不寫 repo，所以不加入資料寫入的 concurrency 群組 —— 不用排在歷史回補後面。
#
# 2026-09-18：加上「前端 JSON 快取」。實測 run #20 的逐步秒數：
#   產出 JSON 866s／checkout 5s／pip 15s／版本戳 0s／上傳 5s／部署 22s
# —— 整個部署的 94% 都在那一步。而**改前端的推送根本不需要重算**：
# 資料湖沒變、pipeline 沒變，算出來的 JSON 一模一樣。
# 快取的 key 就是這三樣東西的內容雜湊，命中就直接沿用上一次的產出。

# 2026-10-03 分支預覽（DECISIONS #301，說明見 docs/preview.md）：
#   · main 有 push → 照舊部署正式站，**同時**把 origin 上所有 preview/* 分支的 site/ 放到 preview/<名稱>/。
#   · preview/* 有 push → 這次的 run 不部署（github-pages 環境只准 main 部署），
#     只用 workflow_dispatch 叫 main 重跑一次；真正的部署永遠在 main 上做，正式站只會是 main 的程式碼。
#     ⚠ 這條只在「那個 preview 分支裡的 pages.yml 也有這段」時才會觸發（push 事件讀的是被推的那個分支的工作流）。
#       從舊 main 拉出來的分支沒有 → 推完手動跑一次 workflow_dispatch（docs/preview.md 有寫）。
#   · 刪掉 preview/* 分支 → delete 事件（讀 main 的工作流）重新部署，那份預覽就消失。
on:
  delete:
  push:
    branches: [main, "preview/**"]
    paths:
      - "site/**"
      - "pipeline/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "強制重算前端 JSON（不吃快取）"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# 正式部署的群組照舊是 pages。preview/* 推送那種 run 只是轉呼叫 main，放在自己的群組，
# 不要排在正在跑的部署後面空等（cancel-in-progress 一律 false，CLAUDE.md 絕對不准改）。
# ⚠ 刪掉「非 preview」分支（claude/* 之類）也會觸發 delete 事件、什麼都不做 ——
#   那種 run 一定要放別的群組：同一群組裡新排進來的 run 會把「還在排隊的正式部署」擠掉，
#   等於刪一個分支就讓網站停在舊版。
concurrency:
  group: ${{ startsWith(github.ref, 'refs/heads/preview/') && format('pages-relay-{0}', github.ref) || (github.event_name == 'delete' && !(github.event.ref_type == 'branch' && startsWith(github.event.ref, 'preview/'))) && format('pages-noop-{0}', github.event.ref) || 'pages' }}
  cancel-in-progress: false

jobs:
  # preview/* 推上來 → 叫 main 重新部署（main 那一輪會把所有 preview/* 一起裝進去）
  relay-preview:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/preview/') }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: 叫 main 重新部署（預覽版會一起更新）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml --repo "${{ github.repository }}" --ref main
          N="${GITHUB_REF_NAME#preview/}"
          echo "已排入 main 的部署；完成後預覽網址：https://miaozike.github.io/tw-rotation/preview/${N//\//-}/"

  deploy:
    # main 的 push／手動執行，或刪掉的是 preview/* 分支時才部署。其他分支刪除、preview 推送一律不跑。
    if: ${{ !startsWith(github.ref, 'refs/heads/preview/') && (github.event_name != 'delete' || (github.event.ref_type == 'branch' && startsWith(github.event.ref, 'preview/'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # key 只看「會改變 JSON 內容的東西」：資料湖、pipeline 程式、套件版本。
      # site/** 刻意不算進去 —— 前端改動不影響 JSON，那正是要吃快取的情況。
      # 版號前綴 payload-v1：以後若 JSON 格式改版，把它加一號就能讓舊快取全部失效。
      - name: 前端 JSON 快取（資料湖與 pipeline 都沒變就不用重算）
        id: payload-cache
        if: ${{ github.event.inputs.force_rebuild != 'true' }}
        uses: actions/cache@v4
        with:
          path: site/data
          key: payload-v1-${{ hashFiles('data/**', 'pipeline/**', 'requirements.txt') }}

      - name: 從資料湖產出前端 JSON
        if: ${{ steps.payload-cache.outputs.cache-hit != 'true' }}
        run: python -m pipeline.build_payload

      - name: 快取命中，沿用上一次的 JSON
        if: ${{ steps.payload-cache.outputs.cache-hit == 'true' }}
        run: |
          echo "資料湖與 pipeline 都沒變，直接用上一次算好的 JSON"
          echo "個股頁 $(ls site/data/stock 2>/dev/null | wc -l) 檔／總共 $(du -sh site/data | cut -f1)"

      # 版號的「第幾版」不能在 runner 上用 git 數：checkout 是淺 clone，
      # `git rev-list --count --since=今天` 永遠回 1，所以一天推兩次都會寫「第 1 版」
      # （2026-09-18 Andy 在線上發現的）。改成直接問 GitHub「今天跑了幾次部署」，
      # 一個 API 呼叫，不用把整個 repo 歷史抓下來。失敗就給空值，版號退回只寫日期。
      - name: 問 GitHub 今天是第幾次部署
        id: seq
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # ⚠ 網址裡的 + 一定要寫成 %2B：沒編碼的 + 會被伺服器解成空白，時區就錯了，
          # 等於從 UTC 00:00（台北 08:00）起算 —— 台北 00:00～08:00 的部署都沒被數到
          # （2026-09-24 deployer 實測：沒編碼回 2、編碼後回 8；也是 09-23「推 14 看到 5」的原因）。
          SINCE=$(TZ=Asia/Taipei date +%Y-%m-%d)T00:00:00%2B08:00
          # &branch=main：preview/* 推送的轉呼叫 run 不算正式站的一版（2026-10-03 分支預覽）
          N=$(gh api "repos/${{ github.repository }}/actions/workflows/pages.yml/runs?branch=main&created=%3E%3D${SINCE}&per_page=100" --jq '.total_count' 2>/dev/null || echo "")
          echo "今天（台北 ${SINCE/\%2B/+}）第 ${N:-?} 次部署"
          echo "n=${N}" >> "$GITHUB_OUTPUT"

      - name: 給自家 JS/CSS 加版本戳（不加的話部署完還要按 Ctrl+F5 才看得到新版）
        run: python scripts/stamp_assets.py
        env:
          TW_BUILD_SEQ: ${{ steps.seq.outputs.n }}
      # 2026-09-25（R6 審查追補）：tasks.json 是內部作業文字，不准上 public 網站。
      # build_payload 已經不寫、也會刪舊檔；這一步是給「快取命中、沿用舊 site/data」那條路的保險。
      - name: 確認部署產物裡沒有 tasks.json
        run: rm -f site/data/tasks.json
      # 2026-09-27 會員登入／使用統計（DECISIONS #270）：前端要知道 account-api 的網址。
      # repo 裡的 site/account_config.js 永遠是空的（api: ''）＝功能關閉；這一步依 Secret 覆寫「部署產物」裡的那支，
      # 網址不進版控。Secret 沒設 → 維持空的 → 沒有登入鈕、不送統計、頁面照常（所以可以先上線、等 Andy 設好再生效）。
      # 放在版本戳之前或之後都可以（戳記只改 index.html 的 ?v=），這裡放在上傳前最後一步，讀起來比較直觀。
      - name: 會員功能設定（沒設 ACCOUNT_API_URL 就維持關閉）
        env:
          ACCOUNT_API_URL: ${{ secrets.ACCOUNT_API_URL }}
        run: |
          if [ -n "$ACCOUNT_API_URL" ]; then
            case "$ACCOUNT_API_URL" in
              https://*)
                python -c "import json,os; u=os.environ['ACCOUNT_API_URL'].strip().rstrip('/'); open('site/account_config.js','w',encoding='utf-8').write('/* 部署時由 pages.yml 依 Secret ACCOUNT_API_URL 產生（repo 裡是空的）*/\nwindow.TW_ACCOUNT = ' + json.dumps({'api': u}) + ';\n')"
                echo "會員功能：開啟";;
              *) echo "::warning::ACCOUNT_API_URL 不是 https:// 開頭，會員功能維持關閉";;
            esac
          else
            echo "會員功能：沒設 ACCOUNT_API_URL，維持關閉（設定步驟見 docs/login_setup.md）"
          fi
      # 2026-10-03 分支預覽（DECISIONS #301）：origin 上每個 preview/* 分支的 site/（不含 data/）
      # 放到 site/preview/<名稱>/，資料讀正式站的 ../../data/，所以每份只多約 7MB。
      # 放在會員設定之後：預覽版沿用這裡已經填好的 account_config.js。失敗不擋正式站部署。
      - name: 分支預覽（preview/* → preview/<名稱>/）
        continue-on-error: true
        env:
          TW_BUILD_SEQ: ${{ steps.seq.outputs.n }}
        run: |
          python scripts/preview_inject.py
          echo "部署包大小：$(du -sh site | cut -f1)（其中預覽 $(du -sh site/preview 2>/dev/null | cut -f1 || echo 0)）"
      # 2026-10-06 資安（Andy：「點選 F12 會有我下過的 Prompt……幫我修正」）：
      #   · delivery.json 是交付清單頁的資料，內容就是 Andy 的逐字原話 → 不上 public 網站（入口早已收掉，頁面會顯示「尚無資料」）。
      #   · 發佈出去的自家 JS／CSS／HTML 一律壓縮並拿掉註解；repo 裡的原始碼保留註解。esbuild 鎖定版本。
      #   · source map 不准發佈（minify_site.py 會刪 *.map，下面再檢查一次）。
      #   放在預覽注入之後：preview/<名稱>/ 底下的檔案也一起處理。任何一支壓縮失敗 → 整個部署失敗，不發佈半套。
      - name: 拿掉內部作業資料（交付清單原話）
        run: rm -f site/data/delivery.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 壓縮發佈檔並移除註解（esbuild 0.28.2）
        run: |
          npm i -g esbuild@0.28.2
          python scripts/minify_site.py site
          if find site -name '*.map' | grep -q .; then echo "::error::部署產物裡還有 source map"; exit 1; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
