name: 部署網站

# 程式碼（site/ 或 pipeline/）一推上來就重新產出前端 JSON 並部署。
# v3 起 site/data/ 不進版控（每天重寫幾十 MB 的 JSON 會把 repo 撐爆），
# 所以這裡要先從資料湖把 JSON 算出來再上傳。
# 不寫 repo，所以不加入資料寫入的 concurrency 群組 —— 不用排在歷史回補後面。
#
# 2026-09-18：加上「前端 JSON 快取」。實測 run #20 的逐步秒數：
#   產出 JSON 866s／checkout 5s／pip 15s／版本戳 0s／上傳 5s／部署 22s
# —— 整個部署的 94% 都在那一步。而**改前端的推送根本不需要重算**：
# 資料湖沒變、pipeline 沒變，算出來的 JSON 一模一樣。
# 快取的 key 就是這三樣東西的內容雜湊，命中就直接沿用上一次的產出。

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "pipeline/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "強制重算前端 JSON（不吃快取）"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # key 只看「會改變 JSON 內容的東西」：資料湖、pipeline 程式、套件版本。
      # site/** 刻意不算進去 —— 前端改動不影響 JSON，那正是要吃快取的情況。
      # 版號前綴 payload-v1：以後若 JSON 格式改版，把它加一號就能讓舊快取全部失效。
      - name: 前端 JSON 快取（資料湖與 pipeline 都沒變就不用重算）
        id: payload-cache
        if: ${{ github.event.inputs.force_rebuild != 'true' }}
        uses: actions/cache@v4
        with:
          path: site/data
          key: payload-v1-${{ hashFiles('data/**', 'pipeline/**', 'requirements.txt') }}

      - name: 從資料湖產出前端 JSON
        if: ${{ steps.payload-cache.outputs.cache-hit != 'true' }}
        run: python -m pipeline.build_payload

      - name: 快取命中，沿用上一次的 JSON
        if: ${{ steps.payload-cache.outputs.cache-hit == 'true' }}
        run: |
          echo "資料湖與 pipeline 都沒變，直接用上一次算好的 JSON"
          echo "個股頁 $(ls site/data/stock 2>/dev/null | wc -l) 檔／總共 $(du -sh site/data | cut -f1)"

      - name: 給自家 JS/CSS 加版本戳（不加的話部署完還要按 Ctrl+F5 才看得到新版）
        run: python scripts/stamp_assets.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
