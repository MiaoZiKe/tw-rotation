name: 部署網站

# 只負責把 site/ 推上 GitHub Pages。不抓資料、不寫 repo，
# 所以不加入資料寫入的 concurrency 群組 —— 程式碼一推上來就部署，
# 不用排在一小時的歷史回補後面（那正是之前更新看不到的原因）。

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
