name: 頻道② 科技透明圈 發文
# 2026-11-08 Andy：「開通自動發文，這部分幫我想辦法自動化」。說明：docs/marketing/channels/tc/autopost.md
# - 每 15 分鐘看 social/tc/queue/：只發 Andy 核准（status: approved）且到點的稿；沒有 approved 稿就什麼都不做。
# - 權杖只用 TC_*（跟頻道一股市帳號完全分開）；頻道一只傳「帳號 id」進來比對，防止發到股市帳號，不傳頻道一權杖。
# - 沒有 TC 權杖 → 安靜跳過（成功結束、不寄失敗信）；approved 超過 30 分鐘沒發 → 開 issue。
# - 手動觸發預設 dry_run＝true：只驗證格式、圖檔與帳號，不發、不寫檔。
# ★ 2026-11-10 頻道④交接（Andy：「Tech_01010909 丟給他們單位處理」）：頻道② 帳號就是 @tech_01010909，
#   權杖改吃頻道④已驗證的 TECH_*（*_AUTO 優先）；TC_* 收件流程保留但不需要。channel_post.yml 的 tech 已停用，避免重複發文。
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只驗證不發（true＝安全試跑；false＝真的發 approved 稿）"
        type: boolean
        default: true
      post:
        description: "只處理這個資料夾（例如 20261105_quanta）；留空＝全部"
        type: string
        default: ""
      fb_check:
        description: "只讀檢查 FB 粉專權杖（查粉專名稱、ID、權杖類型；不發文、不跑發文流程）"
        type: boolean
        default: false
      fb_only:
        description: "把這支已發影片補發到 FB 粉專 Reels（例如 20261122_800v；不看 fb.json 開關、不動 IG／Threads）；dry_run=true 時只檢查不發"
        type: string
        default: ""
permissions:
  contents: write   # 回寫 post.md 的 urls／status 與 state/tc/posted.json
  issues: write     # 監工告警
concurrency:
  group: tc-post
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests   # EAA 權杖找 IG 帳號編號重用 healing_post（要 requests）
      - name: 先檢查格式（不連外）
        run: python scripts/tc_post.py --check
      # 2026-11-23 FB 粉專：只讀檢查（fb_check=true 時只跑這一步）
      - name: FB 粉專權杖只讀檢查
        if: github.event_name == 'workflow_dispatch' && inputs.fb_check
        env:
          TC_FB_PAGE_TOKEN: ${{ secrets.TECH_FB_PAGE_TOKEN }}
          TC_FB_PAGE_ID: ${{ secrets.TECH_FB_PAGE_ID }}
        run: python scripts/tc_fb.py --check
      - name: FB 粉專補發一支已發影片（fb_only）
        id: fbonly
        if: github.event_name == 'workflow_dispatch' && !inputs.fb_check && inputs.fb_only != ''
        continue-on-error: true
        env:
          TC_FB_PAGE_TOKEN: ${{ secrets.TECH_FB_PAGE_TOKEN }}
          TC_FB_PAGE_ID: ${{ secrets.TECH_FB_PAGE_ID }}
          IN_FB: ${{ inputs.fb_only }}
        run: |
          case "$IN_FB" in *[!A-Za-z0-9_-]*) echo "資料夾名稱不合法"; exit 1 ;; esac
          args="--fb-only $IN_FB"
          if [ "${{ inputs.dry_run }}" != "false" ]; then args="$args --dry-run"; fi
          python scripts/tc_post.py $args
      - name: 發文（或 dry-run）
        id: post
        if: ${{ !inputs.fb_check && !inputs.fb_only }}
        continue-on-error: true
        env:
          TC_FB_PAGE_TOKEN: ${{ secrets.TECH_FB_PAGE_TOKEN }}
          TC_FB_PAGE_ID: ${{ secrets.TECH_FB_PAGE_ID }}
          TC_THREADS_TOKEN: ${{ secrets.TECH_THREADS_ACCESS_TOKEN_AUTO || secrets.TECH_THREADS_ACCESS_TOKEN }}
          TC_IG_TOKEN: ${{ secrets.TECH_IG_ACCESS_TOKEN_AUTO || secrets.TECH_IG_ACCESS_TOKEN }}
          TC_THREADS_USER_ID: ${{ secrets.TECH_THREADS_USER_ID }}
          TC_IG_USER_ID: ${{ secrets.TECH_IG_USER_ID }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IN_POST: ${{ inputs.post }}
        run: |
          args=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" != "false" ]; then args="--dry-run"; fi
          case "$IN_POST" in ''|*[!A-Za-z0-9_-]*) ;; *) args="$args --post $IN_POST" ;; esac
          python scripts/tc_post.py $args
      # 2026-11-23 FB 追進度（Andy：「從 2 奈米影片一路發到今天，早上 08:00 和 20:00 發布」「直到發到下一步要發布的，回歸跟 IG 一樣時間」）
      # 設定 social/tc/fb_backfill.json；待補清單不空時，時段到了之後第一輪補最舊的 1 支。獨立一步、continue-on-error，不影響上面 IG／Threads。
      - name: FB 粉專追進度補發（每個時段最多 1 支）
        id: fbbackfill
        if: ${{ !inputs.fb_check && !inputs.fb_only && !inputs.post }}
        continue-on-error: true
        env:
          TC_FB_PAGE_TOKEN: ${{ secrets.TECH_FB_PAGE_TOKEN }}
          TC_FB_PAGE_ID: ${{ secrets.TECH_FB_PAGE_ID }}
        run: |
          args="--fb-backfill"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" != "false" ]; then args="$args --dry-run"; fi
          python scripts/tc_post.py $args
      # 2026-11-20 留言關鍵字回覆（Threads 公開回覆＋IG 私訊）拆到 tc_comments.yml，由 gh-cron Worker 每 10 分鐘派；這裡只管發文。
      - name: 回寫發文結果（只 add 頻道② 的佇列與紀錄）
        if: always() && !(github.event_name == 'workflow_dispatch' && (inputs.dry_run != false || inputs.fb_check))
        run: |
          git config user.name  "tw-rotation-bot"
          git config user.email "actions@github.com"
          git add social/tc/queue state/tc 2>/dev/null || true
          if git diff --staged --quiet; then echo "沒有變動"; exit 0; fi
          git commit -q -m "頻道② 科技透明圈 發文紀錄 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3 4 5; do
            git pull -q --rebase --autostash origin main && git push -q origin HEAD:main && { echo "推送成功"; exit 0; }
            sleep $((i*3))
          done
          echo "::warning::發文紀錄推不上 main"
      - name: 監工：已核准沒發出 → 開 issue
        if: always() && steps.post.outputs.alert == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          REASONS: ${{ steps.post.outputs.reasons }}
        run: |
          T="⚠️ 頻道② 科技透明圈：已核准貼文沒發出"
          N=$(gh issue list -R "${{ github.repository }}" --state open --search "in:title 頻道② 科技透明圈：已核准貼文沒發出" --json number -q '.[0].number' || true)
          if [ -n "$N" ]; then echo "已有 issue #$N，不重複開"; exit 0; fi
          gh issue create -R "${{ github.repository }}" --title "$T" --body "原因：${REASONS}

          這次執行：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          處理方式：docs/marketing/channels/tc/autopost.md「沒發出怎麼辦」。修好後把 post.md 改回 status: approved，下一輪只補沒發的平台。" || echo "::warning::開 issue 失敗"
      - name: IG 到了 delete_at → 開 issue 請人工刪（Instagram 登入版 API 不能刪貼文）
        if: always() && steps.post.outputs.ig_delete == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          LIST: ${{ steps.post.outputs.ig_delete_list }}
        run: |
          gh issue create -R "${{ github.repository }}" --title "頻道② 科技透明圈：IG 貼文到期，請手動刪除" --body "到了 delete_at 的 IG 貼文：${LIST}

          Threads 已自動刪除；IG（Instagram 登入版 API）官方不提供刪除，請手動刪：
          1. 用手機打開上面的連結（或 IG App → 個人檔案 → 點那篇貼文）。
          2. 點貼文右上角「⋯」→「刪除」→ 再按一次「刪除」確認。
          3. 刪完回這個 issue 留言「已刪」並關閉。

          這次執行：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || echo "::warning::開 issue 失敗"
      - name: 監工：FB 粉專 Reels 沒發出 → 開 issue（不影響 IG／Threads）
        if: always() && (steps.post.outputs.fb_alert == '1' || steps.fbonly.outputs.fb_alert == '1' || steps.fbbackfill.outputs.fb_alert == '1')
        env:
          GH_TOKEN: ${{ github.token }}
          REASONS: ${{ steps.post.outputs.fb_reasons }}${{ steps.fbonly.outputs.fb_reasons }}${{ steps.fbbackfill.outputs.fb_reasons }}
        run: |
          N=$(gh issue list -R "${{ github.repository }}" --state open --search "in:title 頻道② 科技透明圈：FB 粉專 Reels 沒發出" --json number -q '.[0].number' || true)
          if [ -n "$N" ]; then gh issue comment "$N" -R "${{ github.repository }}" --body "又一次：${REASONS}（${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}）" || true; exit 0; fi
          gh issue create -R "${{ github.repository }}" --title "⚠️ 頻道② 科技透明圈：FB 粉專 Reels 沒發出" --body "原因：${REASONS}

          IG／Threads 不受影響。這次執行：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          補發排程（social/tc/fb_backfill.json）失敗會在下一輪自動重試，同一支最多 3 次；重試用完的修好後用 tc_post.yml 手動觸發 fb_only=<資料夾>、dry_run=false 補發（已發過的不會重發）。" || echo "::warning::開 issue 失敗"
      - name: 發文失敗就讓流程失敗（會收到 GitHub 通知）
        if: steps.post.outcome == 'failure' || steps.fbonly.outcome == 'failure' || steps.fbbackfill.outcome == 'failure'
        run: |
          echo "發文失敗，請看上一步的訊息；post.md 已標 status: error"
          exit 1
