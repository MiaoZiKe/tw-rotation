name: 社群刪文（手動）

# 只能手動觸發。預設 mode=list：只列出 Threads／IG 全部貼文（不刪），清單當 artifact 上傳。
# mode=delete：只刪 Threads（IG 官方 API 不支援刪），而且 confirm 必須填「我確定刪除」一字不差。
# 說明與 Andy 要做的設定：docs/marketing/diagnosis_1102/delete_capability.md
# 權杖：THREADS_DELETE_TOKEN → THREADS_ACCESS_TOKEN_AUTO → THREADS_ACCESS_TOKEN 逐把查刪除權限，用第一把有的（2026-11-09）。
# mode=archive：完整備份（全文、圖片網址、圖檔）一般 commit 到 social-snaps 的 archive/<archive_name>/，不刪任何東西。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "list＝只列清單（不刪）；archive＝完整備份到 social-snaps（不刪）；delete＝真的刪"
        type: choice
        options: [list, archive, delete]
        default: list
      confirm:
        description: "mode=delete 時必填：我確定刪除"
        type: string
        default: ""
      ids:
        description: "mode=delete：要刪的 Threads id，用逗號或空白分隔（與 ids_file 二選一）"
        type: string
        default: ""
      ids_file:
        description: "mode=delete：repo 裡的 id 清單檔路徑（例如 social/delete/ids_1102.txt）"
        type: string
        default: ""
      max:
        description: "本次最多刪幾則（官方 24 小時上限 100）"
        type: string
        default: "90"
      platform:
        description: "mode=delete：threads 或 ig（ig＝試刪，第一則權限錯誤就停）"
        type: choice
        options: [threads, ig]
        default: threads
      keep_from_tw:
        description: "台北日期 YYYY-MM-DD：這天（含）之後發的全部保留（2026-11-09 重新開始用）"
        type: string
        default: ""
      archive_name:
        description: "mode=archive：存到 social-snaps 的 archive/<這個名字>/"
        type: string
        default: "pre_restart_1109"
      sleep:
        description: "每刪一則間隔秒數，或 5-10（隨機）"
        type: string
        default: "5-10"
      with_views:
        description: "列清單時抓觀看數（較慢）"
        type: boolean
        default: true

concurrency:
  group: social-delete
  cancel-in-progress: false

permissions:
  contents: write      # 2026-11-09：mode=archive 要把備份 commit 到 social-snaps（一般 commit，不 force）

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 列清單（不刪）
        if: inputs.mode == 'list'
        env:
          THREADS_DELETE_TOKEN: ${{ secrets.THREADS_DELETE_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN_AUTO || secrets.THREADS_ACCESS_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN_AUTO || secrets.IG_ACCESS_TOKEN }}
          WITH_VIEWS: ${{ inputs.with_views }}
        run: |
          extra=""
          if [ "$WITH_VIEWS" != "true" ]; then extra="--no-views"; fi
          python scripts/social_delete.py --out out/social_delete/list.json $extra

      - name: 完整備份到 social-snaps（不刪）
        if: inputs.mode == 'archive'
        env:
          THREADS_DELETE_TOKEN: ${{ secrets.THREADS_DELETE_TOKEN }}
          THREADS_ACCESS_TOKEN_AUTO: ${{ secrets.THREADS_ACCESS_TOKEN_AUTO }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN_AUTO || secrets.IG_ACCESS_TOKEN }}
          IN_KEEP: ${{ inputs.keep_from_tw }}
          IN_NAME: ${{ inputs.archive_name }}
        run: |
          set -e
          case "$IN_NAME" in ''|*[!A-Za-z0-9_-]*) echo "::error::archive_name 只能英數、底線、減號"; exit 2;; esac
          mkdir -p out/social_delete
          case "$IN_KEEP" in ''|[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;; *) echo "::error::keep_from_tw 要 YYYY-MM-DD"; exit 2;; esac
          K=""; if [ -n "$IN_KEEP" ]; then K="--keep-from-tw $IN_KEEP"; fi
          python scripts/social_delete.py --archive-dir "out/social_delete/archive" $K --download-media
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            rm -rf "$RUNNER_TEMP/snaps"
            git fetch --depth=1 origin social-snaps
            git worktree add -f "$RUNNER_TEMP/snaps" FETCH_HEAD
            mkdir -p "$RUNNER_TEMP/snaps/archive/$IN_NAME"
            cp -r out/social_delete/archive/. "$RUNNER_TEMP/snaps/archive/$IN_NAME/"
            cd "$RUNNER_TEMP/snaps"
            git add "archive/$IN_NAME"
            git commit -q -m "社群備份：重新開始前完整備份 archive/$IN_NAME（刪文前，全文＋圖片網址＋圖檔）" || { echo "沒有變更"; exit 0; }
            if git push origin HEAD:social-snaps; then echo "備份 commit：$(git rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
            cd "$GITHUB_WORKSPACE"; git worktree remove -f "$RUNNER_TEMP/snaps"; sleep $((i * 5))
          done
          echo "::error::備份推不上 social-snaps"; exit 1

      - name: 真的刪
        if: inputs.mode == 'delete'
        env:
          THREADS_DELETE_TOKEN: ${{ secrets.THREADS_DELETE_TOKEN }}
          THREADS_ACCESS_TOKEN_AUTO: ${{ secrets.THREADS_ACCESS_TOKEN_AUTO }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN_AUTO || secrets.IG_ACCESS_TOKEN }}
          IN_PLATFORM: ${{ inputs.platform }}
          IN_KEEP: ${{ inputs.keep_from_tw }}
          IN_SLEEP: ${{ inputs.sleep }}
          IN_CONFIRM: ${{ inputs.confirm }}
          IN_IDS: ${{ inputs.ids }}
          IN_IDS_FILE: ${{ inputs.ids_file }}
          IN_MAX: ${{ inputs.max }}
        run: |
          set -e
          if [ "$IN_CONFIRM" != "我確定刪除" ]; then
            echo "::error::confirm 沒填「我確定刪除」，一則都沒刪"; exit 2
          fi
          case "$IN_MAX" in ''|*[!0-9]*) echo "::error::max 要填數字"; exit 2;; esac
          mkdir -p out/social_delete
          if [ -n "$IN_IDS_FILE" ]; then
            cp -- "$IN_IDS_FILE" out/social_delete/ids.txt
          else
            printf '%s\n' "$IN_IDS" | tr ', ' '\n\n' | sed '/^$/d' > out/social_delete/ids.txt
          fi
          if [ ! -s out/social_delete/ids.txt ]; then
            echo "::error::沒有要刪的 id（ids 或 ids_file 擇一填）"; exit 2
          fi
          case "$IN_SLEEP" in ''|*[!0-9.-]*) echo "::error::sleep 要填數字或 5-10"; exit 2;; esac
          case "$IN_KEEP" in ''|[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;; *) echo "::error::keep_from_tw 要 YYYY-MM-DD"; exit 2;; esac
          K=""; if [ -n "$IN_KEEP" ]; then K="--keep-from-tw $IN_KEEP"; fi
          P="--platform threads"; if [ "$IN_PLATFORM" = "ig" ]; then P="--platform ig --ig-try-delete"; fi
          python scripts/social_delete.py --execute $P --ids-file out/social_delete/ids.txt $K --sleep "$IN_SLEEP" \
            --confirm "$IN_CONFIRM" --max "$IN_MAX" --result out/social_delete/result.json

      - name: 上傳清單／結果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: social-delete-${{ inputs.mode }}-${{ github.run_id }}
          path: out/social_delete/
          if-no-files-found: warn
          retention-days: 30
