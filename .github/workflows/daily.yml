name: 每日盤後管線

on:
  schedule:
    # 台北 18:30（UTC 10:30），週一到週五。
    # 台股 13:30 收盤，但三大法人與融資券要到傍晚才全部落地，18:30 是安全水位。
    # 注意：GitHub 免費層的排程可能延遲數十分鐘，這是正常的。
    - cron: "30 10 * * 1-5"
  workflow_dispatch:
    inputs:
      skip_finmind:
        description: "跳過 FinMind（不動用每小時額度）"
        type: boolean
        default: false

# 每日管線與歷史回補都會 commit 資料回 repo。
# 同時跑的話，後完成的那個 push 一定會被拒絕（這就是歷史回補一直 Fail 的原因）。
# 共用同一個 concurrency group 讓它們排隊，而不是互相踩。
concurrency:
  group: tw-rotation-data-write
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # checkout 分支最新 commit 而非觸發當下的 SHA：排在 concurrency 佇列裡等待時，
      # 回補可能已經推了新資料，用舊 SHA 算出來的 JSON 會少掉那批資料
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安裝相依套件
        run: pip install -r requirements.txt

      - name: 跑指標庫測試
        # 測試沒過就不要讓壞掉的計算污染資料湖
        run: python -m pytest tests/ -q

      - name: 抓取與計算
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          UNIVERSE_SIZE: "500"
        run: |
          python -m pipeline.run_daily \
            ${{ inputs.skip_finmind && '--skip-finmind' || '' }}

      - name: 回寫資料湖
        run: |
          git config user.name  "tw-rotation-bot"
          git config user.email "actions@github.com"
          git add data site/data
          if git diff --staged --quiet; then
            echo "沒有資料變動，跳過 commit"
            exit 0
          fi
          git commit -m "資料更新 $(date -u '+%Y-%m-%d')"

          # Parquet 是二進位檔，rebase 遇到同檔修改會衝突而不是自動合併。
          # 所以退而求其次：重試時先把遠端抓下來，讓我們這邊的版本勝出
          # （資料層本來就是 append + 去重，下一輪會把缺的補回來）。
          for i in 1 2 3 4 5; do
            if git push origin "${{ github.ref_name }}"; then
              echo "推送成功"
              exit 0
            fi
            echo "推送被拒（第 $i 次），重新對齊遠端後再試…"
            git fetch origin "${{ github.ref_name }}"
            git checkout --ours -- data site/data 2>/dev/null || true
            git rebase -X ours "origin/${{ github.ref_name }}" || {
              git rebase --abort || true
              git reset --soft "origin/${{ github.ref_name }}"
              git add data site/data
              git commit -m "資料更新 $(date -u '+%Y-%m-%d') (合併重試)"
            }
            sleep $((i * 5))
          done
          echo "::error::推送連續失敗 5 次"
          exit 1

      - name: 上傳網站
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: 執行摘要
        if: always()
        run: |
          echo "### 本輪執行結果" >> $GITHUB_STEP_SUMMARY
          if [ -f data/_state/last_run.json ]; then
            python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json, pathlib
          r = json.loads(pathlib.Path("data/_state/last_run.json").read_text())
          print(f"- 交易日：`{r.get('trade_date')}`")
          print(f"- 耗時：{r.get('duration_seconds')}s")
          print(f"- FinMind 剩餘額度：{r.get('finmind_budget_left')}")
          errs = r.get("errors") or []
          print(f"- 錯誤數：{len(errs)}")
          for e in errs:
              print(f"  - `{e}`")
          print("")
          print("| 資料表 | 列數 | 最新 |")
          print("|---|---:|---|")
          for t in r.get("tables", []):
              print(f"| {t['table']} | {t['rows']:,} | {t['latest']} |")
          PY
          else
            echo "找不到 last_run.json —— 管線可能在寫出紀錄前就中斷了" >> $GITHUB_STEP_SUMMARY
          fi

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
