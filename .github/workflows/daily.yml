name: 每日盤後管線

on:
  schedule:
    # 台北 18:30（UTC 10:30），週一到週五。
    # 台股 13:30 收盤，但三大法人與融資券要到傍晚才全部落地，18:30 是安全水位。
    # 注意：GitHub 免費層的排程可能延遲數十分鐘，這是正常的。
    - cron: "30 10 * * 1-5"
  workflow_dispatch:
    inputs:
      skip_finmind:
        description: "跳過 FinMind（不動用每小時額度）"
        type: boolean
        default: false

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安裝相依套件
        run: pip install -r requirements.txt

      - name: 跑指標庫測試
        # 測試沒過就不要讓壞掉的計算污染資料湖
        run: python -m pytest tests/ -q

      - name: 抓取與計算
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          UNIVERSE_SIZE: "500"
        run: |
          python -m pipeline.run_daily \
            ${{ inputs.skip_finmind && '--skip-finmind' || '' }}

      - name: 回寫資料湖
        run: |
          git config user.name  "tw-rotation-bot"
          git config user.email "actions@github.com"
          git add data site/data
          if git diff --staged --quiet; then
            echo "沒有資料變動，跳過 commit"
          else
            git commit -m "資料更新 $(date -u '+%Y-%m-%d')"
            # 期間若有人推 code，改用 rebase 避免整輪白跑
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push
          fi

      - name: 上傳網站
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: 執行摘要
        if: always()
        run: |
          echo "### 本輪執行結果" >> $GITHUB_STEP_SUMMARY
          if [ -f data/_state/last_run.json ]; then
            python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json, pathlib
          r = json.loads(pathlib.Path("data/_state/last_run.json").read_text())
          print(f"- 交易日：`{r.get('trade_date')}`")
          print(f"- 耗時：{r.get('duration_seconds')}s")
          print(f"- FinMind 剩餘額度：{r.get('finmind_budget_left')}")
          td = r.get("finmind_token_days_left")
          if td is None:
              print("- FinMind token：未設定或無法解析")
          elif td < 0:
              print(f"- **FinMind token 已過期 {-td} 天** —— 法人籌碼已停止更新，請更新 secret")
          else:
              print(f"- FinMind token 剩餘天數：{td}")
          errs = r.get("errors") or []
          print(f"- 錯誤數：{len(errs)}")
          for e in errs:
              print(f"  - `{e}`")
          # 回空的來源不會進 errors，但一樣代表資料沒抓到，必須顯示出來
          empties = r.get("empty_sources") or []
          print(f"- 沒有取得資料的來源：{len(empties)}")
          for s in empties:
              print(f"  - `{s}`")
          print("")
          print("| 資料表 | 列數 | 最新 |")
          print("|---|---:|---|")
          for t in r.get("tables", []):
              print(f"| {t['table']} | {t['rows']:,} | {t['latest']} |")
          PY
          else
            echo "找不到 last_run.json —— 管線可能在寫出紀錄前就中斷了" >> $GITHUB_STEP_SUMMARY
          fi

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
