name: 每日盤後管線

# run 標題帶 phase：heal_daily.py 靠它判斷「這個 phase 今天補過沒」
run-name: 每日盤後管線${{ inputs.phase && format(' ({0})', inputs.phase) || '' }}

on:
  schedule:
    # 台北 15:30 / 18:30 / 21:30（UTC 07:30 / 10:30 / 13:30），週一到週五。
    #
    # 為什麼要跑三次（2026-09-14 改）：
    #   1. 台股 13:30 收盤，證交所盤後檔約 15:00 前後就出得來 → 15:30 先把價量抓到，
    #      這樣我下午就看得到當天，不必等到晚上。
    #   2. 三大法人與融資券傍晚才落地 → 18:30 補。
    #   3. GitHub 免費層的排程會延遲數十分鐘（實測 09-11 那次延遲到 22:35，
    #      結果抓到的是前一天的資料，網站就卡在 T-1）。多跑幾次就是對延遲的保險。
    #   4. 重跑是安全的：store.append() 以 key 去重，同一天的資料不會變成兩列。
    # 2026-10-20：分鐘一律避開 :00／:30（GitHub 高負載時段，排程會延遲或被丟）；
    # 仍丟的話由 backfill.yml 的 heal job 補派（scripts/heal_daily.py）。
    - cron: "37 7,10,13 * * 1-5"
    # 清晨（UTC 21:00 ＝ 隔天台北 05:00）：
    # Andy 2026-09-18：「需要你在 05:00 這時間去更新資料，更新除了 K 線外也包含新聞事件等等」。
    # 以前從台北 21:30 到隔天 09:00 完全沒有任何一輪，美股收盤、隔夜國際盤與新聞
    # 全部要等到早上九點才進得來；他一早打開網頁看到的是前一天晚上的東西。
    # 這一輪跑 --phase news（新聞、國際盤、總經），價量那時本來就還沒開盤。
    #
    # ★ 星期幾是 0-4 不是 1-5：跨日會往前挪一天。
    #   台北週一 05:00 ＝ UTC 週日 21:00，所以要含 0；寫 1-5 的話變成台北週二到週六，
    #   **最有價值的週一清晨（美股週五收盤）反而漏掉**，還多跑一個沒有意義的週六。
    - cron: "7 21 * * 0-4"
    # 盤中（UTC 01:00 / 04:00 ＝ 台北 09:00 / 12:00，週一到週五）：跑 --phase news。
    # 價量那時還沒出（盤還沒收），但新聞整天都在更新 —— Andy 2026-09-15
    # 「事件需要同步更新今天發生的」：沒有這兩輪，早上發的新聞要等到 15:30 才進得來。
    - cron: "7 1,4 * * 1-5"
    # 週末（UTC 02:00 / 12:00 ＝ 台北 10:00 / 20:00，週六日）：
    # Andy 2026-09-14「週六日有新增也必須更新上去」。價量週末不會變，
    # 但新聞、國際盤（美股週五夜盤、歐股）、總經會變 → 跑 --phase news。
    - cron: "7 2,12 * * 6,0"
    # 搶「當天三大法人」（UTC 08:15 / 08:45 / 09:15 ＝ 台北 16:15 / 16:45 / 17:15，週一到週五）：
    # Andy 2026-10-20：盤後法人要盡快發到 Threads／IG，不能等 18:30 那輪 full。
    # 跑 --phase inst：先用權值股探針，FinMind 還沒出就 10 秒收工、不 commit、不部署；
    # 有新列才寫入、重算 JSON、部署（部署完成後 social-live 的 workflow_run 會接上）。
    # 成本：沒資料的輪次約 1 分鐘（跳過 pytest），有資料的輪次約 8～12 分鐘；
    # 每天最壞 3 輪 ≈ 15～25 分鐘（一般 1 輪有料 ≈ 10 分鐘 ＋ 另兩輪各 1 分鐘）。
    # 判斷 phase 看 github.event.schedule（寫死的 cron 字串），不看時鐘 —— 排程延遲時不會誤判成 price／full。
    - cron: "15,45 8 * * 1-5"
    - cron: "15 9 * * 1-5"
  workflow_dispatch:
    inputs:
      skip_finmind:
        description: "跳過 FinMind（不動用每小時額度）"
        type: boolean
        default: false
      phase:
        description: "這輪跑什麼（auto＝依 UTC 時間判斷）"
        type: choice
        options: [auto, price, full, news, inst]
        default: auto

# 每日管線與歷史回補都會 commit 資料回 repo。
# 同時跑的話，後完成的那個 push 一定會被拒絕（這就是歷史回補一直 Fail 的原因）。
# 共用同一個 concurrency group 讓它們排隊，而不是互相踩。
concurrency:
  group: tw-rotation-data-write
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      # phase=inst 沒新資料時為 false → deploy 整個跳過（其他 phase 這個值是空的，照常部署）
      inst_new: ${{ steps.fetch.outputs.inst_new }}
    steps:
      # checkout 分支最新 commit 而非觸發當下的 SHA：排在 concurrency 佇列裡等待時，
      # 回補可能已經推了新資料，用舊 SHA 算出來的 JSON 會少掉那批資料
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安裝相依套件
        run: pip install -r requirements.txt

      - name: 跑指標庫測試
        # 測試沒過就不要讓壞掉的計算污染資料湖
        # phase=inst 例外：它只 append 法人、一天最多跑三輪，每輪多 7 分鐘不划算；
        # 同一份程式碼在 15:30／18:30 那輪都已經跑過測試。
        if: ${{ !(github.event_name == 'schedule' && (github.event.schedule == '15,45 8 * * 1-5' || github.event.schedule == '15 9 * * 1-5')) && inputs.phase != 'inst' }}
        run: python -m pytest tests/ -q

      - name: 抓取與計算
        id: fetch
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          UNIVERSE_SIZE: "500"
        run: |
          # 台北 15:30（UTC 07:30）那輪只抓價量 —— 三大法人、融資券、財報那個時間還沒出，
          # 硬抓只會把「還沒出」記成「沒回資料」。真的被 GitHub 排程延遲到 09:00 之後，
          # 就當作完整那輪跑，反正重跑是安全的（append 去重）。
          PHASE="${{ inputs.phase }}"
          if [ -z "$PHASE" ] || [ "$PHASE" = "auto" ]; then
            D=$(date -u +%u)          # 1=週一 … 6=週六 7=週日
            H=$((10#$(date -u +%H)))  # 去掉前導零，不然 08 會被當成八進位
            if [ "${{ github.event.schedule }}" = "15,45 8 * * 1-5" ] || [ "${{ github.event.schedule }}" = "15 9 * * 1-5" ]; then
              PHASE=inst       # 搶當天三大法人（見上面 cron 的說明）
            elif [ "$D" -ge 6 ]; then
              PHASE=news       # 週末只更新新聞與國際盤
            elif [ "$H" -ge 20 ]; then
              # UTC 20:00 之後 ＝ 台北清晨 04:00 以後、當天還沒開盤：只有新聞與國際盤會變。
              # （台北 05:00 那一輪走這裡；不加這條的話它會掉進 full，
              #   然後把「還沒出」的來源記成「沒回資料」，橫幅每天清晨都變黃燈。）
              PHASE=news
            elif [ "$H" -lt 7 ]; then
              # UTC 00~06 ＝ 台北 08:00~14:59，盤還沒收：只有新聞會變。
              # 寫成區間而不是列舉小時，是因為 GitHub 免費層的排程常延遲數十分鐘，
              # 列舉的話一延遲就掉進 full，那些傍晚才落地的來源會被記成「沒回資料」。
              PHASE=news
            elif [ "$H" -le 8 ]; then
              PHASE=price
            else
              PHASE=full
            fi
          fi
          echo "本輪 phase=$PHASE（現在是 UTC $(date -u '+%H:%M')）"
          python -m pipeline.run_daily --phase "$PHASE" \
            ${{ inputs.skip_finmind && '--skip-finmind' || '' }}

      - name: 回寫資料湖
        if: steps.fetch.outputs.inst_new != 'false'
        run: |
          git config user.name  "tw-rotation-bot"
          git config user.email "actions@github.com"
          git add data
          if git diff --staged --quiet; then
            echo "沒有資料變動，跳過 commit"
            exit 0
          fi
          git commit -m "資料更新 $(date -u '+%Y-%m-%d')"

          # Parquet 是二進位檔，rebase 遇到同檔修改會衝突而不是自動合併。
          # 所以退而求其次：重試時先把遠端抓下來，讓我們這邊的版本勝出
          # （資料層本來就是 append + 去重，下一輪會把缺的補回來）。
          for i in 1 2 3 4 5; do
            if git push origin "${{ github.ref_name }}"; then
              echo "推送成功"
              exit 0
            fi
            echo "推送被拒（第 $i 次），重新對齊遠端後再試…"
            git fetch origin "${{ github.ref_name }}"
            git checkout --ours -- data 2>/dev/null || true
            git rebase -X ours "origin/${{ github.ref_name }}" || {
              git rebase --abort || true
              git reset --soft "origin/${{ github.ref_name }}"
              git add data
              git commit -m "資料更新 $(date -u '+%Y-%m-%d') (合併重試)"
            }
            sleep $((i * 5))
          done
          echo "::error::推送連續失敗 5 次"
          exit 1

      - name: 前端對齊 main 最新版（避免把開跑時的舊前端蓋上線）
        if: steps.fetch.outputs.inst_new != 'false'
        # ★ 2026-09-25：這輪開跑時 checkout 的 main，跑到這裡可能已經落後（中途有人推了前端）。
        #   走「合併重試」那條路時工作區保留的是舊 site/，直接上傳就會把舊前端部署上線、蓋掉推送部署。
        #   site/data 是 gitignore 的產出，checkout 不會動到它。
        #   ★ 2026-09-25 追補：pipeline/ 落後時，前端 JSON 也是用舊程式算的（59c1ce7 上線 22 秒就被這輪蓋掉）。
        #   所以 pipeline/ 與 main 不同時，先換成 main 的 pipeline/ 再重算一次 JSON（只讀資料湖，不重抓）。
        run: |
          git fetch origin "${{ github.ref_name }}"
          if ! git diff --quiet HEAD "origin/${{ github.ref_name }}" -- pipeline/; then
            echo "pipeline/ 落後 main，換成最新版並重算前端 JSON"
            git checkout "origin/${{ github.ref_name }}" -- pipeline/
            python -m pipeline.build_payload
          fi
          git checkout "origin/${{ github.ref_name }}" -- site/
      - name: 給自家 JS/CSS 加版本戳（不加的話部署完還要按 Ctrl+F5 才看得到新版）
        if: steps.fetch.outputs.inst_new != 'false'
        run: python scripts/stamp_assets.py
      # ★ 2026-10-05：這條工作流也會部署 Pages，但以前少了下面兩步，
      #   每天早上的盤後輪一部署，就把 pages.yml 裝好的 preview/<名稱>/ 整包蓋掉（Andy 開預覽網址拿到 404），
      #   也把 account_config.js 換回 repo 裡空的那支（會員登入跟著消失）。
      #   兩步照抄 pages.yml，失敗不擋正式站部署。
      - name: 會員功能設定（同 pages.yml；沒設 ACCOUNT_API_URL 就維持關閉）
        if: steps.fetch.outputs.inst_new != 'false'
        env:
          ACCOUNT_API_URL: ${{ secrets.ACCOUNT_API_URL }}
        run: |
          if [ -n "$ACCOUNT_API_URL" ]; then
            case "$ACCOUNT_API_URL" in
              https://*)
                python -c "import json,os; u=os.environ['ACCOUNT_API_URL'].strip().rstrip('/'); open('site/account_config.js','w',encoding='utf-8').write('/* 部署時由 daily.yml 依 Secret ACCOUNT_API_URL 產生（repo 裡是空的）*/\nwindow.TW_ACCOUNT = ' + json.dumps({'api': u}) + ';\n')"
                echo "會員功能：開啟";;
              *) echo "::warning::ACCOUNT_API_URL 不是 https:// 開頭，會員功能維持關閉";;
            esac
          fi
      - name: 分支預覽（同 pages.yml；不裝的話每日部署會把預覽蓋掉）
        if: steps.fetch.outputs.inst_new != 'false'
        continue-on-error: true
        run: python scripts/preview_inject.py
      - name: 上傳網站
        if: steps.fetch.outputs.inst_new != 'false'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: 執行摘要
        if: always()
        run: |
          echo "### 本輪執行結果" >> $GITHUB_STEP_SUMMARY
          if [ -f data/_state/last_run.json ]; then
            python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json, pathlib
          r = json.loads(pathlib.Path("data/_state/last_run.json").read_text())
          print(f"- 這輪跑的是：`{r.get('phase')}`（price＝只抓價量）")
          print(f"- 交易日：`{r.get('trade_date')}`")
          print(f"- 耗時：{r.get('duration_seconds')}s")
          print(f"- FinMind 剩餘額度：{r.get('finmind_budget_left')}")
          errs = r.get("errors") or []
          print(f"- 錯誤數：{len(errs)}")
          for e in errs:
              print(f"  - `{e}`")
          empt = r.get("empty") or []
          print(f"- 沒回資料的步驟：{len(empt)}")
          for e in empt:
              print(f"  - `{e}`")
          print("")
          print("| 資料表 | 列數 | 最新 |")
          print("|---|---:|---|")
          for t in r.get("tables", []):
              print(f"| {t['table']} | {t['rows']:,} | {t['latest']} |")
          PY
          else
            echo "找不到 last_run.json —— 管線可能在寫出紀錄前就中斷了" >> $GITHUB_STEP_SUMMARY
          fi

  deploy:
    needs: collect
    # phase=inst 沒有新法人資料時不部署（也沒有 artifact 可部署）
    if: needs.collect.outputs.inst_new != 'false'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
