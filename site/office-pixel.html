<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="輪動團隊虛擬辦公室 — 像素風（Star-Office 架構）外觀稿">
<title>輪動像素辦公室</title>
</head>
<body>
<style>
/* ──────────────────────────────────────────────────────────────
   B 版：像素辦公室
   架構參考 Star-Office-UI（ringhyacinth）：一間共用辦公室，
   角色依「狀態」自動站到對應區域（工位／圓桌／休息區／Bug 角落／講台），
   右邊是狀態總覽、昨日備忘、Agent 名單。
   整個場景是一張 SVG，所以縮放不會糊；shape-rendering 用 crispEdges 保持像素邊。
   ────────────────────────────────────────────────────────────── */
:root{
  --bg:#141426; --bg-2:#1d1d35; --panel:#232342; --panel-2:#2c2c51; --panel-3:#383866;
  --line:#3d3d6b; --line-2:#55558f; --edge:#0e0e1c;
  --ink:#eef0ff; --ink-2:#b3b6e0; --ink-3:#7d81b5;
  --go:#ffc24d; --ok:#5fd79a; --info:#63c7f0; --stop:#ff6b81; --idle:#8d92c4;
  --wall:#46527f; --wall-2:#39446b; --floor:#a9744f; --floor-2:#96643f;
  --mono:"JetBrains Mono","SFMono-Regular",Menlo,Consolas,monospace;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",-apple-system,"Segoe UI",sans-serif;
  --hard:4px 4px 0 var(--edge);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#e7e9f7; --bg-2:#dcdff2; --panel:#ffffff; --panel-2:#f1f2fb; --panel-3:#e2e4f6;
    --line:#c3c7e4; --line-2:#9aa0cc; --edge:#2b2f52;
    --ink:#1b1f3d; --ink-2:#4b5182; --ink-3:#797fae;
    --go:#c8860a; --ok:#1c9c62; --info:#1682ad; --stop:#d63a54; --idle:#6f75a5;
    --hard:4px 4px 0 rgba(43,47,82,.25);
  }
}
:root[data-theme="dark"]{ color-scheme:dark }
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:14px; line-height:1.6;
  background-image:linear-gradient(180deg,var(--bg),var(--bg-2));
  background-attachment:fixed;
}
h1,h2,h3{margin:0; font-weight:800; text-wrap:balance}
code,.mono{font-family:var(--mono)}
:focus-visible{outline:2px solid var(--go); outline-offset:2px}

.topbar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:40;
  display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:10px 16px;
  background:var(--panel); border-bottom:3px solid var(--edge);
}
.brand b{font-size:16px; letter-spacing:.06em; display:block; line-height:1.2}
.brand span{font-size:10.5px; color:var(--ink-3); letter-spacing:.2em; font-family:var(--mono)}
.spacer{flex:1 1 auto}
.pill{
  display:inline-flex; align-items:center; gap:7px; cursor:pointer; font-family:var(--mono);
  padding:5px 11px; border:2px solid var(--line-2); background:var(--panel-2); color:var(--ink-2); font-size:12px;
}
.pill:hover{border-color:var(--go); color:var(--ink)}
.pill[aria-pressed="true"]{background:var(--panel-3); color:var(--ink); border-color:var(--go)}
.px{width:10px; height:10px; flex:none; background:var(--idle); box-shadow:0 0 0 2px var(--edge)}
.px.working{background:var(--go)} .px.meeting{background:var(--info)}
.px.idle{background:var(--idle)} .px.blocked{background:var(--stop)} .px.briefing{background:#c49bff}
.clock{font-family:var(--mono); font-size:13px; color:var(--ink-2); font-variant-numeric:tabular-nums}
.verbadge{font-family:var(--mono); font-size:11px; color:var(--ink-2); border:2px solid var(--line-2); padding:2px 9px; white-space:nowrap}
.iconbtn{width:32px; height:32px; display:grid; place-items:center; cursor:pointer;
  border:2px solid var(--line-2); background:var(--panel-2); color:var(--ink-2)}
.iconbtn:hover{border-color:var(--go); color:var(--go)}

.wrap{max-width:1560px; margin:0 auto; padding:16px 16px 60px}
.notice{display:flex; gap:10px; align-items:flex-start; font-size:12.5px; color:var(--ink-2);
  background:var(--panel); border:2px dashed var(--line-2); padding:9px 12px; margin-bottom:16px}
.notice b{color:var(--go)}
.cols{display:grid; grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr); gap:16px; align-items:start}
@media (max-width:1000px){ .cols{grid-template-columns:1fr} }

.card{background:var(--panel); border:3px solid var(--edge); box-shadow:var(--hard)}
.card > header{
  display:flex; align-items:center; gap:9px; padding:8px 11px;
  background:var(--panel-3); border-bottom:3px solid var(--edge);
}
.card > header h2{font-size:13px; letter-spacing:.1em}
.card > header .sub{margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--ink-2)}
.card .pad{padding:12px}

.scene{display:block; width:100%; height:auto; background:#0f1024; image-rendering:pixelated}
.legend{display:flex; flex-wrap:wrap; gap:10px; padding:9px 11px; border-top:3px solid var(--edge); background:var(--panel-2);
  font-family:var(--mono); font-size:11px; color:var(--ink-2)}
.legend span{display:inline-flex; align-items:center; gap:6px}

.sprite{cursor:pointer}
.sprite:hover .hl{opacity:1}
.bob{animation:bob 1.4s steps(2,end) infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.bob2{animation:bob 2.2s steps(2,end) infinite}
.blink{animation:blink 1.6s steps(2,end) infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

.rows{display:grid}
.row{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left; cursor:pointer;
  padding:8px 11px; background:transparent; border:0; border-bottom:2px solid var(--line); color:inherit; font:inherit;
}
.row:hover{background:var(--panel-2)}
.row .mini{width:26px; height:34px; flex:none}
.row .mini svg{width:100%; height:100%; display:block}
.row .nm{font-size:13px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.row .zone{font-family:var(--mono); font-size:10.5px; color:var(--ink-3)}
.row .st{margin-left:auto; display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-2); white-space:nowrap}
.row.dim{opacity:.35}

.memo{display:grid; gap:9px}
.memoitem{display:flex; gap:9px; padding:8px 10px; background:var(--panel-2); border-left:4px solid var(--ok); font-size:12.5px; color:var(--ink-2)}
.memoitem .k{font-family:var(--mono); font-size:10.5px; color:var(--ink-3); flex:none}
.todoitem{border-left-color:var(--go)}
.waititem{border-left-color:var(--stop)}
.meter{display:grid; gap:7px}
.meter .m{display:grid; grid-template-columns:70px 1fr 34px; gap:9px; align-items:center; font-size:12px; color:var(--ink-2)}
.meter .track{height:12px; background:var(--panel-2); border:2px solid var(--line-2)}
.meter .track i{display:block; height:100%; background:repeating-linear-gradient(90deg,currentColor 0 4px, transparent 4px 6px)}
.meter .n{font-family:var(--mono); text-align:right; color:var(--ink)}

.scrim{position:fixed; inset:0; background:rgba(8,8,20,.66); z-index:50; opacity:0; transition:opacity .2s}
.drawer{position:fixed; z-index:60; top:0; right:0; height:100%; width:min(440px,100%);
  background:var(--panel); border-left:3px solid var(--edge); transform:translateX(102%);
  transition:transform .2s steps(6,end); display:flex; flex-direction:column}
body.open .drawer{transform:none}
body.open .scrim{opacity:1}
.drawer > header{display:flex; gap:12px; align-items:center; padding:12px; background:var(--panel-3); border-bottom:3px solid var(--edge)}
.drawer > header .av{width:52px; height:68px; flex:none}
.drawer > header .av svg{width:100%; height:100%}
.drawer h2{font-size:16px}
.drawer .sub{font-family:var(--mono); font-size:11px; color:var(--ink-3)}
.drawer .body{overflow-y:auto; padding:13px; display:grid; gap:15px}
.sect h3{font-size:11.5px; letter-spacing:.14em; color:var(--ink-3); margin-bottom:8px; display:flex; gap:8px; align-items:center}
.sect h3 .c{font-family:var(--mono); color:var(--ink-2); border:2px solid var(--line); padding:0 6px}
.list{display:grid; gap:6px}
.item{display:flex; gap:9px; padding:8px 10px; background:var(--panel-2); border-left:4px solid var(--line-2); font-size:12.5px; color:var(--ink-2)}
.item .k{font-family:var(--mono); font-size:10.5px; color:var(--ink-3); min-width:24px}
.item.ok{border-left-color:var(--ok)} .item.go{border-left-color:var(--go)} .item.blocked{border-left-color:var(--stop)}
.files{display:flex; flex-wrap:wrap; gap:6px}
.files code{font-size:11px; background:var(--panel-2); border:2px solid var(--line); padding:3px 7px; color:var(--ink-2)}
.kv{display:grid; grid-template-columns:auto 1fr; gap:6px 12px; font-size:12.5px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0}
.talkline{border-left:4px solid var(--info); background:var(--panel-2); padding:7px 10px; font-size:12.5px; color:var(--ink-2); margin-bottom:6px}
.talkline b{color:var(--ink)}
.bar{height:12px; background:var(--panel-2); border:2px solid var(--line-2)}
.bar i{display:block; height:100%; background:repeating-linear-gradient(90deg,var(--go) 0 4px, transparent 4px 6px)}
@media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important} }
</style>

<header class="topbar">
  <div class="brand">
    <b>輪動像素辦公室</b>
    <span>STAR-OFFICE LAYOUT</span>
  </div>
  <div class="spacer"></div>
  <div class="pills" id="filters" style="display:flex; gap:7px; flex-wrap:wrap" role="group" aria-label="依狀態篩選"></div>
  <div class="spacer"></div>
  <span class="clock" id="clock">--:--:--</span>
  <button class="iconbtn" id="themebtn" type="button" title="切換主題" aria-label="切換主題">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <circle cx="12" cy="12" r="4.2"></circle>
      <path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.5 5.5L7 7M17 17l1.5 1.5M18.5 5.5L17 7M7 17l-1.5 1.5" stroke-linecap="round"></path>
    </svg>
  </button>
  <span class="verbadge" id="ver">v0.1 外觀稿 · 09-20</span>
</header>

<div class="wrap">
  <p class="notice"><span aria-hidden="true">▣</span>
    <span><b>這是外觀稿</b>：狀態、任務、對話都是<strong>示意資料</strong>。
    架構照 Star-Office-UI：<strong>角色依狀態自動站到對應區域</strong> —— 工作中在工位、討論中在圓桌、
    待命在休息區、卡住的在 Bug 角落、CEO 在講台。</span></p>

  <div class="cols">
    <div style="display:grid; gap:16px">
    <div class="card">
      <header><span class="px working"></span><h2>OFFICE FLOOR</h2><span class="sub" id="headcount"></span></header>
      <div id="sceneWrap"></div>
      <div class="legend">
        <span><span class="px working"></span>工位區</span>
        <span><span class="px meeting"></span>圓桌</span>
        <span><span class="px idle"></span>休息區</span>
        <span><span class="px blocked"></span>Bug 角落</span>
        <span><span class="px briefing"></span>講台</span>
        <span style="color:var(--ink-3)">點角色看詳情</span>
      </div>
    </div>
    <div class="card">
      <header><span class="px meeting"></span><h2>圓桌討論</h2><span class="sub" id="talkmeta"></span></header>
      <div class="pad" id="talk"></div>
    </div>
    </div>

    <div style="display:grid; gap:16px">
      <div class="card">
        <header><h2>STATUS</h2><span class="sub" id="statsum"></span></header>
        <div class="pad meter" id="meters"></div>
      </div>
      <div class="card">
        <header><h2>昨日備忘</h2><span class="sub">MEMO</span></header>
        <div class="pad memo" id="memo"></div>
      </div>
      <div class="card">
        <header><h2>AGENTS</h2><span class="sub" id="agcount"></span></header>
        <div class="rows" id="rows"></div>
      </div>
    </div>
  </div>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dname" hidden>
  <header>
    <div class="av" id="dav" aria-hidden="true"></div>
    <div style="min-width:0"><h2 id="dname">—</h2><span class="sub" id="did">—</span></div>
    <button class="iconbtn" id="closebtn" type="button" aria-label="關閉" style="margin-left:auto">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"></path></svg>
    </button>
  </header>
  <div class="body" id="dbody"></div>
</aside>

/* ============================================================
   像素角色：12 × 16 的格子，每一格都是一個 1×1 的方塊。
   shape-rendering="crispEdges" 讓邊緣不做抗鋸齒，放大也還是像素。
   ============================================================ */
const PXSKIN = {a:'#f3c49a', b:'#e0a878', c:'#c1854f', d:'#8a5531', e:'#fcdcc0'};
const PXHAIR = {blk:'#2a2338', brn:'#5b3a20', gry:'#9aa0c0', red:'#b2482a', gold:'#e0b154', ink:'#1e1930'};
const r = (x, y, w, h, f) => '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" fill="' + f + '"/>';

function sprite(L){
  const sk = PXSKIN[L.skin] || PXSKIN.a;
  const hc = PXHAIR[L.hairC] || PXHAIR.blk;
  const cloth = L.suit, pants = '#2f3355', shoe = '#1b1b2e', dark = '#241f33';
  let s = '';
  s += r(3, 16, 6, 1, 'rgba(0,0,0,.28)');
  s += r(3, 13, 2, 2, pants) + r(7, 13, 2, 2, pants);
  s += r(3, 15, 3, 1, shoe) + r(6, 15, 3, 1, shoe);
  s += r(3, 9, 6, 4, cloth) + r(2, 9, 1, 3, cloth) + r(9, 9, 1, 3, cloth);
  s += r(2, 12, 1, 1, sk) + r(9, 12, 1, 1, sk);
  s += r(5, 8, 2, 1, sk);
  s += r(3, 3, 6, 5, sk);
  s += r(2, 3, 1, 2, hc) + r(9, 3, 1, 2, hc);
  if (L.hair !== 'bald') s += r(3, 0, 6, 1, hc) + r(2, 1, 8, 2, hc);
  if (L.hair === 'long') s += r(2, 5, 1, 4, hc) + r(9, 5, 1, 4, hc);
  if (L.hair === 'bun') s += r(4, -2, 4, 2, hc);
  if (L.hair === 'pony') s += r(9, 2, 2, 5, hc);
  if (L.hair === 'curly') s += r(2, -1, 8, 2, hc);
  if (L.hat === 'helmet') s += r(2, -1, 8, 3, '#ffc24d') + r(1, 2, 10, 1, '#e09c1f');
  if (L.hat === 'beret')  s += r(2, -1, 8, 3, '#c49bff') + r(8, -2, 2, 1, '#5fd79a');
  if (L.hat === 'cap')    s += r(2, -1, 8, 3, '#5fd79a') + r(9, 2, 3, 1, '#35a877');
  if (L.hat === 'headset') s += r(2, 0, 8, 1, '#63c7f0') + r(1, 3, 1, 3, '#63c7f0') + r(10, 3, 1, 3, '#63c7f0');
  if (L.glasses) s += r(3, 5, 6, 1, '#63c7f0');
  s += r(4, 5, 1, 1, dark) + r(7, 5, 1, 1, dark);
  s += r(5, 7, 2, 1, '#b5735a');
  s += r(10, 10, 2, 2, L.tool || '#ffc24d');
  return s;
}
function spriteSVG(L, cls, label){
  return '<svg viewBox="-2 -3 16 21" role="img" aria-label="' + (label || '') + '" shape-rendering="crispEdges">' +
    '<g class="' + (cls || '') + '">' + sprite(L) + '</g></svg>';
}

    const n = AGENTS.filter(a => a.status === k).length;
    return '<div class="m"><span>' + label + '</span>' +
      '<span class="track" style="color:' + col + '"><i style="width:' + Math.round(n / total * 100) + '%"></i></span>' +
      '<span class="n">' + n + '</span></div>';
  }).join('');
  document.getElementById('statsum').textContent = total + ' AGENTS';
}
function renderMemo(){
  const rows = []
    .concat(BOARD.wait.map(n => ['waititem', n.k, n.t + '（' + nameOf(n.who) + '）']))
    .concat(BOARD.todo.map(n => ['todoitem', n.k, n.t + '（' + nameOf(n.who) + '）']))
    .concat(BOARD.done.map(n => ['', n.k, n.t]));
  document.getElementById('memo').innerHTML =
    '<p style="margin:0 0 4px; font-size:12px; color:var(--ink-3)">CEO 佈告欄 · 紅＝等 Andy、黃＝今天要做、綠＝之前完成</p>' +
    rows.map(([cls, k, t]) => '<div class="memoitem ' + cls + '"><span class="k">' + esc(k) + '</span><span>' + esc(t) + '</span></div>').join('');
}
function renderRows(){
  const all = [CEO].concat(AGENTS);
  document.getElementById('rows').innerHTML = all.map(a =>
    '<button class="row" type="button" data-id="' + a.id + '" data-status="' + a.status + '">' +
      '<span class="mini">' + spriteSVG(a.look, '', a.name) + '</span>' +
      '<span style="min-width:0"><span class="nm">' + esc(a.name) + '</span>' +
        '<span class="zone">' + esc(a.id) + ' · ' + ZONE[a.status] + '</span></span>' +
      '<span class="st"><span class="px ' + STATUS[a.status].cls + '"></span>' + STATUS[a.status].label + '</span>' +
    '</button>').join('');
  document.getElementById('agcount').textContent = all.length + ' 位';
}

function renderTalk(){
  document.getElementById('talkmeta').textContent = MEETING.members.length + ' 位 · ' + MEETING.elapsed;
  document.getElementById('talk').innerHTML =
    '<p style="margin:0 0 9px; font-size:12.5px"><b>議題：</b>' + esc(MEETING.topic) + '</p>' +
    MEETING.log.map(l => '<p class="talkline"><b>' + esc(nameOf(l.who)) + '</b>：' + esc(l.s) + '</p>').join('');
}
let bubTimer = null, bubIdx = 0;
function cycleBubbles(){
  const slot = document.getElementById('bubslot');
  if (!slot) return;
  const step = () => {
    const e = MEETING.log[bubIdx % MEETING.log.length];
    slot.innerHTML = bubbleSVG(330, 130, 210, e.s.slice(0, 22), nameOf(e.who));
    bubIdx++;
  };
  step();
  if (bubTimer) clearInterval(bubTimer);
  bubTimer = setInterval(step, 4200);
}

/* ── 詳情 ─────────────────────────────────────────────── */
function listHTML(arr, cls, empty){
  if (!arr || !arr.length) return '<p class="item" style="color:var(--ink-3)">' + empty + '</p>';
  return '<div class="list">' + arr.map((t, i) =>
    '<div class="item ' + cls + '"><span class="k">' + String(i + 1).padStart(2, '0') + '</span><span>' + esc(t) + '</span></div>').join('') + '</div>';
}
function openDrawer(id){
  const a = byId(id); if (!a) return;
  const st = STATUS[a.status];
  document.getElementById('dav').innerHTML = spriteSVG(a.look, 'bob', a.name);
  document.getElementById('dname').textContent = a.name;
  document.getElementById('did').textContent = a.id + ' · ' + ZONE[a.status];
  const meetingHere = a.status === 'meeting' || a.id === 'ceo';
  document.getElementById('dbody').innerHTML =
    '<div class="sect"><dl class="kv">' +
      '<dt>狀態</dt><dd><span class="px ' + st.cls + '" style="display:inline-block;vertical-align:-1px"></span> ' + st.label + '（' + ZONE[a.status] + '）</dd>' +
      '<dt>職責</dt><dd>' + esc(a.role) + '</dd>' +
      (a.now ? '<dt>開始於</dt><dd class="mono">' + esc(a.now.since) + '</dd>' : '') +
      (a.blockedBy ? '<dt>卡在</dt><dd style="color:var(--stop)">' + esc(a.blockedBy) + '</dd>' : '') +
    '</dl></div>' +
    (a.now ? '<div class="sect"><h3>目前進行 <span class="c">' + a.now.pct + '%</span></h3>' +
      '<p class="item go">' + esc(a.now.t) + '</p><div class="bar" style="margin-top:8px"><i style="width:' + a.now.pct + '%"></i></div></div>' : '') +
    (a.id === 'ceo'
      ? '<div class="sect"><h3>今日分派 <span class="c">' + CEO.assign.length + '</span></h3>' +
        '<div class="list">' + CEO.assign.map(x => '<div class="item go"><span class="k">' + esc(x.k) + '</span><span>' + esc(x.t) + ' → ' + esc(nameOf(x.who)) + '</span></div>').join('') + '</div></div>' +
        '<div class="sect"><h3>佈告欄 · 之前完成 <span class="c">' + BOARD.done.length + '</span></h3>' +
        '<div class="list">' + BOARD.done.map(n => '<div class="item ok"><span class="k">' + esc(n.k) + '</span><span>' + esc(n.t) + '</span></div>').join('') + '</div></div>'
      : '<div class="sect"><h3>已完成 <span class="c">' + (a.done || []).length + '</span></h3>' + listHTML(a.done, 'ok', '還沒有完成項目') + '</div>' +
        '<div class="sect"><h3>進行中 <span class="c">' + (a.doing || []).length + '</span></h3>' + listHTML(a.doing, 'go', '目前沒有進行中的項目') + '</div>' +
        '<div class="sect"><h3>未完成／在等什麼 <span class="c">' + (a.todo || []).length + '</span></h3>' +
          listHTML(a.todo, a.status === 'blocked' ? 'blocked' : '', '沒有排隊中的項目') + '</div>') +
    (meetingHere ? '<div class="sect"><h3>圓桌討論</h3><p class="talkline"><b>' + esc(MEETING.topic) + '</b></p>' +
      MEETING.log.filter(l => a.id === 'ceo' || l.who === a.id).map(l =>
        '<p class="talkline">' + (a.id === 'ceo' ? '<b>' + esc(nameOf(l.who)) + '</b>：' : '') + esc(l.s) + '</p>').join('') + '</div>' : '') +
    '<div class="sect"><h3>負責檔案</h3><div class="files">' + (a.files || []).map(f => '<code>' + esc(f) + '</code>').join('') + '</div></div>';
  document.getElementById('scrim').hidden = false;
  document.getElementById('drawer').hidden = false;
  requestAnimationFrame(() => document.body.classList.add('open'));
  document.getElementById('closebtn').focus();
}
function closeDrawer(){
  document.body.classList.remove('open');
  setTimeout(() => { document.getElementById('scrim').hidden = true; document.getElementById('drawer').hidden = true; }, 220);
}

function renderFilters(){
  const c = s => AGENTS.filter(a => a.status === s).length;
  const defs = [['all','全部',AGENTS.length,''],['working','工位',c('working'),'working'],
                ['meeting','圓桌',c('meeting'),'meeting'],['idle','休息',c('idle'),'idle'],
                ['blocked','Bug',c('blocked'),'blocked']];
  document.getElementById('filters').innerHTML = defs.map(([k, label, n, s], i) =>
    '<button class="pill" type="button" data-f="' + k + '" aria-pressed="' + (i === 0) + '">' +
      (s ? '<span class="px ' + s + '"></span>' : '') + label + ' ' + n + '</button>').join('');
}
function applyFilter(f){
  document.querySelectorAll('#filters .pill').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.f === f)));
  document.querySelectorAll('#rows .row').forEach(r2 => r2.classList.toggle('dim', f !== 'all' && r2.dataset.status !== f));
  document.querySelectorAll('.sprite').forEach(g => {
    const a = byId(g.dataset.id);
    g.style.opacity = (f === 'all' || (a && a.status === f)) ? '1' : '.28';
  });
}
function tick(){
  const d = new Date(), p = n => String(n).padStart(2, '0');
  document.getElementById('clock').textContent = p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}
function initTheme(){
  let saved = null;
  try { saved = localStorage.getItem('pixel-theme'); } catch (e) {}
  if (saved) document.documentElement.setAttribute('data-theme', saved);
  document.getElementById('themebtn').addEventListener('click', () => {
    const now = document.documentElement.getAttribute('data-theme');
    const isDark = now === 'dark' || (!now && window.matchMedia('(prefers-color-scheme: dark)').matches);
    const next = isDark ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('pixel-theme', next); } catch (e) {}
  });
}

renderFilters(); renderScene(); renderMeters(); renderMemo(); renderRows(); renderTalk();
initTheme(); tick(); setInterval(tick, 1000);

document.addEventListener('click', (e) => {
  const pill = e.target.closest('#filters .pill');
  if (pill){ applyFilter(pill.dataset.f); return; }
  const sp = e.target.closest('.sprite');
  if (sp){ openDrawer(sp.dataset.id); return; }
  const row = e.target.closest('.row');
  if (row){ openDrawer(row.dataset.id); return; }
  if (e.target.closest('#closebtn') || e.target.id === 'scrim') closeDrawer();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && document.body.classList.contains('open')) closeDrawer();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.closest && e.target.closest('.sprite')){
    e.preventDefault(); openDrawer(e.target.closest('.sprite').dataset.id);
  }
});

</script>
</body>
