<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>比比・互動素材預覽</title><style>:root{color-scheme:light;--bg:#f7f1e7;--card:#fffaf1;--ink:#39251e}*{box-sizing:border-box}body{margin:0;font:16px system-ui;background:var(--bg);color:var(--ink)}body.dark{--bg:#251f27;--card:#39303a;--ink:#fff3e4}header,main{max-width:1120px;margin:auto;padding:24px}header p{line-height:1.7}a{color:inherit}nav{display:flex;gap:12px;flex-wrap:wrap}nav button,nav a{font:inherit;border:1px solid #a58d7c;border-radius:999px;padding:10px 16px;background:var(--card);color:var(--ink);text-decoration:none;cursor:pointer}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px}.card{padding:12px;border:1px solid #a58d7c55;border-radius:18px;background:var(--card);color:var(--ink);cursor:pointer;font:inherit}.picture{display:grid;place-items:center;min-height:170px;background:repeating-conic-gradient(#99999912 0% 25%,transparent 0% 50%) 0/20px 20px;border-radius:12px}.picture img{width:160px;height:160px;object-fit:contain}.card strong,.card small{display:block;margin-top:10px}.card small{opacity:.7;font-size:12px}.card:focus-visible{outline:3px solid #d49a61;outline-offset:3px}@media(max-width:420px){main{grid-template-columns:repeat(2,minmax(0,1fr));padding:12px;gap:10px}.card{padding:8px}.picture{min-height:150px}.picture img{max-width:100%;height:auto}}</style><header><p>哩股哩股 · 比比</p><h1>互動素材預覽</h1><p>24 組新版動畫。點選卡片重播，切換深淺背景檢查透明邊緣；完整互動請回網站，使用右下角比比的小圈選單。</p><nav><a href="./#overview">回網站玩比比</a><button id="theme">切換深淺背景</button><button id="replay">全部重播</button></nav></header><main><button class="card" data-file="pet_q"><span class="picture"><img src="brand/bibi/pet_q.webp?v=1015gpt3" alt="比比摸摸頭" loading="lazy"></span><strong>摸摸頭</strong><small>點一下重播</small></button><button class="card" data-file="eat_q"><span class="picture"><img src="brand/bibi/eat_q.webp?v=1015gpt3" alt="比比餵牧草" loading="lazy"></span><strong>餵牧草</strong><small>點一下重播</small></button><button class="card" data-file="ball_catch"><span class="picture"><img src="brand/bibi/ball_catch.webp?v=1015gpt3" alt="比比向右接球" loading="lazy"></span><strong>向右接球</strong><small>點一下重播</small></button><button class="card" data-file="ball_catch_l"><span class="picture"><img src="brand/bibi/ball_catch_l.webp?v=1015gpt3" alt="比比向左接球" loading="lazy"></span><strong>向左接球</strong><small>點一下重播</small></button><button class="card" data-file="spin_q"><span class="picture"><img src="brand/bibi/spin_q.webp?v=1015gpt3" alt="比比轉圈圈" loading="lazy"></span><strong>轉圈圈</strong><small>點一下重播</small></button><button class="card" data-file="popcorn"><span class="picture"><img src="brand/bibi/popcorn.webp?v=1015gpt3" alt="比比爆米花跳" loading="lazy"></span><strong>爆米花跳</strong><small>點一下重播</small></button><button class="card" data-file="highfive"><span class="picture"><img src="brand/bibi/highfive.webp?v=1015gpt3" alt="比比碰鼻子" loading="lazy"></span><strong>碰鼻子</strong><small>點一下重播</small></button><button class="card" data-file="dance"><span class="picture"><img src="brand/bibi/dance.webp?v=1015gpt3" alt="比比跳舞" loading="lazy"></span><strong>跳舞</strong><small>點一下重播</small></button><button class="card" data-file="hug"><span class="picture"><img src="brand/bibi/hug.webp?v=1015gpt3" alt="比比蹭蹭" loading="lazy"></span><strong>蹭蹭</strong><small>點一下重播</small></button><button class="card" data-file="sleep_loop"><span class="picture"><img src="brand/bibi/sleep_loop.webp?v=1015gpt3" alt="比比睡覺" loading="lazy"></span><strong>睡覺</strong><small>點一下重播</small></button><button class="card" data-file="wake_once"><span class="picture"><img src="brand/bibi/wake_once.webp?v=1015gpt3" alt="比比叫醒" loading="lazy"></span><strong>叫醒</strong><small>點一下重播</small></button><button class="card" data-file="hit"><span class="picture"><img src="brand/bibi/hit.webp?v=1015gpt3" alt="比比被敲反應" loading="lazy"></span><strong>被敲反應</strong><small>點一下重播</small></button><button class="card" data-file="cry"><span class="picture"><img src="brand/bibi/cry.webp?v=1015gpt3" alt="比比哭哭" loading="lazy"></span><strong>哭哭</strong><small>點一下重播</small></button><button class="card" data-file="selfie"><span class="picture"><img src="brand/bibi/selfie.webp?v=1015gpt3" alt="比比拍照" loading="lazy"></span><strong>拍照</strong><small>點一下重播</small></button><button class="card" data-file="receive"><span class="picture"><img src="brand/bibi/receive.webp?v=1015gpt3" alt="比比低頭嗅聞" loading="lazy"></span><strong>低頭嗅聞</strong><small>點一下重播</small></button><button class="card" data-file="sniff_eat"><span class="picture"><img src="brand/bibi/sniff_eat.webp?v=1015gpt3" alt="比比嗅聞吃葉" loading="lazy"></span><strong>嗅聞吃葉</strong><small>點一下重播</small></button><button class="card" data-file="hop_reach"><span class="picture"><img src="brand/bibi/hop_reach.webp?v=1015gpt3" alt="比比向上撲跳" loading="lazy"></span><strong>向上撲跳</strong><small>點一下重播</small></button><button class="card" data-file="pounce"><span class="picture"><img src="brand/bibi/pounce.webp?v=1015gpt3" alt="比比前撲" loading="lazy"></span><strong>前撲</strong><small>點一下重播</small></button><button class="card" data-file="tangle"><span class="picture"><img src="brand/bibi/tangle.webp?v=1015gpt3" alt="比比毛線掙脫" loading="lazy"></span><strong>毛線掙脫</strong><small>點一下重播</small></button><button class="card" data-file="look_up"><span class="picture"><img src="brand/bibi/look_up.webp?v=1015gpt3" alt="比比抬頭追視" loading="lazy"></span><strong>抬頭追視</strong><small>點一下重播</small></button><button class="card" data-file="run_r"><span class="picture"><img src="brand/bibi/run_r.webp?v=1015gpt3" alt="比比向右跑" loading="lazy"></span><strong>向右跑</strong><small>點一下重播</small></button><button class="card" data-file="run_l"><span class="picture"><img src="brand/bibi/run_l.webp?v=1015gpt3" alt="比比向左跑" loading="lazy"></span><strong>向左跑</strong><small>點一下重播</small></button><button class="card" data-file="run_start_r"><span class="picture"><img src="brand/bibi/run_start_r.webp?v=1015gpt3" alt="比比起跑" loading="lazy"></span><strong>起跑</strong><small>點一下重播</small></button><button class="card" data-file="run_stop_r"><span class="picture"><img src="brand/bibi/run_stop_r.webp?v=1015gpt3" alt="比比煞車" loading="lazy"></span><strong>煞車</strong><small>點一下重播</small></button></main><script>let n=0;function replay(card){const img=card.querySelector('img');img.src='brand/bibi/'+card.dataset.file+'.webp?v=1015gpt3#replay'+(++n)}document.querySelectorAll('.card').forEach(c=>c.onclick=()=>replay(c));document.querySelector('#theme').onclick=()=>document.body.classList.toggle('dark');document.querySelector('#replay').onclick=()=>document.querySelectorAll('.card').forEach(replay);</script></html>
