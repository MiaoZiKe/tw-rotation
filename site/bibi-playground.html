<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>比比互動試玩</title><style>:root{--panel-2:#fff5e7;--ink:#39251e;--line-2:#b7a28e;--cyan:#55899a}body{margin:0;background:#f4ecdf;color:#39251e;font:16px system-ui}main{padding:24px;max-width:850px;margin:auto}p{line-height:1.7}.controls{display:flex;gap:10px;flex-wrap:wrap}button,a{font:inherit;color:inherit}.controls button,#stop,a{border:1px solid #b7a28e;border-radius:12px;background:#fff8ee;padding:12px;cursor:pointer;text-decoration:none}.supfab{position:fixed;right:30px;bottom:30px;width:72px;height:72px;border:0;background:none}.supfab img{width:104px;height:104px}.status{padding:16px;border-radius:12px;background:#fff8ee;margin:20px 0;min-height:42px}#stop{margin-top:16px}@media(max-width:640px){main{padding:16px}.supfab{right:20px;bottom:24px}}</style><main><a href="./#overview">回網站</a> <a href="bibi-studio.html">看全部動畫</a><h1>跟比比玩一下</h1><p>選一個動作，看右下角比比的反應。這裡使用網站同一套互動腳本與道具，動作完成後會回待機；按 Esc 可以中止正在跑的動作。</p><div class="status" id="status" role="status">準備比比中…</div><div class="controls"><button data-act="pet">摸摸頭</button><button data-act="grass">餵牧草</button><button data-act="ball">玩球</button><button data-act="spin">轉圈圈</button><button data-act="popcorn">爆米花跳</button><button data-act="hit">被敲反應</button><button data-act="five">碰鼻子</button><button data-act="dance">聽音樂</button><button data-act="hug">蹭蹭</button><button data-act="sleep">睡覺／叫醒</button><button data-act="selfie">拍照</button><button data-act="snack">撒零食</button><button data-act="bubble">吹泡泡</button><button data-act="feather">羽毛棒</button><button data-act="yarn">毛線球</button><button data-act="plane">紙飛機</button><button data-act="leaf">落葉</button></div><button id="stop">停止目前動作</button></main><button id="supFab" class="supfab supgifonly" aria-label="比比"><img class="supgif" src="brand/bibi/idle_hop.webp" alt="比比"></button><div id="supPanel" hidden></div><script src="bibi.js?v=1015gpt4"></script><script>document.querySelectorAll('.controls button').forEach(b=>b.onclick=()=>{Bibi.act(b.dataset.act)});document.querySelector('#stop').onclick=()=>Bibi.stop('preview');setInterval(()=>{if(!window.Bibi)return;const s=Bibi.state(),e=document.querySelector('#status');e.textContent=s.loading?'比比準備玩具中…':s.mode==='act'?'比比正在玩：'+(document.querySelector('[data-act="'+(s.run||document.querySelector('#supFab').dataset.bibiAct)+'"]')?.textContent||'互動中'):s.sleeping?'比比睡著了，再按睡覺／叫醒叫醒牠。':'比比回到待機了。';e.dataset.mode=s.mode;e.dataset.shown=s.shown;e.dataset.props=s.props;e.dataset.run=s.run;e.dataset.sleeping=s.sleeping?'1':'0';},150)</script></html>
