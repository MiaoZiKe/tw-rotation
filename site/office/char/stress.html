<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>糰糰 v2・同場壓力測試</title>
<script type="importmap">{"imports":{"three":"../vendor/three.module.min.js"}}</script>
<style>html,body{margin:0;height:100%;background:#f3e6d8;color:#3a2622;font:13px/1.5 system-ui,"Noto Sans TC","Microsoft JhengHei",sans-serif}#v{position:fixed;inset:0}#v canvas{width:100%;height:100%;display:block}#o{position:fixed;left:10px;top:8px;background:rgba(255,250,243,.9);padding:6px 10px;border-radius:8px;white-space:pre}</style></head>
<body><div id="v"></div><div id="o"></div>
<script type="module">
// 用法：stress.html?n=47&lod=mix（lod=0|1|2|mix）。同款同場 n 隻，量繪製呼叫、三角面、每幀 JS 更新時間。
import * as THREE from 'three';
import { Stage } from './stage.js';
import { loadMochi, MochiChar } from './mochi.js';
const qs = new URLSearchParams(location.search), N = +(qs.get('n') || 47), LODQ = qs.get('lod') || 'mix';
const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setPixelRatio(1); document.getElementById('v').appendChild(renderer.domElement);
const stage = new Stage(renderer); stage.floor.visible = true; const scene = stage.scene;
const cam = new THREE.PerspectiveCamera(32, 1, 0.1, 60); cam.position.set(0, 7.5, 9.5); cam.lookAt(0, 0, 0.5);
const assets = await Promise.all([0, 1, 2].map(l => loadMochi({ lod: l })));
const cols = Math.ceil(Math.sqrt(N * 1.5)), cs = []; const palette = [0xffdcc4, 0xffc4d2, 0xd2e8bf, 0xddd0f5, 0xffe6a8];
const t0 = performance.now();
for (let i = 0; i < N; i++) {
  const r = Math.floor(i / cols), c = i % cols, x = (c - (cols - 1) / 2) * 1.1, z = (r - 2) * 1.3;
  const dist = Math.hypot(x, z + 4), lod = LODQ === 'mix' ? (dist < 4.5 ? 0 : dist < 7.5 ? 1 : 2) : +LODQ;
  const ch = new MochiChar(assets[lod], { color: palette[i % palette.length], top: 0xfff4e8 }); ch.root.position.set(x, 0, z); ch.root.rotation.y = (Math.random() - 0.5) * 0.8; scene.add(ch.root); ch.ph = Math.random() * 6; cs.push(ch);
}
const buildMs = performance.now() - t0;
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); } resize(); addEventListener('resize', resize);
let upd = 0, frames = 0, last = performance.now(), raf = 0, T = 0; const out = document.getElementById('o');
function frame(now) {
  raf = requestAnimationFrame(frame); const dt = Math.min(0.05, (now - last) / 1000); last = now; T += dt;
  const u0 = performance.now();
  for (const c of cs) { const t = T + c.ph; c.morph('breath', 0.5 + 0.5 * Math.sin(t * 1.9)); c.rot('ear.L', 0, 0, 0.05 * Math.sin(t * 1.3)); c.rot('ear.R', 0, 0, -0.05 * Math.sin(t * 1.3 + 1)); c.rot('head', 0, 0.2 * Math.sin(t * 0.7), 0); c.update(dt); }
  upd += performance.now() - u0; frames++;
  renderer.render(scene, cam);
  if (frames % 30 === 0) { const i = renderer.info.render; window.STRESS = { n: N, buildMs: Math.round(buildMs), loadMs: assets.map(a => Math.round(a.loadMs)), calls: i.calls, tris: i.triangles, updMs: +(upd / frames).toFixed(2), geometries: renderer.info.memory.geometries, textures: renderer.info.memory.textures }; out.textContent = `n=${N} lod=${LODQ}\n繪製呼叫 ${i.calls}｜三角面 ${i.triangles}\nJS 更新 ${(upd / frames).toFixed(2)} ms/幀（${N} 隻）\n建立 ${Math.round(buildMs)} ms`; document.documentElement.dataset.ready = '1'; }
}
document.addEventListener('visibilitychange', () => { if (document.hidden) { cancelAnimationFrame(raf); raf = 0; } else if (!raf) { last = performance.now(); raf = requestAnimationFrame(frame); } });
raf = requestAnimationFrame(frame);
</script></body></html>
