<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="輪動團隊虛擬辦公室 — 動物森友會風格外觀稿">
<title>輪動村辦公室</title>
</head>
<body>
<style>
/* ──────────────────────────────────────────────────────────────
   A 版：動物森友會風格（白天／夜晚兩種主題）
   造型規則：大圓角、白色描邊、柔和陰影、木頭與草地、大頭身角色。
   一樣不用任何外部資源（字體、圖示全部自己畫）。
   ────────────────────────────────────────────────────────────── */
:root{
  --sky-1:#bfeaff; --sky-2:#e8f7ff;
  --grass:#8ed14f; --grass-2:#6fb93a; --grass-3:#5aa22e;
  --cream:#fdf4dc; --paper:#fffdf5; --paper-2:#fbf1d8;
  --wood:#e3ab55; --wood-2:#c07f3a; --wood-3:#9c5f2a;
  --ink:#5c4326; --ink-2:#8a7050; --ink-3:#b19b7a;
  --line:#e8d7b0; --line-2:#d8bf8e;
  --leaf:#4fa64f; --sun:#ffd25e;
  --pink:#ff9aa2; --blue:#7ec8e3; --mint:#7ddcb1; --lilac:#c3b3f0; --peach:#ffbe7b;
  --go:#f2a33c; --ok:#4fbf72; --wait:#b19b7a; --stop:#ef6b6b;
  --r:22px;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono","SFMono-Regular",Menlo,monospace;
  --shadow:0 10px 0 -4px rgba(120,90,50,.10), 0 16px 30px -18px rgba(90,70,40,.55);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="day"]){
    --sky-1:#1f2a52; --sky-2:#2d3b6b;
    --grass:#2f6b3f; --grass-2:#245432; --grass-3:#1b3f26;
    --cream:#3b3122; --paper:#463a29; --paper-2:#3a301f;
    --wood:#a97a3c; --wood-2:#7d5527; --wood-3:#5d3d1b;
    --ink:#ffeccf; --ink-2:#e0c6a0; --ink-3:#a98f6d;
    --line:#5e4a2d; --line-2:#7a6137;
    --leaf:#3f8a4f; --sun:#ffd98a;
    --shadow:0 10px 0 -4px rgba(0,0,0,.25), 0 18px 30px -18px rgba(0,0,0,.8);
  }
}
:root[data-theme="night"]{
  --sky-1:#1f2a52; --sky-2:#2d3b6b;
  --grass:#2f6b3f; --grass-2:#245432; --grass-3:#1b3f26;
  --cream:#3b3122; --paper:#463a29; --paper-2:#3a301f;
  --wood:#a97a3c; --wood-2:#7d5527; --wood-3:#5d3d1b;
  --ink:#ffeccf; --ink-2:#e0c6a0; --ink-3:#a98f6d;
  --line:#5e4a2d; --line-2:#7a6137;
  --leaf:#3f8a4f; --sun:#ffd98a;
  --shadow:0 10px 0 -4px rgba(0,0,0,.25), 0 18px 30px -18px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
body{
  margin:0; font-family:var(--sans); font-size:14px; line-height:1.65; color:var(--ink);
  background:var(--cream);
  background-image:
    radial-gradient(1100px 420px at 50% -60px, var(--sky-2), transparent 70%),
    radial-gradient(10px 10px at 18% 22%, rgba(255,255,255,.55), transparent 70%),
    radial-gradient(8px 8px at 72% 12%, rgba(255,255,255,.45), transparent 70%);
  background-attachment:fixed;
}
h1,h2,h3{margin:0; font-weight:800; letter-spacing:.02em; text-wrap:balance}
code,.mono{font-family:var(--mono)}
:focus-visible{outline:3px solid var(--go); outline-offset:3px}

/* ── 頂部木牌 ─────────────────────────────────────────── */
.topbar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:40;
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  margin:10px auto 0; max-width:1560px; padding:10px 14px;
  background:var(--paper); border:3px solid #fff; border-radius:var(--r);
  box-shadow:var(--shadow); outline:2px solid var(--line-2); outline-offset:-3px;
}
@media (max-width:640px){ .topbar{margin:8px 8px 0} }
.brand{display:flex; align-items:center; gap:10px; min-width:0}
.brand b{font-size:17px; display:block; line-height:1.2}
.brand span{font-size:11px; color:var(--ink-3); letter-spacing:.14em}
.spacer{flex:1 1 auto}
.pills{display:flex; gap:7px; flex-wrap:wrap}
.pill{
  display:inline-flex; align-items:center; gap:7px; cursor:pointer; font-family:inherit;
  padding:6px 13px; border-radius:999px; border:2px solid var(--line-2);
  background:var(--paper-2); color:var(--ink-2); font-size:13px; font-weight:700;
}
.pill:hover{transform:translateY(-1px)}
.pill[aria-pressed="true"]{background:var(--go); border-color:var(--wood-3); color:#fff}
.pill .n{font-family:var(--mono); font-size:12px; opacity:.75}
.clock{font-family:var(--mono); font-size:13px; color:var(--ink-2); font-variant-numeric:tabular-nums}
.verbadge{
  font-family:var(--mono); font-size:11px; color:var(--ink-2); white-space:nowrap;
  border:2px solid var(--line-2); border-radius:999px; padding:3px 10px; background:var(--paper-2);
}
.iconbtn{
  width:36px; height:36px; display:grid; place-items:center; cursor:pointer; color:var(--ink-2);
  border-radius:50%; border:2px solid var(--line-2); background:var(--paper-2);
}
.iconbtn:hover{background:var(--sun); color:var(--wood-3)}

/* 狀態小圖示 */
.mk{width:18px; height:18px; border-radius:50%; display:grid; place-items:center; flex:none; background:var(--wait)}
.mk.working{background:var(--go)} .mk.meeting{background:var(--blue)}
.mk.idle{background:var(--wait)} .mk.blocked{background:var(--stop)}
.mk svg{width:11px; height:11px; stroke:#fff; fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round}

/* ── 版面 ─────────────────────────────────────────────── */
.wrap{max-width:1560px; margin:0 auto; padding:16px 14px 64px}
.notice{
  display:flex; gap:10px; align-items:flex-start; font-size:12.5px; color:var(--ink-2);
  background:var(--paper); border:2px dashed var(--line-2); border-radius:16px; padding:10px 13px; margin-bottom:16px;
}
.notice b{color:var(--wood-3)}
.zonelabel{display:flex; align-items:center; gap:10px; margin:24px 0 12px; font-size:13px; font-weight:800; color:var(--ink-2)}
.zonelabel::after{content:""; flex:1; height:3px; border-radius:3px; background:repeating-linear-gradient(90deg,var(--line-2) 0 8px, transparent 8px 16px)}
.zonelabel .tag{background:var(--wood); color:#fff; border-radius:999px; padding:2px 11px; font-size:11.5px; letter-spacing:.06em}

.plaza{display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); gap:16px}
.huts{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:16px}
@media (max-width:1040px){ .plaza{grid-template-columns:1fr} }

/* ── 小屋（每位 Agent 的辦公室）───────────────────────── */
.hut{
  border:0; padding:0; font:inherit; color:inherit; text-align:left; width:100%; cursor:pointer;
  background:var(--paper); border-radius:var(--r); overflow:hidden; box-shadow:var(--shadow);
  outline:3px solid #fff; outline-offset:-3px; transition:transform .16s;
  display:flex; flex-direction:column;
}
.hut:hover{transform:translateY(-4px)}
.hut.dim{opacity:.38; filter:saturate(.5)}
.roof{
  height:26px; background:
    repeating-linear-gradient(90deg, var(--roof) 0 14px, color-mix(in srgb, var(--roof) 76%, #000) 14px 28px);
  border-radius:var(--r) var(--r) 0 0; position:relative;
}
.roof::after{content:""; position:absolute; left:0; right:0; bottom:0; height:5px; background:rgba(255,255,255,.55)}
.sign{
  display:flex; align-items:center; gap:8px; padding:9px 12px;
  background:var(--wood); color:#fff; border-bottom:3px solid var(--wood-2);
}
.sign .nm{font-weight:800; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.sign .id{font-size:10.5px; opacity:.85; white-space:nowrap}
.sign .st{margin-left:auto; font-size:11.5px; background:rgba(0,0,0,.18); border-radius:999px; padding:1px 9px; white-space:nowrap}

.yard{position:relative; height:168px; overflow:hidden; background:linear-gradient(180deg,var(--sky-1),var(--sky-2))}
.yard .lawn{
  position:absolute; left:-6%; right:-6%; bottom:-18px; height:60%; border-radius:50% 50% 0 0/28% 28% 0 0;
  background:linear-gradient(180deg,var(--grass),var(--grass-2));
  box-shadow:inset 0 6px 0 rgba(255,255,255,.22);
}
.yard .lawn::after{
  content:""; position:absolute; inset:0; opacity:.5;
  background-image:radial-gradient(3px 5px at 14% 44%, var(--grass-3), transparent 60%),
    radial-gradient(3px 5px at 38% 62%, var(--grass-3), transparent 60%),
    radial-gradient(3px 5px at 66% 50%, var(--grass-3), transparent 60%),
    radial-gradient(3px 5px at 86% 66%, var(--grass-3), transparent 60%);
}
.yard .cloud{
  position:absolute; top:14px; left:12px; width:46px; height:16px; border-radius:999px; background:rgba(255,255,255,.85);
  box-shadow:14px -7px 0 -2px rgba(255,255,255,.85), 28px 2px 0 -4px rgba(255,255,255,.85);
  animation:drift 26s linear infinite;
}
@keyframes drift{0%{transform:translateX(0)}50%{transform:translateX(26px)}100%{transform:translateX(0)}}
.yard .tree{position:absolute; right:14px; bottom:44px; width:44px; height:56px}
.yard .tree i{position:absolute; left:18px; bottom:0; width:8px; height:22px; border-radius:3px; background:var(--wood-2)}
.yard .tree b{
  position:absolute; left:0; bottom:16px; width:44px; height:40px; border-radius:50%;
  background:radial-gradient(circle at 34% 30%, color-mix(in srgb,var(--leaf) 78%, #fff), var(--leaf));
  box-shadow:0 4px 0 -1px rgba(0,0,0,.08);
}
.yard .flower{position:absolute; left:16px; bottom:16px; width:14px; height:14px; border-radius:50%;
  background:radial-gradient(circle at 50% 50%, var(--sun) 0 4px, var(--pink) 4px)}
.yard .flower.two{left:auto; right:64px; bottom:12px; transform:scale(.8);
  background:radial-gradient(circle at 50% 50%, var(--sun) 0 4px, var(--lilac) 4px)}
.yard .door{
  position:absolute; left:50%; transform:translateX(-50%); bottom:42px; width:46px; height:52px;
  border-radius:24px 24px 6px 6px; background:var(--wood-2); border:3px solid var(--wood-3);
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.12);
}
.yard .door::after{content:""; position:absolute; right:8px; top:26px; width:6px; height:6px; border-radius:50%; background:var(--sun)}
.person{position:absolute; bottom:12px; left:24px; width:72px; transform-origin:bottom center}
.person svg{display:block; width:100%; height:auto; overflow:visible}
.hop{animation:hop 2.6s ease-in-out infinite}
@keyframes hop{0%,72%,100%{transform:translateY(0)}80%{transform:translateY(-5px)}88%{transform:translateY(0)}}
.sway{animation:sway 3.6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
.mood{
  position:absolute; left:74px; bottom:104px; display:flex; align-items:center; gap:5px;
  background:var(--paper); border:2px solid var(--line-2); border-radius:14px 14px 14px 4px;
  padding:3px 9px; font-size:11.5px; font-weight:700; color:var(--ink-2); white-space:nowrap;
  animation:pop .4s ease both;
}
@keyframes pop{from{opacity:0; transform:translateY(5px) scale(.9)}to{opacity:1; transform:none}}
.away{position:absolute; left:26px; bottom:70px; font-size:12px; font-weight:800; color:var(--wood-3);
  background:var(--paper); border:2px dashed var(--line-2); border-radius:14px; padding:4px 10px}

.task{padding:11px 13px 13px; background:var(--paper-2); border-top:3px solid var(--line); display:grid; gap:8px}
.task .now{font-size:12.5px; color:var(--ink-2)}
.task .now b{color:var(--ink)}
.bar{height:10px; border-radius:999px; background:var(--paper); border:2px solid var(--line-2); overflow:hidden}
.bar i{display:block; height:100%; background:repeating-linear-gradient(135deg,var(--go) 0 7px, #ffbe63 7px 14px)}
.bar.stop i{background:repeating-linear-gradient(135deg,var(--stop) 0 7px,#ff9c9c 7px 14px)}
.counts{display:flex; gap:12px; font-size:11.5px; font-weight:700; color:var(--ink-3); font-variant-numeric:tabular-nums}
.counts b{font-family:var(--mono)}
.counts .c1 b{color:var(--ok)} .counts .c2 b{color:var(--go)} .counts .c3 b{color:var(--ink-2)}

/* ── 廣場：CEO 舞台 ＋ 布告欄 ─────────────────────────── */
.stage .yard{height:272px}
.stage .dais{
  position:absolute; left:50%; transform:translateX(-50%); bottom:26px; width:min(54%,230px); height:34px;
  border-radius:16px; background:linear-gradient(180deg,var(--wood),var(--wood-2)); border:3px solid var(--wood-3);
}
.stage .banner{
  position:absolute; left:50%; transform:translateX(-50%); top:12px; width:min(72%,320px);
  background:var(--paper); border:3px solid var(--wood); border-radius:16px; padding:8px 12px;
  box-shadow:var(--shadow);
}
.stage .banner h4{font-size:11.5px; color:var(--wood-3); letter-spacing:.1em; margin-bottom:5px}
.stage .banner li{list-style:none; font-size:11.5px; color:var(--ink-2); display:flex; gap:6px}
.stage .banner li em{font-style:normal; font-family:var(--mono); color:var(--go); font-weight:700}
.stage .person.boss{left:50%; transform:translateX(-50%); bottom:50px; width:88px}
.stage .crowd{position:absolute; right:10px; bottom:6px; display:flex; align-items:flex-end}
.stage .crowd .person{position:static; width:58px; margin-left:-12px}
.stage .flag{position:absolute; left:14px; bottom:60px; width:5px; height:74px; border-radius:3px; background:var(--wood-2)}
.stage .flag::after{content:""; position:absolute; left:5px; top:4px; width:34px; height:22px; border-radius:0 8px 8px 0;
  background:var(--pink); box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}

.board{
  background:var(--paper); border-radius:var(--r); box-shadow:var(--shadow);
  outline:3px solid #fff; outline-offset:-3px; overflow:hidden; display:flex; flex-direction:column;
}
.board > header{display:flex; align-items:center; gap:9px; padding:10px 13px; background:var(--wood); color:#fff; border-bottom:3px solid var(--wood-2)}
.board > header h2{font-size:15px}
.board > header .sub{margin-left:auto; font-size:11px; font-family:var(--mono); opacity:.9}
.boardbody{display:grid; grid-template-columns:1fr 1fr; gap:14px; padding:14px; flex:1}
@media (max-width:620px){ .boardbody{grid-template-columns:1fr} }
.col h3{font-size:12px; color:var(--ink-2); margin-bottom:9px; display:flex; gap:7px; align-items:center}
.col h3 .c{background:var(--paper-2); border:2px solid var(--line-2); border-radius:999px; padding:0 8px; font-family:var(--mono); font-size:11px}
.notes{display:grid; gap:9px}
.note{
  position:relative; width:100%; text-align:left; font-family:inherit; cursor:pointer;
  padding:10px 12px; border-radius:14px; font-size:12.5px; line-height:1.5;
  background:#fff4bf; color:#6a5314; border:2px solid #e8cf72; box-shadow:0 4px 0 -1px #e8cf72;
  transform:rotate(-.5deg);
}
.note:nth-child(even){transform:rotate(.6deg); background:#d9f2c6; border-color:#a9d98b; box-shadow:0 4px 0 -1px #a9d98b; color:#3f5a26}
.note:hover{transform:translateY(-2px) rotate(0)}
.note .k{display:block; font-family:var(--mono); font-size:10.5px; opacity:.72}
.note .who{display:inline-block; margin-top:6px; font-size:10.5px; background:rgba(0,0,0,.09); border-radius:999px; padding:1px 8px}
.note.done{background:var(--paper-2); border-color:var(--line-2); box-shadow:none; color:var(--ink-2); transform:none}
.note.done .t{text-decoration:line-through; text-decoration-color:var(--ink-3)}
.note.wait{background:#ffd6cf; border-color:#f0a595; box-shadow:0 4px 0 -1px #f0a595; color:#7a3223}

/* ── 廣場圓桌（會議）───────────────────────────────── */
.meet .yard{height:300px}
.meet .rtable{
  position:absolute; left:50%; transform:translateX(-50%); bottom:64px; width:min(56%,300px); height:78px;
  border-radius:50%; background:radial-gradient(ellipse at 50% 34%, var(--wood), var(--wood-2));
  border:4px solid var(--wood-3); box-shadow:0 10px 0 -4px rgba(0,0,0,.12);
}
.meet .rtable::after{content:""; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  width:44px; height:30px; border-radius:8px; background:var(--paper); border:3px solid var(--line-2)}
.seat{position:absolute; width:66px}
.seat .person{position:static; width:100%}
.seat .tag{display:block; text-align:center; font-size:11px; font-weight:700; color:var(--ink-2);
  background:var(--paper); border:2px solid var(--line-2); border-radius:999px; padding:0 6px; margin-top:2px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.bubble{
  position:absolute; max-width:200px; padding:8px 11px; border-radius:16px 16px 16px 5px;
  background:var(--paper); border:3px solid var(--line-2); color:var(--ink); font-size:11.5px; line-height:1.45;
  box-shadow:var(--shadow); animation:pop .45s ease both;
}
.bubble .sp{display:block; font-size:10.5px; font-weight:800; color:var(--wood-3); margin-bottom:2px}
.mtimer{position:absolute; left:12px; top:12px; font-family:var(--mono); font-size:11px; color:#fff;
  background:var(--blue); border:3px solid #fff; border-radius:999px; padding:2px 10px; box-shadow:var(--shadow)}

/* ── 詳情卡 ───────────────────────────────────────────── */
.scrim{position:fixed; inset:0; background:rgba(60,45,25,.45); z-index:50; opacity:0; transition:opacity .2s}
.drawer{
  position:fixed; z-index:60; top:0; right:0; height:100%; width:min(440px,100%);
  background:var(--paper); border-left:4px solid var(--wood); box-shadow:-18px 0 40px -30px #000;
  transform:translateX(102%); transition:transform .24s cubic-bezier(.22,.9,.3,1);
  display:flex; flex-direction:column;
}
body.open .drawer{transform:none}
body.open .scrim{opacity:1}
.drawer > header{display:flex; gap:12px; align-items:center; padding:14px; background:var(--wood); color:#fff}
.drawer > header .av{width:62px; height:74px; flex:none; background:rgba(255,255,255,.22); border-radius:16px}
.drawer > header .av svg{width:100%; height:100%}
.drawer h2{font-size:17px}
.drawer .sub{font-family:var(--mono); font-size:11px; opacity:.9}
.drawer .body{overflow-y:auto; padding:14px; display:grid; gap:16px}
.sect h3{font-size:12px; color:var(--ink-2); margin-bottom:9px; display:flex; align-items:center; gap:8px}
.sect h3 .c{background:var(--paper-2); border:2px solid var(--line-2); border-radius:999px; padding:0 8px; font-family:var(--mono); font-size:11px}
.list{display:grid; gap:7px}
.item{display:flex; gap:9px; align-items:flex-start; padding:9px 11px; border-radius:14px;
  background:var(--paper-2); border:2px solid var(--line-2); font-size:12.5px; color:var(--ink-2)}
.item .k{font-family:var(--mono); font-size:10.5px; color:var(--ink-3); min-width:24px}
.item.ok{background:#e7f6e0; border-color:#b6dfa2; color:#3f5a26}
.item.go{background:#fff3d6; border-color:#efcf85; color:#6a5314}
.item.blocked{background:#ffe3dd; border-color:#f0a595; color:#7a3223}
.files{display:flex; flex-wrap:wrap; gap:7px}
.files code{font-size:11px; background:var(--paper-2); border:2px solid var(--line-2); border-radius:10px; padding:3px 8px; color:var(--ink-2)}
.kv{display:grid; grid-template-columns:auto 1fr; gap:7px 12px; font-size:12.5px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0}
.talkline{border-left:4px solid var(--blue); border-radius:0 10px 10px 0; background:var(--paper-2);
  padding:7px 11px; font-size:12.5px; color:var(--ink-2); margin-bottom:7px}
.talkline b{color:var(--ink)}
@media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important} }
</style>

<header class="topbar">
  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">
      <circle cx="17" cy="17" r="15" fill="var(--grass)" stroke="#fff" stroke-width="3"></circle>
      <path d="M9 21 q8 -10 16 0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"></path>
      <circle cx="17" cy="12" r="3.4" fill="var(--sun)"></circle>
    </svg>
    <div>
      <b>輪動村辦公室</b>
      <span>TW-ROTATION VILLAGE</span>
    </div>
  </div>
  <div class="spacer"></div>
  <div class="pills" id="filters" role="group" aria-label="依狀態篩選"></div>
  <div class="spacer"></div>
  <span class="clock" id="clock">--:--:--</span>

function paintBubble(node, entry){
  if (!node) return;
  node.innerHTML = '<span class="sp">' + esc(nameOf(entry.who)) + '</span>' + esc(entry.s);
  node.style.animation = 'none'; void node.offsetWidth; node.style.animation = '';
}
function cycleBubbles(){
  const b1 = document.getElementById('bub1'), b2 = document.getElementById('bub2');
  const step = () => {
    paintBubble(b1, MEETING.log[bubIdx % MEETING.log.length]);
    paintBubble(b2, MEETING.log[(bubIdx + 1) % MEETING.log.length]);
    bubIdx = (bubIdx + 2) % MEETING.log.length;
  };
  step();
  if (bubTimer) clearInterval(bubTimer);
  bubTimer = setInterval(step, 4200);
}

      '<div class="sect"><h3>議題</h3><p class="item go">' + esc(MEETING.topic) + '</p></div>' +
      '<div class="sect"><h3>參與者 <span class="c">' + MEETING.members.length + '</span></h3><div class="files">' +
        MEETING.members.map(m => '<code>' + esc(nameOf(m)) + '</code>').join('') + '</div></div>' +
      '<div class="sect"><h3>討論內容 <span class="c">' + MEETING.log.length + ' 則</span></h3>' +
        MEETING.log.map(l => '<p class="talkline"><b>' + esc(nameOf(l.who)) + '</b>：' + esc(l.s) + '</p>').join('') + '</div>';
  } else {
    const a = byId(id); if (!a) return;
    const st = STATUS[a.status];
    document.getElementById('dav').innerHTML = avatar(a.look, moveOf(a.status), a.name);
    document.getElementById('dname').textContent = a.name;
    document.getElementById('did').textContent = a.id + ' · ' + (a.floor || '');
    body.innerHTML =
      '<div class="sect"><dl class="kv">' +
        '<dt>狀態</dt><dd>' + mk(a.status) + ' ' + st.label + '</dd>' +
        '<dt>職責</dt><dd>' + esc(a.role) + '</dd>' +
        (a.now ? '<dt>開始於</dt><dd class="mono">' + esc(a.now.since) + '</dd>' : '') +
        (a.blockedBy ? '<dt>卡在</dt><dd style="color:var(--stop)">' + esc(a.blockedBy) + '</dd>' : '') +
      '</dl></div>' +
      (a.now ? '<div class="sect"><h3>目前進行 <span class="c">' + a.now.pct + '%</span></h3>' +
        '<p class="item go">' + esc(a.now.t) + '</p>' +
        '<div class="bar" style="margin-top:9px"><i style="width:' + a.now.pct + '%"></i></div></div>' : '') +
      '<div class="sect"><h3>已完成 <span class="c">' + (a.done || []).length + '</span></h3>' + listHTML(a.done, 'ok', '還沒有完成項目') + '</div>' +
      '<div class="sect"><h3>進行中 <span class="c">' + (a.doing || []).length + '</span></h3>' + listHTML(a.doing, 'go', '目前沒有進行中的項目') + '</div>' +
      '<div class="sect"><h3>未完成／在等什麼 <span class="c">' + (a.todo || []).length + '</span></h3>' +
        listHTML(a.todo, a.status === 'blocked' ? 'blocked' : '', '沒有排隊中的項目') + '</div>' +
      (a.status === 'meeting' ? '<div class="sect"><h3>正在討論</h3><p class="talkline"><b>' + esc(MEETING.topic) + '</b></p>' +
        MEETING.log.filter(l => l.who === a.id).map(l => '<p class="talkline">' + esc(l.s) + '</p>').join('') + '</div>' : '') +
      '<div class="sect"><h3>負責檔案</h3><div class="files">' + (a.files || []).map(f => '<code>' + esc(f) + '</code>').join('') + '</div></div>';
  }
  document.getElementById('scrim').hidden = false;
  document.getElementById('drawer').hidden = false;
  requestAnimationFrame(() => document.body.classList.add('open'));
  document.getElementById('closebtn').focus();
}
function closeDrawer(){
  document.body.classList.remove('open');
  setTimeout(() => { document.getElementById('scrim').hidden = true; document.getElementById('drawer').hidden = true; }, 220);
}
function renderFilters(){
  const c = s => AGENTS.filter(a => a.status === s).length;
  const defs = [['all','全部',AGENTS.length,''],['working','工作中',c('working'),'working'],
                ['meeting','開會中',c('meeting'),'meeting'],['idle','待命',c('idle'),'idle'],
                ['blocked','等決策',c('blocked'),'blocked']];
  document.getElementById('filters').innerHTML = defs.map(([k, label, n, s], i) =>
    '<button class="pill" type="button" data-f="' + k + '" aria-pressed="' + (i === 0) + '">' +
      (s ? mk(s) : '') + label + ' <span class="n">' + n + '</span></button>').join('');
}
function applyFilter(f){
  document.querySelectorAll('#filters .pill').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.f === f)));
  document.querySelectorAll('#offices .hut').forEach(r => r.classList.toggle('dim', f !== 'all' && r.dataset.status !== f));
}
function tick(){
  const d = new Date(), p = n => String(n).padStart(2, '0');
  document.getElementById('clock').textContent = p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}
function initTheme(){
  let saved = null;
  try { saved = localStorage.getItem('village-theme'); } catch (e) {}
  if (saved) document.documentElement.setAttribute('data-theme', saved);
  document.getElementById('themebtn').addEventListener('click', () => {
    const now = document.documentElement.getAttribute('data-theme');
    const isNight = now === 'night' || (!now && window.matchMedia('(prefers-color-scheme: dark)').matches);
    const next = isNight ? 'day' : 'night';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('village-theme', next); } catch (e) {}
  });
}

renderFilters(); renderStage(); renderBoard(); renderMeeting(); renderOffices();
initTheme(); tick(); setInterval(tick, 1000);

document.addEventListener('click', (e) => {
  const note = e.target.closest('.note');
  if (note){ if (note.dataset.id) openDrawer(note.dataset.id); return; }
  const pill = e.target.closest('#filters .pill');
  if (pill){ applyFilter(pill.dataset.f); return; }
  const hut = e.target.closest('.hut');
  if (hut){ openDrawer(hut.dataset.id); return; }
  if (e.target.closest('#closebtn') || e.target.id === 'scrim') closeDrawer();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && document.body.classList.contains('open')) closeDrawer(); });

</script>
</body>
</html>
