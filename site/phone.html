<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>手機版預覽</title>
<!-- 2026-10-08（Andy：「我是正在使用電腦，所以手機版本看不到，等等給我瀏覽器內容直接就是手機版本」）
     用電腦打開這一頁就直接看到手機版：中間一個 390×844 的框，裡面用 iframe 開 index.html。
     iframe 的寬度就是裡面網頁的視窗寬度，所以 ≤640 的手機樣式會真的生效（不是把桌機縮小）。
     網址的 hash 會帶進去：phone.html#flow/sankey → index.html#flow/sankey；裡面換頁時，外面的網址也跟著換，重新整理會停在同一頁。 -->
<style>
  :root{--bg:#e9ebef;--panel:#ffffff;--ink:#1d2430;--ink-2:#55606f;--line:#c9ced6;--accent:#2a7de1}
  @media (prefers-color-scheme:dark){:root{--bg:#1b1e24;--panel:#262a31;--ink:#e6e9ee;--ink-2:#a3abb7;--line:#3a404a;--accent:#5aa7ff}}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;
    display:flex;flex-direction:column;align-items:center;gap:14px;padding:16px}
  .bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px}
  .bar b{font-weight:600;margin-right:4px}
  button{min-height:36px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font:inherit;cursor:pointer}
  button.on{border-color:var(--accent);color:var(--accent);font-weight:600}
  .sep{width:1px;height:24px;background:var(--line);margin:0 4px}
  .frame{padding:12px;border:2px solid var(--line);border-radius:36px;background:var(--panel);box-shadow:0 10px 30px rgba(0,0,0,.15)}
  iframe{display:block;border:0;border-radius:24px;background:#000}
  .note{color:var(--ink-2);font-size:12px;text-align:center;max-width:520px}
</style>
</head>
<body>
  <div class="bar" role="toolbar" aria-label="手機尺寸">
    <b>手機版預覽</b>
    <button type="button" data-w="390" data-h="844">390×844（iPhone 14）</button>
    <button type="button" data-w="360" data-h="800">360×800（Android）</button>
    <button type="button" data-w="430" data-h="932">430×932（大螢幕）</button>
    <span class="sep" aria-hidden="true"></span>
    <button type="button" id="pvReload">重新整理</button>
    <button type="button" id="pvOpen">用新分頁開啟</button>
  </div>
  <div class="frame"><iframe id="pvFrame" title="手機版畫面" width="390" height="844"></iframe></div>
  <p class="note">框裡就是手機版（寬度 ≤ 640 的版面），可以直接點、捲動。用滑鼠拖曳不會等於手指拖曳；要模擬手指，請用瀏覽器開發者工具的裝置模式。</p>
<script>
(function () {
  'use strict';
  const fr = document.getElementById('pvFrame');
  const SIZE_KEY = 'tw.phone.size';
  const hashNow = () => (location.hash && location.hash.length > 1 ? location.hash : '#overview');
  function setSize(w, h) {
    fr.width = String(w); fr.height = String(h);
    fr.style.width = w + 'px'; fr.style.height = h + 'px';
    document.querySelectorAll('button[data-w]').forEach((b) => b.classList.toggle('on', +b.dataset.w === w));
    try { localStorage.setItem(SIZE_KEY, w + 'x' + h); } catch (e) { /* 私密視窗 */ }
  }
  document.querySelectorAll('button[data-w]').forEach((b) => { b.onclick = () => setSize(+b.dataset.w, +b.dataset.h); });
  let saved = null; try { saved = localStorage.getItem(SIZE_KEY); } catch (e) { /* 私密視窗 */ }
  const m = /^(\d+)x(\d+)$/.exec(saved || '');
  setSize(m ? +m[1] : 390, m ? +m[2] : 844);
  fr.src = 'index.html' + hashNow();
  // 裡面換頁 → 外面網址跟著換（同網域才讀得到）；外面改 hash → 裡面跟著換
  let syncing = false;
  fr.addEventListener('load', () => {
    try {
      fr.contentWindow.addEventListener('hashchange', () => {
        const h = fr.contentWindow.location.hash || '#overview';
        if (h !== location.hash) { syncing = true; history.replaceState(null, '', h); syncing = false; }
      });
    } catch (e) { /* 不同網域：只能單向 */ }
  });
  window.addEventListener('hashchange', () => {
    if (syncing) return;
    try { if (fr.contentWindow.location.hash !== location.hash) fr.contentWindow.location.hash = hashNow(); } catch (e) { fr.src = 'index.html' + hashNow(); }
  });
  document.getElementById('pvReload').onclick = () => { try { fr.contentWindow.location.reload(); } catch (e) { fr.src = 'index.html' + hashNow(); } };
  document.getElementById('pvOpen').onclick = () => { window.open('index.html' + hashNow(), '_blank', 'noopener'); };
})();
</script>
</body>
</html>
