/* 滑過環節的說明框（圖上的環節標題、沒有台股那格的說明、流向圖方塊共用）。
   寬度 240～360px、中文正常斷行 —— 原生 <title> 管不到寬度，會窄到一字一行（Andy 2026-09-24 回報）。*/
.reltip{position:fixed;z-index:60;min-width:240px;max-width:360px;box-sizing:border-box;padding:10px 12px;border-radius:10px;
  background:var(--tip-bg,var(--panel));border:1px solid var(--tip-line,var(--line-2));box-shadow:var(--tip-sh,none);
  color:var(--ink);font-size:13px;line-height:1.6;white-space:normal;word-break:normal;overflow-wrap:break-word;pointer-events:none}
.reltip[hidden]{display:none}
.reltip .rtn{font-size:12px;color:var(--ink-3)}
.reltip .rtd{margin-top:4px;color:var(--ink-2)}
.reltip .rtr{margin-top:3px;font-size:12.5px;color:var(--ink-2)}
.reltip .rtr .k{display:inline-block;min-width:32px;margin-right:6px;color:var(--ink-3)}
/* hover 一張公司卡時，跟它有上下游關係的另一端一起提亮（只有線會看不出通到誰）*/
.chainmap .co.near rect{stroke:var(--cyan);stroke-opacity:.9}
.chainmap .co.near text{fill:var(--ink)}
/* 關聯圖環節收合（2026-09-25）：收合時每檔是一顆小晶片，邊框顏色＝漲跌（紅漲綠跌），外商灰字 */
.chainmap .co.chip rect{stroke:var(--ud);stroke-width:1.3}
.chainmap .co.chip text{font-size:12px}
.chainmap .co.chip.foreign text{fill:var(--ink-3)}
.chainmap .co.chip:hover rect,.chainmap .co.chip.sel rect,.chainmap .co.chip.near rect{stroke:var(--c,var(--cyan));stroke-width:1.8}
.chainmap .segfold{cursor:pointer}
.chainmap .segfold text{font-size:12px;text-anchor:middle;pointer-events:none}
.chainmap .segfold:hover rect{fill:var(--line-2)}
.chainmap .foldbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:8px 12px 0;font-size:12px}
.chainmap .foldbar button{font-size:12px;padding:3px 10px;border-radius:6px;border:1px solid var(--line-2);background:var(--panel-2);color:var(--ink);cursor:pointer}
.chainmap .foldbar button:hover{border-color:var(--cyan)}
.chainmap .foldbar .sub{color:var(--ink-3)}
/* 環節詳情：Default 是空的（高度 0），點色標或環節卡才展開 —— 這就是 Andy 說的「點擊後才會跳出下拉清單」 */
#segBox:empty{display:none}
#segBox{margin-top:10px}
/* ---- 剖析圖設定列：跟標題**同一列、靠右**（Andy 2026-09-23：「設定列改到右上角」）----
   ★ 第一版是絕對定位浮在畫布的右上角內緣，`_preview.py` 當場量到文字重疊：
     圖的右上角本來就有「產品剖析圖 <圖名>」那一行標題，浮上去就是跟它搶同一塊。
     改成同一列並排之後，位置由版面決定 —— 不可能再疊到標題，也不可能蓋住圖的內容，
     而且 `placeDgTools()` 那一整套防抖動機制（死區、補算、ResizeObserver）整個不需要了
     （它存在的唯一理由是「浮在一個會非同步長高的畫布上」）。
   ★ 收合（`.dgfold`）時它仍然在、仍然點得到 —— 它住在標題那一列，跟 `#dgBody` 無關，
     所以「展開剖析圖」那顆鈕不可能跟著消失。*/
#dgSec{position:relative}
.dgsechead{gap:8px 10px;align-items:flex-start}
/* ★ 2026-09-23 修：標題的自然寬度（含 #dgTitle 那串完整圖名）實測 872px，
   設定列 587px，兩個加起來 1459px 遠大於容器 972px —— 於是設定列被擠到**第二行**，
   靠左排，看起來就不在右上角了（實測 qx 0.21、離右緣 385px）。
   `space-between` 對「換了行的單一項目」不會靠右，所以光靠它不夠。
   修法兩件事配成一組：標題可收縮（`flex:1 1 auto` ＋ 既有的 `min-width:0`，文字自己換行），
   設定列不收縮並用 `margin-left:auto` 頂到右緣 —— 這樣不論標題多長都留在同一列的最右邊。 */
.dgsechead{flex-wrap:nowrap}      /* 寬畫面不准換行：換行＝設定列掉到第二列，就不是「標題右邊」了 */
/* ★ 2026-09-23 第十批 C1：「產品剖析圖」那個 h4 拿掉了，左邊剩下 .dgsectitle
   （裡面只有圖名 #dgTitle）。兩個選擇器都留著：h4 那一條給還沒改到的地方，
   不留的話萬一有別頁還在用 h4，設定列會整條掉到第二列。 */
.dgsechead h4,.dgsechead .dgsectitle{min-width:0;flex:1 1 auto}
/* 標題沒了之後這一行只剩灰色小字，行高要補回來，不然它跟右邊那排 pill 的頂端對不齊 */
.dgsectitle{font-size:12.5px;line-height:1.5;padding-top:3px}
/* `flex:0 1 auto` 而不是 `0 0 auto`：中等寬度（實測 1100px）容器只剩約 700px，
   設定列自然寬 587px ＋ 標題最小寬就放不下，硬不收縮就會整條掉到第二列。
   允許它自己把 pill 折成兩排，配上 `align-items:flex-start` 讓兩邊的頂端對齊，
   這樣「跟標題同一列、靠右」在 1440 與 1100 都成立。 */
#dgTools{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center;
  min-width:0;flex:0 1 auto;margin-left:auto}
#dgTools[hidden]{display:none}
/* ★ 2026-09-26：2D｜3D 分段鈕（取代「3D 立體」開關，見 industry.js wire3D 的 paintMode）。
   .seg 自己宣告 display:inline-flex，會蓋掉 [hidden] 的 UA 預設 —— 沒有 3D 場景的圖一定要真的藏起來。
   高度跟旁邊的 .pill 對齊（pill 約 24px）：外框 padding 收到 2px、每格 3px 12px。*/
#dg3d.seg{padding:2px;flex:none;align-self:center}
#dg3d.seg button{padding:2px 12px;font-size:12.5px;line-height:1.35}
#dg3d[hidden]{display:none!important}
/* ★ 2026-09-26：「拖曳：轉動」「重設視角」在 2D 一直都看得到 —— 它們是 .pill（display:inline-flex），
   作者樣式蓋掉了 [hidden] 的 UA 預設，industry.js 設的 hidden 從來沒生效過。2D 時畫面上掛著兩顆只對 3D 有用的鈕，
   也是「看不出現在是 2D 還是 3D」的一部分。設定列裡凡是 hidden 的一律真的藏起來。*/
#dgTools>[hidden]{display:none!important}
/* ★ 2026-09-26（Andy：「拖曳、重設視角，移動到下面」）：兩顆從設定列搬進 3D 畫面框內的右上角，浮在畫布上。
   · .dg3dbox 只是定位用的外框（#prod3d 會被 innerHTML 清空，鈕不能住在它裡面，見 industry.js 樣板的註解）。
   · 半透明底＋模糊：底下是 3D 背景的漸層，實色塊會像一塊補丁；全透明在淺色主題又讀不到字。
     顏色走全站 token（--panel／--line-2／--ink-2），深淺主題各自跟著換，不另外寫一份淺色版。
   · 右欄卡片由 three3d.js 從這組鈕的下緣開始排（reserveTR），所以不會壓到卡片；
     窄畫面（卡片搬到畫布底下）時右上角本來就是空的背景。
   · [hidden] 一定要 !important：.pill 是 inline-flex，外層只要漏一次，2D 時就會掛著兩顆沒用的鈕。*/
.dg3dbox{position:relative}
.dg3dctl{position:absolute;top:8px;right:8px;z-index:6;display:flex;gap:6px;align-items:center;
  padding:4px;border-radius:999px;background:color-mix(in srgb,var(--panel) 62%,transparent);
  border:1px solid color-mix(in srgb,var(--line-2) 70%,transparent);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);box-shadow:0 2px 10px rgba(0,0,0,.18)}
.dg3dctl[hidden]{display:none!important}
.dg3dctl .pill{cursor:pointer;font-size:12.5px;line-height:1.35;
  background:color-mix(in srgb,var(--panel-3) 78%,transparent)}
.dg3dctl .pill:hover{color:var(--ink);border-color:var(--cyan)}
.dg3dctl .pill.cyan{background:rgba(62,224,255,.16)}   /* 「拖曳：平移」時亮青色，上面那條半透明底不能把它蓋掉 */
.dg3dctl .pill:focus-visible{outline:2px solid var(--cyan);outline-offset:1px}
/* 窄畫面：設定列自己換到下一行、排成可左右捲的一列，不准把標題擠到溢出 */
@media (max-width:800px){
  .dgsechead{flex-wrap:wrap}
  #dgTools{flex:1 1 100%;flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;
    margin-left:0;-webkit-overflow-scrolling:touch}
  #dgTools .pill{flex:none}
}

/* ★ 2026-09-23：版號徽章在 **1100px** 也放不下 —— 量到 topbar 需要 1117px，
   整頁因此多出 17px 的橫向捲軸（`A.verbadge#buildver` 的右緣 1117）。
   徽章本來就有「放不下就藏起來」這條既有規則（原本只做到 820px 以下），
   這裡只是把門檻拉到真正放不下的那個寬度。版號在資料橫幅那一行照樣寫得到，
   DECISIONS #148「要看得到版號」沒有被動到。 */
@media (max-width:1140px){ .verbadge{display:none} }

/* ==========================================================================
   ★★★ 2026-09-23 手機優先改版 第一版（Andy：「電腦看跟手機看完全不同，
   幫我依據手機改版頁面，後續還會在更新 先改一版吧」）

   依據 = `docs/mobile_audit.md` 那份量出來的落差清單（16 項），不是印象。
   原則（他講得很清楚）：**桌機遷就手機**，手機是基準；桌機是它的放大／展開版。
   規矩：同一個功能兩邊要叫同一個名字、放在對應得起來的位置；
   收進抽屜可以，**整個消失不行**。

   這一段刻意集中寫在檔尾、而不是散進上面各自的區塊：
   ① 它們全部是「同一件事」的一部分，散開來下一版的人找不到；
   ② 排在最後才蓋得掉上面既有的 820px 區塊（同特異度、後者勝），
      不必替每一條加 !important。
   ========================================================================== */

/* ---- G4：手機字級下限 12px（`docs/mobile_audit.md` 量到 8 頁共 400+ 處破線）----
   根因是 CSS 裡有 60 餘處寫死 11px／11.5px —— 桌機勉強可讀，390px 的手上讀不到。
   ★★ 2026-09-24 改成**桌機也一起抬**（`docs/ui_polish_spec.md` 第一階段第 8 項，
     CEO 2026-09-24 指派）。原本這裡寫「只抬手機、桌機是刻意的層次」——
     量出來的事實推翻了那句話：1440px 上仍有 **132 個節點**小於 12px、16 種選擇器，
     最密的是 `em`(11.5px×26)、`.lb`／`.sg`(11.5px×20)、`.cnt`(11.5px×13)。
     11.5px 在 1440px 的螢幕上一樣是可讀性下限以下，而且 Andy 自己講過「文字太小」。
     ⚠ 代價：桌機的像素會變（字變大 4%），那是**刻意的改動**不是退化 ——
       所以桌機像素比對的報告要把這一項單獨列出來，不可以混進「零差異」裡。
   ⚠ 刻意不含 `.chainmap .co .sub` 與 `.chainmap .fct` —— 那兩個是 SVG 文字，
     位置由 industry.js 依字級算好，抬字級會直接壓到隔壁的節點。留到下一版連同排版一起改。*/
.evbtn .n,.hpanel .ms a .c,.hpanel .ms a.grow .tw2,.opabox .val,
  .rotdd .ddbar .muted,.rotdd .ddpanel>.ddopt em,.rotdd .ddbtn,
  .m3-tag,.m3-night .note,.m3-chart .m3-night .note,[id^='m3c-'][data-fallback]::before,
  .zwrap>.zbadge,.chainchips button em,.rotquads .rq em,
  .stagepanel .sd,.stagepanel ul.ms li .m,.stage li .m,.kpi .l .more,
  #mktTabs button em,.magrid .ma .n em,.magrid .ma .v,.cglist label em,.facets button em,
  .m3-sub,.chainsw button em,.chainsw button[data-dg]::before,
  .nbsw>button em,.nbsw>a em,.nbsw>button[data-dg]::before,
  .qtag,.segchip .n,.xchain .xrow>.muted,.xchain .xrow .pill,.mapnote,
  #lwc .ohlcbox,#lwc .ohlcbox th,#lwc .ohlcbox td,#lwc .pane-labels div,
  .relbox .it,.relbox .nt,.relbox .why,.relbox .depn,.relbox .why b,.ev .cat,
  .segcard .sh .rl,.segcard .sh .cnt,.segcard .sf,.segcard .sco .code,.segcard .sco .rel,.segcard .nt,
  .rotfilter .muted,.rottools .muted,h4.subh small,
  .tk-st,.tk-f code,.tk-sp,
  .dlv-tag,.dlv-w b,.dlv-ver,.dlv-none,.dlv-b,
.segtools .muted,.relsw button{font-size:12px}

/* ---- G1／G9：頂欄右半邊在手機被整個裁掉 ----
   量到的事實（390px）：`.topbar` 需要 528px 卻只有 390px，而它是 `overflow:hidden` ——
   `#themeBtn` 只露出 6px、`#evToggle`（今日事件的**唯一入口**）整顆在畫面外。
   結果是「明亮／深色」與「今日事件」這兩個功能在手機上不存在。

   修法：手機把「更新／即時設定／主題／今日事件」四件事收進一顆「⋯」——
   收進抽屜是允許的，消失不行。抽屜裡每一列都寫**跟桌機同一個名字**，
   而且是 44px 高的整列，比桌機的圖示鈕更好認、更好點。
   ⚠ `overflow` 一定要改回 `visible`：`#morePop` 與搜尋建議 `#sugg` 都是絕對定位的浮層，
     留著 hidden 會把它們裁掉（等於修了一個問題製造另一個）。
     改 visible 之後不會產生橫向捲軸，因為四顆鈕已經收掉、搜尋框改成可收縮。*/
.morebtn{display:none;position:relative}
.morepop{position:absolute;top:calc(100% + 6px);right:8px;z-index:60;width:min(260px,calc(100vw - 24px));
  background:var(--panel);border:1px solid var(--line-2);border-radius:12px;padding:6px;
  box-shadow:0 18px 46px var(--drop)}
.morepop[hidden]{display:none}
.morepop button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:8px 12px;
  border:0;background:transparent;color:var(--ink);font-size:14.5px;text-align:left;border-radius:9px;cursor:pointer}
.morepop button:hover,.morepop button:focus-visible{background:var(--panel-2)}
.morepop button .ic{width:22px;text-align:center;color:var(--cyan);font-size:15px;flex:none}
.morepop button .n{margin-left:auto;background:var(--violet);color:var(--ontop);font-size:12px;/* 同上：白字對 --violet 只有 3.29 */
  padding:1px 8px;border-radius:9px;font-family:var(--mono)}
.morepop .hint{font-size:12px;color:var(--ink-3);padding:4px 12px 6px;line-height:1.5}
@media (max-width:820px){
  .topbar{overflow:visible}
  .livebox,#themeBtn,#evToggle{display:none}
  .morebtn{display:inline-flex;align-items:center;gap:4px;min-height:40px;margin-left:auto}
  /* 搜尋改成「把剩下的寬度都吃掉」：手機上搜尋是最常用的入口，
     而且可收縮才不會把頂欄撐出橫向捲軸（這是 overflow:visible 的前提）。*/
  .search{flex:1 1 auto;min-width:0}
  .search input{width:100%}
}

/* ---- G2：底部分頁列 8 顆放不下，「季節性」「交付清單」整個在畫面外 ----
   量到（390px）：`#tabs` 需要 549px。市場明細被切一半，最後兩顆完全看不到。
   它雖然有 `overflow-x:auto` 滑得到，但手機不顯示捲軸、`space-around` 又讓它
   看起來「剛好排滿」—— 等於沒有任何提示，那兩頁對手機使用者就是不存在。

   修法：**排成兩列四顆，八顆全部看得見**，不靠左右滑。
   為什麼不選「一列可捲 ＋ 淡出提示」：那樣最後兩頁仍然要先滑才看得到，
   而他的抱怨正是「找不到」。多出來的 ~50px 高度換「零隱藏」，這筆划算。
   同時把每顆的觸控高度補到 44px（G5，原本只有 32px）。*/
@media (max-width:820px){
  .tabs{flex-wrap:wrap;justify-content:flex-start;gap:4px;overflow:visible;
    padding:5px 6px calc(5px + env(safe-area-inset-bottom))}
  .tab{flex:1 0 calc(25% - 3px);min-height:44px;display:flex;align-items:center;justify-content:center;
    padding:4px 2px;font-size:12.5px;line-height:1.2}
  /* ★ 2026-09-24：「題材」併進「熱力圖」之後剩七顆 ＝ 上排四顆、下排三顆。
     下排三顆**各佔三分之一、把整列排滿**，不准留一個空位（Andy 截圖上的要求）。
     `flex-grow:1` 本來就會把剩下的寬度分給同一列的人，這裡把基準寫明，
     讓「下排三顆一樣寬」不是靠碰巧：以後分頁再增減一顆，改這一行就好。*/
  .tab:nth-child(n+5){flex-basis:calc(33.333% - 3px)}
  /* 兩列分頁列約 102px 高，內容的下緣要讓開，不然最後一張卡片被蓋住 */
  main{padding-bottom:150px}
}

/* ---- G3：總覽的大盤三張圖 ----
   量到：390px 時三張卡直立堆疊共 1331px（433／433／437），
   使用者要滑過三個整頁畫面才看得到第一個 KPI 數字；1440px 是一列三張、可以互相對照。
   整頁高度因此是 9832 vs 3306（2.97 倍）。

   修法：手機改成**左右滑的卡片**（一次一張、露出下一張的邊）——
   「三個指數並排、可以互相比」這件事在手機上用滑的達成，語意跟桌機一樣，
   而高度從 1331px 收回一張的高度。
   露出 12% 的下一張 ＋ 右緣淡出（`.hsc` 那一段）就是「可以滑」的提示。*/
@media (max-width:820px){
  .m3-grid{display:flex!important;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
  .m3-grid::-webkit-scrollbar{display:none}
  .m3-grid>*{flex:0 0 88%;min-width:0;scroll-snap-align:start}
}

/* ---- G6：橫向可捲的容器要看得出「這裡可以左右滑」----
   ⚠⚠ 2026-09-23 需求翻轉（Andy：「除了桌面不可以遷就手機 其他你要怎麼優化都可以」）：
   這一整段**只在 ≤820px 生效**。桌機有捲軸、有滑鼠滾輪、有 hover，本來就看得出來可以捲，
   加淡出與提示列反而是替桌機加東西 —— 那就是「桌機遷就手機」。
   `.hsc`／`.swipetip` 的樣式與 app.js 掛 class 的那段**兩邊都有手機守門**，
   少一邊都會讓桌機被動到。
   量到（390px，clientWidth → scrollWidth）：#chainSwitch 362→1151（8 條產業鏈只看得到 3 條）、
   #dgPick 324→507、#dgTools 306→416、#stockTabs 362→510、市場明細表 322→543。
   這些用 overflow-x:auto 是對的（整頁不准橫向捲），缺的只是提示。

   兩層提示：① 右緣淡出（mask，內容被切掉看得出來）② app.js 在下面補一行「← 左右滑 →」。
   mask 掛在捲動容器自己身上 —— mask 作用在元素的 border box，**不會跟著內容捲走**，
   所以淡出永遠停在右緣（用 ::after 就會跟著捲，這是刻意不用它的理由）。*/
@media (max-width:820px){
.hsc{-webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 30px),transparent 100%);
  mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 30px),transparent 100%)}
.hsc.at-start{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 30px,#000 100%);
  mask-image:linear-gradient(90deg,transparent 0,#000 30px,#000 100%)}
.hsc.at-both{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 30px,#000 calc(100% - 30px),transparent 100%);
  mask-image:linear-gradient(90deg,transparent 0,#000 30px,#000 calc(100% - 30px),transparent 100%)}
.swipetip{font-size:12px;color:var(--ink-3);letter-spacing:.04em;margin:4px 0 2px;user-select:none}
.swipetip::before{content:'← ';opacity:.7} .swipetip::after{content:' →';opacity:.7}
}

/* ---- G5：觸控目標 ----
   量到（390px）：`.btn.small`／`.pill`／`.seg>button` 高只有 23～29px，
   表格與卡片裡的個股連結只有 18～22px，勾選框 13×13。手機上很容易點到隔壁那一顆。
   ⚠ 我沒有把**全部**可點元素拉到 44px：族群晶片一頁有 56 顆，全部 44px 會讓整頁再長一截，
     那會把剛剛在 G3 省下來的高度又還回去。取捨是：
     **導覽與主要動作（分頁、頂欄、抽屜列、卡片上的動作鈕）給滿 44px；
     密集的篩選晶片給 36px；純文字的個股連結給 32px 的可點高度。**
     這一條是我自己判斷的，Andy 可能不同意 —— 寫在回報裡讓他一次否決。*/
@media (max-width:820px){
  .btn,.evbtn,.iconbtn,.howbtn,.seg>button,.seg button,.nbsw>button,.nbsw>a,
  .chainsw button,.relsw button{min-height:36px}
  .card .row .btn.small,.card .row .howbtn{min-height:40px;padding-left:12px;padding-right:12px}
  .segchip,.chainchips button,.facets button,.rotquads .rq,.pill{min-height:36px;display:inline-flex;
    align-items:center}
  /* 個股連結：不動字級（動了會把表格撐爛），改用 padding 把可點範圍撐到 32px */
  .tw a.lk,.cards a.lk,.ms a,.seglist a.lk,.sibs a.lk{display:inline-flex;align-items:center;min-height:32px}
  input[type=checkbox]{width:20px;height:20px}
  .dtool{width:40px;height:40px} .dtool svg{width:20px;height:20px}
  .dcol{width:30px;height:30px}
}

/* ---- G7：剖析圖收合時，它的設定列要跟著收 ----
   量到（390px）：`#dgFold` 寫著「展開剖析圖 ▾」（圖是收的），
   但「3D 立體／拖曳：轉動／重設視角／動畫：開」四顆照樣在、照樣點得到 ——
   點了畫面什麼都不會變，因為圖根本沒展開。控制項在、被控制的東西不在。
   ⚠ 手機預設收合本身是刻意的（DECISIONS：不收的話一進產業鏈就吃到 1000px 高的圖），
     要修的是設定列，不是把收合拿掉。
   ⚠ `#dgFold` 自己一定要留著（它是把圖開回來的唯一入口），所以用 `:not(#dgFold)`。
   ⚠⚠ 2026-09-23 需求翻轉後改成**只在 ≤820px 生效**。桌機收合時同樣是「控制項在、圖不在」，
     但桌機預設是展開的、而且那是 Andy 現在正在用的版面 —— 動它就是改了桌機行為。
     留到下一版，由他決定桌機要不要也跟著收。*/
@media (max-width:820px){ #dgSec.dgfold #dgTools>.pill:not(#dgFold),#dgSec.dgfold #dgTools>#dg3d{display:none} }

/* ---- G8：個股頁的繪圖工具列 ----
   量到（390px）：`.drawbar` 被攤平成橫向兩列、約 20 顆 20×20～30×24px 的鈕
   （游標／線／箭頭／水平線／框／文字／垃圾桶 ＋ 6 色 ＋ 4 線型 ＋ 還原／關閉）。
   桌機是圖表左側的直排工具列 —— 位置與方向都對不起來，而且手指點不準。
   修法：手機**預設收起來**，工具列那排給一顆「✎ 畫線」開關（名字跟功能一致）。
   收起來不是拿掉：開關就在同一排工具列上，按一下就出來，而且會記住（localStorage）。*/
#drawTgl{display:none}
@media (max-width:820px){
  #drawTgl{display:inline-flex;align-items:center;min-height:36px}
  .chartwrap>.drawbar{display:none}
  .chartwrap.drawon>.drawbar{display:flex}
}

/* ==================================================================================
   ★ 2026-09-23 桌面版介面精修 #5／#6／#7（規格：docs/ui_polish_spec.md §7、§8）
   放在樣式表**最後面**是刻意的：下面三組都要能蓋掉前面既有的規則
   （尤其是五處 `outline:0`），所以順序本身就是這一段能生效的條件。
   ================================================================================== */

/* ---- #5-1 hover 的過場 ----------------------------------------------------------
   量到的事實：全站 70 個 `:hover` 選擇器，其中 57 個（81%）的基底選擇器連
   `transition` 都沒有 —— 滑鼠掃過去顏色是「瞬間切換」，看起來像閃爍不像回饋。
   這裡不去逐條改那 57 個，而是用 `:where()` 一次補齊：
   `:where()` 的權重是 **0**，所以任何既有規則自己寫的 `transition` 都蓋得掉它，
   等於「有寫的照舊、沒寫的補上」，不會把任何既有行為改掉。
   只過場**顏色類**的屬性（底色／邊框／文字／陰影／透明度）——
   尺寸與位置不過場，那會讓旁邊的東西跟著動。 */
:where(a,button,summary,label,
  .tab,.tabnav,.pill,.chip,.tile,.card,.evbtn,.btn,.iconbtn,.howbtn,.segchip,.grade,
  .seg>button,.seg button,.nbsw>button,.nbsw>a,.chainsw button,.chainchips button,
  .relsw button,.facets button,.morepop button,.sugg .sgrow,.dlv-go,.dtool,.dcol,
  .stage li,.hpanel .ms a,th,tbody tr,.ev,.rq){
  transition:background-color var(--dur-fast) var(--ease),
             border-color var(--dur-fast) var(--ease),
             color var(--dur-fast) var(--ease),
             box-shadow var(--dur-fast) var(--ease),
             opacity var(--dur-fast) var(--ease);
}
/* `.tile` 的浮起（translateY(-1px)）**刻意留著**：它是卡片、不是密集列表的一列，
   浮起來不會造成連鎖位移，而且那正是 Andy 點名的「滑動移動回饋」。
   原本它是硬跳的，這裡補上過場讓它變成「浮」而不是「跳」。
   ⚠ 對照組：`.stage li` 的 translateX 已經拿掉（上面），因為那是一列接一列的清單。*/
.tile{transition:background-color var(--dur-fast) var(--ease),border-color var(--dur-fast) var(--ease),
  color var(--dur-fast) var(--ease),box-shadow var(--dur-fast) var(--ease),
  transform var(--dur-fast) var(--ease)}

/* ---- #5-2 按下去的回饋 ----------------------------------------------------------
   改之前整份樣式表的 `:active` 規則是 **0 條** —— 每一顆按鈕按下去都沒有任何反應，
   要等畫面重畫才知道自己按到了。這是 Andy 講的「滑動移動回饋」最大的缺口。
   0.985 的縮放：小到不會讓文字模糊，大到眼睛／手指感覺得到；60ms 是「按下即到」。
   ⚠ **只對「整顆按鈕」用，不對表格列用** —— 整列縮放會讓 12px 的字糊掉一幀，
     表格列的按下回饋改用底色壓一階（上面 `tbody tr:active`）。
   ⚠ `.tabnav` 自己帶著 translateY(-50%) 定位，所以要把那一段一起寫回去，
     不然按下去整顆會往下跳半個身高。*/
:where(button,.tab,.evbtn,.pill,.btn,.chip,.iconbtn,.howbtn,.segchip,.dlv-go,
  .seg>button,.seg button,.nbsw>button,.nbsw>a,.chainsw button,.chainchips button,
  .relsw button,.facets button,.morepop button,a.card,.tile):active{
  transform:scale(.985);transition:transform 60ms var(--ease);
}
.tabnav:active{transform:translateY(-50%) scale(.985);transition:transform 60ms var(--ease)}

/* ---- #7 鍵盤焦點 ----------------------------------------------------------------
   量到的事實：`.tab` 聚焦之後 `outline-width` 是 **0px**，全站 `:focus-visible` 只有 2 條、
   `outline:0`／`none` 有 5 處 —— 只用鍵盤的人完全不知道游標在哪一顆上面。
   `:focus-visible`（不是 `:focus`）表示「滑鼠點一下不會冒出焦點框，用鍵盤才會」。
   `outline-offset:2px` 是為了不被元素自己的邊框吃掉。
   焦點環用 --focus：深色 #3ee0ff 對 panel 11.30、淺色 #0a5f7d 對白底 7.13，
   都遠高於非文字元素要求的 3.0。*/
:where(a,button,input,select,textarea,summary,[tabindex]):focus-visible{
  outline:2px solid var(--focus);outline-offset:2px;
}
/* ⚠ 這一條看起來像廢話（`:focus-visible:focus-visible`），但它解的是一個真的踩到的坑：
   全站有 16 條規則寫 `transition:.15s` —— 那是**簡寫**，等於 `transition-property:all`，
   於是「焦點環」也被當成可過場的屬性，按 Tab 之後 outline 會從 0px 花 150ms 長到 2px。
   實測按下 Tab 的當下量到 `outline-width:1px`、顏色是插值中的 rgb(12,39,50)——
   對用鍵盤快速跳的人來說，那就是「焦點框慢半拍、跟不上游標」。
   重複一次 `:focus-visible` 只是為了把權重提到 (0,2,0)，蓋得過那些 `.tab`／`.tile`
   之類 (0,1,0) 的簡寫；同時把過場屬性收成明確的顏色清單，焦點環因此**一步到位**。
   （更下面那條 `.search input:focus-visible` 權重 (0,2,1)，仍然蓋得過這一條，順序正確。）*/
:focus-visible:focus-visible{
  outline:2px solid var(--focus);outline-offset:2px;
  transition-property:background-color,border-color,color,box-shadow,opacity;
}
/* 五處寫過 `outline:0` 的輸入框：那一行本身是對的（預設焦點框會被 --glow 蓋得很醜），
   錯在**沒有補回替代品**。這裡把焦點框加回去，權重跟原規則相同、靠「寫在後面」取勝。*/
.search input:focus-visible,.livepop input[type=text]:focus-visible,
.cgpop #cgSearch:focus-visible,.chip input:focus-visible{
  outline:2px solid var(--focus);outline-offset:2px;
}

/* ---- #6 prefers-reduced-motion 全站兜底 -----------------------------------------
   改之前 CSS 只有 2 條（`.rbar .pb`、`.m3-pulse`）接了這個查詢，
   也就是「使用者在系統裡關掉動效」對這個網站幾乎沒有作用。
   WCAG 2.3.3 要求互動觸發的動態效果要能關掉，標準技術就是這個查詢（W3C C39）。
   ⚠ **關掉動效不等於沒有回饋** —— 下面第二條把按下去的回饋換成「底色壓一階」，
     動的表達沒了，但「我按到了」這件事還在。這一點比關掉動畫本身更重要。*/
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;scroll-behavior:auto!important;
  }
  /* ⚠ 這一組**故意不用 `:where()`**：`:where()` 的權重是 0，蓋不過
     `.evbtn{background:var(--panel)}` 這種 (0,1,0) 的既有規則，
     於是「關掉動效之後按下去完全沒反應」—— 第一版就是這樣紅的。
     寫成一般選擇器，權重變成 (0,2,0)，底色才真的壓得下去。*/
  button:active,.tab:active,.evbtn:active,.pill:active,.btn:active,.chip:active,
  .iconbtn:active,.howbtn:active,.segchip:active,.dlv-go:active,
  .seg>button:active,.seg button:active,.nbsw>button:active,.nbsw>a:active,
  .chainsw button:active,.chainchips button:active,.relsw button:active,
  .facets button:active,.morepop button:active,a.card:active,.tile:active{
    transform:none;background-color:var(--panel-3);
  }
  .tabnav:active{transform:translateY(-50%);background-color:var(--panel-3)}
  .tile:hover{transform:none}
}
/* ==================================================================================
   ★ 2026-09-24 手機第二版：資訊架構（量測與依據 `docs/mobile_ia.md`）
   Andy：「幫我將手機頁面整理得更直觀順暢，功能分清楚，可以多點頁面沒關係，
   但不要太多文字…不要發生我看圖 結果用資訊我要一直滑下去來回看…以圖為主」。

   ⚠⚠ 下面每一條都包在 `@media (max-width:820px)` 裡，而且 app.js 那一側**也有守門**
   （`.mpager`／`.mmore`／`.mfold` 是真的插進 DOM 的節點，桌機一律不插、插過的要移除）。
   兩邊都守是刻意的：只靠 CSS 藏起來，桌機的 DOM 仍然多了節點，
   `+`／`:first-child`／`:last-child` 這類選擇器就會被它影響 —— 那就是桌機被降級。
   ================================================================================== */
@media (max-width:820px){
  /* ---- ① 分段導覽：一屏回答一件事 ----------------------------------------
     釘在頂欄下面，所以「我現在在這一頁的哪一段」永遠看得到（他說的「知道自己在哪」）。
     觸控高度 44px（G5 的導覽標準）；放不下就左右捲，而且用 `.hsc` 那套淡出提示。*/
  /* ⚠ 分段列**刻意不釘住**。量過：頂欄 58 ＋ 主軸 66 ＋ 分段列 58 ＋ 個股的價格列 65
     ＝ 247px 全部釘在上面，844 的畫面扣掉底部兩列分頁 102 之後只剩 495px 給圖 ——
     釘住的東西越多，「一屏看完一件事」就越難成立。
     主軸（`.mspine`）值得釘（它是動線本身），分段列捲回去看一下就好。*/
  .mpager{display:flex;gap:6px;margin:0 0 10px;padding:7px 2px;
    overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
    background:var(--bg);box-shadow:0 6px 10px -8px rgba(0,0,0,.55)}
  /* ⚠ 2026-09-24 修：`miaPager` 用 `bar.hidden = subs.length < 2` 想把
     「只有一段」的分頁列收掉（程式註解寫得很清楚：「一顆孤單的晶片是雜訊」），
     但 `display:flex` 的權重 (0,1,0) 蓋過瀏覽器內建的 `[hidden]{display:none}` (0,0,0)，
     **那一行完全沒有生效** —— 實測第③步「今日候選」與第④步「今日事件」
     各留下一顆孤單的晶片，連同 margin 共 68px（844 可視區的 8%）。
     這一條把它補回來；`!important` 不需要，同權重下後寫的贏。 */
  .mpager[hidden]{display:none}
  .mpager::-webkit-scrollbar{display:none}
  .mpager>button{flex:0 0 auto;min-height:44px;padding:6px 14px;border-radius:999px;
    border:1px solid var(--line);background:var(--panel-2);color:var(--ink-2);
    font-size:13px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
  .mpager>button.on{background:var(--panel-3);color:var(--ink);
    border-color:var(--focus);box-shadow:inset 0 0 0 1px var(--focus)}
  /* ---- ①-b 主軸動線（`.mspine`）：四個問題排成一條線 ------------------------
     ★ CEO 2026-09-24 拍板：首頁＝一條決策動線
     （① 錢往哪跑 → ② 貴不貴 → ③ 何時進場 → ④ 別進的理由），
     那正是 `CLAUDE.md` 第一段寫的 M1→M2→M3→M4，只是以前沒有在介面上講出來。
     視覺上要有**順序感**（序號 ＋ 一句話 ＋ 最下面的「下一步」），
     不是四個並排的分頁讓人自己猜。*/
  /* `top:58px` ＝ 頂欄的高度（`.topbar` 是 sticky、58px 高、z-index 40）。
     寫 0 的話它會釘到頂欄**底下**去，捲動時整條看不見（第一版就是這樣）。*/
  .mspine{position:sticky;top:58px;z-index:31;display:flex;gap:6px;margin:0 0 6px;padding:8px 2px 6px;
    overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
    background:var(--bg);box-shadow:0 8px 12px -10px rgba(0,0,0,.6)}
  .mspine::-webkit-scrollbar{display:none}
  .mspine>button{flex:0 0 auto;min-height:52px;max-width:200px;padding:6px 13px;border-radius:12px;
    border:1px solid var(--line);background:var(--panel-2);color:var(--ink-2);
    text-align:left;display:flex;flex-direction:column;gap:1px;line-height:1.25}
  .mspine>button b{font-size:13.5px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
  .mspine>button em{font-size:12px;font-style:normal;color:var(--ink-3);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;max-width:176px}
  .mspine>button.on{background:var(--panel-3);color:var(--ink);border-color:var(--focus);
    box-shadow:inset 0 0 0 1px var(--focus)}
  .mspine>button.on em{color:var(--ink-2)}
  /* ★ 2026-09-24 修：主軸列量到 scrollWidth 818 / clientWidth 362 ——**藏了 456px**，
     而且它也是釘住的，所以跟 `#skPx` 走同一條路（不透明蓋片，不是 `.hsc` 的 mask）。
     `right:-2px` 抵銷它自己的 2px 左右內距。*/
  .mspine::after{content:'';flex:0 0 30px;width:30px;margin-left:-30px;
    position:sticky;right:-2px;align-self:stretch;pointer-events:none;
    background:linear-gradient(90deg,rgba(0,0,0,0),var(--bg))}
  .mspine.sk-end::after{background:none}
  /* 「下一步」：動線的方向感靠它 —— 看完一屏就有一顆鈕帶去下一屏，不必回頭找分頁 */
  .mnext{display:block;width:100%;min-height:48px;margin:14px 0 4px;padding:12px;
    border:1px solid var(--focus);border-radius:12px;background:var(--panel-2);
    color:var(--ink);font-size:14px;font-weight:700;letter-spacing:.02em}
  .mnext:active{background:var(--panel-3)}

  /* ---- ①-c 第①步的關鍵數字：四個象限各有幾個族群 ---------------------------
     判準是「圖的關鍵數字要緊鄰圖」。總覽那張小時鐘（compact）**刻意不畫象限卡**
     （桌機的設計，不准動），所以手機在標題下面補這一列。
     顏色吃 `--c`（由 JS 帶入 `STAGE[k].color`），紅漲綠跌那一套沒有動。*/
  .rotkpi{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 2px}
  .rotkpi .rk{display:inline-flex;align-items:center;gap:5px;min-height:32px;padding:4px 10px;
    border-radius:999px;border:1px solid color-mix(in srgb,var(--c) 45%,transparent);
    background:color-mix(in srgb,var(--c) 12%,transparent);
    color:var(--ink-2);font-size:12.5px;font-weight:600}
  .rotkpi .rk b{color:var(--c);font-size:15px;font-variant-numeric:tabular-nums}

  /* ---- ④ 今日事件卡（手機專屬，資料與抽屜同一份）---------------------------- */
  .ovev{display:flex;flex-direction:column;gap:2px;margin-top:6px}
  .ovev .ev{display:block;padding:9px 2px;border-bottom:1px solid var(--line);min-height:44px}
  .ovev .ev .t{display:block;color:var(--ink);font-size:13.5px;line-height:1.45}
  .ovev .ev .m{display:flex;gap:8px;flex-wrap:wrap;margin-top:3px;color:var(--ink-3);font-size:12px}
  .ovev .ev .m .cat{color:var(--ink-2)}

  /* 被分段導覽收起來的那幾塊。`!important` 是必要的：這些元素裡有好幾個
     自己帶 inline style 或 `display:grid` 的既有規則，權重壓不過就會藏不掉。*/
  .mp-off{display:none!important}
  /* 分段導覽把版面切短了，頁尾的留白可以還一點回來給內容 */
  body.miaon main{padding-bottom:132px}

  /* ---- ② 長清單限筆：「看全部」---------------------------------------------
     量到：今日候選 30 張卡 4335px、季節性最強族群 4586px、交付清單 43 筆 10754px。
     收起來不是刪掉 —— 鈕就在清單的最後一列，按一下全部回來。*/
  .mm-off{display:none!important}
  .mmore{display:block;width:100%;min-height:44px;margin:8px 0 2px;padding:10px 12px;
    border:1px dashed var(--line);border-radius:10px;background:var(--panel-2);
    color:var(--ink-2);font-size:13px;font-weight:600}
  .mmore:active{background:var(--panel-3)}

  /* ---- ③ 長說明收合 -------------------------------------------------------- */
  .mf-off{display:none!important}
  .mfold{display:block;width:100%;min-height:40px;margin:8px 0 2px;padding:8px 12px;text-align:left;
    border:1px solid var(--line);border-radius:10px;background:var(--panel-2);
    color:var(--ink-2);font-size:12.5px;font-weight:600}
  .mfold:active{background:var(--panel-3)}

  /* ---- ④ 個股頁：圖與它的數字同屏 -------------------------------------------
     量到（改版前）：K 線圖頂在 1024px、現價在 127～596px —— 相隔 1087px。
     現價那一列釘在分段導覽下面，捲到圖的任何一段都還看得到價格與技術分。
     `top:58px` ＝ 頂欄的高度（個股頁沒有主軸列，分段列也不釘住，所以這一層直接接在頂欄下面）。*/
  /* ⚠ `min-width:0` 不是裝飾：`#skPx` 改成 nowrap 之後它的 min-content 寬度變成 782px，
     而 flex 子項預設 `min-width:auto` **不准縮到 min-content 以下** ——
     於是 `#skIdent` 被撐到 758px，整頁的版面寬度變成 803px，
     手機瀏覽器會把整頁**縮小到 48%** 來塞進 390px（實測 innerWidth 803／initial-scale 失效）。
     那等於全站字在手機上只剩一半大，比原本的問題更嚴重。這兩行就是擋住它的。*/
  /* K 線的高度：桌機是 `clamp(600px, 100vh - 250px, 1280px)`（`.kwide` 再高一點）。
     390×844 的手機上那等於 640px，加上釘住的價格列 65px、分段列 58px、工具列 40px，
     整張圖放不進一屏（量到 782 > 742）。手機收成「一屏剛好放得下」的高度：
     100vh 扣掉 頂欄72 ＋ 分段列58 ＋ 價格列65 ＋ 工具列46 ＋ 底部分頁102 ≈ 343。
     ⚠ 只在 ≤820px 生效，桌機那兩條一個字都沒動。*/
  body.miaon #lwc{height:clamp(380px,calc(100vh - 343px),620px)}
  /* 週期統計的月份熱力圖：2026-09-24 起圖高由列數決定（每列固定高），外框 `#seasonHeatBox` 負責捲動，
     手機把外框上限壓到「一屏放得下框＋圖例＋結論」—— 看圖不用再滑下去找結論。*/
  body.miaon #seasonHeatBox{max-height:clamp(300px,calc(100vh - 420px),460px)}
  body.miaon #skHead{flex-wrap:wrap}
  body.miaon #skIdent{min-width:0;max-width:100%;flex:1 1 100%}
  /* ⚠ 滿版的做法：`.card` 的內距是 16px 18px，所以要往左右各吃回 18px，
     而且**不能留 `max-width:100%`** —— 那會把寬度壓回內容寬，負邊距就撐不出去，
     右邊會露出一條沒有底色的縫，底下捲過去的工具列會從那條縫透出來（實測到的）。*/
  body.miaon #skPx{position:sticky;top:58px;z-index:20;margin:0 -18px;width:calc(100% + 36px);padding:8px 18px;
    background:var(--bg);border-bottom:1px solid var(--line);
    box-shadow:0 6px 10px -9px rgba(0,0,0,.6);
    /* 排成**一列**（原本四個 pill 換行成三列、整塊 180px 高）。
       釘住的東西越高，留給圖的畫布就越少 —— 一列 ~48px 是「價格永遠看得到」的成本上限。
       本益比／同業分位／營收 YoY 沒有不見，往右滑就在。
       ⚠ 2026-09-24 更正：這裡原本寫「`.hsc` 會補淡出」—— **沒有，`#skPx` 不在 `SWIPE_SEL` 裡**，
         而且它也**不能**用 `.hsc`（那是 mask，會讓釘住的列半透明）。淡出改由下面的
         `#skPx::after` 不透明蓋片畫。*/
    flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  body.miaon #skPx::-webkit-scrollbar{display:none}
  body.miaon #skPx>*{flex:0 0 auto}
  /* ★ 2026-09-24 修：這一列**藏了 442px 的內容**（scrollWidth 802 / clientWidth 360，
     「本益比」「同業分位」「營收 YoY」「分 K 完整」四顆整個在畫面外，第四顆起跑點 359.4
     被卡片右緣 376 切一半），而畫面上原本**沒有任何記號**說得出「這一列可以滑」。
     ⚠ 不可以用 `.hsc` 那套淡出 —— 它是 CSS `mask`，會連背景一起淡掉，
       而這一列是釘住的：實測捲到工具列滑進它底下（重疊 25.6px）時，
       右緣**真的看得到底下的「5 秒」晶片透出來**。釘住的東西必須不透明。
     所以改用一塊**不透明的蓋片**：`::after` 在 flex 容器裡是一個 flex 子項，
     用 `position:sticky;right:-18px` 黏在捲動視窗的右緣（-18 是抵銷這一列自己的右內距），
     顏色從透明收到 `var(--bg)`（＝這一列自己的底色）。
     看起來跟淡出一樣，但它是**蓋在內容上**，不是讓內容透出來。
     `margin-left:-36px` 讓它不增加可捲寬度；`pointer-events:none` 讓它不擋點擊。*/
  body.miaon #skPx::after{content:'';flex:0 0 36px;width:36px;margin-left:-36px;
    position:sticky;right:-18px;align-self:stretch;pointer-events:none;
    background:linear-gradient(90deg,rgba(0,0,0,0),var(--bg))}
  /* 捲到最右邊就不要再淡（「已經到底了還在淡」是假提示）—— 由 app.js 掛 `.sk-end`。*/
  body.miaon #skPx.sk-end::after{background:none}
  /* 工具列（週期／指標／設定 共 11 顆）改成**一列左右滑**，高度從 404px 收成一列。
     全部留著、一顆都沒少，只是排成一條可以滑的帶子（`.hsc` 會補淡出與「左右滑」提示）。*/
  body.miaon #skTools{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
    gap:6px;padding-bottom:4px}
  body.miaon #skTools::-webkit-scrollbar{display:none}
  body.miaon #skTools>*{flex:0 0 auto}
  body.miaon #skTools .sp{display:none}                 /* 「把剩下的空間吃掉」的彈簧在可捲的列裡沒有意義 */

  /* ---- ⑤（撤回）產業地圖的長條圖＋圓餅圖曾經改成左右滑 -----------------------
     做出來之後被既有驗收擋下：`_uitest.py` 的「新-產業與個股」有一條
     **W3-8「[390px] 兩張卡片真的上下堆疊（不是硬擠成兩欄）」**——
     那是上一批依 Andy 的要求訂下來的，左右滑會讓它變成「兩欄」而變紅。
     既有的拍板優先於我這一版的偏好，所以整段撤回；`.gpgrid` 在手機維持單欄堆疊。
     代價：產業地圖頁在 390px 仍有 1358px（圓餅圖要捲 1025px 才看得到）——
     寫進「刻意留到下一版」，要改得先問過他。*/

  /* ---- ⑤-b K 線圖例：一個數字不准被切成兩半 -----------------------------------
     390px 實測：`#legendOv` 的兩行邏輯內容折成 5 行、佔掉 501px 高的 K 線圖 101.8px（20.3%），
     而且**折在項目中間** —— 量到「MA60」留在第一行、「2,400.83」被推到第二行
     （那個 span 的邊界框是 244.3×33.8，橫跨兩行）。讀者看到的是一個被拆開的數字。
     `inline-block` 讓每一個 `<span>` 成為不可分割的一塊，要折就整塊折下去。
     ⚠ 只在 `body.miaon`（≤640px 的真手機）生效，桌機那條路徑一個字都沒動。
     ⚠ 這只解決「折在項目中間」；「圖例佔掉圖的五分之一」是另一件事，
       要動到 industry.js 的圖例內容，寫進 docs/mobile_ia.md 的待辦。*/
  body.miaon #lwc .legend-ov span{display:inline-block}

  /* ---- ⑥ 左右滑的位置指示：第幾張／共幾張 ------------------------------------
     Andy 點名的：「左右滑的卡片要有位置指示，不然不知道還有沒有」。
     由 app.js 的 paintSwipe 寫進 `.swipetip` 的 data-pos。*/
  .swipetip[data-pos]::after{content:' → 第 ' attr(data-pos) ' 張 / 共 ' attr(data-of) ' 張';opacity:.85}
}

/* ==================================================================================
   ★ 2026-09-24 設計系統 v2 第 1／2 批（規格：docs/design_system_v2.md §2.1、⑤）
   Andy：「我希望跟他們一樣規格，並且他們方塊的間隔也調整的不錯…將UI大改，需要美化他」。
   每一個數字都是從他給的三張參考截圖量的（規格書 ① 有出處與座標），不是憑感覺。

   範圍：**只有桌機（≥821px）**。手機在 2026-09-23／24 剛做完兩版專屬改版（手機一屏、底部分頁），
   那一套的內距、字級、按鈕高度是另外量過、另外驗過的（驗收段「手機」「手機一屏」），
   這一批不去動它 —— 參考截圖三張都是桌機，拿桌機的尺寸去套手機沒有依據。
   放在樣式表**最後面**，是為了蓋得過前面散在各處的同名規則。
   ================================================================================== */
@media (min-width:821px){
  :root{ --gap-card:24px; }                         /* 卡片之間 16 → 24（101 圖 x=600 直掃，兩條邊線之間 24px） */
  /* ---- 第 1 批：卡片、格線、頁面外距 ---- */
  main{padding:24px 24px 80px}                      /* 20/22 → 24/24 */
  .card{background:var(--panel);                    /* 漸層 → 平塗（101 圖卡片 σ＝0） */
    border-radius:var(--r-lg);                      /* 12 → 24（101 圖擬合 21.9） */
    padding:var(--s5h);                             /* 16/18 → 20（101 圖 卡片邊 x=18 → 熱力圖 x=38） */
    box-shadow:var(--card-sh)}                      /* 深色只留內高光、淺色無陰影 */
  .card.tight{padding:var(--s5);border-radius:var(--r-md)}   /* 12/14 → 16；KPI 小卡是「中型容器」，圓角 16 不是 24 */
  .grid{gap:var(--gap-card)}
  /* 中型容器 16、小元件 10（規格 §2.1 四階圓角：一律 12 的結果是分不出哪個是容器、哪個是按鈕）*/
  .tile,.dlv,.hpanel,.gpcard,.howtxt{border-radius:var(--r-md)}
  .search input,.sugg{border-radius:var(--r-sm)}
  /* ---- 第 2 批：字級（17／16／14／13／12，比原本 20／16.5／15.5／12.5 整體小一號，但行高拉到 1.7）---- */
  body{font-size:var(--fs-body);line-height:var(--lh-body)}         /* 15.5/1.6 → 14/1.7 */
  h2{font-size:var(--fs-h2)}                                          /* 20 → 18 */
  h3{font-size:var(--fs-h3)}                                          /* 16.5 → 16 */
  .card h3 small,h3 small{font-size:var(--fs-sm);line-height:20px}    /* 12.5 → 13 */
  .card .sub{font-size:var(--fs-sm);line-height:20px}                 /* 13/20.8 → 13/20 */
  /* ---- 第 2 批：按鈕一律膠囊（參考站的主按鈕、下拉、日期、圖例全部量到圓角＝半高）---- */
  .btn{border-radius:var(--r-pill);font-size:var(--fs-sm);font-weight:600;
    min-height:36px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
  .btn.small{font-size:var(--fs-min);min-height:28px;padding:0 12px}   /* 工具列 28（參考站 26，我們守觸控下限）*/
  .howbtn{font-size:var(--fs-sm);font-weight:600;min-height:28px;padding:0 12px;
    display:inline-flex;align-items:center}
  .chainchips button{font-size:var(--fs-sm)}
  .evbtn,.tab,.verbadge,.livestate{border-radius:var(--r-pill)}
  .livestate.bad{border-radius:var(--r-pill)}
}

/* ==================================================================================
   ★ 2026-09-24 設計系統 v2 第 4 批：熱力圖的圖例、標題列控制項（規格 §3.1-6／-8）
   這一段**不分寬度**：圖例與控制項是熱力圖本身的一部分，手機一樣要讀得出「這格是哪一級」。
   ================================================================================== */
/* 圖例：圖的右下、圖底往下 16px；左邊標題 12px、右邊一條膠囊，7 格等寬、格間 0。 */
.hmlegend{display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:8px 10px;margin-top:var(--s5)}
.hmlegend .hmttl{font-size:12px;color:var(--ink-3);white-space:nowrap}
.hmlegend .hmbar{display:inline-flex;border-radius:var(--r-pill);overflow:hidden;border:1px solid var(--line);flex:none}
.hmlegend .hmcell{min-width:44px;height:24px;display:inline-flex;align-items:center;justify-content:center;
  padding:0 6px;border:0;margin:0;font:600 12px/1 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color:#fff;cursor:pointer;background:var(--c);font-variant-numeric:tabular-nums;white-space:nowrap;
  transition:opacity var(--dur-fast) var(--ease),box-shadow var(--dur-fast) var(--ease)}
.hmlegend .hmcell.na{color:var(--ink)}
.hmlegend .hmcell.dk{color:var(--hm-ink-dark)}   /* 暖金／湖水藍最亮的兩格配深字 */
/* 點一格＝只亮這一級：其他格退到 35%（圖上的方塊退到 25%），被選的那格內框一圈白線 */
.hmlegend.focus .hmcell{opacity:.35}
.hmlegend.focus .hmcell.on{opacity:1;box-shadow:inset 0 0 0 2px rgba(255,255,255,.9)}
.hmlegend .hmhint{font-size:12px;color:var(--ink-3);white-space:nowrap}
/* 窄於 560px：每格縮到 36、字不縮；再擠就換行（綠三格＋0 ／ 紅三格），**不准縮字** */
@media (max-width:560px){
  .hmlegend{justify-content:flex-start}
  .hmlegend .hmcell{min-width:36px;padding:0 4px}
  .hmlegend .hmbar{flex-wrap:wrap;border-radius:12px}
}
/* 「滾輪放大」徽章：三張熱力圖改成左下角。原本在右上角，是因為那裡以前有一條沒有字的根節點小標（22px 空白）；
   v2 把那條空白拿掉之後，右上角正好是最右邊那條產業鏈的小標（量到會蓋住「傳產與…」）。
   左下角是第一條鏈最大那一塊的左下 —— 方塊標籤一律置中，那個角落不會有字。*/
#heatWrap>.zbadge,#indTreeWrap>.zbadge,#themeMapWrap>.zbadge{top:auto;right:auto;bottom:8px;left:8px}
.zwrap>.zbadge{font-size:12px}   /* 11 → 12（字級下限） */
/* 觸控裝置沒有滾輪（wheelZoom 也沒做雙指縮放），「滾輪放大」是一句用不到的提示；
   而手機上熱力圖的左下角常是一塊小方塊的標籤（390px 量到蓋住「面板產業 +6.1%」）。只在觸控裝置收起來。*/
@media (hover:none){ #heatWrap>.zbadge,#indTreeWrap>.zbadge,#themeMapWrap>.zbadge{display:none} }
/* 桌機：三張熱力圖的徽章平常不顯示，滑鼠移進圖裡（或已經放大）才出現。
   2026-09-24 截積木外觀時量到：左下角仍會蓋住小方塊的名字（總覽「半導體・其他」）——
   方塊排法每天不同，找不到永遠空著的角落，所以改成「不用的時候不佔位」。 */
#heatWrap>.zbadge,#indTreeWrap>.zbadge,#themeMapWrap>.zbadge{opacity:0}
#heatWrap:hover>.zbadge,#indTreeWrap:hover>.zbadge,#themeMapWrap:hover>.zbadge,
#heatWrap.zoomed>.zbadge,#indTreeWrap.zoomed>.zbadge,#themeMapWrap.zoomed>.zbadge{opacity:1}
/* 卡片標題列右側的控制項：下拉與日期膠囊（只顯示、不能改）。高 28、膠囊。 */
.hmctl{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:var(--r-pill);
  border:1px solid var(--line-2);background:var(--panel-3);color:var(--ink-2);font-size:12px;white-space:nowrap}
.hmctl select{appearance:none;-webkit-appearance:none;border:0;background:transparent;color:var(--ink);
  font:inherit;font-weight:600;padding:0 14px 0 0;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);
  background-position:calc(100% - 6px) 55%,calc(100% - 2px) 55%;background-size:4px 4px;background-repeat:no-repeat}
.hmctl select:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.hmctl.date{font-family:var(--mono);color:var(--ink-3)}
.hmctl.date svg{flex:none}

/* ==================================================================================
   ★ 2026-09-24 設計系統 v2 第 5 批：輪動時鐘（規格 docs/design_system_v2.md §3.2）
   ================================================================================== */
/* 象限卡的「本週新進」：`領先 9 +2`，+2 是 12px --ink-3（最近 5 個交易日換進這一段的族群數） */
.rotquads .rq i.nw{font-style:normal;font-weight:400;font-size:12px;font-family:var(--mono);color:var(--ink-3)}
.rotquads .rq.on i.nw{color:var(--ink-2)}
/* 軌跡「焦點｜全部」：勾選框旁邊一組小 seg；軌跡關掉時整組淡掉（按鈕 disabled） */
.rot-tmode button:disabled{opacity:.45;cursor:not-allowed}
/* 高度壓到跟旁邊的勾選框同一行（21px）：像素比對量到用一般 .seg.tiny（約 30px 高）會把整張卡往下推 8px */
.rottools .rot-tmode{padding:1px;border-radius:var(--r-pill);vertical-align:middle}
.rottools .rot-tmode button{padding:0 9px;font-size:12px;line-height:17px;border-radius:var(--r-pill)}
/* 編號模式（時鐘容器 < 560px）的名字清單：依象限分四組，每格「編號 名字」，點一下＝在圖上只亮它。
   字 12～13px、編號是 18px 圓（跟圖上的編號同一個數字），焦點族群的名字粗體。*/
.rotnums{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.rotnums .rnh{font-size:12px;color:var(--ink-3)}
.rotnums .rnh small{font-size:12px}
.rotnums .rnq{display:flex;align-items:flex-start;gap:8px;padding:6px 8px;border-radius:var(--r-sm,10px);
  background:color-mix(in srgb,var(--c) 7%,var(--panel));border:1px solid color-mix(in srgb,var(--c) 28%,transparent)}
.rotnums .rnq>b{flex:none;font-size:13px;color:var(--c);line-height:24px;min-width:2.2em}
.rotnums .rnl{display:flex;flex-wrap:wrap;gap:4px 10px;min-width:0}
.rotnums .rni{appearance:none;border:0;background:none;padding:2px 4px;margin:0;font:inherit;font-size:13px;
  color:var(--ink-2);display:inline-flex;align-items:center;gap:5px;cursor:pointer;border-radius:6px;min-height:24px;
  text-align:left;max-width:100%}
.rotnums .rni.f{color:var(--ink);font-weight:700}
.rotnums .rni i{font-style:normal;flex:none;min-width:18px;height:18px;border-radius:9px;padding:0 4px;
  display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;font-family:var(--mono);
  background:color-mix(in srgb,var(--c) 22%,var(--panel));color:var(--ink)}
.rotnums .rni:hover{background:var(--row-hover)}
.rotnums .rni.on{background:color-mix(in srgb,var(--c) 18%,var(--panel));box-shadow:inset 0 0 0 1px var(--c)}
.rotnums .rni:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
/* 放大視窗那一份掛在 #zoomTools 裡：限制高度，不要把時鐘擠掉 */
#zoomTools .rotnums{max-height:30vh;overflow:auto}
@media (prefers-reduced-motion:reduce){ .rotnums .rni{transition:none} }


/* ★ 2026-09-24 晚：版號在標題下面（取代原本「YYYY-MM-DD 盤後」那行；資料日期與資料狀態在它的滑鼠提示裡）。 */
#asof{display:flex;align-items:center;gap:6px;white-space:nowrap}
#asof .verline{font-family:var(--mono);font-size:12px;color:var(--ink-3);letter-spacing:.02em}
#asof .freshbtn{font:600 12px/1 "Noto Sans TC",system-ui,sans-serif;color:var(--amber);background:none;border:1px solid var(--line-2);
  border-radius:var(--r-pill);padding:2px 8px;cursor:pointer}
#asof .freshbtn:hover{color:var(--ink);border-color:var(--amber)}
.livebox[hidden]{display:none!important}
@media (max-width:820px){
  #asof .freshbtn{font-size:0;padding:2px 6px} #asof .freshbtn::before{content:"↻";font-size:13px}
  #asof .verline{font-size:12px}
}

/* 既有 bug：.btn 的 display 蓋過 hidden，「← 回到族群」平常就露出來（2026-09-24 說明精簡時順手發現） */
#gpBack[hidden]{display:none!important}
select option{background:var(--panel-2);color:var(--ink)}  /* 2026-09-24：下拉選項白底白字看不到 */

/* ==================================================================================
   ★ 2026-09-24 總覽改版（Andy 八條＋大盤三張圖四條，桌機 >820px）
   放在整份樣式的最後面，才蓋得過前面設計系統 v2 那幾批對 .howbtn／.kpi／.m3-* 的設定。
   手機（≤820px）另有人做：這裡凡是會改版面的規則都包在 min-width:821px 裡，
   不包的只有「顏色／字色」這種兩邊都該一樣的東西。
   ================================================================================== */

/* ---- 標題旁的「?」：一顆 22px 圓鈕，點了跳出說明（#howPop），點背景（#howBack）關 ---- */
.howbtn.pop{min-height:0;width:22px;height:22px;padding:0;border-radius:50%;font-size:12.5px;font-weight:700;
  display:inline-flex;align-items:center;justify-content:center;vertical-align:2px;margin-left:6px;line-height:1}
h3 .howbtn.pop{font-family:inherit}
.m3-bar .howbtn.pop{margin-left:0}
#howBack{position:fixed;inset:0;z-index:180;background:rgba(4,8,18,.46);backdrop-filter:blur(1.5px)}
:root[data-theme="light"] #howBack{background:rgba(30,28,24,.28)}
#howBack[hidden],#howPop[hidden]{display:none}
#howPop{position:fixed;z-index:181;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(520px,calc(100vw - 32px));max-height:min(72vh,640px);overflow:auto;
  background:var(--panel);border:1px solid var(--line-2);border-radius:14px;padding:14px 16px 12px;
  box-shadow:0 18px 50px rgba(0,0,0,.45)}
#howPop .hp-h{font-size:15px;margin-bottom:6px;color:var(--ink)}
#howPop .howtxt{margin:0;border-left-width:3px}

/* ---- ① KPI 橫條（≤64px）---- */
@media (min-width:821px){
  #hero.ovstrip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;padding:0;
    background:var(--card,var(--panel));border:1px solid var(--line);border-radius:14px;overflow:hidden;
    margin-bottom:var(--gap-card);max-height:64px}
  #hero.ovstrip .kpi{display:flex;flex-direction:column;justify-content:center;gap:1px;
    padding:8px 16px;min-height:0;height:58px;box-sizing:border-box;border:0;border-radius:0;background:none;box-shadow:none}
  #hero.ovstrip .kpi+.kpi{border-left:1px solid var(--line)}
  #hero.ovstrip .kpi.clickable:hover{background:color-mix(in srgb,var(--cyan) 7%,transparent)}
}
#hero.ovstrip .kpi .l{font-size:12px;line-height:16px;letter-spacing:.04em;color:var(--ink-3);display:flex;align-items:center;gap:6px;flex:none}
#hero.ovstrip .kpi .l .more{float:none;margin-left:auto;font-size:14px;opacity:.75}
#hero.ovstrip .kpi .vv{display:flex;align-items:baseline;gap:8px;white-space:nowrap;overflow:hidden;flex:none;line-height:28px;height:28px}
#hero.ovstrip .kpi .v{font-size:22px;line-height:1.15}
#hero.ovstrip .kpi .d{font-size:12.5px;color:var(--ink-2);font-family:var(--mono)}

/* ---- ①' 2026-09-26：KPI 橫條搬進「大盤三張圖」的工具列（Andy：「將我把這內容放進來，並且排版一下」）----
   #hero 節點本身被 market3.js 的 placeKpi() 搬進 #m3Kpis（手機 ≤640 維持原位，所以這裡不必包 media）。
   · 高度跟工具列同一級：每格兩行（名稱 12px／數字 16px），整條 42px；原本頂端那條 64px 就沒了。
   · 放在「?」右邊那段空白：#m3Kpis 吃掉工具列剩下的寬度（flex:1），4 格等寬、細線隔開。
   · 剩下的寬度不到 680px（1024、800 都是）就整條換到工具列第二行、吃滿整列 —— 不擠、不溢出；
     連整列都不到 600px（641～660 那一小段）才收成兩兩一組。
   · 選擇器前面掛 #m3Frame：權重 (2,x,0) 才蓋得過上面 #hero.ovstrip 那組 (1,x,0) 與 @container 的 #hero 欄數。*/
.m3-bar .m3-kpis{flex:1 1 680px;min-width:0;display:flex;container:m3kpi/inline-size}
.m3-kpis[hidden]{display:none}
#m3Frame #hero.ovstrip{flex:1 1 auto;min-width:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;padding:0;margin:0;
  max-height:none;background:color-mix(in srgb,var(--panel-3) 55%,transparent);border:1px solid var(--line);border-radius:10px;overflow:hidden}
#m3Frame #hero.ovstrip .kpi{display:flex;flex-direction:column;justify-content:center;gap:0;height:42px;min-height:0;
  padding:3px 12px;box-sizing:border-box;border:0;border-radius:0;background:none;box-shadow:none;min-width:0}
#m3Frame #hero.ovstrip .kpi+.kpi{border-left:1px solid var(--line)}
#m3Frame #hero.ovstrip .kpi.clickable:hover{background:color-mix(in srgb,var(--cyan) 8%,transparent)}
#m3Frame #hero.ovstrip .kpi .l{font-size:12px;line-height:15px;letter-spacing:.03em}
#m3Frame #hero.ovstrip .kpi .l .more{font-size:13px;line-height:15px}
#m3Frame #hero.ovstrip .kpi .vv{line-height:21px;height:21px;gap:6px}
#m3Frame #hero.ovstrip .kpi .v{font-size:16px;line-height:21px}
#m3Frame #hero.ovstrip .kpi .d{font-size:12px}
@container m3kpi (max-width:599.98px){
  #m3Frame #hero.ovstrip{grid-template-columns:repeat(2,minmax(0,1fr))}
  #m3Frame #hero.ovstrip .kpi:nth-child(3){border-left:0}
  #m3Frame #hero.ovstrip .kpi:nth-child(n+3){border-top:1px solid var(--line)}
}

/* ---- 大盤三張圖：一個大方框、三格用細線隔開、工具列在框內左上 ---- */
#m3{margin-bottom:0}
.m3-frame{padding:10px 0 6px}
.m3-frame .m3-bar{padding:0 14px;margin-bottom:4px;gap:8px}
.m3-frame .m3-bar .seg button{padding:4px 12px;font-size:13px}
.m3-card{min-width:0}
.m3-card>.m3-h{align-items:center;gap:6px}
.m3-card>.m3-h h3{font-size:15px;margin:0}
.m3-card>.m3-h .m3-big{margin-left:auto}
.m3-sess{padding:1px 8px;border-radius:999px;font-size:12px;border:1px solid var(--line-2);color:var(--ink-2);background:var(--panel-3)}
.m3-sess[data-s="night"]{color:var(--violet,#b69cff);border-color:color-mix(in srgb,var(--violet,#b69cff) 45%,transparent)}
.m3-nums{flex-direction:row;align-items:baseline;flex-wrap:wrap;gap:4px 10px;margin:2px 0 4px;min-height:0;cursor:help}
.m3-nums .m3-px{font-size:24px}
.m3-nums .m3-chg{font-size:13.5px}
.m3-nums .m3-tag{margin-left:0;flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 三格一樣高：數字列不准折行（1024 時加權的數字最長，標籤折下去整格就比別人高一行）*/
.m3-nums{flex-wrap:nowrap;overflow:hidden}
.m3-nums .m3-px,.m3-nums .m3-chg{flex:none;white-space:nowrap}
.m3-card [id^='m3c-'][data-fallback]::before{display:none}
.m3-fb{height:18px;line-height:18px;font-size:12px;color:var(--amber);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
@media (min-width:821px){
  .m3-grid{gap:0}
  .m3-card{padding:4px 12px 0;border-left:1px solid var(--line)}
  .m3-card:first-child{border-left:0}
  .m3-grid.big .m3-card{border-left:0}
  .m3-chart{height:232px}
}
@media (min-width:821px){
  /* Andy：「電腦版維持三張」—— 以前 1100 以下會變成三張直排（整頁多出 700px），
     合進一個框之後 821～1100 也維持三欄並排（1024 時每格約 320px，數字與 K 線都放得下）。*/
  #m3Frame .m3-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  #m3Frame .m3-grid.big{grid-template-columns:1fr}
}
/* K 線的游標看板（mini KChart 沒有 OHLC 看板，market3.js 的 kTip 自己畫）*/
.m3-ktip{position:absolute;left:4px;top:4px;z-index:6;pointer-events:none;display:flex;flex-direction:column;gap:1px;min-width:120px;  /* 2026-09-25 Andy：一個資訊一行 */ 
  max-width:calc(100% - 70px);padding:4px 8px;border-radius:8px;font-size:12px;line-height:1.5;color:var(--ink-2);
  background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line-2);font-family:var(--mono)}
.m3-ktip[hidden]{display:none}
.m3-ktip b{color:var(--ink);font-weight:600;margin-right:2px}
.m3-ktip i{font-style:normal;color:var(--ink)}
.m3-ktip i.up{color:var(--rise)} .m3-ktip i.down{color:var(--fall)}
/* 800px 按「展開」：左右滑的那一格要吃滿整列，不然卡片變高、內容擠在 88% 裡、右邊留一條漸層（審查 R1）*/
@media (max-width:820px){
  .m3-grid.big>*{flex:0 0 100%}
  .m3-grid.big{-webkit-mask-image:none;mask-image:none}
  .m3-grid.big .m3-chart{height:clamp(320px,60vh,560px)}
}

/* ---- ③ 左欄：資金熱力圖（撐滿）＋熱門題材熱力圖（固定高）上下疊 ---- */
.ovcol{display:flex;flex-direction:column;gap:var(--gap-card);min-width:0}
@media (min-width:1101px){
  .ovcol>#ovHeatCard{flex:1 1 auto;min-height:0}
}
#ovThemeCard .rotdd .ddpanel{min-width:240px}
/* 資金熱力圖的產業鏈下拉（2026-09-26）：標題與下拉同一組，間距跟熱門題材那一列一樣是 8px；
   #heatCtl 是 span，要當 flex 容器，下拉才不會吃到行內基線、比標題低半格 */
#ovHeatCard .heathead,#ovThemeCard .heathead{gap:8px;min-width:0}
#heatCtl,#ovThemeCtl{display:inline-flex;min-width:0}
#ovThemeCard .rotdd .ddpanel .ddopt em{margin-left:auto}
#ovTheme{height:300px}
.ovmain h3,.ovlow h3{display:flex;align-items:center}
#udSum{font-size:12.5px}
#streakSub{font-size:12.5px}

/* ---- 法人卡「滾輪放大」徽章：淺色主題原本是深底配灰字、再疊在淺底上 → 灰底灰字看不見（審查 R1）---- */
:root[data-theme="light"] .zwrap>.zbadge{background:rgba(255,255,255,.92);color:var(--ink-2);border-color:var(--line-2)}
:root[data-theme="light"] .zwrap:hover>.zbadge{color:var(--cyan)}

/* ==================================================================================
   ★ 2026-09-25 收尾批（claude/wrapup-1）
   ================================================================================== */
/* ---- 個股 K 線右上角「還原」小標：K 線是除權息還原價、報價是原始價，滑過說明 ----
   掛在 .chartwrap 上的絕對定位：不參與 flex 排版（畫線工具列、圖本體位置一格都不動）。
   right 讓開價格軸（約 60px），top 讓開最上面那一行 OHLC 讀數的高度就好 —— 它在左邊，不會撞。*/
.chartwrap{position:relative}
.adjtag{position:absolute;top:6px;right:72px;z-index:6;font-size:11.5px;font-weight:700;line-height:1;
  padding:4px 7px;border-radius:6px;cursor:help;color:var(--amber);letter-spacing:.06em;
  background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid color-mix(in srgb,var(--amber) 55%,transparent)}
.adjtag:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.adjtag .adjtip{display:none;position:absolute;top:calc(100% + 6px);right:0;width:max-content;max-width:300px;
  padding:9px 11px;border-radius:9px;background:var(--panel);border:1px solid var(--line-2);color:var(--ink-2);
  font-size:12.5px;font-weight:400;line-height:1.55;letter-spacing:0;white-space:normal;text-align:left;
  box-shadow:0 10px 30px rgba(0,0,0,.35)}
.adjtag .adjtip b{color:var(--ink);font-weight:700}
.adjtag .adjtip>span{display:block;margin-top:4px}
.adjtag .adjtip .adjn{color:var(--ink-3);font-size:12px}
.adjtag:hover .adjtip,.adjtag:focus .adjtip,.adjtag.open .adjtip{display:block}
:root[data-theme="light"] .adjtag .adjtip{box-shadow:0 10px 26px rgba(30,28,24,.16)}
/* ---- 足跡輪盤放大視窗的象限卡（審查 R2 #35）：只顯示計數，不接點擊 ——
   點了會展開的象限面板長在卡片上、被放大遮罩蓋住，點了看起來沒反應；要展開請關掉放大在卡片上點。*/
#zoomBody .rotquads .rq{pointer-events:none;cursor:default}
/* ==================================================================================
   ★ 手機版 v3（規格 docs/mobile_v3_spec.md；原型 docs/mobile_v3_proto/proto.css）
   ⚠⚠ 全部包在 `@media (max-width:640px)`，而且掛在 `body.m3on`（mobile3.js 只在 ≤640px 掛）底下 ——
     桌機一個像素都不准變（Andy 2026-09-23：「除了桌面不可以遷就手機」）。
     641～820px（桌機縮半邊）照舊吃第一、二版的規則（兩列分頁等），這裡一條都不碰。
   放在樣式表最後面：同權重下後寫的贏，才蓋得掉前面 ≤820px 那幾批。
   ================================================================================== */
@media (max-width:640px){
  /* ---- B 頂欄 52px：logo＋站名＋搜尋鈕＋「⋯」；版號收進底部「更多」 ---- */
  body.m3on .topbar{height:52px}
  /* 版號那一行收進「更多」；「有新資料 ↻」那顆（#freshBtn）照樣會出現在站名底下，不准藏 */
  body.m3on #asof .verline{display:none}
  body.m3on .topbar .search{display:none}
  body.m3on .msearchbtn{display:inline-grid;place-items:center;margin-left:auto;width:44px;height:44px;flex:none;
    border:1px solid var(--line-2);border-radius:12px;background:var(--panel);color:var(--ink-2);font-size:18px;padding:0}
  body.m3on .morebtn{margin-left:0;min-height:44px}
  body.m3on .topbar.msearch .search{display:flex;align-items:center;gap:6px;position:absolute;left:8px;right:8px;top:4px;height:44px;z-index:5}
  body.m3on .topbar.msearch .search input{flex:1 1 auto;width:auto;height:44px;font-size:16px}
  body.m3on .msearchx{flex:none;min-height:44px;padding:0 12px;border:1px solid var(--line-2);border-radius:10px;
    background:var(--panel);color:var(--ink-2);font-size:14px}
  body.m3on .topbar.msearch .sugg{top:48px}
  /* 頂欄變 52 之後，所有「釘在頂欄底下」的東西一起往上挪 6px */
  body.m3on .mspine{top:52px}
  body.m3on #skPx{top:52px}
  body.m3on aside{top:52px}

  /* ---- B 底部導覽：一列五顆 58px（現行兩列七顆 102px） ---- */
  body.m3on .tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;
    padding:0 0 env(safe-area-inset-bottom);height:calc(58px + env(safe-area-inset-bottom))}
  body.m3on .tab[data-view=market],body.m3on .tab[data-view=season],body.m3on .tab[data-view=delivery]{display:none}
  body.m3on .tab,body.m3on .mtabmore{min-height:44px;height:58px;padding:6px 2px 4px;margin:0;border:0;border-radius:0;
    background:none;box-shadow:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    font-size:12px;line-height:1.2;color:var(--ink-3);font-weight:600;flex:none}
  body.m3on .tab::before,body.m3on .mtabmore::before{font-size:18px;line-height:1;font-weight:400}
  body.m3on .tab[data-view=overview]::before{content:'◎'}
  body.m3on .tab[data-view=flow]::before{content:'⇄'}
  body.m3on .tab[data-view=industry]::before{content:'▦'}
  body.m3on .tab[data-view=heatmap]::before{content:'▤'}
  body.m3on .mtabmore::before{content:'≡'}
  /* 「產業地圖」在手機寫成「產業」（一列五顆放不下四個字＋圖示）：字不改，只縮寫顯示 */
  body.m3on .tab[data-view=industry]{font-size:0}
  body.m3on .tab[data-view=industry]::after{content:'產業';font-size:12px}
  body.m3on .tab.on,body.m3on .mtabmore.on{color:var(--cyan);background:none;box-shadow:none}
  body.m3on .tab.on::before,body.m3on .mtabmore.on::before{text-shadow:0 0 12px color-mix(in srgb,var(--cyan) 60%,transparent)}
  body.m3on main{padding-bottom:calc(58px + 24px + env(safe-area-inset-bottom))}
  body.m3on.miaon main{padding-bottom:calc(58px + 24px + env(safe-area-inset-bottom))}

  /* ---- B 步驟列：四格一列（上面 ①②③④、下面名字），每格 44px ---- */
  body.m3on .mspine{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;overflow:visible;padding:6px 0 6px}
  body.m3on .mspine::after{display:none}
  body.m3on .mspine>button{min-height:44px;max-width:none;padding:3px 2px;border-radius:12px;align-items:center;justify-content:center;
    text-align:center;gap:0;line-height:1.2}
  body.m3on .mspine>button em{font-size:12px;font-family:var(--mono);color:var(--ink-3);max-width:none}
  body.m3on .mspine>button b{font-size:13px;white-space:nowrap}
  body.m3on .mspine>button.on{border-color:var(--cyan);background:color-mix(in srgb,var(--cyan) 14%,var(--panel));box-shadow:var(--glow)}
  body.m3on .mspine>button.on em{color:var(--cyan)}
  /* 分段列：36px 膠囊，選中的反白 */
  body.m3on .mpager{padding:2px 1px;margin:0 0 8px;box-shadow:none;gap:6px}
  body.m3on .mpager>button{min-height:36px;padding:0 14px;font-size:13px;background:transparent;border-color:var(--line-2)}
  body.m3on .mpager>button.on{background:var(--ink);color:var(--bg);border-color:var(--ink);box-shadow:none;font-weight:700}
  body.m3on .mnext{min-height:44px;margin-top:10px}

  /* ---- A「?」：32px 圓，觸控範圍用 ::after 撐到 44px（不佔版面）---- */
  body.m3on .howbtn.pop{width:32px;height:32px;min-height:32px;font-size:15px;position:relative;margin-left:8px;vertical-align:middle}
  body.m3on .howbtn.pop::after{content:'';position:absolute;inset:-6px;border-radius:50%}
  /* 氣泡：貼在「?」的正下方（下面放不下翻到上面，由 mobile3.js placeHowPop 算 top）；左右各留 12px */
  body.m3on #howPop.mbubble{left:12px;right:12px;width:auto;transform:none;max-height:56vh;border-radius:14px;
    padding:12px 14px;font-size:13.5px;line-height:1.65;background:var(--panel-2);box-shadow:0 18px 40px -12px rgba(0,0,0,.8)}
  body.m3on #howBack{background:rgba(3,6,14,.28);backdrop-filter:none}
  :root[data-theme="light"] body.m3on #howBack{background:rgba(30,28,24,.16)}

  /* ---- A 底部抽屜 ---- */
  .msheetback{position:fixed;inset:0;z-index:190;background:rgba(3,6,14,.40)}
  :root[data-theme="light"] .msheetback{background:rgba(30,28,24,.22)}
  .msheetback[hidden],.msheet[hidden]{display:none}
  .msheet{position:fixed;z-index:191;left:0;right:0;bottom:0;max-height:46vh;overflow:auto;overscroll-behavior:contain;
    background:var(--panel-2);border-top:1px solid var(--line-2);border-radius:18px 18px 0 0;
    padding:4px 14px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -18px 40px -12px rgba(0,0,0,.7);
    color:var(--ink);font-size:14px}
  .msheet[data-kind=more]{max-height:72vh}
  .msheet .mgrab{width:40px;height:4px;border-radius:2px;background:var(--line-2);margin:6px auto 8px}
  .msheet .mshhead{display:flex;align-items:center;gap:8px;min-height:32px}
  .msheet .mshhead b{font-size:16px}
  .msheet .mshhead .no{font:700 13px var(--mono);min-width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
    background:var(--c,var(--cyan));color:#07101f;flex:none}
  .msheet .mshbody{margin-top:8px;font-size:13.5px;line-height:1.7;color:var(--ink-2)}
  .msheet .mshbody i{display:block;font-style:normal}
  .msheet .mgrp{margin:10px 2px 2px;font-size:12px;color:var(--ink-3)}
  .msheet .mrow{display:flex;align-items:center;flex-wrap:wrap;gap:2px 10px;width:100%;min-height:48px;padding:8px 10px;border:0;
    border-radius:10px;background:transparent;color:var(--ink);font-size:15px;text-align:left}
  .msheet .mrow small{flex-basis:100%;margin-left:32px;font-size:12px;color:var(--ink-3)}
  .msheet .mrow .ic{width:22px;text-align:center;color:var(--cyan);font-size:16px}
  .msheet .mrow.on{background:color-mix(in srgb,var(--cyan) 10%,transparent);color:var(--cyan)}
  .msheet .mrow .n{margin-left:auto;background:var(--violet);color:var(--ontop);font-size:12px;padding:1px 8px;border-radius:9px;font-family:var(--mono)}
  .msheet .mver{margin:10px 10px 0;font-size:12px;color:var(--ink-3)}
  .msheet .mchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .msheet .mchips a,.msheet .mchips span,.msheet .mchips button{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);
    display:inline-flex;align-items:center;font-size:13px;color:var(--ink);text-decoration:none;background:var(--panel)}
  .msheet .mchips span.none{color:var(--ink-3);border-style:dashed}
  .msheet .mchips .on{border-color:var(--cyan);color:var(--cyan)}
  .msheet .mshnav{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;margin-top:12px;gap:8px}
  .msheet .mshnav button{height:44px;border-radius:12px;border:1px solid var(--line-2);background:var(--panel);color:var(--ink);font-size:18px}
  .msheet .mshnav span{text-align:center;font:600 13px var(--mono);color:var(--ink-3)}
}
/* 桌機（>640）：手機才插的節點就算殘留也一律不顯示（mobile3.js 回桌機會拆掉；這一條是第二道保險）*/
@media (min-width:641px){ .mtabmore,.msearchbtn,.msearchx,.msheet,.msheetback{display:none!important} }
/* ---- 手機 v3 C：總覽＋資金流向（mobile3.js 的 C 段）---- */
@media (max-width:640px){
  /* 手機專屬內容插在既有卡片裡（.m3keep），卡片（.m3host）其餘的桌機內容先藏；「完整版 ›」（.mfull）叫回來 */
  body.m3on .m3host:not(.mfull)>:not(.m3keep):not(.m3keep-h){display:none!important}
  body.m3on .m3host.mfull>.m3keep:not(.mfullbtn){display:none!important}
  body.m3on #ovRotKpi{display:none!important}
  body.m3on :not(.m3host)>.mfullbtn{display:none}
  body.m3on .m3host>.m3keep>.msub:only-child{display:none}
  body.m3on .adjtag{font-size:12px}
  /* 法人卡：標題列裡的「最近 N 天／截止」拉桿與期間副標屬於桌機那張圖，手機版只看最近一個有值的交易日（在「完整版」裡照舊可調）*/
  body.m3on #flowInstCard:not(.mfull)>.m3keep-h .row,body.m3on #flowInstCard:not(.mfull) #instSub{display:none}

<!-- ★ 2026-09-24：Service Worker 註冊（PWA 第一步，docs/mobile_release_plan.md）。
     用途是「加到主畫面」與離線仍打得開，**不是**為了快取資料。
     ⚠⚠ sw.js 對 `data/**` 與任何 .json **完全不介入** —— 那是每天會變的數字，
        快取住會讓人看到昨天的價格，**那比沒有 PWA 還糟**。這條有驗收釘著。
     版本化靠 `?v=<tw:build 版號>`：每次部署版號會變 → 瀏覽器視為新的 SW →
     activate 時刪掉舊快取。**不需要有人記得手動改常數。**
     只在 http(s) 下註冊：本機用 file:// 打開時不跑，免得在開發時留下一個幽靈快取。 -->
<script>
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  addEventListener('load', function () {
    var m = document.querySelector('meta[name="tw:build"]');
    var v = (m && m.content) || 'dev';
    navigator.serviceWorker.register('sw.js?v=' + encodeURIComponent(v))
      .catch(function (e) { console.warn('Service Worker 註冊失敗：', e); });
  });
}
</script>
