  --dg-card-glow-r:6px;                 /* 被點的那一張卡的光暈半徑（科技）；閱讀模式改用 --dg-card-sh */
  --dg-no-r:9.5px;                      /* 編號圓點半徑（要放得下兩位數的 12px 數字） */
  --dg-no-ink:#061018;                  /* 編號圓點裡的數字：印在元件色上，深色才讀得到 */
  --dg-lead-w:1;                        /* 引線粗細（科技 1px；閱讀 .9px 深灰，見 --dg-lead） */

  --dg-node-r:2.8px;                    /* 引線端點的小圓半徑 */
  --dg-node-glow:3px;                   /* 端點光暈半徑（科技）；閱讀 0 ＝ 只留實心圓點 */
  --dg-flow-dot:#ffffff;                /* 流程列上跑的那顆光點 */
  --dg-flow-w:2;                        /* 流動虛線的粗細 */
  --dg-hero-sh:none;                    /* 主角零件的環境光落影（閱讀才有） */

     青綠 175° vs 跌的綠 #2ee59d 156°；橘 28° vs 漲的紅 #ff4d6d 349°。

  --dg-b0-f:rgba(62,224,255,.10); --dg-b0-s:rgba(62,224,255,.28); --dg-b0-ink:#9fe6ff;
  --dg-b1-f:rgba(139,123,255,.10); --dg-b1-s:rgba(139,123,255,.3); --dg-b1-ink:#c3baff;
  --dg-b2-f:rgba(255,180,84,.10); --dg-b2-s:rgba(255,180,84,.28); --dg-b2-ink:#ffd79a;
  --dg-slot-f:rgba(18,26,46,.55); --dg-slot-f2:rgba(18,26,46,.7); --dg-slot-s:rgba(120,150,210,.12);
  --dg-drop:rgba(0,0,0,.34);
  --dg-rib-bg:rgba(120,150,210,.13); --dg-rib-flow:rgba(62,224,255,.5);
  --dg-chip-f:rgba(15,23,43,.9); --dg-chip-ink:#d6e2ff;
  --dg-num-mix:#0b1226;
  /* ================ 各張剖析圖的材質色（2026-09-21 深夜：從九個檔的 scoped <style> 收進來）================

     `.dgair` / `.dg.psu` / `.dgpcb` / `.dgpn` / `.dgsw`）。當時不准動 index.html，

     **這一次是同值搬家，值一個都沒改**，唯一的例外是兩組撞名的（見下面的 ⚠）。
     收進來的理由很實際：配色切換必須碰得到材質色，而 scoped 的變數在 `:root[data-dgpal]`

     ⚠ 撞名兩組（同名不同值，本來靠 scope 各自為政，收進來一定要先改名）：
       `--dg-core`  pcb_rigid 的硬板芯板 #33452f  ←→ ic_substrate 的載板 core #3f4a30

  /* 散熱兩張（液冷 .dgcool ／ 氣冷 .dgair）—— 兩檔的這幾個值本來就一模一樣，合成一份 */

  --dg-fws:#8b96ad;  --dg-fws-2:#5d6679;     /* 一次側（設施側）：第三種顏色 */
  --dg-vap:#24324a;                          /* 兩相元件的蒸氣腔（真空腔，不是液體） */
  --dg-wick:#8f6a45;                         /* 毛細結構（燒結銅粉／溝槽／網目） */
  --dg-steel:#9aa6b4; --dg-steel-2:#6b7683;  /* 不鏽鋼：快接頭、管件、軸、滾珠 */
  --dg-tim:#b6a3b2;                          /* 導熱介面材料 TIM */
  --dg-die:#39476a;                          /* 矽裸晶 */
  --dg-void:#0d1424;                         /* 切面上的空隙／腔體背景 */
  --dg-frame:#1a2540;                        /* 框與盒的底 */
  --dg-cu-lit:#c88a4e; --dg-cu-dim:#9c6432;  /* 銅的亮面／暗面（等角上蓋的漸層兩端） */
  --dg-cu-cut:#8a5525;                       /* 銅在剖面上的斜線（表示這裡是實心的） */
  --dg-alu:#a3b2c4;  --dg-alu-2:#75849a; --dg-alu-3:#5e6b7e;   /* 鋁：鰭片、扇框、扇框厚度那一側 */
  --dg-mag:#5b4a7a;                          /* 磁鐵（轉子） */
  --dg-oil:#c9a24a;                          /* 潤滑油／壓力油膜 */
  --dg-hub-lit:#7c8ba1; --dg-hub-dim:#44506a;/* 輪轂的亮面／暗面（球面漸層兩端） */
  /* 硬板 .dgpcb */
  --dg-pcb-core:#33452f;      /* 芯板 core 的介電：已固化，暗綠（⚠ 原名 --dg-core，撞名改的） */
  --dg-pp:#8a8355;            /* 半固化片 prepreg：玻纖布佔比高，比 core 淺、偏卡其 */
  --dg-yarn:#cfc8a4;          /* 玻纖紗束（⚠ 原名 --dg-glass，撞名改的） */
  --dg-au:#e3b75a;            /* 表面處理最外層的金 */
  --dg-edge:#0e1526;          /* 剖面描邊與鑽孔孔洞（比 --illus 更暗，孔才像孔） */
  /* ABF 載板 .dgabf */
  --dg-core:#3f4a30; --dg-core-2:#2f3824;   /* core：玻纖布補強樹脂（偏暗墨綠） */
  --dg-weave:#7d8c5c;                       /* core 的玻纖織紋（整張圖只有 core 有） */
  --dg-abf:#c3b9a4; --dg-abf-2:#9d947f;     /* ABF 增層膜：均勻、無織紋的樹脂膜 */
  --dg-sr:#2a6e86; --dg-sr-2:#1f5365;       /* 防焊層 */
  --dg-plug:#6b5f49;                        /* core 貫孔內的填塞物 */
  --dg-pcb-2:#12301f;                       /* 主機板的頂面（暗一階） */
  --dg-glass:#8fb6c9;                       /* 玻璃核心（路線圖第三格） */
  /* 先進封裝 .dg（ai_adv_packaging 本來就寫成 var(--dg-x, fallback)，這裡把 fallback 扶正） */
  --dg-si:#33488a; --dg-si-2:#1d2b57;       /* 矽：晶粒、矽中介層、矽橋 */
  --dg-organic:#8a6636; --dg-organic-2:#6a4c27; /* 有機介電：RDL 中介層、ABF 增層膜（琥珀） */
  --dg-emc:#2f3039;                         /* 模封 EMC（含填料的深色樹脂） */
  --dg-uf:#c08f4e;                          /* 底部填充（半透明琥珀） */
  --dg-metal-2:#7d868f;                     /* 補強環（比上蓋暗一階的金屬灰） */
  --dg-sub-2:#10291d;                       /* 載板的暗階（核心層） */
  /* 面板 .dgpn */
  --dg-pn-bezel:#3c4552;  --dg-pn-bezel-d:#293039;   /* 背板／膠框（深灰金屬＋黑塑框） */
  --dg-pn-refl:#eef1f7;   --dg-pn-refl-d:#c2c8d3;    /* 反射片（白霧面） */
  --dg-pn-lgp:#bcdaec;    --dg-pn-lgp-d:#8ab2cc;     /* 導光板（透明壓克力） */
  --dg-pn-led:#ffe2a0;    --dg-pn-led-d:#d7b969;     /* LED 燈條（暖白） */
  --dg-pn-diff:#e1e8f1;   --dg-pn-diff-d:#b4bdca;    /* 擴散片（半透明乳白） */
  --dg-pn-bef:#c7d6e5;    --dg-pn-bef-d:#9aaabd;     /* 稜鏡片／增亮膜 */
  --dg-pn-pol:#69738a;    --dg-pn-pol-d:#495162;     /* 偏光板（深灰半透） */
  --dg-pn-glass:#a9d2e6;  --dg-pn-glass-d:#76a5be;   /* 玻璃基板 */
  --dg-pn-tft:#9aa6b8;    --dg-pn-tft-d:#6f7b8e;     /* TFT 陣列層（金屬灰） */
  --dg-pn-lc:#3b4775;     --dg-pn-lc-d:#2a3356;      /* 液晶層（盒內） */
  --dg-pn-rod:#cfbdf2;                                /* 液晶短棒 */
  --dg-pn-cf:#262c3a;     --dg-pn-cf-d:#1a1f2a;      /* 彩色濾光片層底（黑色矩陣） */
  --dg-pn-bm:#11141b;                                 /* 黑色矩陣 */
  --dg-pn-r:#e2565f; --dg-pn-g:#45b46e; --dg-pn-b:#4c7ee0;   /* R／G／B 色阻 ★ 語意色，配色不准蓋 */
  --dg-pn-ic:#1e232d;     --dg-pn-ic-d:#141821;      /* 驅動 IC 黑方塊 */
  --dg-pn-cof:#c99a44;    --dg-pn-cof-d:#9a742f;     /* COF 軟板（聚醯亞胺琥珀色） */
  --dg-pn-pad:#d9b56b;                                /* 端子區的金屬墊 */
  --dg-pn-org:#9b86e0;                                /* OLED 有機發光層 */
  --dg-pn-line:rgba(255,255,255,.34);                 /* 表面紋理（稜線、偏光紋、格柵） */
  --dg-pn-line2:rgba(10,16,32,.42);                   /* 深色分層線 */
  /* 交換器／無線 .dgsw ★ 四個全是語意色（電／光／電源／接點），配色不准蓋 */
  --dg-sw-sig:var(--dg-sig);   /* 高速電訊號（差動對、SerDes 通道）—— 冷色＝電。別名：值就是 --dg-sig */
  --dg-sw-fiber:#f2c14e;   /* 光纖與光訊號 —— 暖黃，一眼跟「電」分得開 */
  --dg-sw-pwr:var(--dg-pwr);   /* 供電（PSU → VRM → ASIC）—— 橘，而且線一定畫得比訊號粗。別名：值就是 --dg-pwr */
  --dg-sw-gold:#d9a441;    /* 金手指／電接點 —— 比 --dg-cu 的銅更黃，不會跟銅層混 */
  /* 伺服器電源 .dg.psu —— 全部是既有 token 的 color-mix，所以配色一換它們自己會跟著換 */
  --dg-psu-ac:color-mix(in srgb,var(--dg-cu) 82%,var(--dg-cover));      /* 交流側 */
  --dg-psu-gold:color-mix(in srgb,var(--dg-cu) 54%,var(--dg-cover));    /* 鍍金接點 */
  --dg-psu-cu:var(--dg-cu);                                             /* 銅排（亮面） */
  --dg-psu-cu2:color-mix(in srgb,var(--dg-cu) 58%,var(--dg-el));        /* 銅排（暗面） */
  --dg-psu-box:color-mix(in srgb,var(--dg-ink) 7%,transparent);         /* 方塊底 */
  --dg-psu-box2:color-mix(in srgb,var(--dg-ink) 13%,transparent);       /* 方塊底（深一階） */
  --dg-psu-line:color-mix(in srgb,var(--dg-ink-3) 52%,transparent);     /* 一般外框線 */
  --dg-psu-off:color-mix(in srgb,var(--dg-mute) 52%,transparent);       /* 機房基礎設施（不在這條鏈上） */
  --dg-psu-die:color-mix(in srgb,var(--dg-el) 86%,var(--dg-ink-3));     /* 晶片本體 */
  /* 一般電子鏈三張新圖（2026-09-22）：傳動件 .dgmc ／ 鋁電容 .dgac ／ 保護元件 .dgcp。
     ★ 全部寫成既有 token 的 color-mix，所以**四個配色（科技／柔和／沉穩／休閒）一換
       它們自己會跟著換** —— 不必在下面四個 data-dgpal 區塊裡各覆寫一次。
       這是 PSU 那一組已經走過的做法（見上面那七行）。 */
  --dg-mc-ball:color-mix(in srgb,var(--dg-sn) 72%,var(--dg-steel));     /* 鋼珠（亮金屬球） */
  --dg-mc-case:color-mix(in srgb,var(--dg-el) 72%,var(--dg-frame));     /* 馬達／減速機／滑塊的外殼 */
  --dg-mc-flex:color-mix(in srgb,var(--dg-steel) 58%,var(--dg-cu));     /* 柔輪：薄壁，帶一點銅色好認 */
  --dg-mc-cam:color-mix(in srgb,var(--dg-steel-2) 72%,var(--dg-el));    /* 波產生器的橢圓凸輪 */
  --dg-mc-disc:color-mix(in srgb,var(--dg-steel) 64%,var(--dg-alu-3));  /* 擺線盤 */
  --dg-ac-foil:color-mix(in srgb,var(--dg-alu) 82%,var(--dg-sn));       /* 鋁箔基體（陽極／陰極共用） */
  --dg-ac-oxide:color-mix(in srgb,var(--dg-cover) 52%,var(--dg-accent-2d)); /* 陽極氧化膜（全圖最薄，所以對比要拉開才看得見） */
  --dg-ac-paper:color-mix(in srgb,var(--dg-cer) 68%,var(--dg-cu));      /* 電解紙（纖維、偏黃） */
  --dg-ac-elyte:color-mix(in srgb,var(--dg-si) 74%,var(--dg-void));     /* 電解液（半透明流體，要比氧化膜暗才分得開） */
  --dg-ac-poly:color-mix(in srgb,var(--dg-resin) 68%,var(--dg-el));     /* 導電高分子（實心固體） */
  --dg-ac-rubber:color-mix(in srgb,var(--dg-el) 74%,var(--dg-void));    /* 橡膠封口 */
  --dg-ac-sleeve:color-mix(in srgb,var(--dg-si) 60%,var(--dg-frame));   /* 外套膠膜 */
  --dg-cp-grain:color-mix(in srgb,var(--dg-cer) 80%,var(--dg-steel));   /* ZnO 晶粒 */
  --dg-cp-gb:color-mix(in srgb,var(--dg-accent-2d) 58%,var(--dg-cer-cut)); /* 晶界（一定要是線，不是色差） */
  --dg-cp-poly:color-mix(in srgb,var(--dg-cover) 68%,var(--dg-mute));   /* PPTC 高分子基體 */
  --dg-cp-carbon:color-mix(in srgb,var(--dg-void) 68%,var(--dg-el));    /* 導電碳黑 */
  --dg-cp-p:color-mix(in srgb,var(--dg-cu) 58%,var(--dg-die));          /* 半導體 P 區 */
  --dg-cp-n:color-mix(in srgb,var(--dg-die) 76%,var(--dg-steel));       /* 半導體 N 區 */
  --dg-cp-depl:color-mix(in srgb,var(--dg-cover) 70%,var(--dg-steel));  /* 空乏區（TVS 的識別特徵） */
  --ovl:rgba(10,16,32,.55);   /* K 線圖上那幾個浮在圖上的小標籤 */
  --ovl-sh:0 1px 2px #000;    /* 浮在圖上的文字陰影 */
}
/* ---------------- 明亮主題（Andy 2026-09-14）----------------
   只換變數，版面與元件一行都不用改。JS 畫的圖不吃 CSS 變數，
   所以 app.js 的 refreshPalette() 會在切換時把同一組色讀進圖表色票再重畫。 */
:root[data-theme="light"]{
  /* ★ 2026-09-24 設計系統 v2 第 3 批（docs/design_system_v2.md §2.2）：冷藍白 → 暖紙底、暖灰三階文字。
     Andy：「我希望跟他們一樣規格」—— 參考截圖量到的是「暖白紙底、卡片比頁底亮一階、無陰影、暖灰字」這個**結構**；
     色值不是抄對方的（對方 #EFEEEA／#24231F），是 Andy 自己在剖析圖閱讀模式拍板過的那組（--dg-bg／--dg-ink，2026-09-22）。
     改前 → 改後（括號＝對 --panel 白／對 --bg 的實測對比）：
       --bg      #f2f5fb → #F4F3EF（卡片對頁底 1.10:1，參考站 1.11）
       --bg-2    #e9edf7 → #EFEDE8（事件抽屜底；--fall／--flat 對它 4.65／4.52，跟舊值同級）
       --panel-2 #f7f9fd → #FAF9F6　--panel-3 #eef2fa → #F2F1EC
       --line    #dde4f1 → #E9E6DF（1.25）　--line-2 #c2cde1 → #D6D2C8（1.51）
       --ink     #0f1830 → #1F1D19（16.83／15.15）
       --ink-2   #3f4e6d → #3E3A33（11.30／10.18）
       --ink-3   #5b6884 → #5F5A51（6.85／6.16；對 --panel-3 6.05、對 --bg-2 5.85）
     主色 --cyan 與紅漲綠跌**一個都沒動**（對新 --bg：cyan 5.43、rise 5.27、fall 4.90、flat 4.76、lime 5.02）。*/
  --bg:#F4F3EF; --bg-2:#EFEDE8; --panel:#ffffff; --panel-2:#FAF9F6; --panel-3:#F2F1EC;
  --line:#E9E6DF; --line-2:#D6D2C8;
  --ink:#1F1D19; --ink-2:#3E3A33;
  /* ★ 2026-09-23 UI 精修 #2／#3：淺色主題七個色一起往下壓明度。
     為什麼：淺色主題底色是白與近白，舊值有七個對背景不到 4.5（最差的 --fall 只有 3.17），
     所以「切成明亮主題之後一堆字看不清楚」不是錯覺，是量得出來的。
     ⚠ 紅漲綠跌是台股慣例，這裡**只動明度、不動色相**（實測色相差 0.0～2.1°），
        --rise 仍然是紅（漲）、--fall 仍然是綠（跌），語意零改變。
     舊值 → 新值（括號內＝對 panel / panel-2 / panel-3 / bg 的實測對比）：
       --ink-3 #6a7896 → #5b6884（5.59 / 5.30 / 4.98 / 5.12）
       --cyan  #0b7fa6 → #0a6b8a（6.03 / 5.72 / 5.37 / 5.52）
       --amber #b06a00 → #8f5600（6.00 / 5.69 / 5.35 / 5.50）
       --lime  #4a8a15 → #3f7512（5.58 / 5.29 / 4.97 / 5.11）
       --rise  #dc2440 → #c81234（5.85 / 5.55 / 5.21 / 5.35）
       --fall  #0a9b6a → #07794f（5.44 / 5.17 / 4.85 / 4.99）
       --flat  #7a879f → #5f6c85（5.29 / 5.02 / 4.71 / 4.84）
     --violet 沒動（舊值本來就 5.88 / 5.24，已達標）。
     ⚠ app.js 的 PALETTE_LIGHT[0/2/3] 仍然是 #0b7fa6 / #b06a00 / #4a8a15 ——
        那是「分類色盤」的鎖定區（DECISIONS #48：動一個值就把全站板塊顏色洗牌），
        跟這裡的語意色是兩套東西，**刻意不同步**。 */
  --ink-3:#5F5A51;   /* v2 第 3 批：#5b6884（冷藍灰）→ 暖灰，見本段最上面的對比表 */
  --cyan:#0a6b8a; --violet:#5f4ddb; --amber:#8f5600; --lime:#3f7512;
  --rise:#c81234; --fall:#07794f; --flat:#5f6c85;
  --glow:0 0 0 1px rgba(11,127,166,.22), 0 4px 16px -8px rgba(11,127,166,.4);
  /* v2 第 3 批：陰影改暖色調（冷藍 15,24,48 → 暖褐 40,35,25）。桌機卡片走 --card-sh:none；
     這組只剩手機卡片與搜尋建議框在用（第 1 批的決定：手機的卡片結構不動）。 */
  --shadow:0 1px 0 rgba(255,255,255,.6) inset, 0 10px 24px -18px rgba(40,35,25,.30);
  --ontop:#ffffff; --chartbg:#ffffff;
  --topbar:rgba(255,255,255,.82); --topbar-m:rgba(255,255,255,.96);
  --ovl:rgba(255,255,255,.82); --ovl-sh:0 1px 2px rgba(255,255,255,.9);
  --grid:rgba(40,35,25,.07);     /* v2 第 3 批：格線、浮層陰影跟著暖化 */
  --drop:rgba(40,35,25,.18);
  /* v2 第 3 批：body 那兩團紫／青光暈在暖紙底上會發髒（紫＋暖白＝灰粉），淺色主題關掉。深色照舊。 */
  --body-1:transparent; --body-2:transparent;
  --focus:#0a5f7d;    /* 淺色的焦點環：對白底 7.13、對 --bg 6.53 */
  --row-hover:#F2F1EC;/* 對白底實測 1.13（舊 #eef2fa 1.12），跟深色那組同一個強度；v2 第 3 批暖化 */
  /* ---- 設計系統 v2（2026-09-24）淺色那一組 ----
     卡片：參考截圖量到「平塗、無陰影、只靠底色差分層」（σ＝0、外圍像素與頁底無差）。 */
  --card-sh:none;
  /* 熱力圖 7 格（淺色）白字對比：4.73／7.03／11.03／9.04／12.39／8.40／5.64。無資料格配深字（12.5:1）。 */
  --hm-n3:#068456; --hm-n2:#056642; --hm-n1:#084530; --hm-0:#424957;
  --hm-p1:#661522; --hm-p2:#99152D; --hm-p3:#CC1439; --hm-na:#E7E5E4;
  /* 提示框：白 86%（參考站是 70%，但 70% 疊在最深的方塊上次要字只剩 3.71:1；86% 才有 5.22） */
  --tip-bg:rgba(255,255,255,.97); --tip-line:transparent; --tip-sh:0 8px 24px -8px rgba(40,35,25,.25);
}
/* ================ 剖析圖的兩種模式（art-director 2026-09-22，Andy 拍板）================
   Andy 給了兩張參考圖：亮色系「閱讀」（暖白紙底、低飽和粉彩、深灰細引線、白色圓角卡片）
   與暗色系「科技」（深藍炭底、霓虹點綴、半透明 HUD 卡片、細引線＋發光小節點）。
   完整規格在 docs/diagram_specs/_STYLE.md；這裡是它的落地。

   掛在 `<html data-dgpal="tech|read">`，**2D 的 SVG 與 3D 的 three3d.js 讀的是同一份定義**
   （`K.css('--dg-cer')`／`palNum('--dg-sat')` 讀的就是這組變數）。
   預設跟著全站主題走：深色主題 → 科技、淺色主題 → 閱讀；`#dgPal` 那顆鈕可以手動切、切了會記住。
   ⚠ 這改掉了「剖析圖畫布恆為深底」的既有決策（DECISIONS #124／#230）：淺色主題下畫布是暖白。
     `--illus` 本身沒動（產業關聯圖 .chainmap 仍是深底，它有自己的一組對比校準）。

   2026-09-21 的柔和／沉穩／休閒三個配色**已移除**（Andy 2026-09-22 改口只要這兩套）。
   localStorage 裡留著舊值的人：industry.js 的 palPref() 會把它清掉、退回「跟主題走」——
   深色主題下就是科技（＝他們以前的預設），不會看到破圖。

   ★ tech ＝ **:root 的預設值，一個都不覆寫** —— 科技模式必須跟改動之前的畫面同一張。
   ★ 語意色的規矩改成：**色相不准動，明度可以依底色重算**。
     以前那條「任何配色下都不覆寫」是在四個配色全部深底時寫的；
     #ff4d6d 印在 #f4f3ef 上只有 3.0:1、#ff8fab 只有 2.0:1，「這是警告」在亮底上根本讀不出來。
     驗收改成量對比（_uitest 批次22）：語意色對底 ≥ 3、當文字用時 ≥ 4.5，而且色相跟科技的同一個 token 差 < 15°。
   ★ 紅漲綠跌不撞：閱讀的主色是霧青 #1d6f79（色相 186°），跌的綠是 #077a51（157°）、漲的紅 #cf1f3a（350°）。 */
:root[data-dgpal="read"]{
  /* ---- 底與三階文字 ---- */
  --dg-bg:#f4f3ef;                      /* 暖白紙底（Andy 給的 #F4F3EF）；淺色主題的面板是 #fff，畫布比面板暖一階才看得出是一張圖 */
  --dg-ink:#1f1d19; --dg-ink-2:#3e3a33; --dg-ink-3:#5f5a51;   /* 對 #f4f3ef：15.6／10.0／6.5:1 */
  --dg-mute:#726c64;                    /* 附註級圖形與「灰色剪影」的標籤（4.7:1；先進封裝那張拿它當標籤色） */
  --dg-psu-off:var(--dg-mute);          /* 伺服器電源「不在這條鏈上」的設施側：科技用 52% 透明的 mute，紙底上會淡到 1.7:1，這裡給實色 */
  --dg-accent-2d:#1d6f79;               /* 一張圖唯一的主色：霧青。對底 5.3:1 */
  --dg-glow:none; --dg-part-r:0px; --dg-card-glow-r:0px; --dg-node-glow:0px;   /* 閱讀＝完全不發光 */
  --dg-hair-w:1.4;                      /* 深灰細虛線在亮底上 1.4 就看得見（科技要 2） */
  /* 字級整組升一階（正文 13px 起）—— 只給**已改造成風格系統**的圖（svg 根掛 .rs）。
     沒改造的圖維持 12px：實測把 13px 套到全部 18 張，有 8 張同一行的字互相撞上（psu／abf／ai／wafer／hbm／air／liq／gis），
     那些版面是為 12px 排的，字級要升就得連版面一起改（逐張改造那一波的事）。*/
  /* ---- 卡片／引線／流動（共用元件吃的） ---- */
  --dg-card-f:rgba(255,255,255,.80); --dg-card-s:rgba(58,53,45,.22); --dg-card-r:10px;
  --dg-card-sh:drop-shadow(0 1px 2px rgba(40,35,25,.16));   /* 柔和的環境光遮蔽感 */
  --dg-card-blur:blur(10px);            /* HTML 卡片的磨砂玻璃：霧面白 */
  --dg-card-box-sh:0 1px 3px rgba(40,35,25,.14);
  --dg-no-ink:#1f1d19;                  /* 編號數字：閱讀模式的圓點是粉彩底＋色環，數字用深灰（白字印在壓深過的粉彩上只有 4.05:1） */
  --dg-lead:#6b665d; --dg-lead-w:.9; --dg-lead-sel-w:1.5;   /* 深灰細引線 */
  --dg-flow-dot:#1d6f79; --dg-flow-w:1.6;
  --dg-hero-sh:drop-shadow(0 6px 10px rgba(40,35,25,.18));
  --dg-frame-f:rgba(255,255,255,.55); --dg-frame-s:rgba(58,53,45,.18);
  --dg-step-f:rgba(255,255,255,.80);
  /* ---- 語意色：色相不動、明度壓到亮底讀得到（數字見 _STYLE.md 的對比表） ---- */
  --dg-err:#b3122a; --dg-warn:#a8304b;
  --dg-sig:#1b6a9c; --dg-pwr:#b4550e; --dg-cool:#0f7d74;
  --dg-cold:#2b73a8; --dg-cold-2:#1c4f75; --dg-hot:#c1531c; --dg-hot-2:#8a3a12;
  --dg-sw-fiber:#9a7300; --dg-sw-gold:#a87f2a;
  --dg-pn-r:#c9353f; --dg-pn-g:#2e8f52; --dg-pn-b:#3a67c4;
  --dg-ag-cool:#2b73a8; --dg-ag-cool-2:#c1531c;
  /* ---- 環節色降飽和：--c 往深暖灰混 42%，螢光組才不會在紙底上刺眼（淺色主題下另有一組，見下面） ---- */
  --dg-seg-k:58%; --dg-seg-mix:#4a463f;
  /* ---- 等角零件的三個面往哪裡混：頂面往亮、右面往中灰、左面往深灰 ＝ 粉彩但仍看得出立體 ---- */
  --dg-sh0:#6d685f; --dg-sh1:#e9e6df; --dg-sh2:#b9b4aa; --dg-sh3:#8f8a80;
  --dg-part-mix:#3d3934;                /* 零件描邊往深灰混：亮底上沒有描邊的色塊會糊成一片 */
  --dg-line-mix:#6b665d; --dg-iso-c:#6b86a8;
  --dg-grd:rgba(58,53,45,.10); --dg-axis:rgba(58,53,45,.28);
  --dg-chg-a:.10;
  /* ---- 材質族（低飽和粉彩；名字與科技那組一一對應，值全部為亮底重調） ----
     陶瓷＝暖米、金屬＝冷灰、銅＝赤陶、PCB＝鼠尾草綠、玻璃＝霧藍、塑膠＝暖灰、液體＝霧藍。 */
  --dg-cer:#d8cfb6; --dg-cer-2:#c6bca1; --dg-cer-cut:#bfb59c; --dg-cer-cut-2:#a89e85;
  --dg-cover:#e6dfcb; --dg-cover-2:#d6cdb6;
  --dg-cer-sh:#a89f8c; --dg-cer-sh-2:#8f8674; --dg-cer-cutb:#b3a992; --dg-cer-cutb-2:#9d9279;
  --dg-cover-b:#d2cab4; --dg-cover-b-2:#c1b8a2;
  --dg-el:#5b5852;                      /* 內電極：深暖灰，在陶瓷上一眼分得出 */
  --dg-sn:#cdd3d8; --dg-ni:#a2aab2;
  --dg-met-t:#c4cbd1; --dg-met-t-2:#a6aeb5; --dg-met-r:#a8b0b7; --dg-met-r-2:#868e96; --dg-met-l:#a3abb2; --dg-met-l-2:#7f878e;
  --dg-steel:#a9b3bd; --dg-steel-2:#7d8791; --dg-alu:#b5c0cc; --dg-alu-2:#8c98a6; --dg-alu-3:#717d8a;
  --dg-metal-2:#8f979f; --dg-hub-lit:#98a4b5; --dg-hub-dim:#6a7688;
  --dg-cu:#b5764a; --dg-cu-lit:#c98d5f; --dg-cu-dim:#9a5f34; --dg-cu-cut:#8a5525;
  --dg-au:#d1a24a; --dg-oil:#c19a3e; --dg-uf:#c99a5d;
  --dg-resin:#7d7568; --dg-emc:#5a5960; --dg-plug:#8a7d64; --dg-wick:#9a7550;
  --dg-pcb:#4f7a5c; --dg-pcb-2:#416a4e; --dg-sub-2:#416a4e; --dg-pcb-core:#5f7359; --dg-core:#66754f; --dg-core-2:#536242;
  --dg-pp:#a09a72; --dg-yarn:#c9c19c; --dg-weave:#8d9b6e; --dg-abf:#cfc6b1; --dg-abf-2:#aba28d;
  --dg-sr:#3f8aa3; --dg-sr-2:#2f6e84; --dg-glass:#9fc3d6;
  --dg-ag-pcb:#5b8468; --dg-ag-pcb-2:#4a7057; --dg-ag-ccl:#52785b; --dg-ag-ccl-2:#43654b;
  --dg-si:#6b7fb5; --dg-si-2:#4f62a0; --dg-die:#5f6c8f;
  --dg-organic:#a07a49; --dg-organic-2:#7f5f34;
  --dg-tim:#b59fb0; --dg-mag:#7a6a99;
  --dg-fws:#7f8a9c; --dg-fws-2:#5d6679; --dg-vap:#dfe4ea;
  --dg-void:#e8e5dd; --dg-frame:#e6e2d9; --dg-edge:#4a463f;
  /* 面板疊層那一組（--dg-pn-*）：反射片不能是純白（跟紙底同色就消失了） */
  --dg-pn-bezel:#6b6f76; --dg-pn-bezel-d:#555960; --dg-pn-refl:#e6e8ec; --dg-pn-refl-d:#c2c7d0;
  --dg-pn-lgp:#b7d3e4; --dg-pn-lgp-d:#8db0c8; --dg-pn-led:#f0cf74; --dg-pn-led-d:#c9aa4f;
  --dg-pn-diff:#dbe1e8; --dg-pn-diff-d:#adb7c3; --dg-pn-bef:#c3d1df; --dg-pn-bef-d:#97a7ba;
  --dg-pn-pol:#6e7789; --dg-pn-pol-d:#525a6b; --dg-pn-glass:#a7cfe2; --dg-pn-glass-d:#74a2ba;
  --dg-pn-tft:#98a4b6; --dg-pn-tft-d:#6d798c; --dg-pn-lc:#7581ae; --dg-pn-lc-d:#5a6592; --dg-pn-rod:#7d67c7;
  --dg-pn-cf:#4a5060; --dg-pn-cf-d:#383d4a; --dg-pn-bm:#2a2e38; --dg-pn-ic:#3a3f4a; --dg-pn-ic-d:#2b2f38;
  --dg-pn-cof:#b98c2c; --dg-pn-cof-d:#8f6a1f; --dg-pn-pad:#c8a44e; --dg-pn-org:#7d67c7;
  --dg-pn-line:rgba(58,53,45,.26); --dg-pn-line2:rgba(10,16,32,.36);
  /* ---- 題材圖（.dg3）的帶、站點、晶片、彩帶 ---- */
  --dg-band-f:rgba(255,255,255,.5); --dg-band-s:rgba(58,53,45,.18);
  --dg-b0-f:rgba(29,111,121,.08); --dg-b0-s:rgba(29,111,121,.3); --dg-b0-ink:#1d6f79;
  --dg-b1-f:rgba(95,77,219,.07); --dg-b1-s:rgba(95,77,219,.28); --dg-b1-ink:#4b3fb3;
  --dg-b2-f:rgba(176,106,0,.08); --dg-b2-s:rgba(176,106,0,.3); --dg-b2-ink:#8a5300;
  --dg-slot-f:rgba(255,255,255,.6); --dg-slot-f2:rgba(255,255,255,.82); --dg-slot-s:rgba(58,53,45,.15);
  --dg-drop:rgba(40,35,25,.18);
  --dg-rib-bg:rgba(58,53,45,.12); --dg-rib-flow:rgba(29,111,121,.55);
  --dg-chip-f:rgba(255,255,255,.85); --dg-chip-ink:#1f1d19;
  --dg-num-mix:#ffffff;

:root[data-dgpal="read"] .dg.rs{--dg-fs-ttl:19px;--dg-fs-hd:15px;--dg-fs-lbl:14px;--dg-fs-min:13px}
/* 環節色在另外兩種組合的混法（tech＋深色是原色，不寫）：
   淺色主題本來就換成壓深組的環節色（app.js refreshPalette），閱讀模式只要再降一點飽和；
   淺色主題硬切回科技（深底）時壓深組會消失，往白混回來。*/
:root[data-theme="light"][data-dgpal="read"]{--dg-seg-k:86%;--dg-seg-mix:#6b665d}
:root[data-theme="light"][data-dgpal="tech"]{--dg-seg-k:74%;--dg-seg-mix:#ffffff}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:
  radial-gradient(1200px 600px at 10% -10%, var(--body-1), transparent 60%),
  radial-gradient(900px 500px at 100% 0%, var(--body-2), transparent 55%),
  var(--bg);
  color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:15.5px;line-height:1.6;min-height:100vh;
  /* ★ 2026-09-23 UI 精修 #1：全站數字改等寬（tabular figures）。
     為什麼掛在 body 而不是逐個欄位掛：全站原本只有 2 處有 tabular-nums，
     而「數字」到處都是（KPI、漲跌幅、占比、表格、膠囊、圖說），逐個掛一定會漏。
     掛在最上面一層，繼承下去全部都吃得到；等寬字族（--mono）本來就等寬，掛了也沒差。
     效果：同一欄相鄰兩列的數字右緣對得齊（實測差值 0.00px，改之前會差好幾 px），
     而且盤中報價每秒跳動時位數不會左右抽動。
     這一項**不改字級也不改版面**，只是把每個阿拉伯數字的前進寬度統一。 */
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
a{color:var(--cyan);text-decoration:none}
button{font-family:inherit;color:inherit}
input,select{font-family:inherit}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.up{color:var(--rise)} .down{color:var(--fall)} .flat{color:var(--flat)} .muted{color:var(--ink-3)}
.cyan{color:var(--cyan)} .violet{color:var(--violet)} .amber{color:var(--amber)}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:.01em}
h2{font-size:20px} h3{font-size:16.5px} h4{font-size:14.5px;color:var(--ink-2)}
small{font-size:12.5px}
::-webkit-scrollbar{width:10px;height:10px} ::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

/* ---------------- 頂部列 ---------------- */
.topbar{position:sticky;top:0;z-index:40;backdrop-filter:blur(14px);background:var(--topbar);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 18px;height:58px}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;white-space:nowrap}
.brand .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--cyan),var(--violet));
  box-shadow:var(--glow);display:grid;place-items:center;font-family:var(--mono);font-weight:700;color:var(--ontop);font-size:13px}
.brand b{font-size:16px;letter-spacing:.02em}
.brand small{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--ink-3);line-height:1;margin-top:3px}
/* ★ 2026-09-23 UI 精修 #4：分頁列的包裝層。它唯一的工作是當左右箭頭的定位基準 ——
   `.tabs` 自己是捲動容器，絕對定位的東西掛在它裡面會跟著內容一起捲走。 */
.tabswrap{position:relative;flex:1;min-width:0;display:flex;align-items:center}
.tabs{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;padding:0 4px}
.tabs::-webkit-scrollbar{display:none}
/* 左右箭頭：純文字的 ‹ ›，**不引入任何圖示庫**（Andy 公司網路擋 CDN）。
   `tabindex=-1` 是刻意的 —— 八顆分頁在 DOM 裡本來就全部 Tab 得到（捲不捲得到不影響焦點），
   箭頭只是滑鼠使用者的捷徑，讓它們也吃掉兩次 Tab 反而是噪音。 */
.tabnav{display:none;position:absolute;top:50%;transform:translateY(-50%);z-index:3;
  width:24px;height:24px;place-items:center;padding:0;line-height:1;
  border:1px solid var(--line-2);border-radius:999px;background:var(--panel);color:var(--ink-2);
  font-size:15px;cursor:pointer;
  transition:background var(--dur-fast) var(--ease),border-color var(--dur-fast) var(--ease),color var(--dur-fast) var(--ease)}
.tabnav:hover{color:var(--ink);border-color:var(--cyan);background:var(--panel-2)}
.tabnav.l{left:-2px} .tabnav.r{right:-2px}
@media (min-width:821px){
  /* 只在真的捲得動的那一側才出現箭頭與遮罩 —— 捲到底了還留著箭頭是騙人的。
     class 由 app.js 的 `syncTabOverflow()` 掛（scroll／resize／換頁都會重算）。*/
  .tabswrap.ovf-l .tabnav.l,.tabswrap.ovf-r .tabnav.r{display:grid}
  /* 遮罩掛在捲動容器自己身上：mask 作用在 border box，不會跟著內容捲，
     所以淡出永遠停在邊緣（用 ::after 就會跟著捲，這是刻意不用它的理由）。*/
  .tabswrap.ovf-r .tabs{-webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 34px),transparent 100%);
    mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 34px),transparent 100%)}
  .tabswrap.ovf-l .tabs{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 34px,#000 100%);
    mask-image:linear-gradient(90deg,transparent 0,#000 34px,#000 100%)}
  .tabswrap.ovf-l.ovf-r .tabs{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 34px,#000 calc(100% - 34px),transparent 100%);
    mask-image:linear-gradient(90deg,transparent 0,#000 34px,#000 calc(100% - 34px),transparent 100%)}
}
/* 手機：整個包裝層從版面消失，`.tabs` 回到 `.topbar` 的直接子項，
   底部固定兩列四顆那一套（下面 @media max-width:820px）因此一個字都不用改。*/
@media (max-width:820px){ .tabswrap{display:contents} .tabnav{display:none!important} }
.tab{padding:8px 14px;border:0;background:transparent;color:var(--ink-2);font-size:15px;border-radius:9px;

.search::before{content:"⌕";position:absolute;left:12px;top:6px;color:var(--ink-3);font-size:16px}

.sugg{position:absolute;top:42px;left:auto;right:0;width:max(100%,340px);max-width:calc(100vw - 16px);

.sugg .code{font-family:var(--mono);font-weight:600;color:var(--cyan);flex:none}
.sugg .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.sugg .g{margin-left:auto;font-size:12px;color:var(--ink-3);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:0 1 auto}
.sugg .tv{margin-left:auto;font-size:12px;color:var(--ink-3);font-family:var(--mono);flex:none}

.sugg .sghd{display:flex;align-items:center;gap:8px;padding:10px 12px 4px;font-size:12px;font-weight:700;
  color:var(--ink-3);letter-spacing:.04em;cursor:default}
.sugg .sghd + .sgrow{margin-top:2px}

.sugg .sghd small{font-weight:400;font-size:12px;letter-spacing:0;margin-left:auto}
.sugg .sgclr{margin-left:auto;border:0;background:transparent;color:var(--cyan);font-size:12px;cursor:pointer;
  padding:2px 6px;border-radius:6px}
.sugg .sgclr:hover{background:var(--panel-3)}
.sugg .sgdel{flex:none;width:24px;height:24px;margin-left:4px;border:0;border-radius:6px;background:transparent;
  color:var(--ink-3);font-size:16px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}

/* 公司 Logo（2026-09-26）：圓角方形；沒有圖／圖壞掉時是字母頭像（字由 ::before 畫，不進 DOM 文字）。
   ::after 疊一圈 1px 淡框在圖的**上面** —— 白底 Logo 在淺色主題才看得到邊。
   圖本身墊白底：多數公司 Logo 是照白底設計的，透明 PNG 疊在深色底上會糊掉。*/
.slogo{--lz:20px;position:relative;display:inline-grid;place-items:center;flex:none;width:var(--lz);height:var(--lz);
  border-radius:calc(var(--lz) * .26);background:var(--lg,#4d5b73);overflow:hidden;vertical-align:middle}

.slogo::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px var(--line-2);pointer-events:none}

  padding:calc(var(--lz) * .08);box-sizing:border-box}

.evbtn{border:1px solid var(--line-2);background:var(--panel);color:var(--ink-2);padding:7px 12px;

.evbtn.theme:hover{color:var(--ink);border-color:var(--cyan)}
/* 事件側欄的日期改成下拉選單（Andy 2026-09-15：「日期那邊可以變成清單選項選擇日期」）。

#evDate{max-width:150px}
#evDate.stale{color:var(--amber);border-color:var(--amber)}

/* ---------------- 盤中即時（live.js） ---------------- */
.livebox{position:relative;display:flex;align-items:center;gap:6px}
/* ★ 2026-09-23 UI 精修 #4（A14）：即時徽章**不准因為錯誤訊息變長就把導覽分頁擠掉**。
   量到的事實：#flow 的分頁溢出 352px，比其他頁多 190px，差的就是這顆吐出
   `Failed to fetch` 的徽章。一個次要的抓取失敗不該有比整個導覽更大的視覺權重。
   兩件事一起做：① 固定最大寬 ＋ 截斷（全文留在 title，滑上去看得到，是藏不是刪）
   ② `.bad` 從「紅框紅字」改成「琥珀左條 ＋ 面板底」—— 紅色在台股是「漲」，
      拿來表示錯誤會直接跟漲跌混淆（狀態一律顏色＋文字雙編碼）。*/
.livestate{font-size:12px;font-family:var(--mono);white-space:nowrap;color:var(--ink-3);
  padding:3px 8px;border-radius:7px;border:1px solid transparent;
  flex:none;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.livestate.live{color:var(--ontop);background:var(--cyan);font-weight:600}
.livestate.ok{color:var(--ink-2);border-color:var(--line-2)}

.livestate.fresh{cursor:pointer}
.livestate.fresh:hover{color:var(--ink)}
/* 熱力圖分頁：還沒選題材時，題材細節那一塊只放一句怎麼用（2026-09-24 題材併進熱力圖）*/
.themehint{padding:12px 4px;font-size:13px;line-height:1.6;border:1px dashed var(--line-2);border-radius:var(--r);text-align:center}

}

   --ontop 在深色是 #061018 → 5.82，在淺色是 #ffffff 印在 #5f4ddb 上 → 5.88，
   一個 token 同時把兩個主題都修好。字級 11 → 12px（本專案的下限）。*/
.evbtn .n{background:var(--violet);color:var(--ontop);font-size:12px;padding:1px 7px;border-radius:9px;margin-left:6px;font-family:var(--mono)}

/* ---------------- 版面 ---------------- */
.layout{display:grid;grid-template-columns:1fr var(--side-w);min-height:calc(100vh - 58px)}
.layout.noside{grid-template-columns:1fr}
/* ★ 2026-09-22 抓到的既有 bug：`.noside` 只把那一欄收掉，**卻沒有把 aside 藏起來**。
   aside 是 grid item，沒有欄位就被丟到隱含的下一列 ——
   整條事件側欄堆到 main 底下，整頁高度多出約 900px（1366px 實測 2757 -> 3700）。
   app.js 的註解本來就寫著「桌機要靠 .layout.noside 把那一欄收掉」，
   意圖是對的，規則只寫了一半。
   ⚠ 只給桌機：820px 以下 aside 是 position:fixed 的浮層、由 `.open` 控制，

.banner{padding:12px 16px;border-left:3px solid var(--amber);background:rgba(255,180,84,.08);font-size:14px;

.banner.on{display:block}

.banner b{color:var(--ink)}

   **27px 的水平捲軸**（documentElement.scrollWidth 927 vs clientWidth 900）。
   這是既有問題，不是這次版面改動造成的 —— 舊版在同一個寬度量到的數字一模一樣。
   原本只在 ≤820px 隱藏（那條的理由也一樣是「頂部塞不下」），門檻往上拉到 980px。
   版號**不會因此看不到**：橫幅那一行照樣寫著同一個版號（DECISIONS #148 要的是

#sankey{position:relative;min-height:560px}

#ovFlow{min-height:300px} #ovFlow.isempty{min-height:0}

.empty{display:grid;place-items:center;min-height:160px;color:var(--ink-3);font-size:14px;text-align:center;padding:20px}

/* K 線設定面板：指標樣式列 */

   以前吃 var(--ink)，淺色主題下變成深字壓深底，「題材資金熱力」幾乎隱形。*/

/* 熱力圖點方塊後在原地列出成分股，不用跳頁 */
.hpanel{margin-top:12px;padding:12px 14px;border-radius:10px;background:var(--panel-3);border:1px solid var(--line-2)}

.hpanel .hh .m{font-family:var(--mono);font-size:12.5px;color:var(--ink-3)}
.hpanel .hh .sp{flex:1}
.hpanel .ms{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:6px;margin-top:10px}
.hpanel .ms a{display:flex;align-items:baseline;gap:6px;padding:6px 9px;border-radius:8px;background:var(--panel-2);
  border:1px solid transparent;transition:.15s;color:var(--ink)}
.hpanel .ms a:hover{border-color:var(--cyan)}
.hpanel .ms a .c{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.hpanel .ms a .g{margin-left:auto;font-family:var(--mono);font-size:12px}
/* ★ 2026-09-24 夜（審查 R2 #28：「下鑽清單的股名被擠成一字一行 —— 群／聯、台／積電」）：
   個股卡片（.dp，排行與資金去向兩個面板共用）的內容是「名字 代號 金額 佔比 漲跌 →」，
   168px 一欄塞不下，flex 就去壓名字（中文沒有空白可斷，只能一字一行）。
   改成和 .sub 同一套：名字＋代號在第一行（名字不換行、真的太長才截斷加…，全名在 title），數字整段換到第二行。*/
.hpanel .ms a.dp:not(.grow):not(.sub){flex-wrap:wrap;row-gap:1px;align-items:center}
.hpanel .ms a.dp:not(.grow):not(.sub)>span:first-child{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hpanel .ms a.dp:not(.grow):not(.sub) .c{flex:none}
.hpanel .ms a.dp:not(.grow):not(.sub) .g{order:3;flex:1 0 100%;margin-left:0;text-align:left;white-space:nowrap}
/* ★ 2026-09-20（Andy：「資金流向排行下方的族群點擊後所顯示的股票 太長了，
   需要變成固定大小，所以需要有拉Bar 功能，並且確認所有相關版面一樣使用這方式」）。
   成分股多的族群（ETF、半導體業）一展開就把整張圖推出畫面，得捲很久才捲得回來。
   固定高度＋自己的捲軸，和輪動階段那四格（.stage ul）用的是同一套做法。
   這條選擇器是全站共用的 .hpanel —— 資金流向的排行面板、資金集中度的側欄、
   總覽熱力圖的族群面板都吃得到，Andy 要的「所有相關版面一樣」就是這個意思。*/
.hpanel .ms{max-height:232px;overflow-y:auto;scrollbar-width:thin;padding-right:4px}
.hpanel .ms::-webkit-scrollbar{width:6px}
.hpanel .ms::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:999px}
@media (max-width:900px){ .hpanel .ms{max-height:190px} }
/* ★ 2026-09-21（Andy：「當點擊 AI 伺服器第一個 Node 右邊應當顯示 AI 伺服器，
   並下面多出裡面還蓋族群，並且都具備下拉選單可以看個股」）。
   產業鏈面板＝族群列（可展開）＋展開後的個股列。**沒有另開第四種清單樣式** ——
   還是上面那套 .hpanel .ms，只多兩個修飾類：
     .grow 橫跨整排（grid-column:1/-1），所以它底下展開的個股自然另起一行，
           而個股仍然吃多欄格線，一個族群 20 檔也只佔 5 列，不會把面板撐長；
     .sub  往內縮一格，看得出「這幾列是屬於上面那一列的」。 */
.hpanel .ms a.grow{grid-column:1/-1;background:var(--panel);border-left:3px solid var(--c,var(--cyan));
  flex-wrap:wrap;row-gap:2px;align-items:center}
.hpanel .ms a.grow .tw2{font-family:var(--mono);font-size:11px;color:var(--c,var(--cyan));width:10px;flex:none}
.hpanel .ms a.grow .nm{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.hpanel .ms a.grow .g{flex:1 0 100%;margin-left:16px;text-align:left;color:var(--ink-2)}
.hpanel .ms a.grow.ison{background:var(--panel-2)}
.hpanel .ms a.grow .go{flex:none;margin-left:8px;opacity:.65}
.hpanel .ms a.grow .go:hover{opacity:1;color:var(--cyan)}
/* 個股列。和族群列一樣拆成兩行（第一行「簡稱 代號」、第二行數字）。
   不拆的話窄畫面（800px）一欄只剩 130px，flex 會把名字擠成「台／光／電」直排；
   只夾 ellipsis 也不行 —— 會變成「台… 2…」，等於讀不出是哪一檔。
   1440 看不到、800 一看就發現，是 DECISIONS #171 那一類的坑。*/
.hpanel .ms a.sub{margin-left:12px;font-size:12.5px;flex-wrap:wrap;row-gap:1px;align-items:center}
.hpanel .ms a.sub>span:first-child{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ★ 2026-09-25（Andy：總覽足跡輪盤下方點族群出現的面板「範圍要小一點」）：只收桌機的 #ovRotPanel
   （手機另有人做）。字與間距收小、個股從一格一格的卡片改成一行排好幾檔的小標籤，高度上限 88px（約三行）。
   代號藏起來（連結本身就走到個股頁），留名稱＋漲跌。*/
@media (min-width:821px){
  #ovRotPanel{margin-top:6px;padding:7px 10px;border-radius:8px}
  #ovRotPanel .hh{gap:6px}
  #ovRotPanel .hh b{font-size:13px}
  #ovRotPanel .hh .m{font-size:11.5px}
  #ovRotPanel .hh .pill{font-size:11.5px;padding:1px 8px}
  #ovRotPanel .ms{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;max-height:88px}
  #ovRotPanel .ms a{padding:2px 7px;gap:4px;border-radius:6px;font-size:12px;line-height:1.35}
  #ovRotPanel .ms a .c{display:none}
  #ovRotPanel .ms a .g{margin-left:0;font-size:11px}
}
/* ★ 2026-09-26（Andy：「足跡輪盤點擊族群會影響到旁邊的版面」）：#ovRotPanel 改成浮在輪盤上的覆蓋卡 ——
   absolute 掛在 #ovRotCard 上、不佔版面，打開／收起時「昨日資金去向」與左欄卡片一個像素都不動。
   top 由 app.js ovRotPlace() 算（貼著剛點的那顆放在它上方或下方，不蓋到它）。底色用不透明的 --panel-2＋陰影，
   看得出是一張蓋上去的卡，不會跟底下的輪盤線條混在一起。*/
#ovRotCard{position:relative}
#ovRotPanel{position:absolute;left:14px;right:14px;z-index:6;margin-top:0;background:var(--panel-2);
  box-shadow:0 10px 28px rgba(0,0,0,.45)}
/* 641～820 還是桌機那一份輪盤（手機雷達是 ≤640），但沒吃到上面 ≥821 的緊湊樣式 —— 清單上限收到約四行，
   不然一張浮卡就把整個輪盤蓋滿。*/
@media (max-width:820px){ #ovRotPanel .ms{max-height:120px} }
.hpanel .ms a.sub .c{flex:none}
.hpanel .ms a.sub .g{flex:1 0 100%;margin-left:0;text-align:left;white-space:nowrap}
.hpanel .ms a.sub.muted{color:var(--ink-3);grid-column:1/-1}

/* ★ 2026-09-20（Andy：「熱門題材 & 今日候選 框格需要一樣大，超出部分改拉Bar」
   ＋「換另一台電腦、螢幕大小不同就會影響整體變化」）。
   先把量到的事實寫下來，免得下一個人又重測一次：
   grid 預設 align-items:stretch，所以這兩張卡的**外框本來就等高**（1280/1366/1440/1536/1920
   量到的都是左右一模一樣）。真正的問題是另外兩件事 ——
     ① 撐高度的是左邊的「熱門題材」：它在 1fr 那一欄只排得下一欄磚塊，
        八塊疊起來就是 1336px，右邊的候選名單只是被 stretch 拉著陪高；
     ② 同一頁換一台螢幕，整列高度從 722px 跳到 1426px（差快一倍），
        所以他會覺得「版面整個跑掉」。
   做法：整列釘一個**跟視窗寬度無關**的高度上限，內容超出就在卡片內部捲。
   語彙沿用上面那套 .hpanel .ms（固定高度 + overflow-y:auto + 細捲軸），不另開第三種。
   用 min(72vh, 720px) 而不是寫死 720：筆電開了工具列之後視窗只有 600 多高時，
   寫死會讓兩張卡自己超出一個畫面，反而更難看。 */
.eqpair{grid-auto-rows:min(72vh,720px)}
.eqpair>.card{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.eqpair>.card>*{flex:none}
/* 卡片裡唯一會長高的那一塊：吃掉剩下的高度、自己捲。
   min-height:0 不可以拿掉 —— flex 子項的預設 min-height:auto 會讓它拒絕縮小，
   捲軸就永遠不會出現（這正是 2026-09-20 之前「被裁掉而且沒有捲軸」的成因）。*/
.eqpair .pane,.eqpair>.card>.tw{flex:1 1 auto;min-height:0;overflow-y:auto;scrollbar-width:thin}
.eqpair .pane{padding-right:4px}
.eqpair .pane::-webkit-scrollbar{width:6px}
.eqpair .pane::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:999px}
/* 候選名單的表格本來自己帶 cap-lg(560px)；在這一列改由卡片決定高度，不然會出現兩層上限 */
.eqpair>.card>.tw.cap-lg{max-height:none}
/* 窄畫面（兩張卡已經變成上下排）就不要再鎖死列高，否則手機上會出現一格 720px 的空卡 */
@media (max-width:1100px){
  .eqpair{grid-auto-rows:auto}
  .eqpair>.card{overflow:visible}
  .eqpair .pane{max-height:62vh}
  .eqpair>.card>.tw.cap-lg{max-height:440px}
}
/* 放大只在框內發生：捲動層 .zpane 在放大時高度鎖死，卡片與整頁版面完全不受影響 */
/* 圖表旁邊的透明度滑桿（本益比河流圖）。Andy 2026-09-16 要「可以調整透明度」。 */
.opabox{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.opabox input[type=range]{width:82px}
.opabox .val{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);min-width:34px;text-align:right}
.opabox input:disabled{opacity:.35}
/* 拉 Bar：RRG 天數、族群佔比河流、族群×法人共用同一個樣子（Andy 2026-09-18 要求改成拖曳） */
.rbar{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.rbar .t{color:var(--ink-3)}
.rbar input[type=range]{width:132px;accent-color:var(--cyan)}
.rbar .val{font-family:var(--mono);font-size:12px;color:var(--ink);min-width:52px;text-align:right}
@media (max-width:900px){ .rbar input[type=range]{width:96px} }
/* N2：資金流向排行與輪動時鐘共用的族群晶片列。
   點名字＝只看那個族群（兩張圖同步），點箭頭才是進族群頁 ——
   以前整顆是連結，所以「點了就跳走」，根本沒辦法拿來篩選。*/
.linkrow.gchips{display:flex;flex-wrap:wrap;gap:5px 6px}
/* ★ 2026-09-23：`.rotfilter` 裡的族群晶片列與產業鏈 seg 已換成兩層下拉（見下面的 .rotdd），
   原本那五條專屬樣式（`.rotfilter .linkrow.gchips` / `.rotfilter .seg.rotchain` /
   `.rotfilter .gchip*` 與 `[data-sync="n2"]` 的高度上限）全部刪掉，不留死樣式。
   ⚠ 下面那組**通用** `.gchip` 不能刪 —— 全站其他圖表的篩選晶片（`filterChips()`）還在用。*/

/* ★ 2026-09-23（Andy：「圖一二 兩個標籤式都需要做成下拉清單 篩選，所以他會是 族群->題材…
   並非所有族群都在同一個下拉清單，而是對應族群出現對應個股」）：
   `.rotfilter` 裡那一排晶片換成**兩層下拉**（第一層產業鏈、第二層該鏈底下的族群）。

   · 為什麼不用原生 `<select multiple>`：它在手機上是系統的全螢幕選單、吃不到站上的主題色，
     也放不下族群的顏色點。所以自己做 checkbox 面板。
   · `position:relative` + 絕對定位的面板 → 面板**浮在圖上面**，不會把時鐘推下去。
   · 390px 的防溢出是三件事一起：`max-width:calc(100vw - 32px)`（左右各留 16px 的邊）、
     `left:0;right:auto`（永遠往右展開，不會伸出螢幕左邊）、以及面板自己的捲軸。*/
.rotdd{position:relative;display:inline-flex}
.rotdd .ddbtn{appearance:none;display:inline-flex;align-items:center;gap:6px;max-width:min(340px,100%);
  padding:4px 10px;border-radius:8px;border:1px solid var(--line-2);background:var(--panel-2);
  color:var(--ink-2);font-size:12px;font-family:inherit;cursor:pointer;white-space:nowrap}
.rotdd .ddbtn b{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis}
.rotdd .ddbtn i{font-style:normal;color:var(--ink-3);font-size:11px}  /* R2 #4：10 → 11px（全站字級下限） */
.rotdd .ddbtn:hover{border-color:var(--cyan);color:var(--ink)}
.rotdd.open .ddbtn{border-color:var(--cyan);color:var(--ink);background:var(--panel)}
.rotdd .ddpanel{position:absolute;z-index:40;top:calc(100% + 4px);left:0;min-width:210px;
  max-width:calc(100vw - 32px);max-height:290px;overflow:hidden;display:flex;flex-direction:column;
  padding:6px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel);
  box-shadow:0 10px 26px rgba(0,0,0,.35)}
.rotdd .ddpanel[hidden]{display:none}
.rotdd .ddbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:2px 4px 6px;
  border-bottom:1px solid var(--line-2);margin-bottom:4px}
.rotdd .ddbar .muted{font-size:11px}
.rotdd .ddbar .btn{margin-left:auto}
.rotdd .ddbar .btn+.btn{margin-left:0}
.rotdd .ddlist{overflow-y:auto;scrollbar-width:thin;padding-right:2px}
.rotdd .ddlist::-webkit-scrollbar{width:6px}
.rotdd .ddlist::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:999px}
/* 第一層（產業鏈）的選項：整列可點，右邊寫這條鏈底下有幾個族群 —— 選之前就知道會篩掉多少 */
/* 2026-09-25：熱門題材的下拉把選項包在 .ddlist 裡（捲動用），原本只認 .ddpanel>.ddopt，選項吃到瀏覽器預設白底按鈕 —— 一起涵蓋 */
.rotdd .ddpanel>.ddopt,.rotdd .ddlist>.ddopt:not(.chk):not(.one){display:flex;align-items:center;gap:8px;width:100%;appearance:none;border:0;
  background:transparent;color:var(--ink-2);font-size:12.5px;font-family:inherit;text-align:left;
  padding:6px 9px;border-radius:7px;cursor:pointer}
.rotdd .ddpanel>.ddopt em,.rotdd .ddlist>.ddopt:not(.chk):not(.one) em{margin-left:auto;font-style:normal;color:var(--ink-3);font-size:11px;font-family:var(--mono)}
.rotdd .ddpanel>.ddopt:hover,.rotdd .ddlist>.ddopt:not(.chk):not(.one):hover{background:var(--panel-2);color:var(--ink)}
.rotdd .ddpanel>.ddopt.on,.rotdd .ddlist>.ddopt:not(.chk):not(.one).on{background:color-mix(in srgb,var(--cyan) 18%,transparent);color:var(--ink);font-weight:600}
/* 第二層（族群）：checkbox ＋ 族群顏色點 ＋ 「→ 進族群頁」。
   `→` 刻意放在 <label> 外面，不然點它會連帶把勾選也切掉（瀏覽器原生行為）。*/
.rotdd .ddopt.chk{display:flex;align-items:center;gap:6px;border-radius:7px;padding:0 6px 0 0}
.rotdd .ddopt.chk:hover{background:var(--panel-2)}
.rotdd .ddopt.chk label{display:flex;align-items:center;gap:7px;flex:1 1 auto;min-width:0;
  padding:5px 4px 5px 8px;cursor:pointer;font-size:12.5px;color:var(--ink-2)}
.rotdd .ddopt.chk input{accent-color:var(--c,var(--cyan));flex:none;margin:0}
.rotdd .ddopt.chk .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  border-left:3px solid var(--c,var(--cyan));padding-left:6px}
.rotdd .ddopt.chk label:hover .nm{color:var(--ink)}
.rotdd .ddopt.chk .go{flex:none;color:var(--ink-3);text-decoration:none;padding:3px 4px;font-size:12px}
.rotdd .ddopt.chk .go:hover{color:var(--ink)}
/* 單選版的第二層（資金去向桑基圖下面那排）。`.ddopt.one` 點一下就選定並收起來，
   所以不需要 checkbox —— 這張圖從第一天起就是「一次只看一個族群」，
   放 checkbox 會讓人以為可以多選。左邊那條族群色的粗邊是唯一的「顏色線索」。*/
.rotdd .ddopt.one{display:flex;align-items:center;gap:6px;width:100%;border-radius:7px;padding:0 6px 0 0}
.rotdd .ddopt.one:not(.row){appearance:none;border:0;background:transparent;color:var(--ink-2);
  font-size:12.5px;font-family:inherit;text-align:left;padding:6px 9px;cursor:pointer}
.rotdd .ddopt.one:hover{background:var(--panel-2)}
.rotdd .ddopt.one .nm{flex:1 1 auto;min-width:0;appearance:none;border:0;background:transparent;
  color:var(--ink-2);font-size:12.5px;font-family:inherit;text-align:left;cursor:pointer;
  padding:6px 4px 6px 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  border-left:3px solid var(--c,var(--cyan))}
.rotdd .ddopt.one .nm:hover{color:var(--ink)}
.rotdd .ddopt.one.on{background:color-mix(in srgb,var(--c,var(--cyan)) 20%,transparent)}
.rotdd .ddopt.one.on .nm{color:var(--ink);font-weight:600}
.rotdd .ddopt.one .go{flex:none;color:var(--ink-3);text-decoration:none;padding:3px 4px;font-size:12px}
.rotdd .ddopt.one .go:hover{color:var(--ink)}
/* 桑基圖下面那一排：`.rotfilter` 的排版 ＋ 和圖之間留一點距離 */
.ddrow{margin:8px 0 2px}
@media (max-width:420px){ .rotdd .ddbtn{font-size:11.5px;max-width:calc(100vw - 40px)} }
.gchip{display:inline-flex;align-items:center;border:1px solid color-mix(in srgb,var(--c) 32%,transparent);
  border-radius:999px;overflow:hidden;background:color-mix(in srgb,var(--c) 8%,transparent);font-size:12px}
.gchip .pick{appearance:none;border:0;background:transparent;color:var(--ink-2);
  padding:3px 4px 3px 9px;cursor:pointer;font-size:12px;font-family:inherit}
.gchip .go{color:var(--ink-3);text-decoration:none;padding:3px 8px 3px 4px;
  border-left:1px solid color-mix(in srgb,var(--c) 26%,transparent)}
.gchip:hover{border-color:var(--c)}
.gchip .pick:hover,.gchip .go:hover{color:var(--ink)}
.gchip.on{background:color-mix(in srgb,var(--c) 26%,transparent);border-color:var(--c)}
.gchip.on .pick{color:var(--ink);font-weight:600}
/* 台指期夜盤（Andy 2026-09-19：「夜盤要跟日盤共用同一個走勢圖」）。
   2026-09-18 版本是在卡片上半部另外插一塊方框 —— 同一張卡兩套數字。
   現在 .m3-night 是**畫在圖表容器裡面**的說明面板（點數不足 2 筆時才出現），
   所以要撐滿容器高度而不是自己再撐出一塊；只有這三張卡用得到這個選擇器。*/
.m3-night{height:100%;box-sizing:border-box;overflow:auto;padding:12px 14px;border-radius:12px;
  display:flex;flex-direction:column;gap:6px;justify-content:center;
  background:color-mix(in srgb,var(--violet) 9%,transparent);
  border:1px solid color-mix(in srgb,var(--violet) 26%,transparent)}

   光束＝圓形遮罩裡一片轉動的錐形漸層；聲納＝放大＋淡出的細環＋閃一下的白色核心。都不接滑鼠。 */

.rotping .rg{left:calc(var(--r) * -1);top:calc(var(--r) * -1);width:calc(var(--r) * 2);height:calc(var(--r) * 2);box-sizing:border-box;border:1.2px solid var(--c);
  animation:rotpingGrow .52s cubic-bezier(.5,1,.89,1) forwards,rotpingFade .52s linear forwards}
.rotping .rc{left:calc(var(--k) * -1);top:calc(var(--k) * -1);width:calc(var(--k) * 2);height:calc(var(--k) * 2);background:#fff;

.rotquads .rq{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;

/* ★ 2026-09-24 晚：足跡輪盤桌機版照 Andy 的參考檔換長相（理由寫在 app.js ROT_GRAD_V2 上面）。
   象限徽章＝深底膠囊＋1.2px 象限色框；數字 12px（參考檔 11px 低於全站下限，補到 12）。

   只包在 min-width:821px 裡 —— Andy：「手機部分先暫停，等電腦版OK在執行」，手機照舊。

/* 清單本體：一列一個族群，和原本看板那四格的 li 用同一套（.stage ul li 的樣式在下面）

   ★★ 2026-09-23 修版面壞掉（Andy：「資金輪動領先 改善 落後 轉若 裡面的內容跑掉需要重新排版」）
   ────────────────────────────────────────────────────────────────────────
   重現（1440px、四個象限都一樣，量測值寫在這裡當回歸基準）：
     · 名稱欄 `.g` 實測寬 **13～32px**、高 **60～150px** —— 也就是「液冷散熱」被壓成
       一個字一行、直排四列。中文沒有空白可以斷行，壓到一個字寬就只能一個字一行。
     · 數字欄 `.m` 的右緣 748.3px，而那一列的右緣只有 676.7px → **右邊被裁掉 24～71px**，
       「佔比」那一欄整個看不到。
     · `ul.ms` 的 scrollWidth 342 vs clientWidth 270 → **多出一條橫向捲軸**。
   根因（三行湊出來的，缺一不可）：
     ① 這塊面板在 `.rotstagerow` 的第二欄，寬度被鎖成 300px（下面 `flex:0 0 300px`），
        扣掉 padding 之後一列只有 **226px** 可用；
     ② `.m` 是 `white-space:nowrap`，內容「強弱 +16.0　動能 +4.0　佔比 2.4%」本身就要
        **204～219px** —— 它縮不下去，於是 flex 只能去壓另一個可壓的項目；
     ③ `.g` 當時沒有任何 `flex`／`min-width`／`white-space` 的宣告，是預設可壓縮的
        flex item，於是被壓到一個字寬。
   ⚠ 這**不是**今晚手機改版造成的：手機那批動的是 `@media (max-width:820px)`，
     而這個壞法只在 ≥1101px（`.rotstagerow` 還是兩欄）時出現，800／390px 量出來是好的。
     有趣的是 420px 以下早就有一條 `flex-wrap:wrap` 的補丁 —— 修法本來就在檔案裡，
     只是當初沒有往上套到桌機。
   修法（依 CEO 給的判準逐條對）：
     · `flex-wrap:wrap` —— 一行放得下就一行，放不下讓**數字整段換到第二行**，
       名稱因此永遠有整列的寬度可以用，不會再直排。
     · `.g` 明確宣告 `min-width:0` ＋ `nowrap` ＋ `ellipsis`，名稱真的超長就截斷加 `…`，
       全名放進 `title`（rotItem 補的）——**藏起來，不是刪掉**。
     · `.m` 改 `flex:0 0 auto` ＋ `tabular-nums` ＋ 靠右：三個數字一個都不裁，位數也對得齊。
     · `overflow-x:hidden`：`overflow-y:auto` 會讓 overflow-x 算成 auto，那條橫向捲軸就是這樣長出來的。
       面板裡不准橫向捲；筆數多就垂直捲（本來就有 max-height:250px）。*/
/* ★★ 2026-09-24 第二次重排（Andy：「輪動時鐘內的資訊並沒有修正，為何看起來排版還是很糟糕」）
   上面那段修法（flex ＋ wrap）解掉了「直排」與「被裁掉」，但留下 Andy 截圖裡看到的樣子：
   箭頭擠到最右、「強弱 +7.5 動能 +7.2 佔比 6.5%」靠右對齊、窄一點「佔比」就折到第三行 ——
   **每一列的同一欄 x 都不一樣**，眼睛沒辦法往下掃。
   改成表格式格線：每一列（含表頭 li.cols）用**同一組**欄寬 —— 族群名｜強弱｜動能｜佔比｜趨勢，
   數字等寬靠右、一律單行（nowrap），名稱吃剩下的寬度，太長就截斷加「…」（全名在 title）。
   表頭放在 ul 裡面（sticky）而不是 ul 外面：捲軸出現時表頭跟清單在同一個容器裡縮，欄才對得齊。*/
.stagepanel ul.ms{display:block;max-height:280px;overflow-y:auto;overflow-x:hidden;margin:8px 0 0;padding:0 4px 0 0;list-style:none}
.stagepanel ul.ms li{display:grid;grid-template-columns:minmax(0,1fr) 40px 40px 38px 12px;column-gap:6px;
  align-items:center;padding:5px 8px;border-radius:7px;cursor:pointer;font-size:12.5px;line-height:18px;color:var(--ink-2)}
.stagepanel ul.ms li>*{white-space:nowrap}
.stagepanel ul.ms li+li:not(.cols){border-top:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.stagepanel ul.ms li:not(.cols):hover{background:var(--panel-2);color:var(--ink)}
.stagepanel ul.ms li[data-off]{opacity:.55}  /* 不在盤上的族群（成交值不在前 16）：審查 R2 #23 */
.stagepanel ul.ms li.none{display:block;cursor:default;color:var(--ink-3);white-space:normal}
.stagepanel ul.ms li.cols{position:sticky;top:0;z-index:1;cursor:default;padding-top:2px;padding-bottom:4px;
  background:var(--panel-3);font-size:12px;color:var(--ink-3);
  border-bottom:1px solid var(--line-2);border-radius:0}
.stagepanel ul.ms li.cols>span:nth-child(n+2){text-align:right}
.stagepanel ul.ms li.cols>span:last-child{text-align:center}
.stagepanel ul.ms li .gc{display:flex;align-items:center;gap:5px;min-width:0}
.stagepanel ul.ms li .g{font-weight:600;color:var(--ink);min-width:3.2em;flex:0 1 auto;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stagepanel ul.ms li .v{text-align:right;font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.stagepanel ul.ms li .ar{text-align:center;font-weight:700}
/* ↑↓ 紅漲綠跌：以前寫 var(--up)／var(--down)，這兩個變數全站沒有定義，箭頭一直是預設字色（2026-09-24 順手修） */
.stagepanel ul.ms li .ar.up{color:var(--rise)} .stagepanel ul.ms li .ar.dn{color:var(--fall)}
.stagepanel ul.ms li .ar.fl{color:var(--ink-3)}
.stagepanel ul.ms li .jmp{flex:none;font-size:12px;line-height:16px;padding:0 5px;border-radius:999px;color:var(--c);
  border:1px solid color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 12%,transparent)}
.stageboard{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:20px;padding-top:16px}
.stageboard::before{content:"";position:absolute;left:2%;right:2%;top:4px;height:6px;border-radius:999px;
  background:linear-gradient(90deg,var(--fall),var(--cyan),var(--rise),var(--amber),var(--fall));opacity:.5}
/* ★ 2026-09-23：`.stageboard.compact` 的專屬規則已移除 —— 它只服務總覽的 `#rotMini`，
   那一塊換成了「昨日資金去向分流圖」。`.stageboard` / `.stage` 本體**不要刪**：季節性的 `#seasonBoard` 還在用。 */
.stage{position:relative;border:1px solid color-mix(in srgb,var(--c) 34%,transparent);border-radius:20px;
  padding:14px 15px 13px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 11%,var(--panel-3)),var(--panel-3));
  box-shadow:0 10px 26px -22px var(--c)}
/* 軌道上的節點：每一段頭上一顆圓點，坐在漸層軌上 */
.stage::before{content:"";position:absolute;left:24px;top:-19px;width:13px;height:13px;border-radius:999px;
  background:var(--c);box-shadow:0 0 0 4px var(--bg),0 0 12px var(--c)}
/* 段與段之間的箭頭：說明「往下一段走」 */
.stage::after{content:"→";position:absolute;right:-15px;top:50%;transform:translateY(-50%);
  color:var(--ink-3);font-size:15px;font-weight:700}
.stage:last-child::after{content:"↩";color:var(--ink-3)}
@media (max-width:900px){ .stage::after{display:none} .stageboard::before{display:none} }
.stage .sh{display:flex;align-items:baseline;gap:8px}
.stage .sh b{font-size:15.5px}
.stage .sh .n{font-family:var(--mono);font-size:12px;color:var(--ink-3);background:var(--panel-2);
  border-radius:999px;padding:1px 8px}
.stage .sd{color:var(--ink-3);font-size:12.5px;margin:5px 0 9px;line-height:1.55}
.stage .sd em{font-style:normal;color:var(--ink-2)}
/* 2026-09-18（Andy 圖五）：四格改成固定高度＋自己的捲軸。
   以前是「只列前 12 個、其餘寫一句還有 N 個」，看不到的就是看不到；
   現在全部列出來，格子高度固定所以四格永遠等高，版面也不會被撐長。*/
.stage ul{list-style:none;margin:0;padding:0 4px 0 0;display:flex;flex-direction:column;gap:5px;
  max-height:380px;overflow-y:auto;scrollbar-width:thin}
/* ---- 週期統計（#season）的熱力圖外框 ----
   ★ 2026-09-24（Andy：約 100 個族群擠在 600px 高、每列 5～6px、名字只顯示每 4～5 列一個）：
   列高改成固定值（桌機 24、手機 20），圖高＝列數 × 列高，所以每個族群名稱都印得出來；
   整張太高時由外框捲動，月份表頭 sticky 釘在框頂。表頭是 HTML 按鈕而不是 ECharts 的 x 軸 ——
   ECharts 的軸在 canvas 裡，跟著圖一起被捲走，捲到第 40 列就不知道哪一欄是幾月。
   （原本 `#seasonBoard` 的兩條規則跟著「本月歷史最強族群」那張卡一起拿掉了。）*/
.shbox{position:relative;margin-top:10px;max-height:680px;overflow-y:auto;overscroll-behavior:contain;
  border-radius:10px;scrollbar-width:thin;max-width:100%}
/* ★ 2026-09-24（docs/season_grid_spec.md）：桌機的外框寬由 app.js 設成「名稱欄＋12 格」的表格寬，整張表靠左；
   `max-width:100%` 是保險 —— 算錯也不准撐出卡片、不准出現橫向捲軸。手機不設寬，照舊撐滿。*/
.shbox[hidden]{display:none}
/* ★ 2026-09-25（審查 R4：800 寬選「全部」→ 框內 680px 可捲、頁面也可捲，框底被固定在底部的兩列分頁（約 100px）蓋住，
   捲到框底時最後幾列永遠露不出來）。≤820px 的可視高度要扣掉頂列 58px＋底部分頁列約 110px＋一點邊，
   框就一定完整落在兩條固定列之間，框內捲到底看得到最後一列。*/
@media (max-width:820px){ .shbox{max-height:min(680px, calc(100vh - 190px)); max-height:min(680px, calc(100dvh - 190px))} }
.shhead{position:sticky;top:0;z-index:2;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:0;
  background:var(--panel);padding-top:2px;padding-bottom:4px}
.shhead button{border:0;background:transparent;color:var(--ink-2);font:600 12px/1 var(--mono);height:24px;
  padding:0;border-radius:6px;cursor:pointer;white-space:nowrap;overflow:hidden;min-width:0}
.shhead button:hover{background:var(--panel-3);color:var(--ink)}
.shhead button.on{background:var(--cyan);color:var(--ontop)}
.shhead button.now:not(.on){box-shadow:inset 0 -2px 0 var(--cyan)}
.sncav{color:var(--amber)!important}
#seasonCtl{flex-wrap:wrap;gap:8px;justify-content:flex-end}
.stage ul::-webkit-scrollbar{width:6px}
.stage ul::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:999px}
/* 點開的族群：底下原地插一列成分股膠囊 */
.stage li.open{border-color:var(--c);background:var(--panel)}
.stage li.mem{display:flex;flex-wrap:wrap;gap:4px 6px;padding:7px 10px;border-radius:12px;cursor:default;
  background:color-mix(in srgb,var(--c) 9%,transparent);border:1px solid color-mix(in srgb,var(--c) 26%,transparent)}
.stage li.mem:hover{transform:none;background:color-mix(in srgb,var(--c) 9%,transparent)}
.stage li.mem .go{margin-left:auto}
.stage li{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--panel-2);
  cursor:pointer;transition:.15s;flex-wrap:wrap;border:1px solid transparent}
/* ★ 2026-09-23 UI 精修 #5：拿掉 translateX(2px)。密集清單裡整列往右跳，
   滑鼠往下掃過去就是一連串連鎖抖動，看起來像畫面在壞掉而不是回饋。
   回饋改由底色與邊框色負責（而且現在有 120ms 的過場，不再是硬跳）。*/
.stage li:hover{background:var(--panel);border-color:var(--c)}

.stage li .g{font-weight:600;font-size:13.5px}
.stage li .m{font-family:var(--mono);font-size:12px;/* 精修 #8 */color:var(--ink-3);margin-left:auto}
.stage li .ar{font-family:var(--mono);font-size:13px}
.stage li .ar.up{color:var(--rise)} .stage li .ar.dn{color:var(--fall)} .stage li .ar.fl{color:var(--ink-3)}

.top5grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.top5grid .t5{background:var(--panel-3);border:1px solid var(--line-2);border-radius:10px;padding:11px 13px}
.top5grid .t5 .h{display:flex;justify-content:space-between;align-items:baseline;font-weight:600}
.top5grid .t5 .h em{font-style:normal;font-family:var(--mono);color:var(--cyan);font-size:13px}
.top5grid .t5 .m{font-family:var(--mono);font-size:12px;color:var(--ink-3);margin:4px 0 8px}

/* 資金流向頁：期間切換、「怎麼看」說明、估值篩選 */
.periodbar{background:linear-gradient(180deg,rgba(62,224,255,.07),transparent)}

.howbtn{border:1px solid var(--line-2);background:var(--panel-3);color:var(--ink-2);border-radius:999px;
  padding:4px 11px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.howbtn:hover{border-color:var(--cyan);color:var(--cyan)}
.howbtn.on{background:var(--cyan);color:var(--ontop);border-color:var(--cyan);font-weight:700}
.howtxt{margin:10px 0 2px;padding:11px 14px;border-radius:10px;background:var(--panel-3);

.howtxt .howq{display:block;color:var(--ink)}
/* 2026-09-26（Andy：「"?" 內說明欄下方的更詳細說明不需要附註」）：「?」只留標題＋條列。
   howHTML 已經不輸出 .howfine；這一條是保險 —— 還有少數地方自己手寫了 .howfine（例如總覽「昨日資金去向」，
   另一支 agent 正在改那一塊，這一批不碰它），一律不顯示。*/

/* ★ 2026-09-23：`.vfilters` 一整組已移除 —— 它只服務「估值篩選」那張卡（Andy 指定拿掉）。 */

/* K 線工具：重設縮放的小方框圖示、繪圖工具列、設定浮層 */
.iconbtn{width:30px;height:30px;display:inline-grid;place-items:center;border:1px solid var(--line-2);
  background:var(--panel-3);color:var(--ink-2);border-radius:8px;cursor:pointer;padding:0}

@media (max-width:760px){.chartwrap{flex-direction:column}.drawbar{flex-direction:row;flex-wrap:wrap;align-self:stretch}.dsep{height:auto;width:1px;margin:2px 3px}}
