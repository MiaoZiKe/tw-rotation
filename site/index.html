  /* backdrop-filter 會讓 .topbar 變成 position:fixed 子元素的定位基準，
     底部的分頁列就會貼在 topbar 的下緣而不是視窗底部。手機上關掉它。 */
  .topbar{gap:8px;padding:0 10px;overflow:hidden;backdrop-filter:none;background:var(--topbar-m)}
  .search input{width:104px;padding-left:28px}
  /* 手機：分頁列放到底部（頂部塞不下） */
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:44;background:var(--topbar-m);border-top:1px solid var(--line);
    padding:6px 6px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;backdrop-filter:blur(12px);flex:none}
  .tab{padding:7px 9px;font-size:13.5px;flex:1;text-align:center}
  main{padding-bottom:120px}
  .sibs a.lk{font-size:12.5px}
  .segchip{font-size:12px;padding:4px 9px}
  /* 活頁簿分頁在 390px 也不准小於 12px（規格書第一節）；放不下就左右捲 */
  .nbsw>button,.nbsw>a{font-size:12.5px;padding:5px 10px 6px} .nbsw>button.on,.nbsw>a.on{padding:7px 12px 8px}
  .nbsw.lv2>button,.nbsw.lv2>a{font-size:12px;padding:4px 9px 5px} .nbsw.lv2>button.on,.nbsw.lv2>a.on{padding:6px 11px 7px}
  .nbbody{padding:10px 8px 12px}
  /* 手機上沒有一個字可以小於 12px（代號用 .82em 算出來只有 10.25px，手上看不清楚） */
  .tile .lks{font-size:13px} a.lk .code{font-size:12px} .brand small{font-size:11px}
  /* 窄畫面排成 2×2。★ grid-auto-rows:1fr 不可拿掉：兩列的高度預設各自算，
     上下兩張卡就會差幾 px（2026-09-20 新增「機構件」族群之後量到 487 / 467，
     _uitest 的「[800px] 四格等高」就是在擋這件事）。四格輪動板四格必須等高。 */
  .stageboard{grid-template-columns:1fr 1fr;grid-auto-rows:1fr}
  .cyclebar{font-size:12px} .cyclebar .st{padding:4px 10px;font-size:12.5px}
  .magrid{grid-template-columns:1fr} .top5grid{grid-template-columns:1fr}
  #mktSeg2,#mktTabs{flex-wrap:wrap}
  /* 剖析圖不要壓成手機寬（viewBox 1200 壓到 360 的話標籤只剩 3px，等於看不到）；改成可以左右滑 */
  .dgwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .dgwrap svg{width:auto;min-width:940px}
  .dgwrap.compact svg{max-height:none}
  .evbtn{padding:6px 8px;font-size:13px}
  .g2,.g3,.g4{grid-template-columns:1fr} .mtf-grid{grid-template-columns:1fr}
  .search input{width:130px}
  .brand small{display:none}
  /* 頂部塞不下版號；橫幅那一行照樣會寫，手機不會因此看不到 */
  .verbadge{display:none}
  #lwc{height:clamp(460px,calc(100vh - 230px),820px)}
  .tw.hide-m{display:none} .cards{display:grid;gap:10px}
  .scard{background:var(--panel-3);border-radius:10px;padding:12px 14px;border:1px solid var(--line-2)}
  .scard .h{display:flex;justify-content:space-between;align-items:baseline}
  .scard .h b{font-size:16px} .scard .r{display:flex;gap:10px;font-size:13px;color:var(--ink-2);margin-top:6px;flex-wrap:wrap}
}
@media (max-width:480px){ .hero{grid-template-columns:1fr 1fr} .kpi .v{font-size:22px} }
/* 大盤 KPI 固定 6 格：只准排成 6／3／2 欄，不准出現「5 格＋孤兒 1 格」。
   2026-09-24 截積木外觀時抓到：1440 寬、右側事件抽屜打開，內容區只剩約 1032px，
   auto-fit 會排成 5＋1。用容器寬度判斷（抽屜開關都算得對），不用視窗寬度。
   門檻用「每格至少約 200px」算：再窄「784 / 1314」「1 A / 0 B」這種大數字會被折成兩行
   （第一版用 960 當 6 欄門檻，1032 寬時每格 160px，數字就折行了）。 */
#v-overview{container-type:inline-size}
@container (min-width:1270px){ #hero{grid-template-columns:repeat(6,minmax(0,1fr))} }
@container (min-width:628px) and (max-width:1269.98px){ #hero{grid-template-columns:repeat(3,minmax(0,1fr))} }
@container (max-width:627.98px){ #hero{grid-template-columns:repeat(2,minmax(0,1fr))} }

/* ================= 供應鏈環節卡清單（#chainList / .seglist）=================
   Andy 2026-09-20：「供應鏈關聯圖 上下框度太長，改成顯示族群、族群標題底下顯示個股小卡」。
   為什麼用 multi-column 而不是 grid：grid 的每一列會被那一列最高的卡片撐高，
   而環節的公司數從 0 到 8 差很多 —— 用 grid 會把剛剛擠掉的空白原封不動補回來，
   那正是這次要修的東西。multi-column 是把卡片依序塞進欄裡，塞滿才換欄。
   代價是閱讀順序變成「由上往下、再往右」；所以每張卡片自己寫出上下游是哪幾格，
   而且上面那排環節色標本來就是照上游→下游排的，順序看得到。*/
.chainrow>.chainpane{flex:1 1 560px;min-width:0}
.seglist[hidden],.chainmap[hidden]{display:none}
.seglist{columns:236px;column-gap:10px}
.segcard{break-inside:avoid;-webkit-column-break-inside:avoid;page-break-inside:avoid;
  background:var(--panel-3);border:1px solid var(--line-2);border-left:3px solid var(--c,var(--line-2));
  border-radius:10px;padding:7px 10px 8px;margin:0 0 9px;cursor:pointer;transition:.15s}
.segcard:hover{border-color:var(--c)}
.segcard.sel{background:color-mix(in srgb,var(--c) 12%,var(--panel-3));box-shadow:0 0 0 1px var(--c) inset}
.segcard.dim{opacity:.42}
.segcard .sh{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.segcard .sh .dot{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);flex:none}
.segcard .sh .nm{font-size:14.5px;font-weight:700;color:var(--ink);line-height:1.35}
.segcard .sh .rl{font-size:11px;color:var(--ink-3);border:1px solid var(--line-2);border-radius:5px;padding:0 4px}
.segcard .sh .cnt{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
/* 上游／下游那兩行＝把關聯圖上那 140 條邊收斂成「環節對環節」的說法，可以點 */
/* 一行到底（nowrap＋省略號）：多一行就是多 17px，20 格就是 340px。
   切掉的部分在 title 裡完整列出，滑過去看得到 */
.segcard .sf{display:flex;gap:3px 5px;align-items:center;margin-top:4px;font-size:11.5px;
  color:var(--ink-3);line-height:1.5;white-space:nowrap;overflow:hidden;min-width:0}
.segcard .sf .lb{opacity:.8;white-space:nowrap;flex:none}
/* 名稱可以被擠窄並自己出現省略號 —— 這樣字框**永遠留在卡片裡**。
   用 flex:none 的話溢出去的字框會壓到隔壁欄的卡片（看起來被 overflow 切掉了，
   但版面上還在），_preview.py 的重疊掃描量的就是字框，會判成壓字。*/
.segcard .sf>*{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.segcard .sf .sg{color:var(--c);cursor:pointer;border-bottom:1px dotted color-mix(in srgb,var(--c) 55%,transparent)}
.segcard .sf .sg:hover{color:var(--ink);border-bottom-color:var(--ink)}
.segcard .sf .more{font-family:var(--mono);opacity:.75;cursor:help}
/* 小卡排成固定兩欄的 grid，不用 flex-wrap：
   flex 會依名稱長短決定一列塞得下幾張，「日月光投控」那種五字名一張就佔滿整列，
   於是 8 家公司就是 8 列。grid 讓每張小卡剛好半欄寬、名稱過長由 CSS 省略號處理，
   列數固定是 ceil(n/2) —— 這是清單能比關聯圖矮的主因。*/
.segcard .sms{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:5px;margin-top:6px}
/* 個股小卡：名稱白字、代號小一號的藍字（Andy 附圖就是這個樣子）。
   左邊那條 3px 的色邊是漲跌（紅漲綠跌）—— 不佔寬度，又把關聯圖上原本看得到的漲跌接回來 */
.segcard .sco{display:flex;align-items:center;gap:3px;min-width:0;text-align:left;
  background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--u,var(--line-2));
  border-radius:7px;padding:3px 5px;cursor:pointer;font:inherit;line-height:1.3}
.segcard .sco:hover{border-color:var(--cyan)}
.segcard .sco .nm{font-size:12.5px;font-weight:600;color:var(--ink);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1 1 auto}
.segcard .sco .code{font-family:var(--mono);font-size:12px;/* 精修 #8：11 → 12px 下限 */color:var(--cyan);opacity:.9;flex:none}
.segcard .sco .code.fo{color:var(--ink-3)}
.segcard .sco.foreign{border-style:dashed}
/* 關係條數；0 沿用關聯圖那個橘色「?」（還沒查到具名客戶／供應商，寧可留白也不猜） */
.segcard .sco .rel{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--ink-3);
  background:var(--panel-3);border-radius:4px;padding:0 2px;flex:none}
.segcard .sco .rel.iso{color:#d9a441;background:transparent;border:1px solid rgba(217,164,65,.45)}
.segcard .sco.dim{opacity:.35}
.segcard .nt{margin-top:6px;font-size:11.5px;color:var(--ink-3);line-height:1.5}
/* 手機：一欄，但小卡仍然兩張一列（grid 的 minmax 在 330px 的卡裡剛好排得下兩張），
   字級往上加到 13.5／15px —— 手機正文不得小於 15px、任何字不得小於 11px */
@media (max-width:560px){ .seglist{columns:1} .segcard .sco .nm{font-size:13.5px} .segcard .sh .nm{font-size:15px} }

/* ============ 族群（板塊）卡片 ＋ 成分股「顯示全部」（2026-09-21）============
   tide 的 110 個板塊上線之後，半導體鏈的族群卡從 9 張變成 24 張、成分股從 47 檔變成 156 檔。
   量出來 390px 半導體整頁 6983 → 12357，其中族群卡 2868、成分股表 6332。
   Andy 抱怨過兩次的「上下框度太長」又回來了，但這次的大戶不是關聯圖 ——
   關聯圖那一塊（#chainList）現在是 1076px，還在 D0 訂的門檻 1250 以內。

   桌機的尺寸跟以前完全一樣（原本寫在行內樣式，只是搬到這裡好讓手機蓋得掉）。*/
#groupCards .tile{min-width:180px;flex:1 1 200px;max-width:360px}
/* 成分股表下面那一排：一顆鈕 ＋ 一句「所以我該怎麼用」 */
.morebar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:8px}
.morebar[hidden]{display:none}
.morebar .muted{font-size:12px;line-height:1.6;flex:1 1 220px;min-width:0}
@media (max-width:560px){
  /* 手機上 24 張 120px 的卡片＝2868px，而且一排只塞得下一張 —— 那是在浪費整個螢幕寬。
     改成「一行一個板塊」：名稱在左、漲跌在右，第二行放檔數／佔比／本益比與「族群頁 →」。
     ★ 一個板塊都沒有藏：24 個板塊還是 24 列，只是不再各自佔掉一個卡片的高度。*/
  #groupCards{display:block}
  #groupCards .tile{min-width:0;max-width:none;display:grid;grid-template-columns:1fr auto;
    align-items:center;column-gap:10px;row-gap:1px;padding:7px 10px;margin:0 0 5px}
  #groupCards .tile .t{grid-column:1;grid-row:1;font-size:15px;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* 漲跌與「族群頁 →」本來就包在同一個 .row 裡，整個搬到右欄第一行就好 */
  #groupCards .tile .row{grid-column:2;grid-row:1;margin:0!important;gap:8px;flex-wrap:nowrap}
  #groupCards .tile .row .v{font-size:16px;margin:0!important}
  #groupCards .tile .m{grid-column:1/-1;grid-row:2;font-size:12px;margin:0;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
}

/* ---- C4 ＋ A4（2026-09-20）：輪動時鐘／資金流向排行的篩選列與軌跡開關。
   樣式刻意和圖15 漲跌分佈的 #distFilter 同一套（Andy 附的「圖一」就是那個），
   所以兩張卡的互動語彙一致。
   窄畫面（800px / 390px）一律允許換行 —— 這一排有 seg ＋ 勾選 ＋ 三顆鈕，
   不換行在 800px 半格寬度下一定會溢出（2026-09-18 E6 就是只驗寬螢幕放過去的）。*/
.rotfilter{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:6px 0 4px}
.rotfilter .muted{font-size:11.5px}
.rotchk{display:inline-flex;align-items:center;gap:4px;cursor:pointer;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.rottools{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:2px 0 0;font-size:12px;color:var(--ink-3)}
.rottools .muted{font-size:11.5px}
/* 2026-09-21：個股篩選面板（.rotpick / .rotsearch / .rotstocklist）整組移除，樣式一併刪掉，不留死碼 */
@media (max-width:900px){ .rotfilter{gap:5px 6px} }

/* ★ 2026-09-21 合併卡（Andy：「這兩張圖合併，共用同個篩選資訊 週期 分類等等」）。
   ★ 2026-09-23 D1：那兩支拉Bar 本身也合併成**一條雙把手的區間桿**（見下面 `.rbar .dual`），
     所以 `.rottime` 現在只有「區間桿 ＋ 軌跡開關」兩塊。
   flex-wrap 是硬需求 —— 800px／390px 下區間桿 ＋ 軌跡開關一定擠不下同一行，
   不換行就會凸出卡片（2026-09-18 E6 那次就是只驗寬螢幕放過去的）。
   軌跡開關後面那串說明字很長，所以給它 flex-basis 讓它自己換到下一行。*/
.rottime{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;margin:2px 0 4px}
.rottime>#rotBack{flex:0 1 auto}
.rottime>.rottools{flex:1 1 320px;margin:0}

/* ★ D1：雙把手區間桿。兩支 `<input type=range>` 疊在同一條軌道上 ——
   軌道本身 `pointer-events:none`，只有**滑塊**吃得到滑鼠，所以兩支互不搶事件。
   `.lo`（區間起點）寫在後面＝疊在上層，兩個滑塊剛好碰在一起時先抓到的是它；
   「看哪一天」那支（`.hi`）寫在前面，是為了讓 `box.querySelector('input')` 抓到主角。*/
.rbar .dual{position:relative;width:168px;height:18px;flex:0 0 auto}
.rbar .dual .track{position:absolute;left:0;right:0;top:7px;height:4px;border-radius:999px;background:var(--line-2)}
.rbar .dual .sel{position:absolute;top:7px;height:4px;border-radius:999px;background:var(--cyan);opacity:.5}
.rbar .dual input[type=range]{position:absolute;left:0;top:0;width:100%;height:18px;margin:0;
  -webkit-appearance:none;appearance:none;background:transparent;pointer-events:none}
.rbar .dual input[type=range]::-webkit-slider-runnable-track{height:4px;background:transparent;border:none}
.rbar .dual input[type=range]::-moz-range-track{height:4px;background:transparent;border:none}
.rbar .dual input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;
  width:13px;height:13px;margin-top:-4.5px;border-radius:999px;background:var(--cyan);border:none;cursor:pointer}
.rbar .dual input[type=range]::-moz-range-thumb{pointer-events:auto;
  width:13px;height:13px;border-radius:999px;background:var(--cyan);border:none;cursor:pointer}
/* 起點那顆用灰色：兩顆同色的話讀不出「哪一顆是我在看的那一天」 */
.rbar .dual input.lo::-webkit-slider-thumb{background:var(--ink-3)}
.rbar .dual input.lo::-moz-range-thumb{background:var(--ink-3)}
.rbar .dual input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 3px color-mix(in srgb,var(--cyan) 40%,transparent)}
.rbar .val{min-width:150px}
@media (max-width:900px){ .rbar .dual{width:128px} .rbar .val{min-width:0} }
/* 2026-09-24 足跡輪盤的單一拉Bar（dayBar）：數字緊跟著拉Bar，不要右對齊撐出一大段空白 */
.rbar.daybar .val{min-width:0;text-align:left}
/* ★ 2026-09-25（審查 R2 #12：800 寬「N 天前」拉Bar 只剩 96px ＝ 每天約 3px，很難拖準）：
   ≤900px 時足跡輪盤那條單一拉Bar 吃掉這一列剩下的寬，最少 160px。*/
@media (max-width:900px){ .rbar.daybar{flex:1 1 auto;max-width:100%} .rbar.daybar input[type=range]{flex:1 1 160px;min-width:160px;width:auto} }

/* ★ D2：象限展開面板搬到時鐘右邊那塊空白。時鐘吃剩下的寬（min-width:0 才縮得下去），
   面板固定 300px。≤1100px 退回單欄（300px 面板 ＋ 讀得出來的時鐘在 800px 裡放不下）。*/
.rotstagerow{display:flex;align-items:flex-start;gap:12px}
.rotstagerow>#rotClockWrap{flex:1 1 auto;min-width:0}
/* 2026-09-24：300 → 330px。面板改成對齊的格線之後，族群名那一欄是「剩下的寬度」；
   300px 時只剩約 80px（「石化與塑膠…」「電子零組件…」全被截），330px 約 120px，大部分名字寫得完。
   時鐘那一欄本來在面板打開時就已經是編號模式（容器 < 560px），少 30px 只是盤面略小。*/
.rotstagerow>.stagepanel{flex:0 0 330px;max-width:330px;margin-top:0}
@media (max-width:1100px){
  .rotstagerow{display:block}
  .rotstagerow>.stagepanel{max-width:none;margin-top:10px}
}

/* ★ 2026-09-25：輪盤欄標題列（足跡輪盤＋日期區間／放大鈕在右端） */
.rotchead{align-items:center;margin:2px 0 4px;gap:8px}
.rotchead h4.subh{margin:0}
/* ★ 2026-09-25 合併側欄（Andy：「佔太多空間…兩張圖合併，並調整適當大小」）：
   側欄不再 inset:0 撐滿整欄，高度跟著內容走（最多到整欄高、超過才自己捲），底下的排行圖露出來；
   列高、字級、內距一起收小。只影響 >1100px 蓋在排行上的那一型。 */
@media (min-width:1101px){
  #rankFlowWrap>.sidepanel.stagepanel{bottom:auto;max-height:100%;padding:8px 10px}
  #rankFlowWrap>.sidepanel .ph{font-size:12px;gap:6px}
  #rankFlowWrap>.sidepanel .ph b{font-size:13.5px}
  #rankFlowWrap>.sidepanel .sd{font-size:11.5px;margin:3px 0 0;line-height:1.4}
  #rankFlowWrap>.stagepanel ul.ms{margin-top:4px}
  #rankFlowWrap>.stagepanel ul.ms li:not(.mem){padding-top:3px;padding-bottom:3px;font-size:12px}
  #rankFlowWrap>.stagepanel ul.ms li .v{font-size:11.5px}
}
.stagepanel ul.ms li .tw2{flex:none;width:10px;font-size:11px;color:var(--ink-3)}
.stagepanel ul.ms li.ison{background:var(--panel-2)}
.stagepanel ul.ms li.ison .g{color:var(--cyan,var(--ink))}
/* 展開那一列底下的成分股小表：一行一檔，名稱｜代號｜成交值｜佔比｜漲跌｜→ */
.stagepanel ul.ms li.mem{display:block;cursor:default;padding:2px 0 6px 14px;border-top:0}
.stagepanel ul.ms li.mem:hover{background:transparent}
.stagepanel .mt .mr{display:grid;grid-template-columns:minmax(0,1fr) 38px 52px 40px 50px 14px;column-gap:5px;
  align-items:center;font-size:11.5px;line-height:1.35;padding:2px 4px;border-radius:5px;cursor:pointer}
.stagepanel .mt .mr>*{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stagepanel .mt .mr:hover{background:var(--panel-2)}
.stagepanel .mt .mr .nm{color:var(--ink);font-weight:600}
.stagepanel .mt .mr .c{font-family:var(--mono);color:var(--ink-3)}
.stagepanel .mt .mr .v{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink-2)}
.stagepanel .mt .mr b.v.up{color:var(--rise)} .stagepanel .mt .mr b.v.down{color:var(--fall)}
.stagepanel .mt .mr a.go{display:block;padding:0;margin:0;border:0;background:none;min-height:0;box-shadow:none;color:var(--cyan,var(--ink-2));text-decoration:none;text-align:center;font-weight:700}
.stagepanel .mt .mr.ison{box-shadow:inset 2px 0 0 var(--c)}
.stagepanel .mt .mr.noplot .nm{color:var(--ink-3);font-weight:500}
.stagepanel .mt .mr.none{display:block;cursor:default}
.stagepanel li.mem .mw{font-size:11px;padding:2px 4px}

/* ★ D7：總覽「輪動階段」卡片下半的「昨日資金去向」小標與圖 */
h4.ovflowh{margin-top:14px;padding-top:12px;border-top:1px solid var(--line-2)}
/* 合併之後兩張圖各自需要一行小標（卡片標題已經被「資金輪動」佔走）。
   用 h4 而不是 h3：同一張卡裡的層級要看得出來，而且 h3 的字級會把圖往下推。*/
.rotpane{display:flex;flex-direction:column;min-width:0}
h4.subh{margin:0 0 6px;font-size:13.5px;color:var(--ink-1);display:flex;flex-wrap:wrap;
  align-items:baseline;gap:4px 8px}
h4.subh small{font-size:11.5px;font-weight:500;color:var(--ink-3)}
/* 圖區在窄畫面退單欄之後，上下兩塊要有間隔（.grid 的 gap 只在格與格之間） */
@media (max-width:1100px){ .rotpane+.rotpane{margin-top:4px} }
/* ★ 2026-09-24（Andy：「排行圖被擠到下方、上方一大片空白」）：資金輪動卡整張兩欄（HTML 註解有全文）。
   左欄第一列是卡片標題、右欄第一列是排行小標＋兩顆鈕，兩列同高（min-height 32px、垂直置中），
   所以排行圖的頂端跟篩選列同一高度（離卡片頂 ≈ 16 + 32 + 4 ＝ 52px）。
   排行那一格 flex 撐滿整欄：左欄（輪盤）多高，排行就畫多高，底下不留空。*/
.rotcols{align-items:stretch}
/* ★ 2026-09-24 夜（Andy：「資金流向排行版面太窄、不符審美：排行區至少占卡片寬 40%」）：
   2fr:1fr（排行 33%）→ 1.4fr:1fr（扣掉欄間距後排行 ≈ 41%；1.45 量出來只有 39.7%）。輪盤那一欄變窄一點，但它的高度改成跟著欄寬走（rotFitH），
   盤的半徑仍比舊版大（1440 寬、開著今日事件側欄：185 → 約 215px）。≤1100px 照舊單欄。*/
@media (min-width:1101px){ .rotcols{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)} }
.rotcols .rothead,.rotcols .rotrhead{min-height:32px;align-items:center;margin-bottom:4px}
.rotcols .rothead h3{margin:0}
.rotcols .rotrhead h4.subh{margin:0}
/* 右欄只有全寬的 1/3：鈕一定留在同一列，放不下時是日期那行字在小標裡換行，不是把兩顆鈕擠到下一列 */
.rotcols .rotrhead{flex-wrap:nowrap;gap:8px}
.rotcols .rotrhead h4.subh{flex:1 1 auto;min-width:0}
.rotcols .rotrhead .rotbtns{flex:0 0 auto}
.rotright>#rankFlowWrap{flex:1 1 auto;display:flex;flex-direction:column;min-height:420px}
.rotright>#rankFlowWrap>#rankFlow{flex:1 1 auto}
/* 側欄（象限面板／成分股面板）蓋在右欄上：自己捲；輪盤那一欄的寬度完全不動。掛在 #rankFlowWrap 上（只蓋排行圖）—— 排行小標與放大／怎麼看兩顆鈕照樣看得到、按得到；
   .rotright 刻意不設 position，≤1100px 那兩顆鈕的 absolute 才會對準卡片右上角 */
#rankFlowWrap{position:relative}
#rankFlowWrap>.sidepanel{position:absolute;inset:0;z-index:6;margin:0;max-width:none;overflow:hidden;
  box-shadow:0 12px 32px -12px rgba(0,0,0,.55);animation:sidein .16s ease-out}
/* 面板本身是直欄 flex：標題列固定、清單（.ms）吃剩下的高度並自己捲 —— 清單仍是「固定高度＋可捲」那一套，
   只是高度改成「排行圖有多高就多高」。[hidden] 要另外寫：這條的 display:flex 權重比 .hpanel[hidden] 高 */
#rankFlowWrap>.sidepanel{display:flex;flex-direction:column}
#rankFlowWrap>.sidepanel[hidden]{display:none}
#rankFlowWrap>.sidepanel>*{flex:none}
#rankFlowWrap>.sidepanel .ms,#rankFlowWrap>.stagepanel ul.ms{flex:1 1 auto;min-height:0;max-height:none;overflow-y:auto}
@keyframes sidein{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){ #rankFlowWrap>.sidepanel{animation:none} }
/* 審查 R2 #24：面板開著時輪盤不縮了，所以 .rotstagerow 只剩輪盤一格 */
/* 退單欄時排行跑到輪盤下面 —— 兩顆鈕不跟著掉下去，釘在卡片右上角（仍是「卡片標題列右側」）*/
@media (max-width:1100px){
  #flowRotCard .rothead{padding-right:190px}
  #flowRotCard .rotbtns{position:absolute;top:16px;right:18px}
}

/* ---------------------------------------------------------------- 任務板（#tasks）
   刻意用「一張卡一件事」而不是表格：表格在手機上一定要橫捲，
   而 Andy 有時候是在手機上看「到底做完了沒」。 */
.tkwrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;margin-top:10px}
.tk{border:1px solid var(--line);border-left-width:3px;border-radius:12px;padding:10px 12px;background:var(--panel-3)}
.tk-h{display:flex;align-items:center;gap:8px;justify-content:space-between}
.tk-h b{font-family:var(--mono);font-size:13px;color:var(--ink-2)}
.tk-st{font-size:11.5px;color:var(--ink-3)}
.tk-t{margin-top:4px;font-size:13.5px;line-height:1.5}
.tk-n{margin-top:6px;font-size:12px;color:var(--ink-3);line-height:1.6}
.tk-ask{margin-top:6px;font-size:12.5px;color:var(--cyan);line-height:1.6}
.tk-f{margin-top:7px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tk-f code{font-size:11px;color:var(--ink-3);background:var(--panel-2);border-radius:5px;padding:1px 6px}
.tk-sp{font-size:11px;color:var(--ink-3)}
/* 左邊那條色帶就是狀態，不用再找圖例 */
.tk.st-blocked{border-left-color:var(--fall)}
.tk.st-doing{border-left-color:var(--cyan)}
.tk.st-review{border-left-color:var(--amber)}
.tk.st-todo{border-left-color:var(--line-2)}
.tk.st-done{border-left-color:var(--rise)}
.pill.st-blocked{color:var(--fall)}
.pill.st-doing{color:var(--cyan)}
.pill.st-review{color:var(--amber)}
.pill.st-done{color:var(--rise)}
.card.hot{border-color:color-mix(in srgb,var(--fall) 40%,transparent)}
@media(max-width:700px){.tkwrap{grid-template-columns:1fr}}

/* ============ 交付清單（`#delivery`，Andy 2026-09-23）============
   他問的是：「要用什麼方式可以讓你一次就知道我問的問題不會被遺忘，且如實完成」。
   答案是把**他的原話**攤在網頁上 —— 他只重新整理網頁，清單寫在對話裡他驗不了。
   所以版面的主角是引號裡那段原話，「我做了什麼」是配角，刻意做小一級。
   五種狀態＝五個 token，不寫死色碼（DECISIONS #198 那個病）。
   ★ 這裡的綠色是「完成」不是「下跌」：狀態徽章跟報價無關，所以用 --lime 而不是 --fall，
     免得跟紅漲綠跌的價格色混在一起。 */
:root{
  --dlv-done:var(--lime); --dlv-wip:var(--cyan); --dlv-next:var(--violet);
  --dlv-ask:var(--amber); --dlv-drop:var(--ink-3);
}
.dlvwrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:12px;margin-top:12px}
.dlv{border:1px solid var(--line);border-left:4px solid var(--line-2);border-radius:12px;
  padding:12px 14px;background:var(--panel-3);display:flex;flex-direction:column;gap:8px;min-width:0}
/* 「這是你說的」：引號 ＋ 左色條，一眼分得出哪段是他的話、哪段是我的話 */
.dlv-q{position:relative;font-size:14.5px;line-height:1.6;color:var(--ink);font-weight:600;
  padding-left:22px;word-break:break-word}
.dlv-q::before{content:'\201C';position:absolute;left:0;top:-4px;font-size:26px;line-height:1;
  color:var(--ink-3);font-family:Georgia,serif}
.dlv-tag{display:block;font-size:12px;/* 精修 #8 */color:var(--ink-3);font-weight:400;letter-spacing:.05em;margin-bottom:2px}
.dlv-w{font-size:13px;line-height:1.65;color:var(--ink-2);word-break:break-word}
.dlv-w b{color:var(--ink-3);font-weight:600;font-size:12px;/* 精修 #8 */display:block;margin-bottom:2px}
.dlv-n{font-size:12px;line-height:1.65;color:var(--ink-3);border-left:2px dashed var(--line-2);
  padding-left:9px;word-break:break-word}
.dlv-n b{color:var(--amber);font-weight:600}
.dlv-f{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:auto;
  padding-top:8px;border-top:1px dashed var(--line);font-size:12px}
.dlv-ver{font-family:var(--mono);font-size:12px;/* 精修 #8 */color:var(--ink-3)}
.dlv-go{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:12px;
  border:1px solid var(--line-2);background:var(--panel);color:var(--cyan);cursor:pointer}
.dlv-go:hover{border-color:var(--cyan);box-shadow:var(--glow)}
.dlv-none{font-size:12px;/* 精修 #8 */color:var(--ink-3)}
.dlv-b{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;/* 精修 #8：11.5 → 12px 下限 */
  font-size:12px;font-weight:600;border:1px solid currentColor}
/* 一筆的狀態同時決定左邊色條與徽章顏色 —— 只有一個地方定義 */
.dlv.s-done{border-left-color:var(--dlv-done)} .dlv-b.s-done{color:var(--dlv-done)}
.dlv.s-wip{border-left-color:var(--dlv-wip)}   .dlv-b.s-wip{color:var(--dlv-wip)}
.dlv.s-next{border-left-color:var(--dlv-next)} .dlv-b.s-next{color:var(--dlv-next)}
.dlv.s-ask{border-left-color:var(--dlv-ask)}   .dlv-b.s-ask{color:var(--dlv-ask)}
.dlv.s-drop{border-left-color:var(--dlv-drop);opacity:.72} .dlv-b.s-drop{color:var(--dlv-drop)}
/* `ask` 是在等他回答 —— 整張卡要醒目，不然會沉在 31 筆已上線裡面找不到 */
.dlv.s-ask{background:color-mix(in srgb,var(--amber) 9%,var(--panel-3));
  border-color:color-mix(in srgb,var(--amber) 45%,transparent)}
/* ★ 2026-09-23 UI 精修 #2 的連帶處理：這張卡的底是「琥珀 9% 混 --panel-3」，
   比別的卡亮（深色）／暗（淺色）一階，於是 --ink-3 在上面只剩 4.14（深）／4.40（淺），
   兩個都掉到 4.5 以下。不動那個 9%（它是「這張卡要醒目」的理由），
   改成把這張卡上的次要文字提到 --ink-2 → 6.25／6.56。
   ⚠ 這是全站唯一有色底的卡，所以只需要這一條例外，不是開一個新機制。*/
.dlv.s-ask .dlv-tag,.dlv.s-ask .dlv-n,.dlv.s-ask .dlv-ver,.dlv.s-ask .dlv-none{color:var(--ink-2)}
/* 摘要列同時就是篩選鈕：一個控制項，不要摘要一排、篩選又一排 */
.dlvfil{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.dlvfil button{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;
  font-size:12.5px;border:1px solid var(--line-2);background:var(--panel);color:var(--ink-2);cursor:pointer}
.dlvfil button:hover{border-color:var(--cyan);color:var(--ink)}
.dlvfil button.on{color:var(--ontop);background:var(--cyan);font-weight:700;border-color:var(--cyan)}
.dlvfil button b{font-family:var(--mono);font-size:12px}
/* ★ 不要叫 `.empty`：全站已經有一個 `.empty{min-height:160px}`（空狀態容器），
   撞名的話這一排篩選鈕會被撐成 160px 高的巨大膠囊。 */
.dlvfil button.zero{opacity:.45}
@media(max-width:860px){.dlvwrap{grid-template-columns:1fr}}
@media(max-width:430px){.dlv-q{font-size:13.5px}.dlvfil button{font-size:12px;padding:5px 10px}}

/* ============ C3 後半（2026-09-20 下午）：環節卡清單在手機上的「重點展開」============
   前一輪把供應鏈關聯圖改成環節卡清單之後，**桌機短了、手機反而長了**：
   390px 半導體 1088 → 1846、AI 伺服器 780 → 2599。
   根因不是小卡太多，是「每張環節卡的固定成本（標題＋上下游＋內距外距約 70px）
   × 環節數」—— AI 伺服器 20 格光固定成本就 1400px，67 張小卡才佔 1200px。
   所以收的不是小卡（那是 Andy 指名要的東西），是**同時攤開的卡片張數**。

   ★ 這一段只在 ≤560px 生效，桌機（1366／1500／1920）一個像素都不動 ——
   `.sb` 在桌機只是一層沒有樣式的包裝 div。*/
.segtools{display:none}
/* 收合鈕：桌機不存在（桌機永遠攤開，多一顆按不出東西的鈕只會讓人困惑）。
   13px 不是裝飾字級 —— 全站規定任何字不得小於 11px，而這顆是要用指頭點的。*/
.segcard .sx{display:none;align-items:center;justify-content:center;flex:none;
  width:30px;height:24px;margin:-2px -6px -2px 2px;padding:0;border:0;border-radius:6px;
  background:transparent;color:var(--ink-3);font:inherit;font-size:13px;line-height:1;
  cursor:pointer;transition:.15s}
.segcard .sx:hover{color:var(--ink);background:var(--panel)}
.segcard.open .sx{transform:rotate(180deg)}
@media (max-width:560px){
  /* 工具列：一顆總開關＋一句說明。說明要寫「所以我該怎麼用」，不是只說有這個功能 */
  .segtools{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:0 0 8px}
  .segtools[hidden]{display:none}
  .segtools .muted{font-size:11.5px;line-height:1.5;flex:1 1 150px;min-width:0}
  .segcard .sx{display:inline-flex}
  /* 卡片本身也收緊一點：每張省 5px，20 格就是 100px，而且完全不犧牲任何內容 */
  .segcard{padding:5px 9px;margin-bottom:6px}
  .segcard.open{padding-bottom:7px}
  /* 標題列不准換行 —— 換一行就是多 20px×環節數，等於把收合省下來的又吐回去。
     名稱可以被擠窄並自己出現省略號，完整名稱本來就在下方成分股標題與 title 裡 */
  .segcard .sh{flex-wrap:nowrap}
  .segcard .sh .nm{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .segcard .sh .rl,.segcard .sh .cnt{flex:none}
}

/* ---------------------------------------------------------------- 2026-09-20
   資金去向：四層樹 ＋ 右側個股成交值排序面板
   （Andy：「當點擊族群時會在右邊出現個股的成交值排序」）

   用 flex 不用 grid：面板是「點了才出現」的，grid 要先留一欄，
   沒開的時候右邊會空一塊，圖也跟著變窄 —— 那是一眼就看得出來的浪費。
   #sankeyWrap 一定要 min-width:0，否則 flex 子項的最小內容寬度會撐破卡片
   （ECharts 容器本身沒有內容寬，但 .chart 的 min-height 那條規則不擋這個）。*/
#sankeyRow{display:flex;gap:14px;align-items:flex-start}
#sankeyRow #sankeyWrap{flex:1 1 auto;min-width:0}
#sankeyRow #sankeyPanel{flex:0 0 300px;max-width:300px;margin-top:0}
/* 清單比 .hpanel 預設的 232px 高一點：右欄本來就有整張圖那麼高，
   232px 會在一大片空白裡放一個小盒子。仍然是固定高度＋自己捲，規矩沒變。*/
#sankeyRow #sankeyPanel .ms{max-height:420px}
@media (max-width:900px){
  #sankeyRow{display:block}
  #sankeyRow #sankeyPanel{max-width:none;margin-top:12px}
  #sankeyRow #sankeyPanel .ms{max-height:190px}
}
/* ★ 2026-09-21：`.stack` ＝「這個寬度放不下『圖 ＋ 300px 面板』，面板改放到圖下面」。
   為什麼要有這個：面板一打開就吃掉 314px，1280～1440 的筆電上圖會被壓到 700px 以下，
   於是 renderSankey 判定成窄畫面、**把代表股那一整層收掉** ——
   結果就是「點族群想看它的成分股，反而看不到成分股」。
   這條是 JS 量完 #sankeyRow 的寬度才掛上去的（不是媒體查詢），因為判準是
   「圖剩幾 px」而不是「螢幕幾 px」，中間還隔著側欄與卡片內距，媒體查詢算不出來。*/
#sankeyRow.stack{display:block}
#sankeyRow.stack #sankeyPanel{max-width:none;margin-top:12px}
/* 面板從 300px 的側欄變成整列之後，格子會被排成一堆 168px 的窄欄 ——
   「元大台灣50正2」就會被折成一個字一行，而右邊的「87.0 億 11.5% +1.7%」也折成三行。
   一格真正需要的寬度是 名稱 80 ＋ 代號 40 ＋ 數字 150 ≈ 272px，所以整列模式改用 272。
   名稱再長就截字（…），不要讓它去折行 —— 中文可以在任何字之間斷，折起來只會變成直排。*/
#sankeyRow.stack #sankeyPanel .ms{max-height:260px;grid-template-columns:repeat(auto-fill,minmax(272px,1fr))}
#sankeyRow.stack #sankeyPanel .ms a>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ===================== 2026-09-20：大盤三張圖（site/market3.js）===================== */
/* ① 夜盤的說明帶。
   Andy 2026-09-20：「台指期夜盤怎麼可能沒數據，幫我更新走勢圖以及 K 線上去，格式 follow 加權指數」。
   以前 .m3-night 是 height:100% 的方框，**把整張圖換掉**；他不接受，而且他是對的 ——
   「還沒有序列」不是「不要畫圖」的理由。現在圖照畫（跟加權指數同一套 drawLine/drawK），
   說明縮成圖上方一條窄帶，而且只在還沒接到官方分時序列時才出現。
   right 留 60px：走勢圖的 y 軸標籤就在右邊那一欄（grid right:58），蓋住會讀不到價格。 */
.m3-chart .m3-night{position:absolute;left:10px;right:60px;top:6px;z-index:3;
  height:auto;max-height:46%;overflow:auto;padding:7px 10px;border-radius:9px;
  display:block;gap:0;
  background:color-mix(in srgb,var(--chartbg) 90%,transparent);
  border:1px solid color-mix(in srgb,var(--violet) 32%,transparent)}
.m3-chart .m3-night .m3-q b{font-size:12.5px}
.m3-chart .m3-night .note{font-size:11.5px;line-height:1.5;margin-top:2px}
/* ② 呼吸燈：三張走勢圖「最新的那一點」。
   Andy 2026-09-20：「三張走勢圖最新的點需要做呼吸燈圓圈…只要他正在即時更新就會執行呼吸燈效果」。
   兩層是刻意的：core 永遠在（那是「最新一筆在這裡」這個事實），
   ring 只有 .on 的時候才擴散（那是「它還在跳」這個狀態）。
   會說謊的燈比沒有燈更糟，所以 .on 由 market3.js 的 isPulsing() 決定，不是一直掛著。
   定位點就是那一點本身，所以 core/ring 用負的 left/top 讓自己置中。 */
.m3-pulse{position:absolute;width:0;height:0;pointer-events:none;z-index:4;--c:var(--rise)}
/* 開盤前幾分鐘資料只佔幾個 px，核心 7px 會比整條線還寬 —— 收到 5px（見 market3.js 的註解） */
.m3-pulse.tiny .m3-core{left:-2.5px;top:-2.5px;width:5px;height:5px}
.m3-pulse .m3-core{position:absolute;left:-3.5px;top:-3.5px;width:7px;height:7px;border-radius:50%;
  background:var(--c);box-shadow:0 0 7px var(--c);display:block}
.m3-pulse .m3-ring{position:absolute;left:calc(var(--r,16px) / -2);top:calc(var(--r,16px) / -2);
  width:var(--r,16px);height:var(--r,16px);border-radius:50%;
  border:1.5px solid var(--c);opacity:0;transform:scale(.5);display:block}
.m3-pulse.on .m3-ring{animation:m3breathe 1.6s ease-in-out infinite}
@keyframes m3breathe{
  0%{opacity:.9;transform:scale(.45)}
  70%{opacity:.08;transform:scale(2.2)}
  100%{opacity:0;transform:scale(2.2)}}
/* 會暈車的人把動畫放慢，但**不關掉** —— 這盞燈本身是資訊（還在不在更新），關掉等於少一格資料 */
@media(prefers-reduced-motion:reduce){.m3-pulse.on .m3-ring{animation-duration:3.6s}}
@media(max-width:900px){.m3-chart .m3-night{right:52px;max-height:52%}}

/* ================= 供應鏈關聯圖（2026-09-23 C5 退版；2026-09-26 流向圖拿掉，只剩分層圖）=================
   Andy 逐字：「下方的關聯圖回到之前的設計，幫我退版 回到之前的格式，但是需要將關聯圖置中，
   並且，Default 顯示族群相連標籤個股，點擊後才會跳初下拉清單，並且點擊股票 右側會顯示對應訊息」。

   力導向星際圖（DECISIONS #248）那 320 行樣式整組刪掉 —— 產業鏈頁不再有 `.cgraph`，
   留著就是死樣式。分層圖與環節卡清單的樣式本來就還在（`.chainmap` / `.seglist` 兩節），
   這裡只補退版後新增的 hover 提亮上下游（表達形式切換與流向圖已於 2026-09-26 依 Andy「刪除流向圖」整組拿掉）。

   ★ 置中不是靠 CSS 做的（`margin:auto` 對 `width:100%` 的 SVG 沒有作用）——
     是 industry.js 的 `fitCols()` 把左右內距算成一樣大，寫進 viewBox 裡。
     CSS 這邊只要**不要再有 max-width 把它卡住**就好，那正是舊版靠左的原因。*/
.relsec{margin-top:16px;max-width:100%;min-width:0}
.relsec .chainrow{max-width:100%;min-width:0}
/* ================= 產業鏈頁的供應鏈關聯圖：環節下拉 ＋ 選中環節的族群／個股（2026-09-24）
   Andy：「只留下供應鏈關聯圖，其他的用清單方式呈現族群以及個股」「上方標籤改成下拉清單、下方環節字卡全部拿掉」。
   只動桌機（>820px）：
   · #segDD：一顆「環節：全部 ▾」下拉，樣式照資金輪動卡 .rotdd（一列一格、右邊數量、選中高亮）。
     面板就是原本的 #segChips（每一列仍是 .segchip），所以篩選的程式碼沒換路。
   · .relmain 是 grid：第一列下拉、第二列圖；選了一格（.hassel）或開了公司資訊欄才切成「圖｜右欄」兩欄。
     右欄 .relcol 用 contain:size —— 它自己的內容高度不算進列高，列高＝圖的高度，所以「與圖等高」；
     欄裡的 .relstick 是 sticky（捲頁時黏在頂部列下面），上限是「欄高」與「視窗高」取小，裡面自己捲。
   · 圖下方的環節字卡 #chainList（與它的手機總開關 #segTools）在桌機藏起來：跟上面的圖重複。
   手機（≤820px）：下拉鈕藏起來、面板攤開成原本那排色標；右欄不顯示；順序照舊「色標 → 環節詳情 → 圖 → 字卡」。*/
.relmain{min-width:0}
.segchips .segall{display:none}
/* 整條鏈沒有任何上下游時，圖上方明講一句（審查 R3：金融鏈流向圖 0 條帶子、沒有說明，看起來像壞掉） */
.chainmap .mapempty{margin:10px 12px 0;padding:8px 12px;border-radius:8px;border:1px dashed var(--line-2);
  color:var(--ink-2);font-size:13px;line-height:1.6;background:color-mix(in srgb,var(--panel) 60%,transparent)}
/* ★ 2026-09-24（審查 R3「大」）：淺色主題下關聯圖以前仍是深藍底（--illus），裡面的公司卡卻吃淺色的 --panel-3（米白），
   環節標題條是深底配暗字 —— 整頁淺色中間挖了一塊黑、字讀不到。
   DECISIONS #239 當初讓 .chainmap 兩個主題都深底，但卡片與字早就跟著主題走了，兩邊對不起來才是問題的根源。
   所以淺色主題改成整張跟主題走：紙色底、白卡、線改用中灰（淺底上 --line-2 太淡看不到）。深色主題一個值都沒動。*/
:root[data-theme="light"] .chainmap{background:var(--panel-2)}
:root[data-theme="light"] .chainmap .co rect{fill:var(--panel)}
:root[data-theme="light"] .chainmap .co.foreign rect{fill:var(--panel-2)}
:root[data-theme="light"] .chainmap .edge{stroke:#8f887b;stroke-opacity:.5}
:root[data-theme="light"] .chainmap .edge.mat{stroke:#8f887b;stroke-opacity:.42}
:root[data-theme="light"] .chainmap .edge.eq{stroke:#a39d90;stroke-opacity:.35}
:root[data-theme="light"] .chainmap .edge.dim{stroke-opacity:.08}
:root[data-theme="light"] .chainmap .edge.hi{stroke:var(--cyan);stroke-opacity:.95}
@media (min-width:821px){
  .relsec #chainList,.relsec #segTools{display:none}
  .relmain{display:grid;grid-template-columns:minmax(0,1fr);column-gap:12px;margin-top:10px}
  .relmain>.segdd{grid-column:1/-1;grid-row:1;justify-self:start;margin-bottom:10px}
  .relmain>#chainMap{grid-column:1;grid-row:2}
  .relmain>.relcol{display:none}
  .relmain>#segBox{grid-column:1/-1;grid-row:3}
  .relmain.hassel,.relmain:has(#coBox){grid-template-columns:minmax(0,1fr) clamp(260px,26%,320px)}
  .relmain.hassel>.relcol,.relmain:has(#coBox)>.relcol{display:block;grid-column:2;grid-row:2;contain:size;min-height:0;min-width:0}
  /* 圖收起來了就沒有「圖的高度」可以對齊：右欄改成佔滿整列、用自己的高度 */
  .relmain.mapfold>.relcol{grid-column:1/-1!important;contain:none!important}
  .relmain.mapfold .relstick{position:static;max-height:70vh}
  .relstick{position:sticky;top:66px;display:flex;flex-direction:column;gap:8px;max-height:min(100%,calc(100vh - 82px));min-height:0}
  .relstick>#coBox.relside{margin:0!important;flex:0 1 auto;min-height:0;max-height:62%;overflow:auto}

  /* ---- 下拉（照 .rotdd 的樣子；不直接掛 .rotdd，因為手機要把面板攤開成色標，全站那組規則會打架） */
  .segdd{position:relative;display:inline-flex}
  .segdd .ddbtn{appearance:none;display:inline-flex;align-items:center;gap:6px;max-width:min(420px,100%);
    padding:5px 12px;border-radius:8px;border:1px solid var(--line-2);background:var(--panel-2);
    color:var(--ink-2);font-size:13px;font-family:inherit;cursor:pointer;white-space:nowrap}
  .segdd .ddbtn b{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis}
  .segdd .ddbtn i{font-style:normal;color:var(--ink-3);font-size:11px}
  .segdd .ddbtn:hover,.segdd.open .ddbtn{border-color:var(--cyan);color:var(--ink)}
  .segdd.open .ddbtn{background:var(--panel)}
  #segChips.ddpanel{display:none;position:absolute;z-index:40;top:calc(100% + 4px);left:0;margin:0;
    width:max-content;min-width:260px;max-width:min(380px,calc(100vw - 32px));max-height:min(420px,70vh);overflow-y:auto;
    flex-direction:column;flex-wrap:nowrap;gap:0;padding:6px;border-radius:10px;border:1px solid var(--line-2);
    background:var(--panel);box-shadow:0 10px 26px rgba(0,0,0,.35);scrollbar-width:thin}
  .segdd.open #segChips.ddpanel{display:flex}
  #segChips .segall,#segChips .segchip{display:flex;align-items:center;gap:8px;width:100%;box-sizing:border-box;min-height:0;
    appearance:none;border:0;border-radius:7px;background:transparent;color:var(--ink-2);font-size:13px;font-family:inherit;
    font-weight:400;text-align:left;padding:6px 9px;cursor:pointer;box-shadow:none}
  #segChips .segall{border-bottom:1px solid var(--line-2);border-radius:7px 7px 0 0;margin-bottom:4px}
  #segChips .segall em,#segChips .segchip .n{margin-left:auto;font-style:normal;color:var(--ink-3);font-size:11.5px;font-family:var(--mono)}
  #segChips .segchip i{width:8px;height:8px;box-shadow:none}
  #segChips .segall:hover,#segChips .segchip:hover{background:var(--panel-2);color:var(--ink)}
  #segChips .segall.on,#segChips .segchip.sel{background:color-mix(in srgb,var(--c,var(--cyan)) 18%,transparent);color:var(--ink);font-weight:600}
  #segChips .segchip.nomem{opacity:1;border-style:none;color:var(--ink-3)}

  /* ---- 右欄：選中環節的族群與個股 */
  #relList.rellist{flex:1 1 auto;min-height:120px;overflow:auto;overscroll-behavior:contain;
    border:1px solid var(--line);border-radius:10px;background:var(--panel-2);padding:0 0 6px}
  .rellist .rlseg{display:none}
  .rellist .rlseg.on{display:block;margin:6px 8px 0;border-left:3px solid var(--c);border-radius:4px 8px 8px 4px}
  .rellist .rlsh{display:flex;align-items:center;gap:8px;padding:7px 6px 7px 10px;border-radius:0 8px 8px 0;
    background:color-mix(in srgb,var(--c) 14%,transparent);font-size:14px;color:var(--ink)}
  .rellist .rlsh i{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
  .rellist .rlsh .n{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--ink-3)}
  .rellist .rlx{appearance:none;border:0;background:transparent;color:var(--ink-3);font-size:17px;line-height:1;
    padding:2px 6px;border-radius:6px;cursor:pointer}
  .rellist .rlx:hover{color:var(--ink);background:var(--panel-3)}
  .rellist .rlbody{padding:2px 4px 4px 10px}
  .rellist .rlgrp{margin-top:4px}
  .rellist .rlgh{display:flex;align-items:center;gap:8px;padding:3px 2px;font-size:12px}
  .rellist .rlgh .n{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-3)}
  .rellist .rlgn{font-size:12px}
  .rellist .rlco{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:8px;padding:4px 6px;border-radius:6px;
    color:var(--ink);text-decoration:none;font-size:13px;line-height:1.35}
  .rellist .rlco:hover{background:var(--panel-3)}
  .rellist .rlco .cd{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
  .rellist .rlco .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rellist .rlco .chg{font-family:var(--mono);font-size:12.5px;text-align:right;min-width:52px}
  .rellist .rlfo,.rellist .rlnt{padding:4px 6px 2px;font-size:12px;line-height:1.55;color:var(--ink-3)}
  .rellist .rlfo .fo{display:inline-block;margin-right:6px;padding:0 6px;border:1px solid var(--line-2);border-radius:999px;font-size:11px;color:var(--ink-3)}
}
@media (max-width:820px){
  .relmain{display:flex;flex-direction:column}
  .segdd .ddbtn{display:none}
  .relmain>.segdd{order:0} .relmain>#segBox{order:1} .relmain>#chainMap{order:2}
  .relmain>.relcol{order:3} .relmain .relstick{display:contents} .relmain #relList{display:none}
