.minisel{background:var(--panel-3);color:var(--ink);border:1px solid var(--line-2);border-radius:8px;
  padding:4px 7px;font-size:12.5px;font-family:inherit;cursor:pointer}
.minisel:hover{border-color:var(--cyan)}
.m3-tfsel{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-3)}
.m3-tfsel select{background:var(--panel-3);color:var(--ink);border:1px solid var(--line-2);border-radius:9px;
  padding:5px 9px;font-size:13.5px;font-family:inherit;cursor:pointer}
.m3-tfsel select:hover{border-color:var(--cyan)}
.m3-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.m3-grid.big{grid-template-columns:1fr}
.m3-card{padding:12px 14px 10px}
.m3-h{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.m3-h h3{font-size:15px}
/* min-height 是為了讓三張圖的起點對齊：加權的數字比較長會折成兩行，沒有它三張圖會高高低低 */
/* 即時分 K 的來源說明（個股頁）。資料是兩個來源接起來的，口徑一定要寫在畫面上 */
.livenote{margin:6px 0 0;padding:6px 10px;border-radius:8px;border:1px solid var(--line-2);
  background:color-mix(in srgb,var(--amber) 8%,var(--panel));color:var(--ink-2)}
.seg button.livetf::after{content:"●";margin-left:5px;font-size:8px;color:var(--rise);vertical-align:2px}
.seg button.livetf.on::after{color:var(--ontop)}
/* 非交易時段（週末、休市、開盤前）：即時週期畫的是最近交易日 → 灰點＝非即時（Andy 2026-09-26） */
.seg button.livetf.offhrs::after{color:var(--ink-3)}
.seg button.livetf.offhrs.on::after{color:var(--ontop);opacity:.55}
.mtf-cell .cap .mtfoff{font-size:11px;color:var(--ink-3);margin-right:6px}
.m3-nums{display:flex;flex-direction:column;gap:1px;margin:6px 0 8px;min-height:108px}
.m3-px{font-family:var(--mono);font-size:27px;font-weight:700;line-height:1.1}
.m3-chg{font-family:var(--mono);font-size:14px;font-weight:600}
/* 讓它自己換行，不要用省略號 —— 「昨收 46,184…」少了尾數等於沒講 */
.m3-sub{font-size:11.5px;color:var(--ink-3);font-family:var(--mono);line-height:1.55}
.m3-sub b{font-weight:600}
.m3-chart{height:250px;position:relative}
.m3-grid.big .m3-chart{height:clamp(420px,calc(100vh - 420px),760px)}
@media(max-width:1100px){.m3-grid{grid-template-columns:1fr}.m3-chart{height:260px}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.crumbs{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink-3);margin-bottom:12px;flex-wrap:wrap}
.crumbs a{cursor:pointer;color:var(--ink-2)} .crumbs a:hover{color:var(--cyan)}
.crumbs .cur{color:var(--ink);font-weight:700}
.note{font-size:12.5px;color:var(--ink-3);line-height:1.5}

/* ---------------- 全站互通連結 ---------------- */
a.lk{display:inline-flex;align-items:center;gap:5px;cursor:pointer;color:var(--ink);border-bottom:1px dotted transparent;line-height:1.3;white-space:nowrap}
a.lk:hover{color:var(--cyan);border-bottom-color:var(--cyan)}
a.lk-stock{font-weight:600}
/* ★ 2026-09-23 UI 精修 #8：股票代號從相對字級 .82em 改成固定 12px。
   為什麼不是「把 .82 調大」：.82em 是**跟著父層縮**的，父層 12.5px 時實測只剩 10.25px，
   而代號正是全站最常被掃描的欄位 —— 誰在漲、要點進去哪一檔，都是先讀代號。
   改成固定值它就不會再被父層拖下去。12px 是本專案的字級硬下限（--dg-fs-min 同值）。*/
a.lk .code{font-family:var(--mono);font-size:12px;color:var(--cyan);font-weight:500;opacity:.9}
a.lk-group{color:var(--ink-2);font-weight:500}
a.lk-group i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--ink-3));box-shadow:0 0 0 2px color-mix(in srgb,var(--c,var(--ink-3)) 25%,transparent);flex:none}
a.lk-group:hover{color:var(--c,var(--cyan));border-bottom-color:var(--c,var(--cyan))}
a.lk-theme{color:#c3baff;font-weight:500} a.lk-theme::before{content:"#";opacity:.6;margin-right:-3px}
/* ★ 2026-09-24（設計系統 v2 第 1 批順手抓到的）：#c3baff 是深色主題的淡紫，印在淺色主題的白卡片上只有 1.78:1。
   以前卡片是漸層底，「淺色主題」那段對比掃描量不到漸層背景所以一直沒報；卡片改平塗之後就量到了。
   淺色主題改吃 --violet（#5f4ddb，對白 5.88）。.pill.violet 是同一個寫死值，一起修。*/
:root[data-theme="light"] a.lk-theme,:root[data-theme="light"] .pill.violet{color:var(--violet)}
a.lk-chain{color:var(--cyan);font-weight:600}
a.lk-back{color:var(--ink-3);font-size:13px} a.lk-back:hover{color:var(--ink)}
a.lk.sm{font-size:12px;font-weight:500}
/* 2026-09-25：產業鏈頁的環節資訊面板與「其他產業鏈」連結列桌機拿掉（JS 已不畫 segBox 內容；
   這條是給「手機載入後拉寬成桌機」那種情況保底）。手機照舊。 */
@media (min-width:821px){#segBox,.linkrow.chainothers{display:none!important}}
.linkrow{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:13px;align-items:center}
.linkrow>.muted{font-size:12px;letter-spacing:.06em}
.linkrow a.lk{padding:2px 8px;border-radius:999px;background:var(--panel-3);border:1px solid var(--line);border-bottom-width:1px;font-size:12.5px}
.linkrow a.lk:hover{border-color:var(--c,var(--cyan))}
/* E5：產業鏈頁最上方的類別切換列 —— 換一條鏈不用退回產業地圖。橫向可捲，手機也放得下 */
.chainsw{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:10px;
  border-bottom:1px solid var(--line);scrollbar-width:thin}
.chainsw button{flex:0 0 auto;border:1px solid var(--line-2);background:var(--panel-3);color:var(--ink-2);
  padding:5px 12px;border-radius:999px;font-size:13px;cursor:pointer;white-space:nowrap;transition:.15s}
.chainsw button em{font-style:normal;font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin-left:6px}
.chainsw button:hover{border-color:var(--cyan);color:var(--ink)}
.chainsw button.on{background:rgba(62,224,255,.12);border-color:var(--cyan);color:var(--cyan);font-weight:600}
.chainsw button.on em{color:var(--cyan)}
.chainsw button[data-dg]::before{content:'◧';margin-right:5px;font-size:11px;opacity:.75}

/* ---------------- 活頁簿分頁（Andy 2026-09-23：「像是 EXCEL 活頁簿那樣，但是位置在上方」）
   為什麼不是既有的膠囊（.chainsw 原本那種）：膠囊看起來像「篩選鈕」，
   活頁簿要看起來像「這一頁就是下面那塊內容的封面」——
   所以選中的那一頁**與內容同底色、沒有下邊界**（兩者連成一片），未選的往下縮一點。
   一層（產業鏈）與二層（剖析圖）共用同一套視覺，只差字級與高度。
   ⚠ 橫向可捲時 overflow-y 必須是 visible 以外的值才不會多長出捲軸，
     但 `overflow:auto hidden` 會把往下疊的那 1px 裁掉 —— 所以
     「疊在內容上緣」是靠容器的 margin-bottom:-1px + z-index，不是靠子元素外溢。*/
.nbsw{display:flex;gap:3px;align-items:flex-end;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;
  padding:4px 2px 0;margin:0 0 -1px;position:relative;z-index:2;border:0}
.nbsw::-webkit-scrollbar{display:none}
.nbsw>button,.nbsw>a{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap;
  margin-top:6px;padding:6px 13px 7px;border:1px solid var(--line-2);border-bottom:0;border-radius:9px 9px 0 0;
  background:var(--panel-3);color:var(--ink-2);font-size:13.5px;transition:background .15s,color .15s,margin-top .15s}
.nbsw>button:hover,.nbsw>a:hover{background:var(--panel-2);color:var(--ink);border-color:var(--cyan)}
.nbsw>button.on,.nbsw>a.on{margin-top:0;padding:8px 15px 9px;background:var(--panel);color:var(--cyan);font-weight:700;
  border-color:var(--line);border-bottom:0;box-shadow:inset 0 3px 0 var(--cyan)}
.nbsw>button em,.nbsw>a em{font-style:normal;font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.nbsw>button.on em,.nbsw>a.on em{color:var(--cyan)}
.nbsw>button[data-dg]::before{content:'◧';font-size:11px;opacity:.75}
.nbsw>a i{width:8px;height:8px;border-radius:2px;background:var(--c,var(--cyan));flex:0 0 auto}
/* 一層的內容就是下面那張卡（.nbcard）；二層的內容是卡裡面的 .nbbody。
   兩者的左上角都不能有圓角 —— 有圓角就看得出分頁跟內容是兩塊，活頁簿的錯覺就破了。*/
.nbcard{border-radius:0 var(--r) var(--r) var(--r)}
.nbbody{border:1px solid var(--line);border-radius:0 10px 10px 10px;background:var(--panel-2);padding:10px 12px 14px;position:relative;z-index:1;margin-bottom:12px}
.nbsw.lv2>a.on,.nbsw.lv2>button.on{background:var(--panel-2)}
/* 二層（剖析圖）比一層小一號，視覺上才看得出是子分頁 */
.nbsw.lv2>button,.nbsw.lv2>a{font-size:12.5px;padding:5px 11px 6px}
.nbsw.lv2>button.on,.nbsw.lv2>a.on{padding:7px 13px 8px}

/* ---------------- 族群總覽：左長條（漲跌幅）＋右圓餅（占比） ---------------- */
/* ⚠ 兩個 minmax(0,…) 與 min-width:0 一個都不能省：ECharts 的畫布是**絕對定位在容器裡、
   寬度寫死成像素**的，`1fr` 的自動最小尺寸會被那個舊寬度撐住 —— 於是使用者把視窗從
   800 拉窄到 390 時，格線的欄位仍然停在 716px（實測 grid 的框 306px、欄卻是 716px），
   整頁因此長出橫向捲軸，而且**永遠好不了**（容器不縮 → ResizeObserver 不發 → 畫布不縮）。
   給一個 0 的最小值就把這個死結打開：容器先縮、RO 再把畫布縮回來。*/
.gpgrid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:12px;align-items:stretch}
/* ★ 2026-09-23（W3-8，Andy：「看起來太乾澀了」）：兩張圖各自裝進一張有標題的卡片。
   底色比頁面底亮一階、有邊框有圓角 —— 兩張圖之間終於有分界，而且各自講什麼寫在標題上。
   ⚠ `min-width:0` 一個都不能省（理由同上面那段：ECharts 的畫布寬度是寫死的像素）。*/
.gpcard{min-width:0;background:var(--panel-3);border:1px solid var(--line-2);border-radius:12px;
  padding:10px 12px 8px;display:flex;flex-direction:column}
.gpcard>h5{margin:0 0 4px;font-size:14px;font-weight:700;color:var(--ink);line-height:1.5}
.gpcard>h5>small{font-weight:400;font-size:12px;color:var(--ink-3);margin-left:6px}
/* 2026-09-24 甜甜圈改版：圖例在圖下方、兩欄，「● 名稱 ……… 42.0%」（百分比等寬、靠右）。
   滑過一列＝滑過那一塊扇形（中心字跟著換），點一列＝點那一塊（進族群）。「其他」只看不點。*/
.gplegend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 14px;margin:2px 4px 2px}
.gplegend .lg{display:flex;align-items:center;gap:7px;min-width:0;height:22px;padding:0 6px;border:0;border-radius:6px;
  background:transparent;color:var(--ink-2);font:inherit;font-size:12px;cursor:pointer;text-align:left}
.gplegend .lg.other{cursor:default}
.gplegend .lg:hover,.gplegend .lg.on{background:var(--panel-2);color:var(--ink)}
.gplegend .lg i{flex:none;width:8px;height:8px;border-radius:50%}
.gplegend .lg .nm{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gplegend .lg .pc{flex:none;font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.gpgrid .chart{min-height:360px;min-width:0;overflow:hidden;flex:1 1 auto}
.gphead{gap:10px;flex-wrap:wrap;align-items:flex-start}
.gphead h4{font-size:15px}
.gplive{display:inline-flex;gap:6px;align-items:center}
.gpnote{margin-top:8px}
/* 窄畫面：兩張卡片上下堆疊，不要硬擠成兩欄（390 擠成兩欄的話圓餅只剩指甲大小） */
@media (max-width:820px){ .gpgrid{grid-template-columns:minmax(0,1fr)} .gpgrid .chart{min-height:320px} }
.qtag{font-size:11.5px;padding:2px 8px;border-radius:6px;font-weight:700;margin-left:6px}
.qtag.leading{background:rgba(255,77,109,.16);color:var(--rise)} .qtag.improving{background:rgba(62,224,255,.14);color:var(--cyan)}
.qtag.weakening{background:rgba(255,180,84,.14);color:var(--amber)} .qtag.lagging{background:rgba(46,229,157,.14);color:var(--fall)}
.tile .lks{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:8px;font-size:12.5px}
.tile .lks a.lk{color:var(--ink-2);font-weight:500}
.tile.colored{border-left:4px solid var(--c,var(--line-2))}
.tile.colored.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--panel-3));box-shadow:0 0 0 1px var(--c) inset}
/* 同族群一次全部攤開，不要橫向拉 bar（拉 bar 看不到後面有哪些同業，等於沒列） */
.sibs{display:flex;flex-wrap:wrap;gap:6px;padding:6px 0 4px;margin-top:8px;max-height:200px;overflow-y:auto}
.sibs a.lk{flex:none;padding:5px 10px;border-radius:9px;background:var(--panel-3);border:1px solid var(--line);font-size:13px}
.sibs a.lk.cur{border-color:var(--cyan);background:rgba(62,224,255,.12);color:var(--cyan)}
.sibs a.lk .chg{font-family:var(--mono);font-size:12px;margin-left:4px}
.segchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.segchip{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;border:1px solid var(--line-2);background:var(--panel-3);
  color:var(--ink-2);font-size:13px;cursor:pointer;transition:.15s;user-select:none}
.segchip i{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);flex:none}
.segchip:hover{border-color:var(--c);color:var(--ink)}
.segchip.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,var(--panel-3));color:var(--ink);font-weight:700}
.segchip .n{font-family:var(--mono);font-size:11px;color:var(--ink-3)} .segchip.sel .n{color:var(--ink-2)}
.segchip.nomem{opacity:.6;border-style:dashed}
.segbox{margin-top:10px;padding:10px 14px;border-radius:10px;border:1px solid var(--c,var(--line-2));background:color-mix(in srgb,var(--c,#8ea0c4) 8%,var(--panel));font-size:13.5px}
.segbox b.t{color:var(--c)}
a.lk.out{opacity:.55} a.lk.out .code{opacity:.6}
.segbox .row{gap:6px 14px;margin-top:6px}
/* E6：跨產業鏈的環節（ABF 載板等）—— 兩條鏈各一張架構圖縮圖，加上各自的上下游與族群 */
.xchains{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line-2);
  display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.xchains .xhd{grid-column:1/-1;font-size:13px;color:var(--ink-2)}
.xchain{border:1px solid var(--line-2);border-radius:10px;padding:9px 11px;background:var(--panel-3)}
.xchain.cur{border-color:var(--c,var(--cyan))}
.xchain{min-width:0}          /* grid item 預設 min-width:auto，會撐開不讓裡面的圖縮小 */
/* 外框只負責裁切，實際縮放由 JS 量完再用 transform 套在 .xinner 上
   （理由見 industry.js fitMini 的註解：窄畫面時 CSS 算不對這張 SVG 的寬度）。 */
.xchain .xmini{position:relative;width:100%;margin:7px 0;padding:0;overflow:hidden}
.xchain .xmini .xinner{position:absolute;top:0;left:0;transform-origin:0 0}
.xchain .xmini svg{display:block}
.xchain .xrow{display:flex;flex-wrap:wrap;gap:5px 10px;align-items:center;margin-top:5px;font-size:12.5px}
.xchain .xrow>.muted{font-size:11.5px;letter-spacing:.06em;min-width:28px}
.xchain .xrow .pill{font-size:11.5px;padding:2px 8px}
/* 縮圖只是定位用的，點它沒有意義；真的要過去請按「切到這條鏈看」 */
.xchain .xmini *{pointer-events:none}
/* 亮起／壓暗沿用剖析圖自己那套（diagrams.js 的 STYLE），這裡只把壓暗再壓一點，對比才拉得開 */
.xchain .xmini [data-seg].dim{opacity:.16}
.gdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c,var(--ink-3));margin-right:6px;vertical-align:-1px}

/* ---------------- 表格 ---------------- */
.tw{overflow:auto;border-radius:10px;border:1px solid var(--line)}
/* 長表格不要把整頁拉長：表身自己捲，表頭固定（Andy 2026-09-12：每個分頁都要在一個畫面內看完） */
.tw.cap-sm{max-height:320px}.tw.cap-md{max-height:440px}.tw.cap-lg{max-height:560px}
.tw.cap-sm,.tw.cap-md,.tw.cap-lg{scrollbar-width:thin}
.tw::-webkit-scrollbar{width:10px;height:10px}
.tw::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:6px}
.tw::-webkit-scrollbar-thumb:hover{background:var(--ink-3)}
tr.ghead td{background:var(--panel-3);color:var(--ink-2);font-size:12.5px;font-weight:600;position:sticky;top:33px;z-index:1}
.mapnote{font-size:11.5px;color:var(--ink-3)}
/* ★ 2026-09-23 UI 精修 #9：表格。四件事一起做，都是「資料很多時不要糊掉」。
   ① 列高固定：`td` 給定 line-height，每列高度不再因為內容長短上下抽動。
   ② 列 hover 換成 --row-hover（深 #17213c／淺 #eef2fa，兩個主題都實測 1.12:1）——
      舊值是寫死的 rgba(62,224,255,.06)，在淺色主題上是一層幾乎看不見的青霧。
      1.12 是刻意的：看得出「游標在這一列」，但不會把整列的文字壓掉。
   ③ 每 5 列一條較明顯的分隔（--line-2）：給眼睛一個定位點。
      選細分隔線而不是斑馬紋，是因為**本站每一列都可以點**（點進個股頁），
      斑馬紋會跟 hover／選取狀態打架，而量測研究顯示它對正確率沒有顯著改善。
   ④ 表頭吸頂的那條線改用 box-shadow：`border-collapse:collapse` 之下，
      sticky 表頭的 border 會跟著內容捲走（表頭底下會裂開一條縫），box-shadow 不會。
   數字欄本來就靠右（`th,td` 預設 text-align:right，文字欄才加 `.l`），這一版維持。*/
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 11px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
td{line-height:1.45}
th{position:sticky;top:0;background:var(--panel-3);color:var(--ink-2);font-weight:600;font-size:12.5px;letter-spacing:.04em;z-index:1;cursor:pointer;
  box-shadow:0 1px 0 var(--line-2)}
th.l,td.l{text-align:left} td.num{font-family:var(--mono)}
tbody tr{cursor:pointer;transition:background var(--dur-fast) var(--ease)}
tbody tr:hover{background:var(--row-hover)}
/* 列按下去的回饋用底色壓一階，**不用 scale** —— 整列縮放會讓 12px 的字糊掉一幀，
   而且相鄰的列會跟著看起來在動（§7.3 的但書）。*/
tbody tr:active{background:var(--panel-3)}
tbody tr:nth-child(5n) td{border-bottom-color:var(--line-2)}
tbody tr:last-child td{border-bottom:0}
.grade{display:inline-block;padding:2px 9px;border-radius:6px;font-weight:700;font-size:12.5px;font-family:var(--mono)}
.grade.A{background:rgba(255,77,109,.18);color:var(--rise)} .grade.B{background:rgba(255,180,84,.16);color:var(--amber)}
.grade.W{background:var(--panel-3);color:var(--ink-3)}

/* ---------------- 個股：圖表面板 ---------------- */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.toolbar .sp{flex:1}
/* ★ 2026-09-26 個股 K 線的「指標 ▾」下拉（取代整排指標晶片＋獨立的「圖表設定」面板）。
   面板本身沿用 .cfgpop（fixed、JS 貼在按鈕旁、夾進視窗、內部捲動），這裡只管清單列的長相。
   每一列：左邊開關＋色點＋名稱＋參數摘要（整塊都是開關），右邊 ▸ 就地展開這個指標的設定。*/
.inddd .indn{font-family:var(--mono);font-size:12px;color:var(--cyan)}
.inddd[aria-expanded="true"]{border-color:var(--cyan);color:var(--cyan)}
.cfgpop.indpop{width:392px;padding:10px 10px 12px}
.indpop .ttl{display:flex;align-items:baseline;gap:8px;padding:0 4px}
.indpop .ttl small{font-weight:400;font-size:12px;color:var(--ink-3)}
.indrow{border-top:1px solid var(--line)}
.indrow:first-child{border-top:0}
.indrow .ihead{display:flex;align-items:center;gap:6px;min-height:38px}
.indrow .isw{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:6px 4px;cursor:pointer;border-radius:7px;user-select:none}
.indrow .isw:hover{background:var(--panel-3)}
.indrow .isw input{accent-color:var(--cyan);width:16px;height:16px;margin:0;flex:none;cursor:pointer}
.indrow .isw i{width:9px;height:9px;border-radius:50%;flex:none}
.indrow .iname{font-size:13.5px;color:var(--ink-2);white-space:nowrap}
.indrow.on .iname{color:var(--ink);font-weight:600}
.indrow .isum{font-family:var(--mono);font-size:12px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.indrow.on .isum{color:var(--cyan)}
.indrow .inote{font-size:11px;color:var(--ink-3);white-space:nowrap}
.indrow .iexp{flex:none;width:30px;height:30px;border:1px solid transparent;border-radius:7px;background:transparent;color:var(--ink-3);
  font-size:13px;cursor:pointer;display:grid;place-items:center;transition:transform .15s var(--ease)}
.indrow .iexp:hover{border-color:var(--line-2);color:var(--cyan)}
.indrow.open .iexp{transform:rotate(90deg);color:var(--cyan)}
.indrow .ibody{padding:2px 6px 10px 28px}
.indrow .ibody .frow{flex-wrap:wrap}
.indrow .ibody input[type=number]{width:62px}
.indrow .ibody .plab{font-size:12px;color:var(--ink-3);min-width:0}
.indpop .ifoot{display:flex;align-items:center;gap:8px;margin-top:8px;padding:8px 4px 0;border-top:1px solid var(--line)}
@media (max-width:640px){.cfgpop.indpop{width:calc(100vw - 20px)}.indrow .ibody{padding-left:8px}}
/* 基本資料的題材／族群連結：以前黏成「#AI 伺服器#高階 PCB」一串，看不出哪裡斷 */
.tagrow{display:inline-flex;flex-wrap:wrap;gap:4px 12px}
/* 週期統計「自填 年」：以前沒套樣式，深色主題裡是一塊白底 */
.opabox input[type=number]{background:var(--panel-3);border:1px solid var(--line-2);color:var(--ink);border-radius:6px;
  padding:3px 6px;font-family:var(--mono);font-size:12.5px;color-scheme:light dark}
.opabox input[type=number]:focus{outline:0;border-color:var(--cyan)}
/* 個股「基本資料」分頁：基本資料表＋1–12 月平均漲幅並排（2026-09-26）。季節卡是直欄 flex，圖吃掉剩下的高度，
   兩張卡等高；≤900px 疊成上下（.g2 全站是 ≤820 才疊，這裡欄寬到 900 以下，季節圖的 12 個月份標籤就開始擠）。 */
.skBasics{align-items:stretch}
.skBasics .msCard{display:flex;flex-direction:column}
.skBasics .msCard>.chart{flex:1 1 auto;min-height:300px}
.mshint{font-size:12.5px;color:var(--amber,#ffb454);margin:4px 0 0;text-align:right}
@media (max-width:900px){ .skBasics{grid-template-columns:minmax(0,1fr)} .skBasics .msCard>.chart{min-height:300px} .mshint{text-align:left} }
/* K 線圖高度跟著視窗走（Andy：「K 線圖太小，版面需要擴大」）：
   以前寫死 640px，螢幕再大也只有那麼高。扣掉頂部列＋標題＋工具列＋說明約 300px，
   剩下的全部給圖；上下限避免小筆電被壓扁、超寬螢幕拉成一條。 */
#lwc{position:relative;height:clamp(600px,calc(100vh - 250px),1280px);border-radius:10px;overflow:hidden;background:var(--chartbg);border:1px solid var(--line)}
/* 寬版模式：收起右側事件欄，把整個視窗寬度讓給圖（工具列上的「⤢ 寬版」）*/
body.kwide .layout{grid-template-columns:1fr}
body.kwide aside{display:none}
body.kwide #lwc{height:clamp(640px,calc(100vh - 185px),1500px)}
body.kwide .mtf-cell .cv{height:clamp(300px,calc((100vh - 260px) / 2),620px)}
#lwc .legend-ov{position:absolute;left:12px;top:8px;z-index:5;font-family:var(--mono);font-size:12.5px;color:var(--ink-2);
  pointer-events:none;line-height:1.5;text-shadow:var(--ovl-sh)}
#lwc .legend-ov b{color:var(--ink)}
#lwc .legend-ov{background:var(--ovl);padding:4px 8px;border-radius:6px;backdrop-filter:blur(2px)}
/* 跟著游標走的開高低收資訊框（Andy 2026-09-15 圖一） */
#lwc .ohlcbox{position:absolute;z-index:7;pointer-events:none;min-width:148px;
  background:var(--ovl);border:1px solid var(--line-2);border-radius:9px;padding:7px 9px;
  box-shadow:0 10px 26px var(--drop);font-family:var(--mono);font-size:11.5px;line-height:1.5}
#lwc .ohlcbox .oh{font-weight:700;color:var(--ink);margin-bottom:4px;letter-spacing:.02em}
/* 全站表格有自己的 padding，這裡要蓋掉，不然八列會拉成一根長條蓋住半張圖 */
#lwc .ohlcbox table{border-collapse:collapse;width:100%;line-height:1.45}
#lwc .ohlcbox th,#lwc .ohlcbox td{padding:1px 0;border:0;font-size:11.5px;height:auto}
#lwc .ohlcbox th{text-align:left;font-weight:400;color:var(--ink-3);padding-right:12px;white-space:nowrap}
#lwc .ohlcbox td{text-align:right;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
/* 這三條的優先度要壓過上面那條，不然紅漲綠跌會被吃掉變成一片白 */
#lwc .ohlcbox td.up{color:var(--rise)} #lwc .ohlcbox td.down{color:var(--fall)} #lwc .ohlcbox td.flat{color:var(--flat)}
/* 畫線粗細：用線本身的厚度表示 */
.dw{width:30px;height:24px;border:1px solid transparent;background:transparent;border-radius:6px;
  cursor:pointer;display:grid;place-items:center;padding:0}
.dw span{display:block;width:18px;background:var(--ink-2);border-radius:3px}
.dw:hover{background:var(--panel-3)} .dw.on{border-color:var(--cyan);background:var(--panel-3)}
.dw.on span{background:var(--cyan)}
.dtool.dfill.on{color:var(--cyan)}
#lwc .pane-labels div{position:absolute;left:12px;z-index:5;font-family:var(--mono);font-size:11.5px;color:var(--ink-3);pointer-events:none;
  text-shadow:var(--ovl-sh);background:var(--ovl);padding:2px 7px;border-radius:5px}
#lwc .pane-labels b{color:var(--ink)}
#lwc .k-wm{position:absolute;left:0;right:64px;top:34%;text-align:center;font-family:var(--mono);font-size:34px;font-weight:700;
  color:color-mix(in srgb,var(--ink-3) 12%,transparent);pointer-events:none;z-index:1;letter-spacing:.06em}
.mtf-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mtf-cell{background:var(--chartbg);border:1px solid var(--line);border-radius:10px;overflow:hidden;position:relative}
.mtf-cell .cap select.mtfsel{background:var(--panel-3);color:var(--ink);border:1px solid var(--line-2);
  border-radius:7px;padding:2px 6px;font-size:12.5px;font-family:inherit;cursor:pointer;margin-right:6px}
.mtf-cell .cap select.mtfsel:hover{border-color:var(--cyan)}
.mtf-cell .cap{position:absolute;left:10px;top:8px;z-index:5;font-size:12.5px;color:var(--ink-2);font-family:var(--mono);text-shadow:var(--ovl-sh)}
.mtf-cell .cv{height:clamp(280px,calc((100vh - 360px) / 2),560px);position:relative}
/* 四週期小圖的游標看板（2026-09-26）：滑過哪一根就寫那一根的時間、開高低收與量（張）。
   擺在週期下拉的正下方；沒滑過時整塊藏起來，不擋圖。*/
.mtf-cell .mtip{position:absolute;left:10px;top:40px;z-index:6;pointer-events:none;font-family:var(--mono);font-size:11.5px;
  color:var(--ink-2);background:var(--ovl);padding:3px 8px;border-radius:6px;text-shadow:var(--ovl-sh);line-height:1.5;max-width:calc(100% - 90px)}
.mtf-cell .mtip b{color:var(--ink)}
/* 「重設縮放」角標（2026-09-26 從工具列搬進圖裡，KChart 自己掛、自己定位）：半透明，滑過才亮 */
.kfit{position:absolute;z-index:6;width:28px;height:28px;padding:0;display:grid;place-items:center;border:1px solid transparent;
  border-radius:7px;background:var(--ovl);color:var(--ink-3);opacity:.55;cursor:pointer;
  transition:opacity .15s var(--ease),color .15s var(--ease),border-color .15s var(--ease)}
.kfit:hover,.kfit:focus-visible{opacity:1;color:var(--cyan);border-color:var(--cyan)}
.kfit svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.mtf-cell .kfit{width:24px;height:24px}
.mtf-cell .kfit svg{width:13px;height:13px}
.verdict{border-left:3px solid var(--cyan);padding:12px 16px;background:rgba(62,224,255,.05);border-radius:0 10px 10px 0}
.verdict h3{margin-bottom:6px}
.verdict ul{margin:6px 0 0;padding-left:18px;color:var(--ink-2)} .verdict li{margin:3px 0}
.lights{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.light{padding:4px 10px;border-radius:7px;font-size:12.5px;background:var(--panel-3);color:var(--ink-2)}
.light.pos{background:rgba(255,77,109,.16);color:var(--rise)} .light.neg{background:rgba(46,229,157,.16);color:var(--fall)}
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 14px;overflow-x:auto;scrollbar-width:none}
.subtabs button{border:0;background:transparent;color:var(--ink-2);padding:9px 14px;font-size:14.5px;cursor:pointer;
  border-bottom:2px solid transparent;white-space:nowrap}
.subtabs button.on{color:var(--cyan);border-bottom-color:var(--cyan);font-weight:700}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0;font-family:var(--mono)}
.kvs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kvs .k{background:var(--panel-3);border-radius:9px;padding:8px 11px}
.kvs .k .l{font-size:12px;color:var(--ink-3)} .kvs .k .v{font-family:var(--mono);font-size:17px;font-weight:600}

/* ---------------- 產業鏈圖 ---------------- */
/* 圖 ＋ 產業關係面板並排。窄畫面（<1100px）wrap 掉到下面 ——
   800px 硬要並排會把關聯圖擠到看不清（2026-09-18 E6 就是這樣踩過一次）。 */
.chainrow{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.chainrow>.chainmap{flex:1 1 560px;min-width:0}
.chainrow>#coBox.relside{flex:0 1 340px;min-width:280px;margin-top:0;max-height:640px;overflow:auto}
@media(max-width:1100px){.chainrow>#coBox.relside{flex:1 1 100%;max-height:none}}
.chainmap{position:relative;overflow:auto;min-width:0;border-radius:10px;background:var(--illus);border:1px solid var(--line)}
.chainmap svg{display:block}
.chainmap .seg-title{fill:var(--ink-3);font-size:12px;letter-spacing:.06em}
.chainmap .co rect{rx:8;fill:var(--panel-3);stroke:var(--line-2);cursor:pointer;transition:.15s}
.chainmap .co:hover rect,.chainmap .co.sel rect{stroke:var(--cyan);filter:drop-shadow(0 0 8px rgba(62,224,255,.6))}
.chainmap .co text{font-size:12.5px;fill:var(--ink);pointer-events:none}
.chainmap .co .sub{font-size:11px;fill:var(--ink-3);font-family:var(--mono)}
.chainmap .co.foreign rect{fill:var(--panel);stroke-dasharray:3 3}
.chainmap .elayer{pointer-events:none}   /* 圖十：邊改畫在卡片之上，才不會被卡片蓋掉；但不能吃掉卡片的點擊 */
.chainmap .edge{fill:none;stroke:var(--line-2);stroke-opacity:.55;stroke-width:var(--w,1.2)}  /* --w＝依存度 strength，見 industry.js drawChainMap */
.chainmap .edge.hi{stroke:var(--cyan);stroke-opacity:.9;stroke-width:calc(var(--w,1.2) + 1.2)}
.chainmap .edge.dim{stroke-opacity:.08}
.chainmap .edge.dash{stroke-dasharray:5 4}            /* outsources_to：委外，錢的方向跟供貨相反 */
.chainmap .edge.spec{stroke-dasharray:1.5 3.5;stroke-opacity:.5}  /* designated_by：終端指定料號 AVL，實體出貨不一定經過它 */
.chainmap .edge.mat{stroke:#9aa6bd;stroke-opacity:.42}            /* 材料：灰色，但粗細仍依 strength */
.chainmap .edge.eq{stroke:#8792ab;stroke-opacity:.28;stroke-width:1}  /* 設備／材料環節：灰色細線，不跟主鏈搶視覺 */
/* 產業關係說明（Andy 2026-09-19：「點擊關聯圖時，在旁邊新增這類說明」）。
   圖上只有一條線，看得到「有關係」但看不懂「是什麼關係」——
   這一塊把那條線攤開講：誰供什麼給它、它又賣什麼給誰、以及那是官方揭露還是產業推論。 */
.relbox{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.relbox .rh{font-size:13px;color:var(--ink)}
.relbox h5{margin:8px 0 4px;font-size:12px;font-weight:600;color:var(--ink-3);letter-spacing:.04em}
.relbox ul{list-style:none;margin:0;padding:0}
.relbox li{padding:5px 0 5px 9px;border-left:2px solid var(--line-2);margin-bottom:3px;font-size:12.5px}
.relbox li:hover{border-left-color:var(--cyan)}
.relbox .rl{color:var(--ink-3);margin-right:5px}
.relbox .it{font-size:11.5px;color:var(--ink-2);margin-top:2px}
.relbox .nt{font-size:11px;color:var(--ink-3);margin-top:3px;line-height:1.5}
/* 依存度：五格小方塊，滿幾格就是 strength 幾 —— 比寫「4」直覺 */
.relbox .rhd{display:flex;flex-wrap:wrap;align-items:center;gap:3px 6px;line-height:1.45}
.relbox .rhd .rl{margin-right:0}
.relbox .depw{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;cursor:help}
.relbox .depn{font-size:10.5px;color:var(--ink-3)}
.relbox .dep{display:inline-block;width:26px;height:7px;border-radius:2px;
  background:linear-gradient(to right,var(--cyan) 0,var(--cyan) calc(var(--n,1)*20%),var(--line-2) calc(var(--n,1)*20%))}
.relbox .cf{font-style:normal;font-size:10.5px;padding:0 5px;border-radius:4px;border:1px solid var(--line-2);
  display:inline-block;white-space:nowrap;line-height:1.5}
.relbox .nt .cf{margin:0 2px}
.relbox a.cf-lk{text-decoration:none;cursor:pointer}
.relbox a.cf-lk:hover{text-decoration:underline;border-color:var(--cyan)}
.relbox .cf-estimated[title]{cursor:help}
.relbox .cf-verified{color:#6ee7a8;border-color:rgba(110,231,168,.45)}
.relbox .cf-reported{color:var(--ink-3)}
.relbox .cf-estimated{color:#d9a441;border-color:rgba(217,164,65,.45)}
/* Andy 2026-09-19：「若是事實可以不上相關連結，若是你的推論也記得補上，並說明原因」。
   推論整塊染成橘色並留一道左邊框 —— 事實與推論在畫面上要一眼分得開，
   不然使用者會把我的推論當成誰講過的事實。 */
.relbox li.guess{border-left-color:rgba(217,164,65,.6)}
.relbox .why{margin-top:4px;padding:5px 7px;border-radius:6px;font-size:11px;line-height:1.55;
  color:var(--ink-2);background:rgba(217,164,65,.08);border:1px solid rgba(217,164,65,.28)}
.relbox .why b{display:block;color:#d9a441;font-size:11px;margin-bottom:2px}
.relbox .src{display:inline-block;margin-top:3px;font-size:10.5px;color:var(--cyan);text-decoration:none}
.relbox .src:hover{text-decoration:underline}
.chainmap .iso circle{fill:none;stroke:#d9a441;stroke-opacity:.75}
.chainmap .iso text{font-size:9.5px;fill:#d9a441;text-anchor:middle;pointer-events:none}
.chainmap .co.dim{opacity:.28}
.chainmap .co rect{stroke:var(--line-2)}
.chainmap .co:hover rect,.chainmap .co.sel rect{stroke:var(--c,var(--cyan));filter:drop-shadow(0 0 8px var(--c,rgba(62,224,255,.6)))}
.chainmap .segtitle{cursor:pointer} .chainmap .segtitle.sel rect{fill-opacity:.4}
.chainmap .segtitle:hover rect{fill-opacity:.3}
/* 畫布底改讀 --dg-bg（預設就是 var(--illus)，所以科技配色下外觀零變化）。
   寫死成 var(--illus) 的話，配色切換換不掉底色 —— 那就只剩「零件變色、底色沒變」的半套。*/
.dgwrap{border-radius:10px;background:var(--dg-bg,var(--illus));border:1px solid var(--line);padding:6px;overflow:hidden;
  transition:background .2s}
/* 3D 剖析圖：畫布 + 疊在上面的 DOM 標籤（用 DOM 才選得起來，文字重疊驗收也還跑得動） */
/* ================ 3D 剖析圖的兩種模式（DECISIONS #238，2026-09-22）================
   只放「3D 才有的東西」：畫布底、打光、材質手感、玻璃、流線、卡片。
   零件的**材質色**仍然讀 :root 的 --dg-*（陶瓷、銅、板子…），跟 2D 同一份；
   這裡的 --dg-sat／--dg-mix 只是再往模式的色溫收一次（閱讀＝往暖奶油、科技＝往冷白）。
   ★ 舊的 soft／calm／casual 三個 3D 區塊在這一批**拿掉了**（Andy 改口只要兩套），
     three3d.js 會把舊名字映射成 read／tech，舊的 localStorage 不會讓 3D 掛掉。
   科技（預設）＝深藍炭底、冷白主光 ＋ 一盞後方輪廓光（電影感）、玻璃偏冷、流線微發光；
   閱讀＝暖白底、大半球光 ＋ 低主光（柔和環境光遮蔽、沒有強高光）、玻璃霧面白、
        流線不發光、收斂成細線 ＋ 端點；材質整組粗糙度拉高、金屬度壓低（霧面塑膠、陶瓷、黏土）。
   token 一覽（three3d.js 的 applyPal 每次換模式都會重讀）：
     畫布底  --dg-1 / --dg-2
     打光    --dg-key --dg-fill --dg-hemi --dg-bounce --dg-rim（強度） --dg-l-key/fill/sky/gnd/rim（顏色） --dg-expo（曝光）
     材質    --dg-sat --dg-mix --dg-mix-k（色溫收斂） --dg-rough-k --dg-metal-k（手感倍率） --dg-lit --dg-dim（明暗兩端）
     玻璃    --dg-glass（顏色，3D 這裡蓋掉 2D 的值） --dg-glass-a（不透明度）
     發光    --dg-led --dg-led-c --dg-sel-em --dg-part-em（指示燈、同環節、被點的那一顆） --dg-flow-em --dg-flow-a（流線）
     角色色  --dg-fl-sig 訊號藍 --dg-fl-pwr 電力橘 --dg-fl-cool 液冷青綠 --dg-fl-opt 光青 --dg-fl-air 氣流灰白
     陰影    --dg-shadow --dg-shadow-a（模型底下那一片柔和接觸陰影）
     卡片    --dg3-card --dg3-card-line --dg3-card-sh --dg3-ink/-2/-3 --dg3-badge-ink --dg3-lead-w --dg3-halo --dg3-blur */
.dg3d{
  /* 科技 v3（docs/diagram_style_tech_v3.md）：深邃暗藍黑 #080C14、中心微亮 #0E1626 的徑向漸層 */
  /* ★ 2026-09-22 PBR 精緻化（DECISIONS #244、docs/diagram_3d_pbr_spec.md）：
     背景改成規格書七的「科技深海軍藍」（#0A1428 → #060B14）。
     徑向漸層本來就在（CSS 的 radial-gradient），所以不需要再生一張 canvas texture 當
     scene.background —— 畫布是 alpha:true，CSS 的底直接透出來，成本是零。*/
  --dg-1:var(--dg-bg-tech-2,#0A1428); --dg-2:var(--dg-bg-tech,#060B14);
  /* 打光（規格書一-5）：暖白主光投影 ＋ 冷白補光 ＋ 後上方輪廓光；
     半球光從 .8 降到 .35 —— envMap 進來之後它不需要那麼強，強了只會把立體感洗平。*/
  --dg-key:1.25; --dg-fill:.4; --dg-hemi:.35; --dg-bounce:.16; --dg-rim:.8; --dg-expo:1.0;
  --dg-l-key:#FFF4E6; --dg-l-fill:#DCE9FF; --dg-l-sky:#1B2740; --dg-l-gnd:#05070C; --dg-l-rim:#BFE3FF;
  /* 環境貼圖（規格書一-1）：程序式棚的五片面板顏色 ＋ envMapIntensity。
     上方大柔光板是主要的反射來源；左冷右暖就是零件邊緣那一道冷暖對比的來源。*/
  --dg-env:.9; --dg-env-top:#C8D8F0; --dg-env-l:#4E7FB8; --dg-env-r:#C08A52;
  --dg-env-back:#16203A; --dg-env-bot:#080D16;
  --dg-shadow-on:1;                     /* 真陰影的開關（窄畫面由 three3d.js 自己關）*/
  /* 規格書一-4：整體色溫收斂降到接近 0 —— 那是「灰」的根因 6。
     ★ 實測之後直接歸零：sat 1.05 ＋ mix-k .02 會把七類模組的 ΔE76 從 31 壓到 26
       （差一點就破 25 的線）。顏色差異全部交給下面那組 --dg-m-*，全域色溫不准再碰它。*/
  --dg-sat:1; --dg-mix:#dde6f5; --dg-mix-k:0;
  --dg-rough-k:1; --dg-metal-k:1;
  --dg-lit:#ffffff; --dg-dim:#070b14;
  /* 收透明（規格書一-3）：只有機櫃**外殼板**可以很透（.28），主要零件一律不透明 */
  --dg-glass:#7FB4D8; --dg-glass-a:.28; --dg-shell-a:.28;
  /* ★ 模組色（規格書一-4 那張表）：關掉標籤也要認得出七類。冷（銀灰／墨綠／青綠）七成、暖（銅／橘）三成 */
  --dg-m-rack:#B8C2CC;        /* 機架／滑軌／鈑金：銀灰霧面金屬 */
  --dg-m-pcb:#0E3B32;         /* PCB 板材：墨綠 */
  --dg-m-trace:#E6B95C;       /* PCB 走線／焊墊：金 */
  --dg-m-die:#1E2E52;         /* 晶片本體：深藍 */
  --dg-m-graphite:#3A3F47;    /* 晶片模封／IC 封裝：石墨灰 */
  --dg-m-hs:#CBD5DE;          /* 散熱蓋／鰭片：銀灰，比機架亮一階 */
  /* 銅件：香檳金偏暖銅。規格書給的 #C98A5E 跟電源的暖橘 #E08A3C 在 Lab 上只差 ΔE76 22
     —— 關掉標籤時「銅接頭」與「電源櫃」會分不開，所以往香檳金那一端拉到 ΔE 34。*/
  --dg-m-cu:#D6A886;
  --dg-m-cool:#2FB8A6;        /* 液冷：青綠（半透明有厚度） */
  --dg-m-cool-a:.62;
  --dg-m-fanf:#5A7285;        /* 風扇外框：藍灰 */
  --dg-m-blade:#2E3A45;       /* 風扇葉片：實體深灰藍（不准只剩透明輪廓） */
  --dg-m-pwr:#E08A3C;         /* 電源／BBU：暖橘 */
  /* 科技模式的板子底色（v3 §3-08：#0F3D3A，配金色走線）。這是 3D 專用的覆寫 token：
     材質族 pcb 先讀它、讀不到才讀 :root 的 --dg-pcb；閱讀模式把它設成 initial ＝ 交回 root 的粉彩值 */
  --dg-pcb-3d:#0F3D3A;
  /* 發光克制（規格書一-6）：只有指示燈、資料流／光路、液冷流向、被點選的那一顆准發光 */
  --dg-led:.7; --dg-led-c:#22E5C8; --dg-sel-em:.22; --dg-part-em:.45; --dg-flow-em:.8; --dg-flow-a:.9;
  /* v3 §2 五色系（每一類元件固定一個主色）。style-system 若在 :root 定義 --dg-sig／--dg-pwr／--dg-cool／--dg-opt
     這裡會直接吃它們（var 的第一個值），沒有才用 v3 的值。
       sig 螢光藍＝訊號／網通／背板／ToR   opt 松石綠＝光模組／CPO／光路   pwr 亮橙＝電力／快接頭
       gpu 紫＝GPU／CoWoS 晶粒            ind 靛藍＝NVSwitch               cool 霓虹綠＝CDU／manifold 外殼
       cold 冷水（青綠迴路） hot 熱水管（發光紅）  cu 紅銅（冷板、銅箔） trace 金色走線
       air 風扇模組（暗藍／亮橙） blade 扇葉  airline 吹出來的氣流線（淡藍白） */
  --dg-fl-sig:var(--dg-sig,#58C4FF); --dg-fl-sig-2:#2F7FE0; --dg-fl-opt:var(--dg-opt,#22E5C8); --dg-fl-pwr:var(--dg-pwr,#FF8A3D);
  --dg-fl-gpu:#9B6DFF; --dg-fl-ind:#7C86FF; --dg-fl-cool:var(--dg-cool,#2FD9C4);
  /* v9（參考圖 docs/diagram_refs/3d_rack_*）：液冷迴路青綠發光；風扇框藍、扇葉藍色霓虹；玻璃邊緣高光；托盤底下 AO */
  --dg-fl-cold:#2FD9C4; --dg-fl-hot:#FF4D5E; --dg-fl-cu:#E8A97E; --dg-fl-cu-2:#B8694A; --dg-fl-trace:#FFD37A;
  --dg-fl-air:#58C4FF; --dg-fl-blade:#7FD4FF; --dg-fl-airline:#BFE9FF;   /* air＝風扇模組（框／卡片），blade＝扇葉，airline＝吹出來的氣流線 */
  --dg-glass-edge:#9FE0FF; --dg-glass-edge-a:.55;
  /* 有了真陰影之後，這片軟接觸陰影退成「補一點點」就好，不然底下會糊成一塊黑 */
  --dg-ao:#000000; --dg-ao-a:.3;
  --dg-shadow:#000000; --dg-shadow-a:.38;
  --dg3-card:rgba(13,19,38,.6); --dg3-card-line:rgba(160,190,240,.26); --dg3-card-sh:0 8px 24px -12px rgba(0,0,0,.6);
  --dg3-ink:#eef3ff; --dg3-ink-2:#b5c2de; --dg3-ink-3:#8ea0c4; --dg3-badge-ink:#0b132b;
  --dg-card-lmin:.48; --dg-card-lmax:1;          /* 卡片元件色的明度夾限：深底上太暗的拉亮到 .48，不壓暗 */
  --dg3-lead-w:1; --dg3-halo:.55; --dg3-blur:10px;
}
.dg3d[data-pal="read"]{
  /* v9（Andy 的亮色參考圖 docs/diagram_refs/3d_rack_light_glass.webp）：**不是灰掉的粉彩**。
     暖白底、托盤藍／綠／橙保留中等飽和、水路青綠帶柔光（約科技模式的 40%）、霧面玻璃有厚度與白邊高光、
     托盤底下淡陰影、柔和攝影棚光。這一組蓋掉之前「閱讀不發光、去飽和」的值。*/
  /* 規格書七：閱讀模式的底是淡藍灰（#E8EDF2 → #D6DEE6），不是奶油白 ——
     奶油白 ＋ --dg-mix-k .08 就是「閱讀模式整體霧化、對比掉下去」的根因 6。*/
  --dg-1:#E8EDF2; --dg-2:#D6DEE6;
  --dg-key:1.15; --dg-fill:.38; --dg-hemi:.35; --dg-bounce:.2; --dg-rim:.35; --dg-expo:1.06;
  --dg-l-key:#FFF4E6; --dg-l-fill:#DCE9FF; --dg-l-sky:#E8EEF5; --dg-l-gnd:#B9C2CC; --dg-l-rim:#FFF6EA;
  /* 閱讀模式的棚比較亮（白牆棚拍），所以 envMapIntensity 反而要高一點，金屬才不會在白底上變灰 */
  --dg-env:1.15; --dg-env-top:#FFFFFF; --dg-env-l:#C6D8EA; --dg-env-r:#EAD3B6;
  --dg-env-back:#E4E9EF; --dg-env-bot:#9AA4AE;
  --dg-shadow-on:1;
  --dg-sat:1; --dg-mix:#f2ede3; --dg-mix-k:0;
  /* ★ --dg-metal-k 從 .6 拉回 1.0（規格書一-1）：那個 0.6 是「沒有環境貼圖只好把暗金屬藏起來」
     的補償值，根因修掉之後它就只是在把金屬變成塑膠。*/
  --dg-rough-k:1.05; --dg-metal-k:1;
  --dg-lit:#ffffff; --dg-dim:#4a443c;
  --dg-glass:#DCE8F0; --dg-glass-a:.3; --dg-shell-a:.28;
  --dg-pcb-3d:#5E9A63;                  /* 運算托盤＝綠色 PCB 板（參考圖亮色版），不是灰板 */
  /* 模組色的閱讀版：同一組語意、明度往上提，對白底仍然分得開（兩兩色差 ≥ 25） */
  --dg-m-rack:#C9D1D9; --dg-m-pcb:#2E6B58; --dg-m-trace:#D9B35B;
  --dg-m-die:#39466B; --dg-m-graphite:#5A6069; --dg-m-hs:#DCE3E9;
  --dg-m-cu:#D9AE7E; --dg-m-cool:#3FC2B0; --dg-m-cool-a:.6;
  --dg-m-fanf:#6E8697; --dg-m-blade:#49586A; --dg-m-pwr:#D9843C;
  --dg-led:.3; --dg-sel-em:0; --dg-part-em:.15; --dg-flow-em:.3; --dg-flow-a:.8;
  --dg-fl-sig:#4A90D9; --dg-fl-sig-2:#3A73B5; --dg-fl-pwr:#F0883A; --dg-fl-cool:#22B5A0; --dg-fl-opt:#2BB3A0;
  --dg-fl-gpu:#7D5BD6; --dg-fl-ind:#5B6FD6; --dg-fl-cold:#2FC9B4; --dg-fl-hot:#E8626B; --dg-fl-cu:#C98A63; --dg-fl-cu-2:#A8785E; --dg-fl-trace:#D9B35B;
  --dg-fl-air:#F0883A; --dg-fl-blade:#DCE8F0; --dg-fl-airline:#9FC4E8;   /* 亮色：風扇橙框、扇葉淡藍白、氣流淡藍 */
  --dg-glass-edge:#FFFFFF; --dg-glass-edge-a:.85;
  --dg-ao:#3A342C; --dg-ao-a:.14;
  --dg-shadow:#5a4f40; --dg-shadow-a:.18;
  --dg3-card:rgba(255,255,255,.84); --dg3-card-line:rgba(60,55,48,.16); --dg3-card-sh:0 8px 22px -14px rgba(60,50,40,.45);
  --dg3-ink:#262320; --dg3-ink-2:#4d4740; --dg3-ink-3:#716a61; --dg3-badge-ink:#ffffff;   /* 閱讀模式圓點底是中深的元件色，字改白 */
  --dg-card-lmin:.30; --dg-card-lmax:.40;        /* 白卡上的標題字／圓點底／引線：太亮的（玻璃、陶瓷）壓到 .40 以下 */
  --dg3-lead-w:.9; --dg3-halo:0; --dg3-blur:8px;
  --dg3-lead:rgba(70,64,56,.72);        /* 閱讀模式的引線是深灰細線（#238）；科技模式不定義＝跟元件同色 */
}
.dg3d{position:relative;border-radius:10px;background:radial-gradient(120% 90% at 50% 0%,var(--dg-1),var(--dg-2));
  border:1px solid var(--line);overflow:hidden;min-height:360px}
.dg3d[hidden]{display:none}
/* E1（Andy 2026-09-18「3D 圖文字太小 → 改成引線＋外部文字框」）：
   標籤不再貼在零件頭上，改成排在畫布左右兩欄的文字框 —— 字放大到 12.5px、
   多一行說明、左邊一條環節色的粗邊把它跟零件綁在一起，再用引線接回去。 */
/* ★ 2026-09-22 風格系統：3D 的 DOM 標籤是「卡片」共用元件的 HTML 版，跟 2D 的 labelRow 吃同一組 token。
   磨砂玻璃 ＝ 半透明底（--dg-card-f）＋ backdrop-filter（--dg-card-blur）；不支援 backdrop-filter 的瀏覽器
   自然退回半透明實色。卡片的元件色走 --dg-card-c（three3d.js 用 inline style 餵；沒餵就落回環節色 --c，
   再沒有就 --dg-ink）—— 左側色條、邊框、選取態都用它。
   ⚠ 尺寸一個都沒動（字級 12.5、內距、左邊框 3px、圓角 7px）：標籤排版算法量的是這些。
   文字改吃 --dg-ink*（不是全站的 --ink*）：卡片跟著剖析圖的模式走，淺色主題硬切回科技時字才不會是深色印在深色上。*/
.lbl3d{position:absolute;font-size:12.5px;line-height:1.35;color:var(--dg-ink-2);
  --card-c:var(--dg-card-c,var(--c,var(--dg-ink)));
  background:var(--dg-card-f);-webkit-backdrop-filter:var(--dg-card-blur);backdrop-filter:var(--dg-card-blur);
  border:1px solid color-mix(in srgb,var(--card-c) 40%,var(--dg-card-s));
  border-left:3px solid var(--card-c);border-radius:7px;padding:4px 8px;
  white-space:normal;transition:opacity .15s,border-color .15s;box-shadow:var(--dg-card-box-sh);z-index:2}
.lbl3d b{display:block;font-weight:700;color:var(--dg-ink)}
/* ★ style-3d 在 main 的卡片 CSS 上補的三樣（其餘照 main 的 token 名走）：
   ① 編號圓點 em.no3d（v3 §4；顏色＝卡片的元件色 --card-c，字用 --dg3-badge-ink，深字在霓虹或粉彩上都讀得到）
   ② 中英雙語標題 b small.en
   ③ 標題左邊留 24px 給圓點 */
.lbl3d b{padding-left:24px;min-height:18px}
.lbl3d b small.en{display:block;font-weight:500;font-size:var(--dg-fs-min,12px);color:var(--dg-ink-3);letter-spacing:.01em;line-height:1.3}
.lbl3d em.no3d{position:absolute;left:8px;top:6px;width:18px;height:18px;border-radius:50%;
  background:var(--card-c);color:var(--dg3-badge-ink,#0b132b);font-style:normal;font-weight:700;
  font-size:var(--dg-fs-min,12px);line-height:18px;text-align:center;font-family:var(--mono);letter-spacing:0}
/* P4-d（art-director 2026-09-21）：這一行的說明以前是 11px、而且 line-clamp:2 把它截斷。
   11px 低於字級下限（--dg-fs-min 12px），截斷又讓「這一層變薄會怎樣」講到一半就沒了 ——
   那正是規格書 §1 定義的成敗條件。改成 12px、放寬到三行。*/
.lbl3d i{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  font-style:normal;font-size:var(--dg-fs-min,12px);color:var(--dg-ink-3);margin-top:2px}
/* 圖九 2-3：文字框底下那排可點的台股晶片（規格書 docs/diagram_specs/dg3d_standard.md）。
   晶片是 DOM 不是畫進畫布 —— 這樣文字重疊驗得到、也真的選得起來。 */
.lbl3d u.chips3d{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px;text-decoration:none}
.lbl3d .chip3d{font-size:var(--dg-fs-min,12px);line-height:1.45;padding:0 5px;border-radius:5px;text-decoration:none;
  color:var(--dg-ink-2);background:color-mix(in srgb,var(--card-c) 16%,transparent);
  border:1px solid color-mix(in srgb,var(--card-c) 38%,transparent);cursor:pointer;white-space:nowrap}
.lbl3d .chip3d:hover{color:var(--dg-ink);background:color-mix(in srgb,var(--card-c) 32%,transparent)}
.lbl3d u.chips3d s{font-size:var(--dg-fs-min,12px);color:var(--dg-ink-3);text-decoration:none;align-self:center}
/* A5-b：晶片上方那行「這排台股是哪一群」的小字，要自己占一整行，不要跟晶片擠在同一列 */
.lbl3d u.chips3d s.chipnote{flex:0 0 100%;margin-bottom:1px}
.lbl3d.sel{border-color:var(--card-c);background:color-mix(in srgb,var(--card-c) 12%,var(--dg-card-f))}
.lbl3d.sel b{color:var(--card-c)}
/* 主角用「底色再深一階 ＋ 外圈光暈」，刻意不動 border-width ——
   .lbl3d 的左邊框是 3px、其餘 1px，一改寬度整個文字框就位移，標籤排版會連帶重算。*/
.lbl3d.sel-part{border-color:var(--card-c);background:color-mix(in srgb,var(--card-c) 24%,var(--dg-card-f));
  box-shadow:0 0 0 2px color-mix(in srgb,var(--card-c) 42%,transparent),var(--dg-card-box-sh)}
/* 單一環節的 3D 場景（MLCC 那種）：同環節但不是被點的那一顆，標籤也要退一階，
   不然三個標籤長得一模一樣，使用者仍然看不出剛剛點到誰。
   兩個 class 都要在才生效：.dg1＝整個場景只有一個環節、.haspart＝現在真的有人被點著。
   少了 .haspart 的話，「從環節色標選這一格」會把三個標籤一起壓暗 —— 那時候根本沒有主角。*/
.dg3d.dg1.haspart .lbl3d.sel:not(.sel-part){opacity:var(--dg-sib-o,.4)}
.lbl3d.dim{opacity:.26}
/* 轉到背面、或兩欄都排滿了，離相機最遠的那幾個先讓位 */
.lbl3d.hid{opacity:0;pointer-events:none}
.lbl3d:hover{border-color:var(--card-c);color:var(--dg-ink);z-index:3}
/* 3D 的引線與端點：跟 2D 的 .leader／.anchor 同一套 token。端點的顏色由 three3d.js 用 inline stroke 餵；
   科技模式帶光暈（--dg-node-glow），閱讀模式只留實心圓點。*/
.lead3d .ld{fill:none;stroke:var(--dg-lead,var(--line-2));stroke-width:var(--dg-lead-w,1.1);opacity:.72}
.lead3d .ld-dot{fill:var(--dg-bg);stroke-width:1.4;opacity:.95;filter:drop-shadow(0 0 var(--dg-node-glow,3px) var(--dg-card-c,var(--c,var(--cyan))))}
:root[data-dgpal="read"] .lead3d .ld-dot{filter:none}
.lead3d .ld.sel{stroke-width:1.5}
.lead3d .ld-halo{display:none}   /* 端點的光暈由 main 的 .ld-dot drop-shadow 負責，這顆舊的暈圈不再畫 */
/* ★ 響應式的卡片欄（Andy 2026-09-22「版面需要左右對齊…會依據螢幕大小變化」）。
   模式由 three3d.js 依**視窗寬度**判斷並掛 class（跟 style-system 共用這組名字，見 docs/diagram_restyle_plan.md）：
     .dgstage--lr     視窗 ≥1280：左右兩欄（.dgstage-l／.dgstage-r 疊在畫布兩側，寬度＝ grid 的 minmax(220px,1fr) 解出來的值）
     .dgstage--r      960～1279：只留右欄
     .dgstage--below  <960：卡片搬進 .dgstage-b（畫布底下、文件流、一欄），畫布上改用編號圓點（.ld-no） */
.dg3d .dgstage-l,.dg3d .dgstage-r{position:absolute;top:0;bottom:0;width:220px;pointer-events:none}
.dg3d .dgstage-l{left:0} .dg3d .dgstage-r{right:0}
.dg3d .dgstage-b{display:grid;grid-template-columns:1fr;gap:6px;padding:8px}
.dg3d .dgstage-b[hidden]{display:none}
.dg3d .lbl3d.below{position:relative;left:auto;top:auto;width:auto}
/* 欄位塞不下時卡片先**收成一行**（標題＋英文＋前兩顆晶片），不掉到畫布底下（Andy 2026-09-22：「不准掉到下面」）。
   被點的那一張永遠是全開的；滑過收起來的卡片會暫時展開（z-index 疊在上面）。*/
.dg3d .lbl3d.compact i{display:none}
.dg3d .lbl3d.compact u.chips3d .chip3d:nth-child(n+3),.dg3d .lbl3d.compact u.chips3d s{display:none}
.dg3d .lbl3d.compact:hover i{display:-webkit-box}
.dg3d .lbl3d.compact:hover u.chips3d .chip3d:nth-child(n+3),.dg3d .lbl3d.compact:hover u.chips3d s{display:initial}
/* 第二階收合（2026-09-24）：只留編號＋標題；滑過或被點（sel-part 不會帶 mini）才展開 */
.dg3d .lbl3d.mini b small.en,.dg3d .lbl3d.mini u.chips3d{display:none}
.dg3d .lbl3d.mini b::after{content:" ▾";font-weight:400;color:var(--dg-ink-3)}
.dg3d .lbl3d.mini:hover b small.en{display:block}
.dg3d .lbl3d.mini:hover u.chips3d{display:flex}
.dg3d .lbl3d.mini:hover b::after{content:none}
.lead3d .ld-no circle{fill:var(--c,var(--dg-ink-3));stroke:var(--dg-2);stroke-width:1.5}
.lead3d .ld-no text{fill:var(--dg3-badge-ink,#0b132b);font-family:var(--mono);font-weight:700;font-size:12px}
.dgwrap svg{display:block;width:100%;height:auto}
/* ★★ 2026-09-22：`native`（DECISIONS #227）只設了 **min-width** ——
   它擋的是「欄位太窄把圖壓小、字跟著縮」，**另一邊完全沒擋**：
   svg 是 width:100%，欄位一變寬整張圖就跟著放大。

   實測（1440 螢幕、MLCC）：
     「今日事件」抽屜開著 → 欄寬  998 → 畫布  984×749
     抽屜關掉           → 欄寬 1358 → 畫布 1344×1023   ← **放大 1.366 倍**
   1920 只會更誇張。Andy 說「圖片及文字縮小一半…大小問題導致版面塞太滿」，
   這就是那個大小問題的根因之一：**同一張圖會有好幾種尺寸，而且沒有上限。**

   給 max-width 之後，不管欄位多寬都是固定 984 —— 那才是他要的「統一大小」。
   ⚠ 只給 `.dgm`（產業鏈的量產剖析圖）。題材頁那幾張是 `.dg3`、畫布 1180 寬，
     套上去會被縮成 0.834 倍、12px 的字變成 10px。 */
.dgwrap svg.dgm{max-width:984px;margin-inline:auto}
.dgwrap.compact svg{max-height:380px}
/* ================ 風格系統 v2 版面（art-director 2026-09-22）================
   Andy：「這邊的版面需要左右對齊，可以適當分配左右間隔，讓版面更滿，看起來舒適，並且會依據螢幕大小變化」。
   畫布（SVG，原尺寸、不放大）在中間，說明卡片（HTML .dgc）在左右兩欄，整個 .dgwrap 填滿容器。
   欄數看的是**容器**的寬度（container query），不是視窗 —— 產業鏈頁的 main 旁邊有 360px 的事件側欄，
   視窗 1440 時 main 只有 998（抽屜開）或 1358（抽屜關）；用視窗量會在 Andy 真的在用的寬度上判錯邊。
     ≥1280：左欄 ｜ 畫布 ｜ 右欄（minmax(220px,1fr) minmax(0,984px) minmax(220px,1fr)）
     960～1279：畫布 ｜ 右欄（左欄的卡片也排進右欄）
     <960：單欄，卡片在畫布下面；390 一欄一張、字 12px 下限
   引線由 diagrams.js 的 externalize() 在 .dglead 疊層上畫，寬度變了（ResizeObserver）就重算，沒有寫死座標。*/
/* ★ 2026-09-23 修「事件抽屜開著時說明卡片掉回單欄、引線一條都不畫」。
   `container-type:inline-size` 量的是**內容盒**：內距寫在容器身上，
   容器查詢看到的寬度就少了左右各 12px。抽屜開時外層 972px → 查詢只看到 946px，
   差 14px 沒跨過 960 的門檻，整個掉回單欄（單欄本來就不畫引線）。
   修法是把內距移到內層的 `.dggrid`，讓查詢量到完整寬度 ——
   而不是把門檻改成 940 去遷就內距（那是把內距的數字抄進門檻裡，
   以後有人調內距就會再壞一次，而且 1280 那道門檻也一樣少算 24px）。
   ⚠ 畫面上的內距一點都沒有變（同一組數值只是換一層掛），
     `.dglead` 的原點也沒有變 —— 絕對定位的基準是 padding box，
     它的起點就是 `.dggrid` 的邊框邊，跟 relayout 拿的 getBoundingClientRect 同一個點。*/
.dgwrap.dgv2{container-type:inline-size;padding:0}
.dgv2 .dggrid{position:relative;display:grid;gap:12px 18px;align-items:start;padding:10px 12px 12px;
  grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "c" "l" "r"}
.dgv2 .dghead{grid-area:head;min-width:0}
.dgv2 .dghead b{display:block;font-size:var(--dg-fs-ttl);font-weight:700;color:var(--dg-ink);letter-spacing:.02em;line-height:1.35}
.dgv2 .dghead span{display:block;font-size:var(--dg-fs-min);color:var(--dg-ink-3);line-height:1.55;margin-top:3px}
.dgv2 .dgcanvas{grid-area:c;min-width:0;max-width:100%;overflow-x:auto;overflow-y:hidden;justify-self:center}
.dgv2 .dgcanvas svg{display:block;height:auto;margin:0}
/* 卡片：併成一欄（單欄／兩欄堆疊）時 .dgcards 是格子、左右欄 display:contents，卡片照 order（＝編號）排，
   dense 讓落單的那張補進空格；三欄時反過來，.dgcards 是 display:contents，兩個 .dgcol 各自站到 l／r。*/
.dgv2 .dgcards{grid-area:r;min-width:0;display:grid;gap:8px;align-content:start;grid-auto-flow:dense;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.dgv2 .dgcol{display:contents}
@container (min-width:960px){
  .dgv2 .dggrid{grid-template-columns:minmax(0,1fr) minmax(240px,32%);grid-template-areas:"head head" "c r"}
  .dgv2 .dgcanvas{justify-self:end}
  .dgv2 .dgcards{grid-template-columns:1fr}
}
@container (min-width:1280px){
  .dgv2 .dggrid{grid-template-columns:minmax(220px,1fr) minmax(0,984px) minmax(220px,1fr);grid-template-areas:"head head head" "l c r"}
  .dgv2 .dgcanvas{justify-self:center}
  .dgv2 .dgcards{display:contents}
  .dgv2 .dgcol{display:grid;min-width:0;gap:8px;align-content:start;grid-template-columns:1fr}
  .dgv2 .dgcol.l{grid-area:l} .dgv2 .dgcol.r{grid-area:r}
}
.dglead{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.dglead path{fill:none;stroke:var(--dg-lead,color-mix(in srgb,var(--c,var(--dg-ink-3)) 55%,var(--dg-line-mix)));stroke-width:var(--dg-lead-w,1);transition:stroke .15s}
.dglead path.sel,.dglead path.sel-part{stroke:var(--c,var(--dg-accent-2d));stroke-width:var(--dg-lead-sel-w,1.6)}
.dglead path.dim{opacity:.25}
/* ---- HTML 卡片（跟 SVG 的 .lrow、3D 的 .lbl3d 同一組 token：磨砂玻璃、細邊、左側色條、編號圓點）---- */
.dgc{position:relative;--card-c:var(--dg-card-c,var(--c,var(--dg-ink)));display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 9px;align-items:start;
  background:var(--dg-card-f);-webkit-backdrop-filter:var(--dg-card-blur);backdrop-filter:var(--dg-card-blur);
  border:1px solid color-mix(in srgb,var(--card-c) 40%,var(--dg-card-s));border-left:3px solid var(--card-c);
  border-radius:var(--dg-card-r,8px);padding:8px 11px 8px 11px;box-shadow:var(--dg-card-box-sh);cursor:pointer;
  font-size:var(--dg-fs-min,12px);line-height:1.5;color:var(--dg-ink-3);transition:border-color .15s,background .15s,opacity .2s}
.dgc .no{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;margin-top:1px;
  background:var(--card-c);color:var(--dg-no-ink);font-family:var(--mono);font-size:var(--dg-fs-min,12px);font-weight:700;letter-spacing:0}
.dgc .bd{min-width:0}
.dgc b{display:block;font-size:var(--dg-fs-lbl,12.5px);font-weight:600;color:var(--dg-ink);line-height:1.4}
.dgc i{display:block;font-style:normal;color:var(--dg-ink-3);margin-top:2px}
.dgc.note{cursor:default} .dgc.note .bd{grid-column:1 / -1}
.dgc.warn{--dg-card-c:var(--dg-warn)} .dgc.warn b,.dgc.warn i{color:var(--dg-warn)}
.dgc:hover{border-color:var(--card-c)}
.dgc.sel{border-color:var(--card-c);background:color-mix(in srgb,var(--card-c) 12%,var(--dg-card-f))}
.dgc.sel b{color:var(--card-c)}
.dgc.sel-part{border-color:var(--card-c);background:color-mix(in srgb,var(--card-c) 24%,var(--dg-card-f));
  box-shadow:0 0 0 2px color-mix(in srgb,var(--card-c) 42%,transparent),var(--dg-card-box-sh)}
.dgc.sel-part b{font-weight:700}
.dgc.dim{opacity:.3}
/* 單一環節的圖：同環節但不是主角的卡片退一階（跟 SVG 的 .dg.dg1.haspart 同一條規則） */
.dgwrap.dg1.haspart .dgc.sel:not(.sel-part){opacity:var(--dg-sib-o,.4)}
/* 閱讀模式：標題維持深灰、編號圓點改成粉彩底＋色環＋深灰數字（同 SVG 那一套） */
:root[data-dgpal="read"] .dgc.sel b{color:var(--dg-ink)}
:root[data-dgpal="read"] .dgc .no{background:color-mix(in srgb,var(--card-c) 18%,var(--dg-bg));color:var(--dg-ink);box-shadow:inset 0 0 0 1.2px var(--card-c)}
/* ---- 卡片限高收合＋點編號說明小卡（2026-09-24，diagrams.js 的 fitCards／openPop）----
   收合模式只留「編號＋標題 ▾」；被選起來（sel-part）或自己點開（.open，公式／警語卡）的那張才展開說明。
   欄位超過「畫布高 ＋ 40px」就在欄內捲（.dgscroll，max-height 由 JS 依畫布高寫入）。*/
.dgv2 .dgscroll{overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;padding-right:2px}
.dgwrap.dgfold .dgc:not(.sel-part):not(.open) i{display:none}
.dgwrap.dgfold .dgc:not(.sel-part):not(.open) b::after{content:" ▾";font-weight:400;color:var(--dg-ink-3)}
.dgwrap.dgfold .dgc.note{cursor:pointer}
.dgwrap.dgmeasure .dgc i{display:none!important}
.dgwrap.dgfold .dgc{padding-top:6px;padding-bottom:6px}
/* 手機版之後要用的「只留編號」：卡片欄整個藏起來，說明一律靠點編號跳出（資料結構先備好，桌機不會進這個模式）*/
.dgwrap[data-dglbl="num"] .dgcards,.dgwrap[data-dglbl="num"] .dglead{display:none}
.dgpop{position:absolute;z-index:6;width:min(300px,calc(100% - 12px));--card-c:var(--dg-accent-2d);
  background:color-mix(in srgb,var(--card-c) 10%,var(--dg-bg));border:1px solid color-mix(in srgb,var(--card-c) 55%,var(--dg-card-s));
  border-left:3px solid var(--card-c);border-radius:var(--dg-card-r,8px);padding:8px 10px 9px 11px;
  box-shadow:0 8px 24px color-mix(in srgb,var(--dg-bg) 20%,transparent),var(--dg-card-box-sh);
  font-size:var(--dg-fs-min,12px);line-height:1.55;color:var(--dg-ink-3);cursor:default}
.dgpop[hidden]{display:none}
.dgpop .hd{display:flex;align-items:flex-start;gap:8px;margin-bottom:3px}
.dgpop .no{flex:none;display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;
  background:var(--card-c);color:var(--dg-no-ink);font-family:var(--mono);font-size:var(--dg-fs-min,12px);font-weight:700}
.dgpop b{flex:1;min-width:0;font-size:var(--dg-fs-lbl,12.5px);font-weight:700;color:var(--dg-ink);line-height:1.45;padding-top:2px}
.dgpop .x{flex:none;border:0;background:transparent;color:var(--dg-ink-3);font-size:13px;line-height:1;padding:4px 2px;cursor:pointer}
.dgpop .x:hover{color:var(--dg-ink)}
.dgpop i{display:block;font-style:normal;margin-top:2px}
.dgchips{display:flex;flex-wrap:wrap;gap:3px 4px;margin-top:4px;text-decoration:none}
.dgchips .dgchip{font-size:var(--dg-fs-min,12px);line-height:1.45;padding:0 5px;border-radius:5px;text-decoration:none;color:var(--dg-ink-2,var(--text));background:color-mix(in srgb,var(--dg-card-c,var(--c,var(--accent))) 16%,transparent);border:1px solid color-mix(in srgb,var(--dg-card-c,var(--c,var(--accent))) 40%,transparent);cursor:pointer}
.dgchips .dgchip:hover{color:var(--dg-ink,var(--text));background:color-mix(in srgb,var(--dg-card-c,var(--c,var(--accent))) 32%,transparent)}
.dgchips s{font-size:var(--dg-fs-min,12px);text-decoration:none;color:var(--dg-ink-3,var(--muted))}
.dgpop .dgchips .dgchip{--dg-card-c:var(--card-c)}
.dgwrap.dgfold .dgc:not(.sel-part):not(.open) .dgchips{display:none}
:root[data-dgpal="read"] .dgpop .no{background:color-mix(in srgb,var(--card-c) 18%,var(--dg-bg));color:var(--dg-ink);box-shadow:inset 0 0 0 1.2px var(--card-c)}
.dgwrap.noanim *{animation:none!important}
/* ---- 剖析圖的顯示／隱藏收尾
   ★ 2026-09-23 第二批（W3-7，Andy：「下方的字卡也拿掉 因為上方分頁就有同樣功能了」）：
     圖別選單 `.dgmenu` / `.dgcards` / `.dgcard` 那一整組樣式移除 ——
     它畫的東西跟二層分頁列完全重複（同樣的 dgOpts、同樣的網址）。
     ⚠ `.dgv2 .dgcards`（v2 版面的說明卡片欄，diagrams.js 的 externalize 建的）
       **不是同一個東西**，留在上面的 .dgv2 區塊裡沒有動。
   ★ 這三條 [hidden] 是必要的收尾：.row（flex）與 .pill（inline-flex）這些
     有 display 規則的類別會**蓋掉** UA 預設的 [hidden]{display:none}，
     不補的話「族群總覽」那一頁那幾顆工具鈕照樣看得到，按下去卻沒有圖可以動。*/
#dgBody[hidden],#dgTools[hidden]{display:none}
