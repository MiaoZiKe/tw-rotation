<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="'Noto Sans TC','PingFang TC',sans-serif">
<rect width="720" height="360" fill="#F5EDE3"/>
<text x="30" y="42" font-size="20" font-weight="700" fill="#6B4A3A">畢業後，從哪一天開始還款？</text>
<text x="30" y="92" font-size="16" fill="#6B4A3A">舊制</text>
<rect x="110" y="68" width="100" height="36" rx="6" fill="#EAD8C4" stroke="#6B4A3A" stroke-width="1.5"/>
<text x="160" y="92" font-size="16" fill="#6B4A3A" text-anchor="middle">寬限 1 年</text>
<rect x="210" y="68" width="400" height="36" rx="6" fill="#6B4A3A"/>
<text x="410" y="92" font-size="16" fill="#F5EDE3" text-anchor="middle">開始還本息</text>
<text x="30" y="172" font-size="16" fill="#C96F2D" font-weight="700">新制</text>
<rect x="110" y="148" width="200" height="36" rx="6" fill="#F3D2B3" stroke="#C96F2D" stroke-width="2"/>
<text x="210" y="172" font-size="16" fill="#6B4A3A" text-anchor="middle" font-weight="700">寬限 2 年</text>
<rect x="310" y="148" width="300" height="36" rx="6" fill="#C96F2D"/>
<text x="460" y="172" font-size="16" fill="#F5EDE3" text-anchor="middle">開始還本息</text>
<text x="110" y="214" font-size="14" fill="#6B4A3A">畢業</text>
<text x="210" y="214" font-size="14" fill="#6B4A3A" text-anchor="middle">+1 年</text>
<text x="310" y="214" font-size="14" fill="#6B4A3A" text-anchor="middle">+2 年</text>
<text x="30" y="262" font-size="16" fill="#6B4A3A">寬限期內免還本息；畢業也包含休學、退學、</text>
<text x="30" y="288" font-size="16" fill="#6B4A3A">服義務役、教育實習。在職專班不適用。</text>
<text x="30" y="334" font-size="14" fill="#8a6a58">資料：教育部國民及學前教育署 115 學年度就學貸款措施函（2026-07）</text>
</svg>
