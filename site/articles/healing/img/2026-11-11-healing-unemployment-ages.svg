<rect x="230" y="162" width="231" height="48" rx="8" fill="#C96F2D"/>
<text x="475" y="196" font-size="22" font-weight="700" fill="#6B4A3A">5.69%</text>
<text x="40" y="268" font-size="22" font-weight="700" fill="#6B4A3A">30–34 歲</text>
