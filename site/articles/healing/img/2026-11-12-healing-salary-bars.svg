<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" width="800" height="390" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><rect width="800" height="390" fill="#F5EDE3"/><text x="40" y="52" font-size="24" font-weight="700" fill="#6B4A3A">平均數 vs 中位數：差了將近 1 萬元</text><text x="40" y="82" font-size="15" fill="#6B4A3A">2025 年全體受僱員工每人每月經常性薪資（元）</text><text x="40" y="150" font-size="18" fill="#6B4A3A" font-weight="700">平均數</text><rect x="130" y="120" width="521" height="56" rx="6" fill="#C96F2D"/><text x="663" y="156" font-size="22" font-weight="700" fill="#C96F2D">47,884</text><text x="40" y="240" font-size="18" fill="#6B4A3A" font-weight="700">中位數</text><rect x="130" y="210" width="418" height="56" rx="6" fill="#6B4A3A"/><text x="560" y="246" font-size="22" font-weight="700" fill="#6B4A3A">38,406</text><text x="130" y="310" font-size="18" fill="#6B4A3A">差距：47,884 − 38,406 = 9,478 元</text><text x="40" y="360" font-size="14" fill="#6B4A3A">出處：行政院主計總處，2025 年薪資統計，2026-02-11 公布</text></svg>