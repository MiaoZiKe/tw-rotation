<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 694" width="600" height="694"><rect width="600" height="694" fill="#F5EDE3"/><text x="24" y="42" font-size="26" font-weight="700" fill="#6B4A3A" font-family="'Noto Sans TC','PingFang TC',sans-serif">感受到的壓力，和已經做的事</text><text x="24" y="108" font-size="20" fill="#6B4A3A" font-family="'Noto Sans TC','PingFang TC',sans-serif">感受到企業對 AI 能力的要求增加</text><rect x="24" y="120" width="345" height="28" rx="6" fill="#C96F2D"/><text x="379" y="142" font-size="22" font-weight="700" fill="#6B4A3A" font-family="'Noto Sans TC','PingFang TC',sans-serif">75%</text><text x="24" y="198" font-size="20" fill="#6B4A3A" font-family="'Noto Sans TC','PingFang TC',sans-serif">認為會 AI 有助求職</text><rect x="24" y="210" width="394" height="28" rx="6" fill="#C96F2D"/><text x="428" y="232" font-size="22" font-weight="700" fill="#6B4A3A" font-family="'Noto Sans TC','PingFang TC',sans-serif">85.7%</text><text x="24" y="288" font-size="20" fill="#6B4A3A" font-family="'Noto Sans TC','PingFang TC',sans-serif">最希望企業提供 AI 培訓課程</text><rect x="24" y="300" width="330" height="28" rx="6" fill="#C96F2D"/><text x="364" y="322" font-size="22" font-weight="700" fill="#6B4A3A" font-family="'Noto Sans TC','PingFang TC',sans-serif">71.8%</text><text x="24" y="378" font-size="20" fill="#6B4A3A" font-family="'Noto Sans TC','PingFang TC',sans-serif">已經積極學習 AI 技能</text><rect x="24" y="390" width="65" height="28" rx="6" fill="#8A6A55"/><text x="99" y="412" font-size="22" font-weight="700" fill="#6B4A3A" font-family="'Noto Sans TC','PingFang TC',sans-serif">14.2%</text><text x="24" y="468" font-size="20" fill="#6B4A3A" font-family="'Noto Sans TC','PingFang TC',sans-serif">想學但還沒開始（含不知從何開始、沒興趣）</text><rect x="24" y="480" width="271" height="28" rx="6" fill="#8A6A55"/><text x="305" y="502" font-size="22" font-weight="700" fill="#6B4A3A" font-family="'Noto Sans TC','PingFang TC',sans-serif">58.9%</text><text x="24" y="558" font-size="20" fill="#6B4A3A" font-family="'Noto Sans TC','PingFang TC',sans-serif">學習困難：不知道從哪裡開始</text><rect x="24" y="570" width="262" height="28" rx="6" fill="#8A6A55"/><text x="296" y="592" font-size="22" font-weight="700" fill="#6B4A3A" font-family="'Noto Sans TC','PingFang TC',sans-serif">56.9%</text><text x="24" y="648" font-size="17" fill="#6B4A3A" font-family="'Noto Sans TC','PingFang TC',sans-serif">受訪者自述；n=1,213；橘＝需求與期待，咖啡＝學習現況</text><text x="24" y="674" font-size="17" fill="#6B4A3A" font-family="'Noto Sans TC','PingFang TC',sans-serif">出處：台北市勞動局 × 1111，2026/8/13；聯合報 2026/8</text></svg>