<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="輪動團隊虛擬辦公室 — 深色科技風外觀稿">
<title>輪動團隊辦公室</title>
</head>
<body>
<style>
/* ──────────────────────────────────────────────────────────────
   輪動團隊辦公室 — 外觀稿 v0.1
   刻意不使用任何外部資源（字體、圖示、圖表庫全部自己畫）：
   Andy 公司網路擋 CDN，而且 GitHub Pages 上這頁要能離線打開。
   配色沿用 site/index.html 的深色科技風變數，讓它看起來是同一個產品。
   ────────────────────────────────────────────────────────────── */

/* 預設＝深色（這個設計是深色優先）；淺色在下面兩個區塊覆蓋 */
:root{
  --bg:#070b16; --bg-2:#0b1224; --panel:#0f172b; --panel-2:#141e36; --panel-3:#1a2542;
  --line:#1e2a48; --line-2:#2a3860;
  --ink:#e8eeff; --ink-2:#a9b6d6; --ink-3:#6f7ea3;
  --cyan:#3ee0ff; --violet:#8b7bff; --amber:#ffb454; --lime:#c3ff5b;
  --rose:#ff4d6d; --mint:#2ee59d;
  --wall-1:#16203a; --wall-2:#0d1528;
  --floor-1:#101a30; --floor-2:#0a1122; --floor-line:rgba(62,224,255,.10);
  --desk:#24314f; --desk-top:#31426b; --screen:#071827; --screen-2:#0c2740;
  --board:#15203a; --board-frame:#2d3c63;
  --note:#f3c969; --note-ink:#3a2c06;
  --topbar:rgba(7,11,22,.86);
  --drop:0 18px 40px -26px rgba(0,0,0,.95);
  --r:14px;
  --mono:"JetBrains Mono","SFMono-Regular",Menlo,Consolas,monospace;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#eef1f8; --bg-2:#e5eaf5; --panel:#ffffff; --panel-2:#f6f8fd; --panel-3:#eaeffa;
    --line:#d3dbeb; --line-2:#bcc7de;
    --ink:#101a2e; --ink-2:#4a5a7a; --ink-3:#7a89a6;
    --cyan:#0b8fb3; --violet:#6a56e8; --amber:#b97400; --lime:#5e8f00;
    --rose:#d62c4e; --mint:#0a9b68;
    --wall-1:#dde4f3; --wall-2:#cdd7ec;
    --floor-1:#e7ecf8; --floor-2:#d8e0f1; --floor-line:rgba(11,143,179,.16);
    --desk:#b9c4dc; --desk-top:#cbd4e8; --screen:#20304a; --screen-2:#31486b;
    --board:#f2f5fc; --board-frame:#c6d0e6;
    --note:#ffe08a; --note-ink:#4a3705;
    --topbar:rgba(238,241,248,.88);
    --drop:0 14px 32px -24px rgba(20,30,60,.55);
  }
}
:root[data-theme="light"]{
  --bg:#eef1f8; --bg-2:#e5eaf5; --panel:#ffffff; --panel-2:#f6f8fd; --panel-3:#eaeffa;
  --line:#d3dbeb; --line-2:#bcc7de;
  --ink:#101a2e; --ink-2:#4a5a7a; --ink-3:#7a89a6;
  --cyan:#0b8fb3; --violet:#6a56e8; --amber:#b97400; --lime:#5e8f00;
  --rose:#d62c4e; --mint:#0a9b68;
  --wall-1:#dde4f3; --wall-2:#cdd7ec;
  --floor-1:#e7ecf8; --floor-2:#d8e0f1; --floor-line:rgba(11,143,179,.16);
  --desk:#b9c4dc; --desk-top:#cbd4e8; --screen:#20304a; --screen-2:#31486b;
  --board:#f2f5fc; --board-frame:#c6d0e6;
  --note:#ffe08a; --note-ink:#4a3705;
  --topbar:rgba(238,241,248,.88);
  --drop:0 14px 32px -24px rgba(20,30,60,.55);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-size:14px; line-height:1.6;
  background-image:
    radial-gradient(900px 500px at 12% -10%, rgba(139,123,255,.14), transparent 60%),
    radial-gradient(800px 460px at 88% 0%, rgba(62,224,255,.10), transparent 60%);
  background-attachment:fixed;
}
h1,h2,h3{margin:0; text-wrap:balance; font-weight:700; letter-spacing:.01em}
code,.mono{font-family:var(--mono)}

/* ── 頂部列 ───────────────────────────────────────────────── */
.topbar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:40;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding:10px 16px; background:var(--topbar); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex; align-items:center; gap:10px; min-width:0}
.brand .logo{width:30px; height:30px; flex:none}
.brand b{font-size:16px; letter-spacing:.02em}
.brand span{display:block; font-size:11px; color:var(--ink-3); letter-spacing:.06em}
.spacer{flex:1 1 auto}
.pills{display:flex; gap:6px; flex-wrap:wrap}
.pill{
  display:inline-flex; align-items:center; gap:6px; cursor:pointer;
  padding:5px 11px; border-radius:999px; border:1px solid var(--line-2);
  background:var(--panel); color:var(--ink-2); font-size:12.5px; font-family:inherit;
}
.pill:hover{border-color:var(--cyan); color:var(--ink)}
.pill[aria-pressed="true"]{background:var(--panel-3); color:var(--ink); border-color:var(--cyan)}
.pill .n{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:12px; color:var(--ink-3)}
.pill[aria-pressed="true"] .n{color:var(--cyan)}
.dot{width:8px; height:8px; border-radius:50%; background:var(--ink-3); flex:none}
.dot.working{background:var(--cyan); box-shadow:0 0 0 3px rgba(62,224,255,.18)}
.dot.meeting{background:var(--amber); box-shadow:0 0 0 3px rgba(255,180,84,.18)}
.dot.idle{background:var(--ink-3)}
.dot.blocked{background:var(--rose); box-shadow:0 0 0 3px rgba(255,77,109,.20)}
.clock{font-family:var(--mono); font-size:13px; color:var(--ink-2); font-variant-numeric:tabular-nums}
.verbadge{
  font-family:var(--mono); font-size:11px; letter-spacing:.04em; color:var(--ink-3);
  border:1px solid var(--line-2); border-radius:999px; padding:3px 9px; white-space:nowrap;
}
.iconbtn{
  width:32px; height:32px; display:grid; place-items:center; cursor:pointer;
  border-radius:9px; border:1px solid var(--line-2); background:var(--panel); color:var(--ink-2);
}
.iconbtn:hover{border-color:var(--cyan); color:var(--cyan)}
:focus-visible{outline:2px solid var(--cyan); outline-offset:2px}

/* ── 版面骨架 ─────────────────────────────────────────────── */
.wrap{padding:18px 16px 64px; max-width:1560px; margin:0 auto}
.notice{
  display:flex; gap:10px; align-items:flex-start;
  border:1px dashed var(--line-2); border-radius:10px; padding:9px 12px; margin-bottom:16px;
  color:var(--ink-2); font-size:12.5px; background:var(--panel);
}
.notice b{color:var(--amber)}
.floorlabel{
  display:flex; align-items:center; gap:10px; margin:22px 0 10px;
  font-size:12px; letter-spacing:.18em; color:var(--ink-3);
}
.floorlabel::after{content:""; flex:1; height:1px; background:linear-gradient(90deg,var(--line-2),transparent)}
.floorlabel .fl{font-family:var(--mono); color:var(--cyan); letter-spacing:.08em}

.strip{display:grid; grid-template-columns:minmax(0,1.35fr) minmax(0,1fr); gap:14px}
.offices{display:grid; grid-template-columns:repeat(auto-fill,minmax(258px,1fr)); gap:14px}
@media (max-width:1080px){ .strip{grid-template-columns:1fr} }

/* ── 房間 ─────────────────────────────────────────────────── */
.room{
  border:1px solid var(--line); border-radius:var(--r); overflow:hidden;
  background:var(--panel); box-shadow:var(--drop); transition:border-color .18s, transform .18s;
  display:flex; flex-direction:column; text-align:left; padding:0; font:inherit; color:inherit;
  width:100%; cursor:pointer;
}
.room:hover{border-color:var(--cyan); transform:translateY(-2px)}
.room.dim{opacity:.32; filter:saturate(.35)}
.plate{
  display:flex; align-items:center; gap:8px; padding:9px 11px;
  border-bottom:1px solid var(--line); background:var(--panel-3);
}
.plate .nm{font-weight:700; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.plate .id{font-family:var(--mono); font-size:10.5px; color:var(--ink-3); white-space:nowrap}
.plate .st{margin-left:auto; font-size:11px; color:var(--ink-2); white-space:nowrap}

/* 場景：後牆 ＋ 2.5D 地板 */
.scene{position:relative; height:164px; overflow:hidden; background:linear-gradient(180deg,var(--wall-1),var(--wall-2))}
.scene .floor{
  position:absolute; left:-20%; right:-20%; bottom:0; height:46%;
  background:linear-gradient(180deg,var(--floor-1),var(--floor-2));
  border-top:1px solid var(--line-2);
}
.scene .floor::before{
  content:""; position:absolute; inset:0;
  background-image:
    repeating-linear-gradient(90deg, var(--floor-line) 0 1px, transparent 1px 42px),
    repeating-linear-gradient(0deg, var(--floor-line) 0 1px, transparent 1px 22px);
  transform:perspective(150px) rotateX(58deg); transform-origin:bottom center;
}
.scene .win{
  position:absolute; right:12px; top:12px; width:62px; height:44px; border-radius:4px;
  border:1px solid var(--line-2);
  background:linear-gradient(180deg,#0a1630,#123055 70%, #1b4a6e);
  box-shadow:inset 0 0 18px rgba(62,224,255,.14);
}
:root[data-theme="light"] .scene .win, :root:not([data-theme="dark"]) .scene .win{}
.scene .win::after{
  content:""; position:absolute; left:6px; right:6px; bottom:0; height:16px;
  background:
    linear-gradient(90deg, transparent 0 8px, currentColor 8px 13px, transparent 13px 20px,
    currentColor 20px 24px, transparent 24px 34px, currentColor 34px 41px, transparent 41px);
  color:rgba(10,16,32,.85); opacity:.75;
}
.scene .lamp{
  position:absolute; left:50%; top:-26px; width:120px; height:80px; transform:translateX(-50%);
  background:radial-gradient(60px 40px at 50% 0%, rgba(255,180,84,.20), transparent 70%);
  pointer-events:none;
}
/* 辦公桌 */
.desk{position:absolute; right:14px; bottom:14px; width:104px}
.desk .top{height:9px; border-radius:3px; background:linear-gradient(180deg,var(--desk-top),var(--desk))}
.desk .leg{position:absolute; bottom:-16px; width:5px; height:16px; background:var(--desk)}
.desk .leg.l{left:8px} .desk .leg.r{right:8px}
.monitor{
  position:absolute; right:22px; bottom:23px; width:62px; height:40px; border-radius:4px;
  border:1px solid var(--line-2); background:var(--screen); overflow:hidden;
  box-shadow:0 0 16px -4px rgba(62,224,255,.5);
}
.monitor .bars{position:absolute; left:5px; right:5px; bottom:5px; height:22px; display:flex; align-items:flex-end; gap:3px}
.monitor .bars i{flex:1; background:var(--cyan); opacity:.85; border-radius:1px}
.monitor .bars i:nth-child(2){background:var(--violet)}
.monitor .bars i:nth-child(4){background:var(--amber)}
.monitor .ln{position:absolute; left:5px; top:5px; height:3px; width:26px; border-radius:2px; background:var(--screen-2)}
.plantpot{position:absolute; left:10px; bottom:12px; width:16px; height:12px; border-radius:0 0 5px 5px; background:#7b5a3a}
.plantpot::before{
  content:""; position:absolute; left:2px; bottom:10px; width:12px; height:18px; border-radius:60% 60% 20% 20%;
  background:linear-gradient(180deg,#2ee59d,#137a55);
}
/* 人物 */
.person{position:absolute; bottom:10px; left:30px; width:66px; transform-origin:bottom center}
.person svg{display:block; width:100%; height:auto; overflow:visible}
.breathe{animation:breathe 4.4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-1px) scaleY(1.012)}}
.typing{animation:typing 1.1s steps(2,end) infinite}
@keyframes typing{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.6px)}}
.nod{animation:nod 3.2s ease-in-out infinite}
@keyframes nod{0%,100%{transform:rotate(0)}45%{transform:rotate(-5deg)}70%{transform:rotate(2deg)}}
.zzz{position:absolute; left:52px; bottom:70px; font-family:var(--mono); font-size:11px; color:var(--ink-3); animation:floaty 3.4s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0); opacity:.35}50%{transform:translateY(-6px); opacity:.85}}

/* 房間底部：目前任務 */
.task{padding:10px 11px 12px; border-top:1px solid var(--line); background:var(--panel-2); display:grid; gap:7px}
.task .now{font-size:12.5px; color:var(--ink-2)}
.task .now b{margin-right:5px}
.task .now b{color:var(--ink); font-weight:600}
.bar{height:5px; border-radius:99px; background:var(--panel-3); overflow:hidden; border:1px solid var(--line)}
.bar i{display:block; height:100%; background:linear-gradient(90deg,var(--cyan),var(--violet))}
.bar.amberbar i{background:linear-gradient(90deg,var(--amber),var(--rose))}
.counts{display:flex; gap:12px; font-family:var(--mono); font-size:11px; color:var(--ink-3); font-variant-numeric:tabular-nums}
.counts b{font-weight:600}
.counts .ok b{color:var(--mint)} .counts .go b{color:var(--cyan)} .counts .wait b{color:var(--ink-2)}

/* 狀態外框：用形狀＋顏色一起編碼，不只用顏色 */
.room[data-status="working"]{border-left:3px solid var(--cyan)}
.room[data-status="meeting"]{border-left:3px solid var(--amber)}
.room[data-status="blocked"]{border-left:3px solid var(--rose)}
.room[data-status="idle"]{border-left:3px solid var(--line-2)}

/* ── CEO 舞台 ─────────────────────────────────────────────── */
.stage .scene{height:250px}
.stage .slide{
  position:absolute; left:16px; top:14px; width:min(46%,240px); height:112px; border-radius:6px;
  border:1px solid var(--line-2); background:var(--screen); padding:9px 11px; overflow:hidden;
  box-shadow:0 0 30px -8px rgba(62,224,255,.55);
}
.stage .slide h4{margin:0 0 6px; font-size:11.5px; letter-spacing:.1em; color:var(--cyan); font-weight:700}
.stage .slide li{list-style:none; font-size:11px; color:#c9d6f5; display:flex; gap:6px; margin-bottom:3px}
.stage .slide li s{color:#6f7ea3; text-decoration-color:#6f7ea3}
.stage .slide li em{font-style:normal; font-family:var(--mono); color:var(--amber)}
.podium{
  position:absolute; left:calc(min(46%,240px) + 46px); bottom:38px; width:54px; height:40px;
  background:linear-gradient(180deg,var(--desk-top),var(--desk)); border-radius:4px 4px 2px 2px;
  border:1px solid var(--line-2);
}
.podium::after{content:""; position:absolute; left:8px; right:8px; top:8px; height:3px; background:var(--cyan); opacity:.5; border-radius:2px}
.dais{
  position:absolute; left:calc(min(46%,240px) + 22px); bottom:22px; width:118px; height:18px; border-radius:3px;
  background:linear-gradient(180deg,var(--panel-3),var(--panel-2)); border:1px solid var(--line-2);
}
.stage .person.boss{left:calc(min(46%,240px) + 58px); bottom:36px; width:82px}
.stage .crowd{position:absolute; right:14px; bottom:8px; display:flex; align-items:flex-end; gap:2px}
.stage .crowd .person{position:static; width:58px}
.beam{
  position:absolute; left:calc(min(46%,240px) + 70px); bottom:70px; width:2px; height:46px;
  background:linear-gradient(180deg,rgba(255,77,109,.9),transparent); transform-origin:bottom center;
  transform:rotate(38deg); animation:point 5s ease-in-out infinite;
}
@keyframes point{0%,100%{transform:rotate(38deg)}50%{transform:rotate(18deg)}}

/* ── 佈告欄 ──────────────────────────────────────────────── */
.board{
  border:1px solid var(--board-frame); border-radius:var(--r); background:var(--board);
  box-shadow:var(--drop); display:flex; flex-direction:column; overflow:hidden;
}
.board > header{
  display:flex; align-items:center; gap:9px; padding:10px 12px;
  border-bottom:1px solid var(--line); background:var(--panel-3);
}
.board > header h2{font-size:14px}
.board > header .sub{margin-left:auto; font-size:11px; color:var(--ink-3); font-family:var(--mono)}
.boardbody{display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:12px; flex:1}
@media (max-width:620px){ .boardbody{grid-template-columns:1fr} }
.col h3{font-size:11.5px; letter-spacing:.14em; color:var(--ink-3); margin-bottom:8px; display:flex; gap:7px; align-items:center}
.col h3 .c{font-family:var(--mono); color:var(--ink-2)}
.notes{display:grid; gap:8px}
.note{
  position:relative; padding:9px 10px 9px 12px; border-radius:3px; font-size:12.5px; line-height:1.45;
  background:var(--note); color:var(--note-ink); box-shadow:0 6px 14px -10px rgba(0,0,0,.9);
  transform:rotate(-.35deg); cursor:pointer; border:0; font-family:inherit; text-align:left; width:100%;
}
.note:nth-child(even){transform:rotate(.45deg)}
.note:hover{filter:brightness(1.06)}
.note .k{font-family:var(--mono); font-size:10.5px; opacity:.72; display:block}
.note .who{display:inline-block; margin-top:5px; font-size:10.5px; background:rgba(0,0,0,.14); border-radius:99px; padding:1px 7px}
.note::before{content:""; position:absolute; left:50%; top:-4px; width:8px; height:8px; border-radius:50%; background:#c9432f; box-shadow:0 2px 4px rgba(0,0,0,.5)}
.note.done{background:var(--panel-2); color:var(--ink-2); box-shadow:none; transform:none; border:1px solid var(--line)}
.note.done::before{background:var(--mint)}
.note.done .t{text-decoration:line-through; text-decoration-color:var(--ink-3)}
.note.wait{background:#e07a5f; color:#2c0f06}
.note.wait::before{background:#ffd76b}

/* ── 會議室 ──────────────────────────────────────────────── */
.meeting-room .scene{height:300px}
.meeting-room .floor{height:62%}
.mtable{
  position:absolute; left:50%; bottom:60px; transform:translateX(-50%);
  width:min(58%,330px); height:90px; border-radius:50%;
  background:radial-gradient(ellipse at 50% 30%, var(--desk-top), var(--desk));
  border:1px solid var(--line-2); box-shadow:0 22px 30px -24px #000;
}
.mtable::after{
  content:""; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  width:38px; height:26px; border-radius:3px; background:var(--screen); border:1px solid var(--line-2);
  box-shadow:0 0 22px -4px rgba(62,224,255,.6);
}
.seat{position:absolute; width:62px}
.seat .person{position:static; width:100%}
.seat .tag{
  display:block; text-align:center; font-size:10.5px; color:var(--ink-2); margin-top:2px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.bubble{
  position:absolute; max-width:190px; padding:7px 10px; border-radius:11px 11px 11px 3px;
  background:var(--panel-3); border:1px solid var(--line-2); color:var(--ink); font-size:11.5px;
  box-shadow:var(--drop); animation:pop .5s ease both;
}
.bubble .sp{display:block; font-size:10px; color:var(--cyan); font-family:var(--mono); margin-bottom:2px}
@keyframes pop{from{opacity:0; transform:translateY(6px) scale(.96)}to{opacity:1; transform:none}}
.mtimer{
  position:absolute; left:14px; top:12px; font-family:var(--mono); font-size:11px; color:var(--amber);
  border:1px solid rgba(255,180,84,.4); border-radius:99px; padding:2px 9px; background:rgba(255,180,84,.08);
}

/* ── 右側詳情抽屜 ────────────────────────────────────────── */
.scrim{position:fixed; inset:0; background:rgba(4,7,14,.6); backdrop-filter:blur(2px); z-index:50; opacity:0; transition:opacity .2s}
.drawer{
  position:fixed; z-index:60; top:0; right:0; height:100%; width:min(440px,100%);
  background:var(--panel); border-left:1px solid var(--line-2); box-shadow:-24px 0 60px -40px #000;
  transform:translateX(102%); transition:transform .24s cubic-bezier(.22,.9,.3,1);
  display:flex; flex-direction:column;
}
body.open .drawer{transform:none}
body.open .scrim{opacity:1}
.drawer > header{
  display:flex; gap:12px; align-items:center; padding:14px 14px 12px;
  border-bottom:1px solid var(--line); background:var(--panel-3);
}
.drawer > header .av{width:56px; height:72px; flex:none}
.drawer > header .av svg{width:100%; height:100%}
.drawer h2{font-size:16px}
.drawer .sub{font-family:var(--mono); font-size:11px; color:var(--ink-3)}
.drawer .body{overflow-y:auto; padding:14px; display:grid; gap:16px}
.sect h3{
  font-size:11.5px; letter-spacing:.14em; color:var(--ink-3); margin-bottom:8px;
  display:flex; align-items:center; gap:8px;
}
.sect h3 .c{font-family:var(--mono); color:var(--ink-2)}
.list{display:grid; gap:6px}
.item{
  display:flex; gap:9px; align-items:flex-start; padding:8px 10px; border-radius:9px;
  border:1px solid var(--line); background:var(--panel-2); font-size:12.5px; color:var(--ink-2);
}

const byId = id => id === 'ceo' ? CEO : AGENTS.find(a => a.id === id);
const nameOf = id => (byId(id) || {name:id}).name;
const el = (h) => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstElementChild; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function barsHTML(seed){
  const h = [];
  for (let i = 0; i < 5; i++) h.push('<i style="height:' + (28 + ((seed * (i + 3) * 7) % 68)) + '%"></i>');
  return h.join('');
}
function moveOf(st){ return st === 'working' ? 'type' : (st === 'meeting' || st === 'briefing' ? 'nod' : 'idle'); }

function sceneHTML(a, seed){
  const away = a.status === 'meeting';
  return '<div class="scene">' +
    '<div class="lamp"></div><div class="win"></div><div class="floor"></div>' +
    '<div class="desk"><div class="top"></div><div class="leg l"></div><div class="leg r"></div></div>' +
    '<div class="monitor"><div class="ln"></div><div class="bars">' + barsHTML(seed) + '</div></div>' +
    '<div class="plantpot"></div>' +
    (a.status === 'idle' ? '<div class="zzz">···</div>' : '') +
    (away
      ? '<div class="zzz" style="left:26px;bottom:52px;color:var(--amber)">↗ 9F 會議室</div>'
      : '<div class="person">' + avatar(a.look, moveOf(a.status), a.name) + '</div>') +
    '</div>';
}

function roomHTML(a, i){
  const st = STATUS[a.status];
  const now = a.now;
  return '<button class="room" type="button" data-id="' + a.id + '" data-status="' + a.status + '">' +
    '<span class="plate"><span class="dot ' + st.cls + '"></span>' +
      '<span class="nm">' + esc(a.name) + '</span>' +
      '<code class="id">' + esc(a.id) + '</code>' +
      '<span class="st">' + st.label + '</span></span>' +
    sceneHTML(a, i + 2) +
    '<span class="task">' +
      '<span class="now">' + (now ? '<b>現在：</b>' + esc(now.t) : '<b>待命中</b>　沒有進行中的任務') + '</span>' +
      (now ? '<span class="bar' + (a.status === 'blocked' ? ' amberbar' : '') + '"><i style="width:' + now.pct + '%"></i></span>' : '<span class="bar"><i style="width:0"></i></span>') +
      '<span class="counts">' +
        '<span class="ok">完成 <b>' + (a.done || []).length + '</b></span>' +
        '<span class="go">進行 <b>' + (a.doing || []).length + '</b></span>' +
        '<span class="wait">未完成 <b>' + (a.todo || []).length + '</b></span>' +
      '</span>' +
    '</span>' +
  '</button>';
}

        '<div class="notes">' + BOARD.wait.map(n => noteHTML(n, 'wait')).join('') + BOARD.todo.map(n => noteHTML(n)).join('') + '</div></div>' +
      '<div class="col"><h3>之前完成 <span class="c">' + BOARD.done.length + '</span></h3>' +
        '<div class="notes">' + BOARD.done.map(n => noteHTML(n, 'done')).join('') + '</div></div>' +
    '</div>';
}

const SEATS = [
  {left:'10%', bottom:'150px'}, {left:'64%', bottom:'150px'},
  {left:'22%', bottom:'16px'},  {left:'54%', bottom:'16px'}
];
function renderMeeting(){
  const seats = MEETING.members.map((id, i) => {
    const a = byId(id), p = SEATS[i] || SEATS[0];
    return '<span class="seat" style="left:' + p.left + ';bottom:' + p.bottom + '">' +
      '<span class="person">' + avatar(a.look, 'nod', a.name) + '</span>' +
      '<span class="tag">' + esc(a.name) + '</span></span>';
  }).join('');
  document.getElementById('meeting').innerHTML =
    '<button class="room meeting-room" type="button" data-id="meeting" data-status="meeting">' +
      '<span class="plate"><span class="dot meeting"></span><span class="nm">9F 會議室 · 討論中</span>' +
        '<code class="id">' + MEETING.members.length + ' 人</code><span class="st">' + esc(MEETING.elapsed) + '</span></span>' +
      '<span class="scene">' +
        '<span class="lamp"></span><span class="floor"></span>' +
        '<span class="mtimer">' + esc(MEETING.since) + ' 開始</span>' +
        '<span class="mtable"></span>' + seats +
        '<span class="bubble" id="bub1" style="left:14px;bottom:196px"></span>' +
        '<span class="bubble" id="bub2" style="right:14px;bottom:238px"></span>' +
      '</span>' +
      '<span class="task"><span class="now"><b>討論中：</b>' + esc(MEETING.topic) + '</span>' +
        '<span class="counts">' + MEETING.members.map(id => '<span class="go">' + esc(nameOf(id)) + '</span>').join('') + '</span>' +
      '</span>' +
    '</button>';
  cycleBubbles();
}
let bubTimer = null, bubIdx = 0;
function paintBubble(node, entry){
  if (!node) return;
  node.innerHTML = '<span class="sp">' + esc(nameOf(entry.who)) + '</span>' + esc(entry.s);
  node.style.animation = 'none'; void node.offsetWidth; node.style.animation = '';
}
function cycleBubbles(){
  const b1 = document.getElementById('bub1'), b2 = document.getElementById('bub2');
  const step = () => {
    paintBubble(b1, MEETING.log[bubIdx % MEETING.log.length]);
    paintBubble(b2, MEETING.log[(bubIdx + 1) % MEETING.log.length]);
    bubIdx = (bubIdx + 2) % MEETING.log.length;
  };
  step();
  if (bubTimer) clearInterval(bubTimer);
  bubTimer = setInterval(step, 4200);
}

/* ── 右側詳情 ───────────────────────────────────────────── */
function listHTML(arr, cls, empty){
  if (!arr || !arr.length) return '<p class="item todo" style="color:var(--ink-3)">' + empty + '</p>';
  return '<div class="list">' + arr.map((t, i) =>
    '<div class="item ' + cls + '"><span class="k">' + String(i + 1).padStart(2, '0') + '</span><span>' + esc(t) + '</span></div>').join('') + '</div>';
}
function openDrawer(id){
  const body = document.getElementById('dbody');
  if (id === 'meeting'){
    document.getElementById('dav').innerHTML = avatar(byId(MEETING.members[0]).look, 'nod', '');
    document.getElementById('dname').textContent = '9F 會議室';
    document.getElementById('did').textContent = MEETING.members.join(' · ');
    body.innerHTML =
      '<div class="sect"><h3>議題</h3><p class="item go">' + esc(MEETING.topic) + '</p></div>' +
      '<div class="sect"><h3>參與者 <span class="c">' + MEETING.members.length + '</span></h3><div class="files">' +
        MEETING.members.map(m => '<code>' + esc(nameOf(m)) + '</code>').join('') + '</div></div>' +
      '<div class="sect"><h3>討論內容 <span class="c">' + MEETING.log.length + ' 則</span></h3>' +
        MEETING.log.map(l => '<p class="talkline"><b>' + esc(nameOf(l.who)) + '</b>：' + esc(l.s) + '</p>').join('') + '</div>';
  } else {
    const a = byId(id); if (!a) return;
    const st = STATUS[a.status];
    document.getElementById('dav').innerHTML = avatar(a.look, moveOf(a.status), a.name);
    document.getElementById('dname').textContent = a.name;
    document.getElementById('did').textContent = a.id + ' · ' + (a.floor || '');
    body.innerHTML =
      '<div class="sect"><dl class="kv">' +
        '<dt>狀態</dt><dd><span class="dot ' + st.cls + '" style="display:inline-block;vertical-align:-1px"></span> ' + st.label + '</dd>' +
        '<dt>職責</dt><dd>' + esc(a.role) + '</dd>' +
        (a.now ? '<dt>開始於</dt><dd class="mono">' + esc(a.now.since) + '</dd>' : '') +
        (a.blockedBy ? '<dt>卡在</dt><dd style="color:var(--rose)">' + esc(a.blockedBy) + '</dd>' : '') +
      '</dl></div>' +
      (a.now ? '<div class="sect"><h3>目前進行 <span class="c">' + a.now.pct + '%</span></h3>' +
        '<p class="item go">' + esc(a.now.t) + '</p>' +
        '<div class="bar" style="margin-top:8px"><i style="width:' + a.now.pct + '%"></i></div></div>' : '') +
      '<div class="sect"><h3>已完成 <span class="c">' + (a.done || []).length + '</span></h3>' + listHTML(a.done, 'ok', '還沒有完成項目') + '</div>' +
      '<div class="sect"><h3>進行中 <span class="c">' + (a.doing || []).length + '</span></h3>' + listHTML(a.doing, 'go', '目前沒有進行中的項目') + '</div>' +
      '<div class="sect"><h3>未完成／在等什麼 <span class="c">' + (a.todo || []).length + '</span></h3>' + listHTML(a.todo, a.status === 'blocked' ? 'blocked' : 'todo', '沒有排隊中的項目') + '</div>' +
      (a.status === 'meeting' ? '<div class="sect"><h3>正在討論</h3>' +
        '<p class="talkline"><b>' + esc(MEETING.topic) + '</b></p>' +
        MEETING.log.filter(l => l.who === a.id).map(l => '<p class="talkline">' + esc(l.s) + '</p>').join('') + '</div>' : '') +
      '<div class="sect"><h3>負責檔案</h3><div class="files">' + (a.files || []).map(f => '<code>' + esc(f) + '</code>').join('') + '</div></div>';
  }
  document.getElementById('scrim').hidden = false;
  document.getElementById('drawer').hidden = false;
  requestAnimationFrame(() => document.body.classList.add('open'));
  document.getElementById('closebtn').focus();
}
function closeDrawer(){
  document.body.classList.remove('open');
  setTimeout(() => { document.getElementById('scrim').hidden = true; document.getElementById('drawer').hidden = true; }, 220);
}

/* ── 篩選、時鐘、主題 ──────────────────────────────────── */
function renderFilters(){
  const c = s => AGENTS.filter(a => a.status === s).length;
  const defs = [['all','全部',AGENTS.length,''],['working','工作中',c('working'),'working'],
                ['meeting','開會中',c('meeting'),'meeting'],['idle','待命',c('idle'),'idle'],
                ['blocked','等決策',c('blocked'),'blocked']];
  document.getElementById('filters').innerHTML = defs.map(([k, label, n, dot], i) =>
    '<button class="pill" type="button" data-f="' + k + '" aria-pressed="' + (i === 0) + '">' +
      (dot ? '<span class="dot ' + dot + '"></span>' : '') + label + ' <span class="n">' + n + '</span></button>').join('');
}
function applyFilter(f){
  document.querySelectorAll('#filters .pill').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.f === f)));
  document.querySelectorAll('#offices .room').forEach(r => r.classList.toggle('dim', f !== 'all' && r.dataset.status !== f));
}
function tick(){
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  document.getElementById('clock').textContent = p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}
function initTheme(){
  let saved = null;
  try { saved = localStorage.getItem('office-theme'); } catch (e) {}
  if (saved) document.documentElement.setAttribute('data-theme', saved);
  document.getElementById('themebtn').addEventListener('click', () => {
    const now = document.documentElement.getAttribute('data-theme');
    const isLight = now === 'light' || (!now && window.matchMedia('(prefers-color-scheme: light)').matches);
    const next = isLight ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('office-theme', next); } catch (e) {}
  });
}

/* ── 啟動 ─────────────────────────────────────────────── */
renderFilters(); renderStage(); renderBoard(); renderMeeting(); renderOffices();
initTheme(); tick(); setInterval(tick, 1000);

document.addEventListener('click', (e) => {
  const note = e.target.closest('.note');
  if (note){ if (note.dataset.id) openDrawer(note.dataset.id); return; }
  const pill = e.target.closest('#filters .pill');
  if (pill){ applyFilter(pill.dataset.f); return; }
  const room = e.target.closest('.room');
  if (room){ openDrawer(room.dataset.id); return; }
  if (e.target.closest('#closebtn') || e.target.id === 'scrim') closeDrawer();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && document.body.classList.contains('open')) closeDrawer(); });
</script>
</body>
</html>
