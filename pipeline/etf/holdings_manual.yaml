# ETF 成分股：人工整理檔（2026-10-07 建立，2026-10-08 第五輪改規則）
#
# 用途：發行投信官網每日公告（pipeline/sources/etf_pcf.py）與投信投顧公會每月前十大（pipeline/sources/sitca.py）
#       兩個自動來源都沒有的 ETF，由人工（CEO 或 Andy）整理一份，pipeline/compute/etf_holdings.py 會合併進
#       site/data/etf_holdings.json，前端成分股分頁照樣畫甜甜圈＋清單，小字標「人工整理・資料日 X・來源 Y」。
# 來源優先順序（Andy 2026-10-08：「每一檔用第一個成功的來源」）：① 官網每日 ＞ ② 公會月資料 ＞ ③ 這個檔。
#   有 ① 或 ② 的那一檔，這裡寫了也不會用（例外：這裡的資料日比 ① 新時以這裡為準）。
# 規則：
#   - 優先抄**發行投信官網**公告；投信官網看不到時，可以由人工在玩股網、口袋證券「用眼睛看完後」整理進來
#     （CEO 2026-10-08 指示的替代做法；這兩站的條款不允許程式自動抓，所以只能人工、而且要標出處與日期）。
#   - asof 寫「那份持股的資料日期」（網站上標的日期，不是抄寫當天）。
#   - src 寫看資料的網址；src_name 寫來源名稱（前端顯示），例如「玩股網（人工整理）」。
#   - w＝占基金淨值 %（必填，沒有權重的列不會顯示）；shares＝股數（可省略）；外股 code 寫原代號（例如 "NVDA US"）。
#   - 拿不到的欄位就不寫，不准估。
#
# 格式：
# etfs:
#   "00690":
#     asof: "2026-10-07"
#     issuer: "兆豐"
#     src: "https://www.wantgoo.com/stock/etf/00690/constituent"
#     src_name: "玩股網（人工整理）"
#     note: "兆豐官網擋雲端主機，公會月資料尚未公告該檔"
#     items:
#       - {code: "2330", name: "台積電", w: 25.56}
#       - {code: "2454", name: "聯發科", w: 14.57}
etfs: {}
