# ============================================================================
# 財報日曆（#earnings）的 FED 與美國重大數據日程 —— 人工維護（2026-10-05 建立）
# ----------------------------------------------------------------------------
# 為什麼要這份檔：
#   · FOMC 會議日程不是 FRED 的「發布」，FRED 拿不到；聯準會每年公開公布隔年的會議日程。
#   · CPI／非農／GDP／PCE 的公布日正式來源是 FRED fred/release/dates（pipeline/sources/macro.release_calendar，
#     進資料湖 macro_calendar 表）。這裡的 releases 只是**退回值**：FRED 金鑰沒設或抓取失敗時才用，
#     FRED 有資料時一律以 FRED 為準（build 端 pipeline/compute/earnings.py macro_events()）。
#
# 查證方式（照實寫）：這個容器的出口代理擋掉一般網址（WebFetch／curl 都打不開），只能用 WebSearch 撈摘要。
#   每個日期至少兩個來源的摘要講得出同一件事才寫進來；**沒有讀過官方頁面原文**，信心：中。
#   下次有人能開官方頁面時，請對照下列網址逐條確認，確認過把 verified 改成那天的日期與「原文」。
#   verified／source／second_source 是查證紀錄，只留在這份檔：earnings.json 的 src 只寫發布機關名
#   （2026-10-06 廢話普查第二輪，Andy：「讀者看了沒意義」；macro_events() 的 docstring）。
#
# 日期一律是**美東日期**（公布當地日期）；台灣時間由程式換算（夏令 +12 小時、冬令 +13 小時）。
# ============================================================================
verified: "2026-10-05（WebSearch 摘要，未讀原文）"

fomc:
  source: https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm
  second_source: https://fedratecalc.com/fomc-meeting-schedule/ ；https://fedratecalc.com/fomc-minutes-release-schedule/
  # start／end＝會議兩天；end 那天美東 14:00 公布決議、14:30 記者會。sep＝附經濟預測摘要（點陣圖）。
  # minutes＝會議紀要公布日（會後三週，美東 14:00）。
  meetings:
    - {start: "2026-01-27", end: "2026-01-28", sep: false, minutes: "2026-02-18"}
    - {start: "2026-03-17", end: "2026-03-18", sep: true,  minutes: "2026-04-08"}
    - {start: "2026-04-28", end: "2026-04-29", sep: false, minutes: "2026-05-20"}
    - {start: "2026-06-16", end: "2026-06-17", sep: true,  minutes: "2026-07-08"}
    - {start: "2026-07-28", end: "2026-07-29", sep: false, minutes: "2026-08-19"}
    - {start: "2026-09-15", end: "2026-09-16", sep: true,  minutes: "2026-10-07"}
    - {start: "2026-10-27", end: "2026-10-28", sep: false, minutes: "2026-11-18"}
    - {start: "2026-12-08", end: "2026-12-09", sep: true,  minutes: "2026-12-30"}

# FRED 抓不到時的退回日程（美東 08:30 公布）。ref＝這次公布的是哪一期的數據。
releases:
  cpi:
    source: https://www.bls.gov/schedule/news_release/cpi.htm
    dates:
      - {date: "2026-09-11", ref: "2026 年 8 月"}
      - {date: "2026-10-14", ref: "2026 年 9 月"}
      - {date: "2026-11-10", ref: "2026 年 10 月"}
      - {date: "2026-12-10", ref: "2026 年 11 月"}
  nfp:
    source: https://www.bls.gov/schedule/news_release/empsit.htm
    dates:
      - {date: "2026-09-04", ref: "2026 年 8 月"}
      - {date: "2026-10-02", ref: "2026 年 9 月"}
      - {date: "2026-11-06", ref: "2026 年 10 月"}
      - {date: "2026-12-04", ref: "2026 年 11 月"}
  pce:
    source: https://www.bea.gov/news/schedule
    dates:
      - {date: "2026-09-30", ref: "2026 年 8 月"}
      - {date: "2026-10-29", ref: "2026 年 9 月"}
      - {date: "2026-11-25", ref: "2026 年 10 月"}
      - {date: "2026-12-23", ref: "2026 年 11 月"}
  gdp:
    source: https://www.bea.gov/news/schedule
    dates:
      - {date: "2026-09-30", ref: "2026 Q2 第三次估計"}
      - {date: "2026-10-29", ref: "2026 Q3 初值"}
      - {date: "2026-11-25", ref: "2026 Q3 第二次估計"}
      - {date: "2026-12-23", ref: "2026 Q3 第三次估計"}

# ============================================================================
# 2026-10-06 補：每個 FED／美國數據事件的「是什麼／怎麼看／影響什麼／重要性星級／偏多偏空規則」
# （Andy：「多補充那消息是什麼、怎麼看、會影響什麼，重要程度用星星備註，符合預期或不符合是利空利多」）
# 星級是本專案的固定規則（stars 可自行調整，1～5）；措辭一律「市場通常解讀為…」，不是投資建議。
# 預期值：沒有合法免費來源（金十、Investing.com 等的預期值是商業資料，不抓不抄）→ 頁面不顯示預期值，
#   偏多／偏空改用「公布值 vs 前值」判斷；前值與公布值是 FRED 實際數字（FRED 抓不到就不顯示，不編）。
# dir：up_bear＝數字比前值高 → 對台股偏空；up_bull＝比前值高 → 偏多；none＝不判（要看決議內容／預期）。
# main：公布值取 FRED 快照的哪一項（對應 macro_snapshot 的 key）。
# links：官方數據連結（新分頁開啟）。FRED 連結一律指向「頁面上那個數字實際用的序列」（macro_snapshot 讀的 ID），
#   不是名稱相近的別條序列（例：GDP 用實質季增年率 A191RL1Q225SBEA，不是名目 GDP；PCE 看核心 PCEPILFE）。
#   2026-10-06 WebSearch 逐條確認頁面存在（摘要有標題與內容，未讀原文）：federalreserve.gov/monetarypolicy/fomccalendars.htm、
#   bls.gov/cpi/、bls.gov/news.release/empsit.nr0.htm（就業報告固定網址）、bea.gov/data/personal-consumption-expenditures-price-index、
#   bea.gov/data/gdp/gross-domestic-product、fred.stlouisfed.org/series/{DFEDTARU,CPIAUCSL,PAYEMS,UNRATE,PCEPILFE,A191RL1Q225SBEA}。
# 說明文字依據：聯準會、BLS、BEA 官方對各項數據的定義與一般財經媒體的通用解讀；寫法與星級參考金十數據財經日曆的欄位（星級、前值、預期、公布值、影響），文字自寫。
# ============================================================================
info:
  fomc:
    links:
      - {name: 聯準會 FOMC 聲明, url: "https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm"}
      - {name: FRED 目標利率, url: "https://fred.stlouisfed.org/series/DFEDTARU"}
    stars: 5
    what: 聯準會決定政策利率（聯邦基金利率目標區間），並公布聲明與記者會。
    how: 市場通常解讀為：降息或偏鴿措辭＝資金面寬鬆；升息或偏鷹措辭＝資金面收緊；比市場預期鷹或鴿才會造成大波動。
    impact: 美債殖利率、美元、全球風險資產；台股以科技權值與外資動向反應最明顯。
    dir: none
    main: policy
  minutes:
    links:
      - {name: 聯準會 FOMC 紀要, url: "https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm"}
      - {name: FRED 目標利率, url: "https://fred.stlouisfed.org/series/DFEDTARU"}
    stars: 3
    what: 上次利率會議的完整討論紀錄，會後三週公布。
    how: 市場通常解讀為：紀錄顯示多數委員偏向降息＝偏鴿；顯示擔心通膨＝偏鷹。
    impact: 美債殖利率、降息預期。
    dir: none
    main: policy
  cpi:
    links:
      - {name: BLS CPI, url: "https://www.bls.gov/cpi/"}
      - {name: FRED CPI, url: "https://fred.stlouisfed.org/series/CPIAUCSL"}
    stars: 5
    what: 美國消費者物價指數，每月公布上個月的物價年增率，是最先出爐的通膨數字。
    how: 市場通常解讀為：年增率高於前值＝通膨黏、降息延後；低於前值＝降息預期升溫。
    impact: 美債殖利率、美元、美股與台股科技股估值（殖利率上升通常壓抑高本益比族群）。
    dir: up_bear
    main: cpi_yoy
    rule: 公布值（CPI 年增率）高於前值＝對台股偏空；低於前值＝偏多。
  nfp:
    links:
      - {name: BLS 就業報告, url: "https://www.bls.gov/news.release/empsit.nr0.htm"}
      - {name: FRED 非農, url: "https://fred.stlouisfed.org/series/PAYEMS"}
      - {name: FRED 失業率, url: "https://fred.stlouisfed.org/series/UNRATE"}
    stars: 5
    what: 美國非農新增就業人數（含失業率），每月第一個週五公布。
    how: 市場通常解讀為：新增就業高於前值＝景氣穩但降息理由減弱；明顯低於前值＝景氣降溫、降息預期升溫，過弱則被解讀為衰退疑慮。
    impact: 美元、美債殖利率、降息預期。
    dir: up_bull
    main: nfp_change
    rule: 新增就業高於前值＝對台股偏多（景氣穩）；低於前值＝偏空（就業與降息的關係有兩面，僅供參考）。
  pce:
    links:
      - {name: BEA PCE, url: "https://www.bea.gov/data/personal-consumption-expenditures-price-index"}
      - {name: FRED 核心 PCE, url: "https://fred.stlouisfed.org/series/PCEPILFE"}
    stars: 4
    what: 美國 PCE 物價指數，聯準會 2% 通膨目標正式採用的指標。
    how: 市場通常解讀為：核心 PCE 年增率高於前值＝通膨降溫慢；低於前值＝回到 2% 目標有進展。
    impact: 降息預期、美債殖利率。
    dir: up_bear
    main: core_pce_yoy
    rule: 核心 PCE 年增率高於前值＝對台股偏空；低於前值＝偏多。
  gdp:
    links:
      - {name: BEA GDP, url: "https://www.bea.gov/data/gdp/gross-domestic-product"}
      - {name: FRED 實質 GDP, url: "https://fred.stlouisfed.org/series/A191RL1Q225SBEA"}
    stars: 4
    what: 美國實質 GDP 季增年率，同一季公布初值、第二次、第三次估計。
    how: 市場通常解讀為：高於前值＝景氣強、企業獲利基期好；低於前值＝景氣放緩。
    impact: 美股企業獲利預期、美元、台灣出口訂單的外部需求。
    dir: up_bull
    main: gdp
    rule: 季增年率高於前值＝對台股偏多；低於前值＝偏空。
  src: 聯準會（federalreserve.gov）、BLS（bls.gov）、BEA（bea.gov）對各項數據的定義；解讀為一般財經媒體的通用說法，無特定單一來源
