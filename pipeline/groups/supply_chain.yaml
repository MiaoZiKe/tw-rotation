    name: CoWoS 先進封裝
    segment: adv_pkg
    supply_demand: {status: shortage, note: "供給約滿足需求 6–7 成", as_of: "2026", confidence: reported}
    demand_allocation:
      - {customer: nvidia, pct: 63}
      - {customer: broadcom, pct: 13}
      - {customer: amd, pct: 8}
      - {customer: marvell, pct: 8}
    # 2026-09-19：來源只寫「鉅亨/富果」不是一個可點的出處、as_of 只寫年份前端算不出 180 天。
    # 數字先留著（它是這張圖的重要脈絡），但信心度標到 estimated 並講明沒有可查證出處。
    allocation_source: {name: "法人研究轉述，未取得可查證出處", as_of: "2026-09", confidence: estimated}
  - id: liquid_cooling
    name: 液冷散熱
    segment: thermal
    penetration:
      - {metric: "AI 伺服器液冷滲透率", value_pct: 76, as_of: "2026F", source: "鉅亨網引述法人", confidence: reported}
    note: "700W 以上 TDP 氣冷失效；水冷櫃單價約氣冷 4 倍"
  - id: hvdc_800v
    name: 800V HVDC 電源架構
    segment: power
    note: "Vera Rubin 世代硬規，2027 才真正放量"
    as_of: "2026-09"
    confidence: reported

