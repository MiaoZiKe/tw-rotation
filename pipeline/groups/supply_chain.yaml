# 產業關聯圖資料（產業分析師的 schema）
#
# 節點三種：segment（產業環節）、company（公司，帶台股代號）、product（產品/技術）
# 邊：supplies（供貨給）、competes（競爭）、substitutes（替代）、produced_by（由誰生產）
#
# 市占率規則：每一筆都要帶 as_of + source + confidence，UI 會顯示「這數字多舊、可不可信」。
#   confidence: verified（官方/研究機構明確數字）、reported（媒體引述法人）、estimated（推論）
# 超過 180 天沒更新的數字，頁面會自動變灰並提示。
#
# 這份是種子，數字由 Andy 依產業經驗校訂。半年重審一次邊關係，市占季度覆核。

meta:
  schema_version: "1.0"
  as_of: "2026-09-11"
  reviewed: "2026-09-11"
  note: "AI 伺服器 / 半導體鏈種子資料，市占數字依 2026-09 產業分析師查證"

# ---------------------------------------------------------------- 環節（分層順序 = 上游 → 下游）
segments:
  - {id: ip_eda,       name: "IP / EDA / 設計服務", layer: 0, chain: semiconductor}
  - {id: ic_design,    name: "IC 設計",             layer: 1, chain: semiconductor}
  - {id: foundry,      name: "晶圓代工",            layer: 2, chain: semiconductor}
  - {id: adv_pkg,      name: "先進封裝 CoWoS/SoIC", layer: 3, chain: semiconductor}
  - {id: osat_test,    name: "封測 / 測試",         layer: 3, chain: semiconductor}
  - {id: hbm,          name: "HBM 記憶體",          layer: 2, chain: semiconductor, note: "台廠無直接供應商，關聯在測試與載板"}
  - {id: abf_pcb,      name: "ABF 載板 / 高階 PCB", layer: 3, chain: ai_server}
  - {id: ccl,          name: "CCL 銅箔基板",        layer: 2, chain: ai_server}
  - {id: thermal,      name: "散熱（液冷）",        layer: 4, chain: ai_server}
  - {id: power,        name: "電源",                layer: 4, chain: ai_server}
  - {id: optical,      name: "光通訊 / 矽光子",     layer: 4, chain: ai_server}
  - {id: switch,       name: "交換器",              layer: 4, chain: ai_server}
  - {id: assembly,     name: "系統組裝 / 機櫃",     layer: 5, chain: ai_server}
  - {id: hyperscaler,  name: "雲端業者（終端需求）", layer: 6, chain: ai_server}

# ---------------------------------------------------------------- 產品 / 技術
products:
  - id: cowos
    name: CoWoS 先進封裝
    segment: adv_pkg
    supply_demand: {status: shortage, note: "供給約滿足需求 6–7 成", as_of: "2026", confidence: reported}
    demand_allocation:
      - {customer: nvidia, pct: 63}
      - {customer: broadcom, pct: 13}
      - {customer: amd, pct: 8}
      - {customer: marvell, pct: 8}
    allocation_source: {name: "法人研究轉述（鉅亨/富果）", as_of: "2026", confidence: reported}
  - id: liquid_cooling
    name: 液冷散熱
    segment: thermal
    penetration:
      - {metric: "AI 伺服器液冷滲透率", value_pct: 76, as_of: "2026F", source: "鉅亨網引述法人", confidence: reported}
    note: "700W 以上 TDP 氣冷失效；水冷櫃單價約氣冷 4 倍"
  - id: hvdc_800v
    name: 800V HVDC 電源架構
    segment: power
    note: "Vera Rubin 世代硬規，2027 才真正放量"
    as_of: "2026-09"
    confidence: reported

