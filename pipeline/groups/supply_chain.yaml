# 產業關聯圖資料（產業分析師的 schema）
#
# 節點三種：segment（產業環節）、company（公司，帶台股代號）、product（產品/技術）
#
# 邊（rel）：
#   supplies       from 供貨給 to（實線＋箭頭）
#   outsources_to  from 把製程委外給 to（虛線）—— 錢是 from 付給 to，方向跟 supplies 相反
#   designated_by  from 的料號由 to 指定（AVL，點虛線）—— 實體出貨不一定經過 to
#                  ★ 2026-09-19 新增。AI 伺服器鏈跟一般製造業鏈的關鍵差別就在這裡：
#                    CSP／NVIDIA 直接指定 CCL 與 PCB 的料號，但實體出貨走 ODM。
#                    只有 supplies 一種語意的話，不是畫錯（CCL 廠→GPU 廠）就是漏掉最重要的商業關係。
#   produced_by    product 由哪個 company 生產
#   competes       ★ 已經不放在 edges 裡（圖十不畫競爭關係，畫了會被誤讀成供貨），改放 competitors 區塊
#
# segment 的 role：core（預設，主鏈製程環節，實色）／material（材料，灰色但粗細仍依 strength）
#                  ／equipment（設備，灰細線）。前端 industry.js 的 drawChainMap 據此決定線的樣式。
#
# 市占率規則：每一筆都要帶 as_of + source + confidence，UI 會顯示「這數字多舊、可不可信」。
#   confidence: verified（官方/研究機構明確數字）、reported（媒體引述法人）、estimated（推論）
# 超過 180 天沒更新的數字，頁面會自動變灰並提示。
#
# 這份是種子，數字由 Andy 依產業經驗校訂。半年重審一次邊關係，市占季度覆核。

meta:
  schema_version: "1.0"
  as_of: "2026-09-19"
  reviewed: "2026-09-19"
  note: >-
    AI 伺服器 / 半導體鏈。2026-09-19 由三位 industry-analyst 分頭查證後大改：
    環節重新分類（設備／材料／測試介面獨立）、補上經查證的邊、刪掉查不到出處的市占數字。
    查證用的是搜尋摘要層級的公開資料（容器擋掉原文抓取），沒有讀到法說會逐字稿或年報，
    完整的來源與信心度記在 docs/supply_chain_suggest.md。

# ---------------------------------------------------------------- 環節（分層順序 = 上游 → 下游）
segments:
  # ---- 材料（最上游，role: material）
  # 這一層 2026-09-19 才補進來。整條鏈的瓶頸其實都在這裡（味之素 ABF 膜全球 >95% 市占、
  # 2026 漲價 30%），以前圖上完全不存在，點「ABF 載板」也列不出它的材料來源。
  # ★ 2026-09-21：名字補上「樹脂」—— 這一格底下的 1303 南亞 tech 就有「電子級環氧樹脂」，
  #   公司掛得沒錯，錯的是格子的名字漏了一種材料，讀者會以為樹脂沒人做。
  #   （CCL 的成本結構：銅箔約 35~45%、補強材料（玻纖布）約 25~40%、絕緣材料（樹脂）約 20~30%，
  #    三者都在這一格 —— 證據等級：WebSearch 摘要，區間只當量級看。）
  - {id: ccl_material,       name: "銅箔 / 玻纖布 / 樹脂",      layer: 1, chain: ai_server,     role: material}
  # ★ 2026-09-19（第二輪）：半導體這一側原本完全沒有「製程材料」這一格 ——
  #   兩個材料格（ccl_material、substrate_material）都在載板／PCB 那一側，
  #   所以靶材、特化、耗材這種真正卡在晶圓廠前面的東西無處可放。
  - {id: semi_material,      name: "半導體製程材料", layer: 1, chain: semiconductor, role: material}
  - {id: substrate_material, name: "載板材料 ABF / BT", layer: 2, chain: semiconductor, role: material}
  # ---- 半導體主幹
  - {id: ip_eda,       name: "IP / EDA / 設計服務", layer: 0, chain: semiconductor}
  - {id: ic_design,    name: "IC 設計",             layer: 1, chain: semiconductor}
  - {id: foundry,      name: "晶圓代工",            layer: 2, chain: semiconductor}
  - {id: adv_pkg,      name: "先進封裝 CoWoS/SoIC", layer: 3, chain: semiconductor,
     note: "CoWoS/SoIC 由台積電自己做（見晶圓代工），日月光承接外溢（見封測）"}
  - {id: osat_test,    name: "封測 / 測試",         layer: 3, chain: semiconductor}
  - {id: hbm,          name: "HBM 記憶體",          layer: 2, chain: semiconductor,
     note: "只畫 HBM 本體（由 SK hynix / Micron 自家封裝，台廠無直接供應商）。NAND 與利基 DRAM 另外兩格"}
  # ★ 2026-09-19 新增。NVIDIA 官方 Vera Rubin 技術文件把 NVMe SSD 定為 ICMS
  #   （Inference Context Memory Storage）記憶體階層的一層 —— 儲存從後段裝置變成系統架構的一層。
  #   這不是媒體推測，是官方規格，所以這一格值得開。
  - {id: storage,      name: "企業級儲存 / NAND", layer: 2, chain: semiconductor,
     note: "NVIDIA 在 Vera Rubin 推出 ICMS，把 NVMe SSD 納入推論的 context memory 階層（HBM→host mem→local SSD→ICMS→network storage）。台股主體是群聯 8299；慧榮是 NASDAQ:SIMO，不是台股，未列入"}
  # 跟 HBM 分開的理由：南亞科明講看淡 HBM、改押地端 AI 記憶體，旺宏與華邦電根本不做 DRAM／HBM；
  # 而且這一段營收由現貨報價驅動（2026H1 NOR 合約價漲 100–120%），跟 HBM 的長約模式拐點不同。
  - {id: dram_nor,     name: "DRAM / NOR Flash", layer: 2, chain: semiconductor}
  # ★ 2026-09-19：id 沿用 abf_pcb（前端 diagrams.js／three3d.js／_uitest 都引用了它），
  #   但把名稱與 chain 改對：IC 載板屬於半導體封裝環節，不是 AI 伺服器鏈。
  #   金像電 2368 從這一格搬去 hdi_pcb —— 它根本不做 ABF 載板，
  #   四家塞同一格等於在網站上宣稱「金像電是 ABF 載板廠」。
  - {id: abf_pcb,      name: "IC 載板（ABF / BT）",  layer: 3, chain: semiconductor}
  # ---- 設備 / 測試介面（role: equipment，灰細線，不跟主鏈搶視覺）
  # 設備廠的營收驅動是「客戶的資本支出」，產能廠是「CoWoS 單價」，景氣拐點不同；
  # 放同一格會讓族群卡片的量能解讀失真。
  # ★ 2026-09-19：前段設備自成一格。原本只有 pkg_equipment（封裝設備，layer 3），
  #   把應用材料或家登塞進去，網站等於在宣稱「應用材料是封裝設備商」「EUV 光罩盒是封裝設備」——
  #   跟「金像電被放進 ABF 載板」是同一條錯。
  #   layer 刻意選 1（不跟 pkg_equipment 的 3 一致）：industry.js 用 layer ± 1 算上下游清單，
  #   放 layer 1 的話晶圓代工（layer 2）的上游清單才帶得出「前段設備」。
  #   pkg_equipment 放 layer 3 其實就是因為這樣，封裝設備不會出現在封測環節的上游清單裡 ——
  #   那是既有的小缺陷，不值得複製。
  - {id: fab_equipment,  name: "前段設備 / 零組件",           layer: 1, chain: semiconductor, role: equipment}
  - {id: pkg_equipment,  name: "封裝設備 / 濕製程",         layer: 3, chain: semiconductor, role: equipment}
  - {id: test_interface, name: "測試介面 探針卡", layer: 3, chain: semiconductor, role: equipment}
  # ---- AI 伺服器
  # ★ 2026-09-21：顯示名補上 HDI。id 叫 hdi_pcb、名字卻只寫「MLB / UBB」，
  #   而 HDI（高密度互連、細線路少層）與 MLB/UBB（高層數厚板）是**兩種不同的板**。
  #   原本格子裡三家主要做高層板所以看不出來，華通（全球 HDI 龍頭）進來之後就矛盾了。
  #   id 不動（前端有引用），只改顯示名。
  #   顯示名有 150px 的硬上限（tests/test_delivery_guard.py，欄寬只有 ~155px），
  #   所以寫成「高階 PCB（HDI/高層板）」（斜線兩側不留空白剛好壓到 147px）—— MLB / UBB 是高層板的兩種，收進去不失真。
  - {id: hdi_pcb,      name: "高階 PCB（HDI/高層板）", layer: 3, chain: ai_server}
  # CCL 標 material，但**不**因此弱化到跟設備同級 —— 它是 PCB 裡**最大的單一材料成本**，
  # 是這輪行情的「因」不是「果」。灰色、粗細仍依 strength。
  # ★ 2026-09-21 更正：原本這句寫「占材料成本 50% 以上」，**查不到支撐**。
  #   實際查到的數字散得很開，而且口徑本身就不一致：
  #     40~60%（一般口徑，未指明是材料成本還是總成本）
  #     20~50%（台系整理）
  #     35~40%（中系整理，AI 伺服器高多層板口徑，並稱「PCB 第一大成本」）
  #   所有來源唯一一致的只有**定性結論**：CCL 是 PCB 裡最大的單一材料成本。
  #   所以改成定性句，不寫百分比 —— 這個檔案在別的地方本來就是這個標準
  #   （見家登、ASML Pod 那幾條：「只有投顧／社群等級來源，所以只寫定性不寫數字」），
  #   這一句是自己的例外。⚠ 證據等級：WebSearch 摘要，沒有讀過原文。
  - {id: ccl,          name: "CCL 銅箔基板",        layer: 2, chain: ai_server, role: material,
     material_of: [hdi_pcb]}
  # ★ 2026-09-19 更正：原本這句寫「健策是封裝層級、奇鋐／雙鴻是系統層級」，在 2026 年已經是**錯的**。
  #   雙鴻的封裝層級均熱片 2025Q2 起就在出貨（不是送樣）、還在泰國蓋專廠；
  #   健策 2026-03 的水冷板與分歧管首度列入 NVIDIA GTC Vera Rubin NVL72 系統端供應商名單
  #   （同一張名單上就有奇鋐）。重疊是雙向的，所以這個環節**不拆**。
  - {id: thermal,      name: "散熱（均熱片 / 液冷）", layer: 4, chain: ai_server,
     note: "分封裝層級（均熱片 lid/IHS、微流道均熱片 MCL，封裝廠貼合）與系統層級（水冷板／CDU／分歧管，組裝廠安裝）兩層。2026 年三家互相跨層，不再是各據一層"}
  - {id: power,        name: "電源",                layer: 4, chain: ai_server}
  - {id: optical_epi,  name: "光通訊磊晶 / 雷射晶粒", layer: 3, chain: ai_server}
  - {id: optical,      name: "光通訊模組 / 矽光子",  layer: 4, chain: ai_server}
  - {id: switch,       name: "交換器",              layer: 4, chain: ai_server}
  # ★ 2026-09-19（第二輪）新增兩格。共同理由：這兩類公司塞進現有任何一格都會重演
  #   「金像電被放進 ABF 載板」那條錯誤 —— 網站等於在宣稱它做的是另一種產品。
  - {id: connector,    name: "連接器 / 線材", layer: 4, chain: ai_server}
  - {id: fpc,          name: "軟板 FPC",               layer: 4, chain: ai_server}
  - {id: assembly,     name: "系統組裝 / 機櫃",     layer: 5, chain: ai_server}
  - {id: hyperscaler,  name: "雲端業者（終端需求）", layer: 6, chain: ai_server}

  # ================================================================ 一般電子鏈（2026-09-19 新增）
  # 這條鏈原本一個環節都沒有 —— 產業地圖上點得進去，但裡面沒有關聯圖也沒有剖析圖。
  # 分層照半導體鏈同一套讀法：材料 → 零組件 → 設備／系統 → 組裝 → 終端需求。
  #
  # ★ 為什麼加在檔案**最後面**而不是照 layer 插進上面：
  #   環節顏色是 PALETTE[color_idx % 14]，color_idx 是 YAML 的原始順序（loader.py）。
  #   加在尾端 → 既有 26 個環節的 color_idx 完全不動，全站顏色不會被洗掉。
  #   排序由 loader 依 layer 做，所以畫面上這幾格還是會回到正確的上下游位置。
  - {id: display_material, name: "面板材料 玻璃基板", layer: 0, chain: electronics, role: material,
     material_of: [panel_mfg],
     note: "TFT-LCD 玻璃基板與半導體級玻璃（玻璃核心基板 GCS）。★ 台股沒有 TFT 玻璃基板廠 —— 全球是康寧／AGC／NEG 三家，所以這一格只有外商。台玻 1802 做的是建築玻璃與玻纖、不是 TFT 基板，不要放進來"}
  - {id: passive_comp,     name: "被動元件 MLCC / 電阻", layer: 1, chain: electronics,
     note: "MLCC、晶片電阻、鋁質電解電容。★ 這一格全部查不到具名客戶，所以只有節點沒有邊，圖上會掛「?」—— 那是誠實，不是漏畫。
       ★ 2026-09-21 補進 3026 禾伸堂與 6173 信昌電：`groups.yaml` 的 mlcc 族群早就有這兩家，
       但這一格漏了，於是 MLCC 剖析圖點下去只列得出國巨／華新科／凱美 ——
       圖在講 MLCC，卻少了兩家真的做 MLCC 的，這是呈現上的錯"}
  - {id: panel_mfg,        name: "面板 TFT-LCD", layer: 2, chain: electronics,
     note: "面板製造。2026 年這一格的資金故事已經不是面板報價，而是「把既有 LCD 產線轉成面板級封裝 FOPLP 與玻璃核心基板」"}
  - {id: handset_optics,   name: "手機光學鏡頭", layer: 2, chain: electronics}
  - {id: metal_casing,     name: "機構件 / 金屬機殼", layer: 2, chain: electronics,
     note: "★ 刻意不叫「手機機殼」：這一格現在的主體是筆電機殼與 AI 伺服器機構件（見 catcher 的 note），叫手機機殼會是錯的"}
  - {id: net_equip,        name: "網通設備 CPE / 天線", layer: 3, chain: electronics,
     note: "寬頻 CPE、5G FWA、低軌衛星用戶終端。★ 交換器在 switch 那一格（智邦），不重複開"}
  - {id: consumer_ems,     name: "消費電子組裝 EMS", layer: 4, chain: electronics,
     note: "★ 跟 assembly（系統組裝／機櫃）分開：assembly 那一格講的是 AI 機櫃 L10/L11，把消費電子 EMS 塞進去等於在網站上宣稱它是 AI 機櫃廠 —— 跟「金像電被放進 ABF 載板」是同一條錯"}
  - {id: brand_operator,   name: "終端品牌與營運商", layer: 5, chain: electronics,
     note: "終端需求方，作用等同 AI 鏈的 hyperscaler。只放「台廠具名對手方就是它」的，不是要畫這些品牌的供應鏈全貌"}

# ---------------------------------------------------------------- 產品 / 技術
products:
  - id: cowos
    name: CoWoS 先進封裝
    segment: adv_pkg
    # as_of 只寫年份的話，過期判斷只能拿年中當基準，誤差半年。一律寫到月。
    supply_demand: {status: shortage, note: "供給約滿足需求 6–7 成", as_of: "2026-09", confidence: reported}
    demand_allocation:
      - {customer: nvidia, pct: 63}
      - {customer: broadcom, pct: 13}
      - {customer: amd, pct: 8}
      - {customer: marvell, pct: 8}
    # 2026-09-19：來源只寫「鉅亨/富果」不是一個可點的出處、as_of 只寫年份前端算不出 180 天。
    # 數字先留著（它是這張圖的重要脈絡），但信心度標到 estimated 並講明沒有可查證出處。
    allocation_source: {name: "法人研究轉述，未取得可查證出處", as_of: "2026-09", confidence: estimated}
  - id: liquid_cooling
    name: 液冷散熱
    segment: thermal
    penetration:
      - {metric: "AI 伺服器液冷滲透率", value_pct: 76, as_of: "2026F", source: "鉅亨網引述法人", confidence: reported}
    note: "700W 以上 TDP 氣冷失效；水冷櫃單價約氣冷 4 倍"
  - id: mcl
    name: 微流道均熱片 MCL
    segment: thermal
    note: "把微流道做進均熱片裡，單價約傳統均熱片 3–4 倍。2026H2 起逐步導入、2027 漸成主流；健策業界進度最快但 2026-09 仍在試產驗證，奇鋐 MLCP 最快 2026H2 小規模試產"
    as_of: "2026-09"
    confidence: reported
  - id: hvdc_800v
    name: 800V HVDC 電源架構
    segment: power
    note: "Vera Rubin 世代硬規，2027 才真正放量"
    as_of: "2026-09"
    confidence: reported

# ---------------------------------------------------------------- 公司
companies:
  # ---- 半導體主幹
  - {id: gud,     ticker: "3443", name: 創意,       segment: ip_eda,   tech: [ASIC 設計服務], customers: [hyperscaler]}
  - {id: alchip,  ticker: "3661", name: 世芯-KY,    segment: ip_eda,   tech: [ASIC 設計服務, 先進製程 NRE]}
  - {id: faraday, ticker: "3035", name: 智原,       segment: ip_eda,   tech: [IP, ASIC]}
  # ★ 這兩家跟創意／世芯的方向**相反**：設計服務是 turnkey、向晶圓廠買產能；
  #   IP 廠是把 IP 授權出去收授權金與權利金，晶圓廠是它們的**客戶**。
  #   同一格裡出現兩個方向的邊是對的，不是畫反。
  - {id: m31,     ticker: "6643", name: M31,        segment: ip_eda,
     tech: [高速傳輸介面 IP, PCIe, USB, UFS, MIPI, SerDes, 基礎 IP],
     note: "上櫃。純 IP 授權商，營收＝授權金＋權利金。法說自陳「來自晶圓廠客戶的新案授權金額年增逾 200%」—— 那五個字就是方向的證據"}
  - {id: ememory, ticker: "3529", name: 力旺,       segment: ip_eda,
     tech: [eNVM 嵌入式非揮發性記憶體 IP, NeoFuse OTP, PUF 安全 IP],
     note: "權利金約佔營收 67～85%，隨晶圓代工廠量產按片數或晶片售價提撥。IP 布局涵蓋全球 25 家晶圓廠、560 多個製程平台；TSMC OIP 最佳 IP 合作夥伴 16 度得獎"}
