# ---------------------------------------------------------------- 邊
# 2026-09-19 由三位 industry-analyst 查證後重寫。每條標了 confidence：
#   verified  官方文件／重訊等級（公司官網、優良供應商名單、採購金額揭露）
#   reported  兩個以上獨立媒體在摘要層級講同一件事
#   estimated **產業邏輯推論**，沒有直接來源
#
# ★ Andy 2026-09-19：「若是事實可以不上相關連結，若是你的推論也記得補上，並說明原因」。
#   所以：
#     verified / reported → 是事實，`note` 可有可無，**不強制附 source_url**
#     estimated           → 是**我的推論**，`note` 一定要寫成
#                           「推論依據：① … ② …。缺的是：<沒有的那個直接證據>」，
#                           而且**一定要附 source_url**（支撐推論的那篇）。
#   理由很直接：事實他自己查得到；推論是我的主張，我得把推理過程攤開讓他判斷。
#
# ★ 兩條 2026-09-19 用代價換來的硬規矩：
#   1. **台灣財經媒體的並列標題不得當成供貨關係的依據。**
#      〈智邦、台光電 嗨〉〈智邦、台燿 出貨動能樂觀〉這種標題講的是「兩家一起受惠」，
#      不是「A 供貨給 B」。同一個陷阱在兩輪查證裡各踩到一次。
#   2. **公司代號一律要獨立查證過才寫進來。**
#      這一輪差點把竑騰寫成 6428 —— 那是台灣淘米（遊戲／文創股）。竑騰是 7751。
#      代號錯了不只是一行字錯：個股頁會去抓完全另一家公司的股價與營收。
# 查不到出處的一律**不畫**，讓節點維持孤立並在圖上標「?」。畫錯一條線比留一個「?」糟糕得多。
