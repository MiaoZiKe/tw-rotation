# 產業關聯圖資料（產業分析師的 schema）
#
# 節點三種：segment（產業環節）、company（公司，帶台股代號）、product（產品/技術）
#
# 邊（rel）：
#   supplies       from 供貨給 to（實線＋箭頭）
#   outsources_to  from 把製程委外給 to（虛線）—— 錢是 from 付給 to，方向跟 supplies 相反
#   designated_by  from 的料號由 to 指定（AVL，點虛線）—— 實體出貨不一定經過 to
#                  ★ 2026-09-19 新增。AI 伺服器鏈跟一般製造業鏈的關鍵差別就在這裡：
#                    CSP／NVIDIA 直接指定 CCL 與 PCB 的料號，但實體出貨走 ODM。
#                    只有 supplies 一種語意的話，不是畫錯（CCL 廠→GPU 廠）就是漏掉最重要的商業關係。
#   produced_by    product 由哪個 company 生產
#   competes       ★ 已經不放在 edges 裡（圖十不畫競爭關係，畫了會被誤讀成供貨），改放 competitors 區塊
#
# segment 的 role：core（預設，主鏈製程環節，實色）／material（材料，灰色但粗細仍依 strength）
#                  ／equipment（設備，灰細線）。前端 industry.js 的 drawChainMap 據此決定線的樣式。
#
# 市占率規則：每一筆都要帶 as_of + source + confidence，UI 會顯示「這數字多舊、可不可信」。
#   confidence: verified（官方/研究機構明確數字）、reported（媒體引述法人）、estimated（推論）
# 超過 180 天沒更新的數字，頁面會自動變灰並提示。
#
# 這份是種子，數字由 Andy 依產業經驗校訂。半年重審一次邊關係，市占季度覆核。

meta:
  schema_version: "1.0"
  as_of: "2026-09-19"
  reviewed: "2026-09-19"
  note: >-
    AI 伺服器 / 半導體鏈。2026-09-19 由三位 industry-analyst 分頭查證後大改：
    環節重新分類（設備／材料／測試介面獨立）、補上經查證的邊、刪掉查不到出處的市占數字。
    查證用的是搜尋摘要層級的公開資料（容器擋掉原文抓取），沒有讀到法說會逐字稿或年報，
    完整的來源與信心度記在 docs/supply_chain_suggest.md。

# ---------------------------------------------------------------- 環節（分層順序 = 上游 → 下游）
segments:
  # ---- 材料（最上游，role: material）
  # 這一層 2026-09-19 才補進來。整條鏈的瓶頸其實都在這裡（味之素 ABF 膜全球 >95% 市占、
  # 2026 漲價 30%），以前圖上完全不存在，點「ABF 載板」也列不出它的材料來源。
  - {id: ccl_material,       name: "銅箔 / 玻纖布",             layer: 1, chain: ai_server,     role: material}
  - {id: substrate_material, name: "載板材料（ABF 膜 / BT 樹脂）", layer: 2, chain: semiconductor, role: material}
  # ---- 半導體主幹
  - {id: ip_eda,       name: "IP / EDA / 設計服務", layer: 0, chain: semiconductor}
  - {id: ic_design,    name: "IC 設計",             layer: 1, chain: semiconductor}
  - {id: foundry,      name: "晶圓代工",            layer: 2, chain: semiconductor}
  - {id: adv_pkg,      name: "先進封裝 CoWoS/SoIC", layer: 3, chain: semiconductor,
     note: "CoWoS/SoIC 由台積電自己做（見晶圓代工），日月光承接外溢（見封測）"}
  - {id: osat_test,    name: "封測 / 測試",         layer: 3, chain: semiconductor}
  - {id: hbm,          name: "HBM 記憶體",          layer: 2, chain: semiconductor,
     note: "本圖只畫 HBM 本體（由 SK hynix / Micron 自家封裝，台廠無直接供應商）；傳統 DRAM / NAND 不在這張圖上"}
  # ★ 2026-09-19：id 沿用 abf_pcb（前端 diagrams.js／three3d.js／_uitest 都引用了它），
  #   但把名稱與 chain 改對：IC 載板屬於半導體封裝環節，不是 AI 伺服器鏈。
  #   金像電 2368 從這一格搬去 hdi_pcb —— 它根本不做 ABF 載板，
  #   四家塞同一格等於在網站上宣稱「金像電是 ABF 載板廠」。
  - {id: abf_pcb,      name: "IC 載板（ABF / BT）",  layer: 3, chain: semiconductor}
  # ---- 設備 / 測試介面（role: equipment，灰細線，不跟主鏈搶視覺）
  # 設備廠的營收驅動是「客戶的資本支出」，產能廠是「CoWoS 單價」，景氣拐點不同；
  # 放同一格會讓族群卡片的量能解讀失真。
  - {id: pkg_equipment,  name: "封裝設備 / 濕製程",         layer: 3, chain: semiconductor, role: equipment}
  - {id: test_interface, name: "測試介面（探針卡 / 測試座）", layer: 3, chain: semiconductor, role: equipment}
  # ---- AI 伺服器
  - {id: hdi_pcb,      name: "高階 PCB（MLB / UBB）", layer: 3, chain: ai_server}
  # CCL 標 material，但**不**因此弱化到跟設備同級 —— 它占高階 AI 伺服器 PCB 材料成本 50% 以上，
  # 是這輪行情的「因」不是「果」。灰色、粗細仍依 strength。
  - {id: ccl,          name: "CCL 銅箔基板",        layer: 2, chain: ai_server, role: material,
     material_of: [hdi_pcb]}
  - {id: thermal,      name: "散熱（均熱片 / 液冷）", layer: 4, chain: ai_server,
     note: "健策是封裝層級的均熱片（封裝廠就貼上去），奇鋐／雙鴻是系統層級的水冷板／CDU（組裝廠才裝）"}
  - {id: power,        name: "電源",                layer: 4, chain: ai_server}
  - {id: optical_epi,  name: "光通訊磊晶 / 雷射晶粒", layer: 3, chain: ai_server}
  - {id: optical,      name: "光通訊模組 / 矽光子",  layer: 4, chain: ai_server}
  - {id: switch,       name: "交換器",              layer: 4, chain: ai_server}
  - {id: assembly,     name: "系統組裝 / 機櫃",     layer: 5, chain: ai_server}
  - {id: hyperscaler,  name: "雲端業者（終端需求）", layer: 6, chain: ai_server}

# ---------------------------------------------------------------- 產品 / 技術
products:
