# 族群 / 題材對照表
#
# 這是全案唯一需要人工維護的檔案，也是最有價值的一份 —— 抓得到的資料大家都有，
# 族群怎麼切才是自己的判斷。
#
# 維護規則：
#   1. 這份是「題材族群」，與證交所法定產業別（自動來自 API）並存，兩者都會用
#   2. 每個族群標 tier（upstream / midstream / downstream）以呈現供應鏈位置
#   3. reviewed 欄位是上次人工檢視日期；超過一季沒檢視，dashboard 會顯示提醒
#   4. 成分股寧缺勿濫：放進來的每一檔都要是該題材的實際受惠者，
#      不是「新聞提過一次」就算
#   5. valuation_metric 決定這個族群用哪種估值口徑比同業（金融專家的規則）：
#        pe      本益比（預設）—— 一般製造業、IC 設計、代工
#        pb_roe  股價淨值比 + ROE —— 金融、壽險、營建資產股（PE 受評價損益與一次性扭曲）
#        ps      股價營收比 —— 未獲利的生技、新創（PE 沒有意義）
#      沒寫就是 pe。絕不跨族群比 PE 絕對值。
#
# 下游偵測：pipeline/groups/build_groups.py 會從官方產業價值鏈平台與
# MoneyDJ 概念股抓出候選清單，與這份比對後產出「建議新增/移除」報告，
# 但不會自動改這個檔案 —— 決定權在人。

meta:
  version: 1
  reviewed: "2026-09-11"
  note: "初版種子，需 Andy 依實際追蹤標的校訂；已加 valuation_metric"

groups:

  # ---------------------------------------------------------------- 半導體鏈
  ic_design:
    name: IC 設計
    tier: upstream
    chain: semiconductor
    # ★ 2026-09-19：拿掉 8299（群聯，移到 memory，見上）與 6669（緯穎）——
    #   緯穎是 AI 伺服器 ODM，不是 IC 設計公司，它本來就在 ai_server_odm 裡。
    # ★ 2026-09-19（第二輪）：收回四家被放錯格的 IC 設計公司 ——
    #   5471 松翰原本在 semi_equipment（它是 MCU 設計公司，不是設備商），
    #   6104 創惟／6526 達發／4966 譜瑞-KY 原本在 silicon_ip（它們賣的是晶片，不是 IP 授權）。
    #   矽智財的定義是「授權 IP 收權利金」，力旺 3529 與 M31 6643 才是；
    #   把賣晶片的公司放進去，會讓「矽智財」族群的量能與估值中位數整個失真。
    #   ★ 2026-09-19 傍晚拿掉 3529（力旺）：這個檔案自己在 silicon_ip 那一格寫著
    #     「矽智財的定義是『授權 IP 收權利金』，力旺 3529 與 M31 6643 才是」——
    #     照它自己的定義，力旺就不該同時留在 ic_design。
    #     力旺的權利金約佔營收 67～85%，隨晶圓代工廠量產按片數提撥，是純授權模式。
    #     雙掛會把它的量能 1/n 拆到 IC 設計去，而 M1 正是靠族群量能判斷錢往哪跑。
    codes: ["2454", "3034", "2379", "3443", "6415", "3661", "5269",
            "5471", "6104", "6526", "4966"]

  silicon_ip:
    name: 矽智財 IP
    tier: upstream
    chain: semiconductor
    codes: ["3529", "6643"]

  foundry:
    name: 晶圓代工
    tier: midstream
    chain: semiconductor
    # ★ 2026-09-19：拿掉 3374（精材）—— 它做的是晶圓級封裝 WLCSP／TSV，
    #   是封裝廠（台積電轉投資），不是晶圓代工廠。
    #   ★ 2026-09-19 傍晚再修一次：我當時寫「它留在 advanced_packaging」也是錯的。
    #     那一格的 note 寫著「CoWoS 產能相關**設備與材料**」，裡面是家登／萬潤／辛耘三家設備商，
    #     而精材是**產能廠**，做的是 WLCSP／TSV（營收結構：晶圓測試約 44～50%、WLCSP 約 49%），
    #     **不做 CoWoS 也不做 SoIC**。留在那一格會讓「先進封裝 CoWoS」族群的量能
    #     混進一家成熟 WLCSP／測試廠。已移到 osat（封測）。
    codes: ["2330", "2303", "5347", "6770"]

  memory:
    name: 記憶體
    tier: midstream
    chain: semiconductor
    # ★ 2026-09-19 拿掉 8261（富鼎）—— 那是功率半導體（MOSFET／IGBT）廠，跟記憶體無關。
    #   它會污染記憶體族群的量能、漲跌幅與估值中位數，而 M1 正是靠族群量能判斷「錢往哪跑」。
    #   （themes.yaml 的「HBM / 記憶體」題材也有同一個錯，一起拿掉。）
    #   補上 2337（旺宏）—— themes.yaml 本來就有它，groups.yaml 沒有，同一家公司
    #   在題材頁算得到、在族群頁算不到。
    #   補上 8299（群聯）並從 ic_design 移出：它的營收主體是 NAND 模組與 eSSD、
    #   驅動因子是 NAND 報價而不是設計案（2026H1 營收 1,088 億）。
    codes: ["2408", "3006", "2344", "2337", "8299", "4967", "5289", "3260"]

  osat:
    name: 封測
    tier: downstream
    chain: semiconductor
    # ★ 2026-09-19：拿掉 2311（日月光）—— 2018-04 已下市，與矽品合併為日月光投控 3711（本格已有）。
    #   機器驗證：data/price_daily 裡 2018 年只剩 67 筆、2019 年起連續八年 0 筆。
    #   它不會報錯的原因是 data/company_info 留了一筆欄位幾乎全空的殘影，
    #   所以「查得到名字」不等於「這檔還在交易」。這類錯只有機器抓得到，
    #   tests/test_group_codes_alive.py 從今天起每次 pytest 都會掃。
    #   ★ 2026-09-19 傍晚補上 3374（精材）：它做的是晶圓級封裝與晶圓測試，屬封測，
    #     不是先進封裝 CoWoS（見 foundry 那一格的說明）。
    codes: ["3711", "6239", "2449", "8150", "3264", "3374"]

  advanced_packaging:
    name: 先進封裝 CoWoS
    tier: downstream
    chain: semiconductor
    note: "台積電 CoWoS 產能相關設備與材料"
    # ★ 2026-09-19：拿掉 6266（泰詠）與 2461（光群雷）。
    #   6266 泰詠是 EMS／SMT 板級代工（TPEX 電子零組件業），跟先進封裝無關；
    #   2461 光群雷做的是雷射全像「包裝」材料（日化品、菸酒防偽），
    #   很可能是當初用關鍵字比對時「包裝」撞上「先進封裝」的「裝」字被收進來的。
    #   ★ 2026-09-19 傍晚拿掉 3374（精材）——它是產能廠不是設備商，也不做 CoWoS／SoIC，已移到 osat。
    #     這一格現在純粹是「CoWoS 產能相關的設備與材料」，跟 note 對得上。
    codes: ["3680", "6187", "3583"]

  semi_equipment:
    name: 半導體設備
    tier: upstream
    chain: semiconductor
    # ★ 2026-09-19：5471 松翰移到 ic_design（MCU 設計公司）、
    #   6182 合晶移到 semi_material（矽晶圓廠，是材料不是設備）。
    #   ★ 2026-09-19 傍晚補上 6196（帆宣）：在手訂單破千億、客戶含台積電與 ASML 的
    #     半導體廠務／設備整合商，但 groups / themes / supply_chain 三個檔原本都查不到它
    #     —— 跟「臻鼎 4958 三個檔都沒有」是同一類洞。
    codes: ["3131", "3680", "6187", "3413", "6196"]

  semi_material:
    name: 半導體材料
    tier: upstream
    chain: semiconductor
    # ★ 2026-09-19：這一格原本五檔裡有四檔跟半導體材料無關，是這次查到最嚴重的一條 ——
    #   M1 資金面的「半導體材料」族群量能有 4/5 是別的產業的錢，數字整個是錯的，
    #   而且點進族群會列出一家直播公司。逐檔用 data/company_info 的證交所產業別獨立確認：
    #     4763 材料*-KY  化學工業   濟南大自然新材料，醋酸纖維絲束（香菸濾嘴、眼鏡框）
    #     6165 浪凡      數位雲端   浪凡網路科技，直播平台「浪 LIVE」
    #     8104 錸寶      光電業     錸寶科技，PMOLED 面板
    #     4707 磐亞      化學工業   非離子界面活性劑
    #     1785 光洋科    其他電子   靶材與貴金屬回收精煉 —— 唯一對的一檔
    #   補進 6182 合晶（TPEX 半導體業，矽晶圓），它原本被放在 semi_equipment。
    #   這一格只剩兩檔是刻意的：寧可少，不要再放一家「聽起來有關」的進來。
    codes: ["1785", "6182"]

  # ---------------------------------------------------------------- AI 伺服器鏈
  ai_server_odm:
    name: AI 伺服器組裝
    tier: downstream
    chain: ai_server
    # ★ 2026-09-19：拿掉 5388（中磊）—— 這是「公司自己否認」等級的錯。
    #   中磊 2026 法說明講不把 AI 伺服器／Switch／CPO／OCS 列為主要發展方向，
    #   選擇從 Edge 端切入 AI。它是寬頻／電信 CPE 網通廠，留在 networking 那一格。
    codes: ["2317", "2382", "2356", "6669", "3231", "2376"]

  server_thermal:
    name: 伺服器散熱
    tier: midstream
    chain: ai_server
    note: "液冷是 AI 機櫃最關鍵的瓶頸之一；封裝層級的均熱片（健策）與系統層級的水冷同屬這一族群"
    # ★ 2026-09-19 補上 3653（健策）。原本這一格沒有它，但 themes.yaml 的「散熱/液冷」
    #   與 supply_chain.yaml 的 thermal 環節都有 —— 三個檔互相打架，
    #   而 M1 的族群量能吃的是這一份，等於健策的資金流根本沒被算進伺服器散熱。
    #   證據：市場口徑固定是「散熱三雄＝奇鋐＋雙鴻＋健策」（商周／工商／豐雲學堂／旺得富都這樣寫），
    #   而且 2026-05-06 一則「Rubin 均熱片由雙片改單片、單價 150→50 美元」的傳言
    #   讓三家同步重挫（健策險吞 3 根跌停、雙鴻連四跌、奇鋐跌停「拖累散熱族群」）——
    #   那是封裝層級的 ASP 事件，卻打穿了系統層級的兩家，資金流事實上是同向的。
    codes: ["3017", "3324", "6230", "2421", "8996", "3653", "2486"]

  server_power:
    name: 伺服器電源
    tier: midstream
    chain: ai_server
    # ★ 2026-09-19：拿掉 3033（威健）與 2489（瑞軒），兩家都不生產電源。
    #   3033 威健是電子通路業（AMD 亞太區最大代理商），代理 Infineon 的電源 IC 不等於做電源；
    #   2489 瑞軒是光電業（顯示器／數位電視 ODM），查不到任何電源產品線。
    #   放在這一格會讓使用者以為它們跟台達電、光寶科在搶同一張單。
    codes: ["2308", "6409"]

  pcb_abf:
    name: PCB / ABF 載板
    tier: midstream
    chain: ai_server
    # ★ 2026-09-19 補上 4958（臻鼎-KY）。它是全球 PCB 龍頭、AI 算力應用佔營收逾六成，
    #   2026-06-01 以官方新聞稿宣布加入 NVIDIA MGX 生態系，卻在 groups.yaml 與 themes.yaml
    #   兩個檔裡都完全查不到 —— 一張講 AI 伺服器 PCB 的圖上沒有臻鼎，是覆蓋率最大的洞。
    #   （這一格同時裝了載板、高層數硬板、軟板三種東西，名稱會誤導，已列進下一批要拆的項目。）
    codes: ["3037", "8046", "2368", "6269", "3189", "5469", "4958"]

  connector:
    name: 連接器 / 高速傳輸
    tier: midstream
    chain: ai_server
    # ★ 2026-09-19：五檔裡有三檔不是連接器廠，而且三檔都已經在它們該在的格子裡，
    #   雙掛會把量能 1/n 拆到一個它們不屬於的族群：
    #     2308 台達電 電源／散熱集團（已在 server_power）
    #     6285 啟碁   網通 ODM（已在 networking）
    #     2492 華新科 MLCC 被動元件（已在 passive）
    #   真正的連接器／線材廠只有 3023 信邦與 3665 貿聯-KY。
    codes: ["3023", "3665"]

  optical_comm:
    name: 光通訊 / 矽光子
    tier: midstream
    chain: ai_server
    # ★ 2026-09-19：拿掉 6143（振曜）。振曜本體是全球最大電子閱讀器組裝廠（電子紙），
    #   光纖業務是它持股約四成的 6291 沛亨在做 —— 用「被投資公司在做什麼」定義母公司的族群，
    #   等於把一家電子紙廠的量能算進光通訊。（6291 沛亨要不要收進來，等它的具名客戶查得到再說。）
    codes: ["3450", "4979", "4977", "3363"]

