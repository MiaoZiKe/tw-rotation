    codes: ["2707", "2739", "2731", "5706"]

# 供應鏈上下游關係：用來畫關聯圖，也用來判斷「上游先漲，下游會不會跟」
chains:
  semiconductor:
    name: 半導體
    order: [silicon_ip, ic_design, semi_equipment, semi_material, foundry, memory, osat, advanced_packaging]
  ai_server:
    name: AI 伺服器
    order: [optical_comm, pcb_abf, connector, server_power, server_thermal, ai_server_odm]
  electronics:
    name: 一般電子
    order: [passive, panel, networking, handset_chain]
  traditional:
    name: 傳產
    order: [steel, petrochemical, shipping, finance, biotech, tourism]
  infrastructure:
    name: 基礎建設
    order: [heavy_electric, green_energy]

