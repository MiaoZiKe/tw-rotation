benchmarks:
  foundry: "^SOX"
  ic_design: "^SOX"
  memory: "^SOX"
  advanced_packaging: "^SOX"
  ai_server_odm: "^IXIC"
  server_thermal: "^IXIC"
  optical_comm: "^IXIC"
  finance: "^TWII"
