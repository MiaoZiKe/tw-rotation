    codes: ["3576", "6438", "1513"]

  biotech:
    name: 生技醫療
    tier: standalone
    chain: traditional
    valuation_metric: ps
    codes: ["6446", "4737", "1795", "6547", "4746"]

  tourism:
    name: 觀光餐旅
    tier: standalone
