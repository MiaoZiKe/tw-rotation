    tier: standalone
    chain: infrastructure
    # ★ 2026-09-19：拿掉 6806（森崴能源）。它確實是綠能公司，但因子公司富崴承攬台電離岸風電
    #   二期嚴重虧損、淨值轉為負數，證交所公告自 2026-06-23 起終止上市，資料湖最後一筆是 2026-06-22。
    #   這一檔是機器掃出來的、沒有任何一位分析師回報 —— 「族群成分對不對」與「這檔還在不在」
