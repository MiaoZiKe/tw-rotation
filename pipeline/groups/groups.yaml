# 族群 / 題材對照表 —— 板塊定義以 tide-tw.app 的 110 個板塊為準
#
# 這是全案唯一需要人工維護的檔案，也是最有價值的一份 —— 抓得到的資料大家都有，
# 族群怎麼切才是自己的判斷。
#
# 為什麼改成 110 個板塊（2026-09-21）
# ------------------------------------
# 舊版是自訂的 28 個族群。Andy 指定把「資金去向」與「輪動時鐘」換成 tide-tw.app 的板塊，
# 並親自截圖提供官方清單（逐字抄錄在 docs/tide_110_boards.md，那份是權威清單）。
# **板塊名稱一律用 tide 的原文**，不自己改名 —— 名字不同就對不起來，改名等於白做。
#
# ★ tide 的清單是起點，不是聖經（Andy 2026-09-21：「即使他是那樣寫也需要查證」）
# ------------------------------------------------------------------------
# 收容桶（〇〇・其他）只該裝「真的沒有共同驅動力」的零散股。如果一籃股票明顯一起動，
# 卻因為 tide 沒開那一格就丟進收容桶，M1 的資金面就看不到它 —— CCL 那四家合計
# 日均 319 億（20 日平均），連同銅箔與德宏一起整包躺在「電子零組件・其他」裡 ——
# 那一桶 536.7 億裡有 426 億（79%）是這六檔，等於台股 AI 板材主線在儀表板上消失。
# 所以新增板塊的判準是**兩條都要過**：
#   1. 資金流同向 —— 用 data/price_daily 實際算 120 個交易日、剔除大盤 beta 後的
#      日報酬殘差相關。基準線：全市場隨機配對中位 +0.08、95 百分位 +0.29
#      （2026-09-21 用 395 檔深歷史股實測）。組內要明顯高於這個基準，
#      而且要高於它對隔壁板塊的相關。
#   2. 有獨立敘事 —— 查得到公開來源說明這一籃被同一件事驅動（同一個終端需求、
#      同一波政策、同一個缺料）。只有一條成立的，寫進 docs/tide_deviations.md 並維持現狀。
# 只成立一條就硬開一格，等於把「看起來像」當成證據；兩條都不成立就留在收容桶。
#
# 這個檔案裡只有 83 個板塊，另外 33 個去哪了？
# --------------------------------------------
# tide 的 110 個板塊裡有 33 個「就等於一個法定產業別」：
#   · 16 個是「〈法定產業別〉・其他」的收容桶（半導體・其他、光電・其他…），
#   · 1 個是「其他產業」，
#   · 16 個是整個產業別自己就是一個板塊（生技醫療、文化創意、水泥、造紙…，
#     tide 沒有替它們再開「・其他」，代表那一格就是整個產業別）。
# 這 33 個**刻意不在這裡手寫成分股**：build_payload 會替「沒有題材族群」的股票
# 自動用法定產業別開一個 ind_<產業別> 族群（見 compute/flow._attach_groups），
# 手寫會跟自動桶打架 —— 同一檔股票兩邊都出現，資金佔比被算兩次，
# 而且每次有新股上市都要回來補一次。
# 所以改成只登記「法定產業別 → tide 顯示名」的對照表（meta.ind_display），
# 讓 ind_* 自動桶直接改用 tide 的名字。**pipeline 端要配合的事寫在 meta.ind_display 上面。**
#
# 維護規則：
#   1. 每個板塊標 tier（upstream / midstream / downstream / standalone）以呈現供應鏈位置
#   2. reviewed 欄位是上次人工檢視日期；超過一季沒檢視，dashboard 會顯示提醒
#   3. 成分股寧缺勿濫：放進來的每一檔都要說得出「主要營收來源」，不是靠名字猜。
#      每一檔的歸類理由、信心度與來源網址寫在 docs/groups_tide110_evidence.md。
#   4. 一檔股票可以屬於多個板塊（散熱廠氣冷液冷都做、日月光既做封測也做先進封裝），
#      量能會按 1/n 拆分（flow._attach_groups），所以掛兩個不會把市場總量灌水。
#   5. valuation_metric 決定這個板塊用哪種估值口徑比同業（金融專家的規則）：
#        pe      本益比（預設）—— 一般製造業、IC 設計、代工
#        pb_roe  股價淨值比 + ROE —— 金融、壽險、營建資產股（PE 受評價損益與一次性扭曲）
#        ps      股價營收比 —— 未獲利的生技、新創（PE 沒有意義）
#      沒寫就是 pe。絕不跨族群比 PE 絕對值。
#
# 成分股怎麼驗的：每一檔都比對過 data/company_info（存在、非興櫃）與
# data/price_daily/year=2026（2026-09-10～09-18 七個交易日連續有報價）。不通過的不留。

meta:
  version: 3
  reviewed: "2026-09-21"
  source: "tide-tw.app 的 110 個板塊（Andy 2026-09-21 截圖，逐字抄錄於 docs/tide_110_boards.md）"
  note: >-
    板塊名稱以 tide 原文為準。象限（漲潮／輪動／觀望／退潮）是每天會變的資金狀態，
    不是分類，所以刻意沒有寫進這個檔案。
    83 個板塊在 groups 裡手寫成分，另外 33 個由 build_payload 的 ind_* 自動桶供應（見 ind_display）。
    2026-09-21 第二輪查證後，依「資金流是否同向 ＋ 有沒有獨立敘事」新增 6 個 tide 沒有的板塊
    （CCL 銅箔基板、銅箔、重電設備、電信服務、壽險金控、證券金控），
    每一筆偏離的理由、相關係數與代價都寫在 docs/tide_deviations.md。

  # ★ 給 pipeline 的請求（這個檔案自己做不到，需要 build_payload.py 配合）：
  #   ind_* 自動桶目前用法定產業別原名當 group_name（「半導體業」「生技醫療業」）。
  #   請改成：若 norm_industry(產業別) 在下面這張表裡，group_name 就用對應的 tide 顯示名。
  #   group_id 維持 "ind_" + 產業別原名不要動（前端 L.groupByName 與熱力圖下鑽都吃它）。
  #   沒對到的（目前只有 ETF）維持原名。
  #   另外，帶 valuation_metric 的那一格要讓 compute/fundamental.group_valuation() 也吃到 ——
  #   ind_* 目前一律用 pe，但壽險／證券／產險的 PE 會被評價損益扭曲，必須走 pb_roe。
  #   改這一段的理由：這 33 個板塊的成分本來就該自動維護，手寫會和自動桶重複計算。
