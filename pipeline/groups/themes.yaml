# 題材對照表（v3）。與 groups.yaml 的「族群」不同：
# - 族群是產業鏈位置，一檔股票的量能會依所屬族群數平均拆分（避免灌水）
# - 題材是市場炒作的敘事，一檔股票可以同時是 AI、CoWoS、矽光子；量能「不拆分」，
#   因為題材熱度就是要看「多少錢在追這個故事」，重複計算是刻意的
# 這份清單是起始版，由 Andy 校訂。codes 用證券代號；簡稱由 company_info 補。
