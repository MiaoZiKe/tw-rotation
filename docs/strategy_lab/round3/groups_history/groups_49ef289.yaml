# 族群 / 題材對照表
#
# 這是全案唯一需要人工維護的檔案，也是最有價值的一份 —— 抓得到的資料大家都有，
# 族群怎麼切才是自己的判斷。
#
# 維護規則：
#   1. 這份是「題材族群」，與證交所法定產業別（自動來自 API）並存，兩者都會用
#   2. 每個族群標 tier（upstream / midstream / downstream）以呈現供應鏈位置
#   3. reviewed 欄位是上次人工檢視日期；超過一季沒檢視，dashboard 會顯示提醒
#   4. 成分股寧缺勿濫：放進來的每一檔都要是該題材的實際受惠者，
#      不是「新聞提過一次」就算
#
# 下游偵測：pipeline/groups/build_groups.py 會從官方產業價值鏈平台與
# MoneyDJ 概念股抓出候選清單，與這份比對後產出「建議新增/移除」報告，
# 但不會自動改這個檔案 —— 決定權在人。

meta:
  version: 1
  reviewed: "2026-09-10"
  note: "初版種子，需 Andy 依實際追蹤標的校訂"

