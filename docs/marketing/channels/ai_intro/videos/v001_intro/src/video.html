const items=[];
function add(id,x,y,w,h,cls,html,t0,t1,extra={}){const d=document.createElement('div');d.className='o '+cls;d.dataset.o=id;

 const it={d,t0,t1,id,...extra};items.push(it);return it}

function drawSteam(it,t){const z=[0,12,12,0],ph=Math.floor(t*4);let r='';[[9,'#E9A25D'],[7,'#C77A3A'],[8,'#E9A25D']].forEach(([h,col],c)=>{const off=((ph+c)%2)*0;for(let i=0;i<h;i++)r+=`<rect x="${c*48+z[(i+ph)%4]}" y="${(h-1-i)*12+(c===1?24:0)}" width="12" height="12" fill="${col}" opacity="${0.45+0.55*((i+1)/h)}"/>`});it.d.innerHTML=`<svg style="display:block" width="132" height="132" viewBox="0 0 132 132">${r}</svg>`}
const FADE=0.3;
function render(t,opt={}){
 for(const it of items){let a=0,dy=0;
  if(opt.noSub&&it.sub){it.d.style.opacity=0;continue}
  if(t>=it.t0&&t<=it.t1+FADE){const fi=Math.min(1,(t-it.t0)/FADE),fo=Math.min(1,(it.t1+FADE-t)/FADE);a=Math.max(0,Math.min(fi,fo));dy=Math.round((1-fi)*40/8)*8}
  it.d.style.opacity=a;it.d.style.transform=`translateY(${dy}px)`;
  if(a>0&&it.steam)drawSteam(it,t);
  if(a>0&&it.grid){const qs=it.d.children;for(let i=0;i<36;i++){const q=qs[i];const on=t>=0.1+i*0.045;let op=on?0.9:0,bg='#E9A25D';
    if(t>=2.6){if(lit.includes(i)){bg='#C77A3A';op=1;if(t>3.0&&Math.floor(t*4)%2)op=.75}else op=on?0.18:0}

}
// ===== 重疊與版面檢查
const I=(a,b)=>Math.max(0,Math.min(a.r,b.r)-Math.max(a.l,b.l))*Math.max(0,Math.min(a.b,b.b)-Math.max(a.t,b.t));
function box(el,pad){const r=el.getBoundingClientRect();return {l:r.left,t:r.top,r:r.right+pad,b:r.bottom+pad}}
function check(){const out=[];const vis=items.filter(it=>parseFloat(it.d.style.opacity)>0.02);
 const bx=vis.map(it=>({id:it.id,b:box(it.d,it.d.classList.contains('pc')?8:0),it}));
 for(let i=0;i<bx.length;i++){const a=bx[i];
  if(a.b.l<0||a.b.r>960||a.b.t<250||a.b.b>1570)out.push('越出安全區 '+a.id);
  for(let j=i+1;j<bx.length;j++)if(I(a.b,bx[j].b)>0)out.push('相交 '+a.id+' × '+bx[j].id);
  const kids=[...a.it.d.querySelectorAll('[data-i]')];
  kids.forEach(k=>{const kb=box(k,0),pb=box(a.it.d,0);if(kb.l<pb.l+6||kb.r>pb.r-6||kb.t<pb.t+6||kb.b>pb.b-6)out.push('內部越框 '+a.id)});
  for(let x=0;x<kids.length;x++)for(let y=x+1;y<kids.length;y++)if(I(box(kids[x],0),box(kids[y],0))>0)out.push('內部相交 '+a.id);
  const sw=a.it.d.scrollWidth>a.it.d.clientWidth+1||a.it.d.scrollHeight>a.it.d.clientHeight+1;if(sw&&!a.it.grid)out.push('文字溢出 '+a.id)}
 return out}
window.render=render;window.check=check;
