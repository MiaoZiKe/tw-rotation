<html><head><meta charset=utf-8><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:1350px;background:#F6EFE2;color:#2A2118;font-family:'Noto Serif TC','WenQuanYi Zen Hei',serif;position:relative;overflow:hidden}
.abs{position:absolute}
.tag{font-size:30px;font-weight:700;color:#D4401F;letter-spacing:2px}
.date{font-size:28px;color:#6B5B49;font-weight:500}
.hook{font-size:132px;font-weight:900;line-height:1.12;letter-spacing:-2px}
.hook em{font-style:normal;color:#D4401F}
.sub{font-size:44px;font-weight:500;color:#6B5B49;line-height:1.4}
.chip{font-size:30px;font-weight:700;padding:10px 24px;border-radius:999px;border:2px solid #D9CBB2;background:#FFFBF3;color:#2A2118}
.h2{font-size:58px;font-weight:800;line-height:1.25}
.step{font-size:30px;font-weight:800;background:#D4401F;color:#FFFFFF;padding:6px 20px;border-radius:10px}
.shot{background:#FFFBF3;border:3px solid #D9CBB2;border-radius:22px;overflow:hidden;box-shadow:0 18px 40px -24px rgba(0,0,0,.45)}
.bar{height:56px;background:#FFFBF3;border-bottom:2px solid #D9CBB2;display:flex;align-items:center;gap:10px;padding-left:20px;font-size:24px;color:#6B5B49}
.dot{width:16px;height:16px;border-radius:50%;background:#D9CBB2}
.ui{background:#FFFFFF;color:#222;height:calc(100% - 56px);padding:28px;font-family:sans-serif}
.ui .l{height:22px;border-radius:6px;background:#D7DCE3;margin-bottom:16px}
.ui .b{border-radius:12px;background:#fff;border:2px solid #DDE2E8;padding:20px;margin-bottom:16px;font-size:30px}
.hl{border:6px solid #B7791F;border-radius:16px;background:rgba(255,200,87,.14)}
.num{width:64px;height:64px;border-radius:50%;background:#B7791F;color:#1b1300;font-weight:900;font-size:36px;display:flex;align-items:center;justify-content:center}
.note{font-size:34px;font-weight:600;line-height:1.4;color:#2A2118}
.note b{color:#D4401F}
.disc{font-size:26px;color:#6B5B49;font-weight:500;border-top:2px solid #D9CBB2;padding-top:14px;display:flex;justify-content:space-between}
.disc span.k{color:#2A2118;font-weight:700}
.badge{font-size:28px;font-weight:800;padding:6px 18px;border-radius:8px;border:3px solid #1F6F6B;color:#1F6F6B}
</style></head><body><div class=abs data-o=step style="left:64px;top:72px"><span class=step>STEP 2</span></div>
<div class=abs data-o=date style="right:64px;top:76px"><span class=date>2/6</span></div>
<div class=abs data-o=title style="left:64px;top:150px;width:952px"><div class=h2>貼上原始資料，一鍵出圖表</div></div>
<div class="abs shot" data-o=shot id=shot style="left:64px;top:300px;width:952px;height:640px"><div class=bar><i class=dot></i><i class=dot></i><i class=dot></i><span>某某工具 · 範例畫面</span></div><div class=ui><div class=b>輸入：2025 Q3 銷售表（已遮個資）</div><div class=b style="height:90px"></div><div class=b>輸出：長條圖＋摘要</div></div></div>
<div class="abs hl" data-o=hl data-in=shot style="left:92px;top:590px;width:896px;height:96px"></div>
<div class="abs num" data-o=n1 data-in=shot style="left:900px;top:512px">1</div>
<div class=abs data-o=arrow data-in=shot style="left:760px;top:700px"><svg width=210 height=170 viewBox="0 0 210 170"><path d="M200 160 C170 90 110 60 40 30" stroke="#B7791F" stroke-width="9" fill="none" stroke-linecap="round"/><path d="M40 30 L82 28 M40 30 L56 68" stroke="#B7791F" stroke-width="9" stroke-linecap="round"/></svg></div>
<div class=abs data-o=note style="left:64px;top:980px;width:952px"><div class=note><b>重點：</b>它自動辨識欄位，不用先整理表格。實測 120 列資料，約 8 秒完成。</div></div>
<div class=abs data-o=source style="left:64px;top:1130px"><span class=badge>實測｜非 AI 生成</span></div>
<div class=abs data-o=disc style="left:64px;top:1228px;width:952px"><div class=disc><span><span class=k>無業配</span>｜截圖本人實測，個資已遮</span><span>測試日 11/03</span></div></div></body></html>
