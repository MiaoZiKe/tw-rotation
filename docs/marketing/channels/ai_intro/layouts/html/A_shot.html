<html><head><meta charset=utf-8><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:1350px;background:#0F1722;color:#F3F7FB;font-family:'Noto Sans TC','WenQuanYi Zen Hei',sans-serif;position:relative;overflow:hidden}
.abs{position:absolute}
.tag{font-size:30px;font-weight:700;color:#6FD8A0;letter-spacing:2px;line-height:1.3}
.date{font-size:28px;color:#B4C2D3;font-weight:500;line-height:1.3}
.hook{font-size:132px;font-weight:900;line-height:1.12;letter-spacing:-2px}
.hook em{font-style:normal;color:#6FD8A0}
.sub{font-size:44px;font-weight:500;color:#B4C2D3;line-height:1.4}
.chip{font-size:30px;font-weight:700;padding:10px 24px;border-radius:999px;border:2px solid #2A3A52;background:#182334;color:#F3F7FB;line-height:1.3}
.h2{font-size:58px;font-weight:800;line-height:1.25}
.step{font-size:30px;font-weight:800;border:3px solid #6FD8A0;color:#6FD8A0;padding:4px 18px;border-radius:10px;line-height:1.3}
.shot{background:#182334;border:3px solid #2A3A52;border-radius:22px;overflow:hidden}
.bar{height:56px;background:#182334;border-bottom:2px solid #2A3A52;display:flex;align-items:center;gap:10px;padding-left:20px;font-size:24px;color:#B4C2D3}
.dot{width:16px;height:16px;border-radius:50%;background:#2A3A52}
.ui{background:#F6F7F9;color:#1D2530;height:calc(100% - 56px);padding:28px;font-family:sans-serif}
.dim .ui{filter:brightness(.5)}
.ui .l{height:22px;border-radius:6px;background:#D7DCE3;margin-bottom:16px}
.ui .b{border-radius:12px;background:#fff;border:2px solid #DDE2E8;padding:20px;margin-bottom:16px;font-size:30px;height:84px}
.hl{position:absolute;border:6px solid #FFC857;border-radius:16px;background:rgba(255,200,87,.14)}
.num{position:absolute;width:64px;height:64px;border-radius:50%;background:#FFC857;color:#1b1300;font-weight:900;font-size:36px;display:flex;align-items:center;justify-content:center}
.note{font-size:34px;font-weight:600;line-height:1.4}
.note b{color:#6FD8A0}
.badge{font-size:28px;font-weight:800;padding:6px 18px;border-radius:8px;border:3px solid #6FD8A0;color:#6FD8A0;line-height:1.3}
.disc{font-size:28px;color:#B4C2D3;font-weight:500;border-top:2px solid #2A3A52;padding-top:12px;display:flex;justify-content:space-between;line-height:1.3}
.disc .k{color:#F3F7FB;font-weight:700}
table{border-collapse:collapse;width:100%;font-size:34px}
th{font-size:32px;font-weight:800;text-align:left;padding:0 20px;height:96px;border-bottom:3px solid #2A3A52;color:#B4C2D3}
td{padding:0 20px;height:96px;border-bottom:2px solid #2A3A52;font-weight:600}
td.w{background:rgba(111,216,160,.14);color:#6FD8A0;font-weight:800}
.item{display:flex;gap:24px;align-items:flex-start}
.item .n{flex:none;width:64px;height:64px;border-radius:50%;border:3px solid #6FD8A0;color:#6FD8A0;font-weight:900;font-size:34px;display:flex;align-items:center;justify-content:center}
.item p{font-size:44px;font-weight:700;line-height:1.35}
.item small{display:block;font-size:30px;font-weight:500;color:#B4C2D3;margin-top:6px}
</style></head><body><div class=abs data-o=step style="left:64px;top:72px"><span class=step>STEP 2</span></div>
