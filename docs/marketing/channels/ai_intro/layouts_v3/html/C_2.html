">公司說是為員工增加彈性。媒體把它和 AI 投資成本連在一起，這是媒體的解讀，不是公司原話。</p></div><div class="cell mint" data-o="c4"><h3 class="w"><svg class="ic" width="52" height="52" viewBox="0 0 52 52" fill="none" stroke="#14171C" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path class="dc" d="M26 6a14 14 0 0 0-8 25c2 2 2 4 2 7h12c0-3 0-5 2-7a14 14 0 0 0-8-25z M20 46h12"/></svg>對上班族差在哪</h3><p style="font-size:38px">看到「AI 導致裁員」的標題時，先分清「公司說的原因」和「媒體猜的原因」。</p></div><div class="fx"></div><div class="brow"><div class="badge w" data-o="標章">整理自新聞｜我沒親自測</div><div class="tag" data-o="角標">查證 01｜第 1 版｜11/03</div></div></div><div class="disc" data-o="揭露列"><span><b>無業配</b>｜自製圖文</span><span>圖文含 AI 協助</span></div></body></html>
