" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round" /><circle cx="802.0" cy="160.0" r="26.0" fill="none" stroke="var(--w-lamp)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" /><polygon points="772.0,184.0 838.0,184.0 780.0,262.0 860.0,262.0" fill="var(--w-lamp)" stroke="var(--w-line)" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" opacity="0.07" /></g></svg></div><div data-o="main" class="m" style="top:566px;font-size:64px;line-height:80px">談晴，也說礙</div><div data-o="small" class="s" style="top:690px">說這一代的難，也說還在的光。</div><div class="abs" style="left:96px;top:772px;width:888px;display:flex;flex-direction:column;gap:40px"><div data-o="body1" style="font-size:32px;line-height:46px;color:var(--w-sub);white-space:pre-wrap;overflow-wrap:anywhere;line-break:strict">我們是一個觀察者。<br>看這一代年輕人怎麼生活：<br>薪水追不上房價，租屋一換再換；<br>長輩問什麼時候結婚、生小孩，我們還在算下個月的房租；<br>大家都說台灣在成長，但多數人的日子，好像沒有跟著變輕。</div><div data-o="body2" style="font-size:32px;line-height:46px;color:var(--w-sub);white-space:pre-wrap;overflow-wrap:anywhere;line-break:strict">這些是「礙」。我們不美化，也不抱怨，只是把它說清楚。<br>說清楚了，才知道不是自己不夠努力。</div></div><div data-o="foot" class="abs lab" style="left:96px;top:1222px">往右滑 →</div></body></html>
