<style>
:root{--bg:#0f1520;--card:#161e2c;--card2:#1b2536;--line:#2a364a;--ink:#e8edf5;--ink2:#a9b6c8;--ink3:#7d8ba0;--up:#ff5a5f;--down:#2fc48d;--acc:#4da3ff;--amber:#f5b942;--r:10px}

.date{color:var(--ink2);font-variant-numeric:tabular-nums}.sp{flex:1}

.howbtn.on .pop{display:block}

.ans{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:12px 0}
.chip{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px;cursor:pointer;min-height:64px}.chip.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.chip .k{font-size:12px;color:var(--ink3)}.chip .n{font-size:16px;font-weight:600}.chip .v{font-size:13px;color:var(--ink2)}
.up{color:var(--up)}.dn{color:var(--down)}.mut{color:var(--ink3)}
.sentence{font-size:16px;margin:12px 0 0;line-height:1.5}
.ctl{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.ctl input[type=range]{flex:1;min-width:160px;height:32px;accent-color:var(--acc)}
.play{width:32px;height:32px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:14px;cursor:pointer}
.slot{margin-top:12px;border:1px dashed var(--line);border-radius:var(--r);padding:8px 16px;color:var(--ink2);display:flex;gap:8px;align-items:center;font-size:13px}
.slot b{color:var(--amber)}

#stage{position:relative;width:100%}

 const rel=g.rel[t],w=Math.abs(rel)<0.3?'和加權指數差不多':(rel>0?'比加權指數強':'比加權指數弱');
 return `${mdl(D.dates[t])} 資金往 <b>${g.name}</b> 集中（占全市場成交額 ${g.share[t].toFixed(1)}%，比前一天多 ${g.dshare[t].toFixed(1)} 個百分點）；它當天 <b class="${cls(g.chg[t])}">${f1(g.chg[t])}%</b>，${w}（加權指數 <span class="${cls(m)}">${f1(m)}%</span>）。`}
function chips(){const {inn}=topN(S.t,3);$('#ans').innerHTML=inn.map((g,i)=>`<div class="chip ${S.sel===g.gid?'on':''}" data-g="${g.gid}"><div class="k">流入第 ${i+1}</div><div class="n">${g.name}</div><div class="v"><span class="a">占比 ${g.share[S.t].toFixed(1)}%（${f2(g.dshare[S.t])}）・</span>漲跌 <span class="${cls(g.chg[S.t])}">${f1(g.chg[S.t])}%</span></div></div>`).join('')}
let proto;
function all(){ S.t=Math.max(S.t,T-S.win); $('#tr').min=T-S.win; $('#dtl').textContent=D.dates[S.t]; $('#trl').textContent=mdl(D.dates[S.t]); $('#tr').value=S.t; $('#sent').innerHTML=sentence(S.t); chips(); proto.draw(); }
function sel(gid){S.sel=S.sel===gid?null:gid; all()}
function init(p){proto=p; const tr=$('#tr'); tr.max=T-1;
 tr.oninput=()=>{S.t=+tr.value;all()};
 $('#how').onclick=e=>{e.currentTarget.classList.toggle('on')};
 $('#ans').onclick=e=>{const c=e.target.closest('.chip'); if(c) sel(c.dataset.g)};
 $('#winseg').onclick=e=>{const b=e.target.closest('button'); if(!b)return; S.win=+b.dataset.w; document.querySelectorAll('#winseg button').forEach(x=>x.classList.toggle('on',x===b)); all()};
 $('#play').onclick=()=>{ if(S.play){clearInterval(S.play);S.play=null;$('#play').textContent='▶';return}
  $('#play').textContent='❚❚'; if(S.t>=T-1)S.t=Math.max(0,T-S.win); S.play=setInterval(()=>{ if(S.t>=T-1){clearInterval(S.play);S.play=null;$('#play').textContent='▶';return} S.t++; all()},500)};
 new ResizeObserver(()=>proto.draw()).observe($('#stage')); all();}
function tip(html,ev){const t=$('#tip'),r=$('#stagecard').getBoundingClientRect(); if(!html){t.style.display='none';return} t.innerHTML=html;t.style.display='block'; let x=ev.clientX-r.left+14,y=ev.clientY-r.top+14; if(x+t.offsetWidth>r.width-8)x=ev.clientX-r.left-t.offsetWidth-14; t.style.left=x+'px';t.style.top=y+'px'}

// 方案甲：資金河流（左＝資金樹的階層，中＝占比隨時間的色帶＋累計走勢線，右＝游標那天的數字）
const ROWH=46,CH=22;
function rowsA(){const lo=T-S.win;const sc=g=>{let s=0;for(let i=lo;i<T;i++)s+=g.share[i]||0;return s/S.win};
 let pick=G.slice().sort((a,b)=>sc(b)-sc(a)).slice(0,innerWidth<640?6:10); if(S.sel&&!pick.find(g=>g.gid===S.sel))pick.push(byId[S.sel]);
 const by={};pick.forEach(g=>(by[g.chain]=by[g.chain]||[]).push(g));
 return Object.keys(by).map(c=>({chain:c,tot:by[c].reduce((a,g)=>a+sc(g),0),gs:by[c]})).sort((a,b)=>b.tot-a.tot)}
const proto_a={draw(){const W=$('#stage').clientWidth,mob=W<640,LW=mob?96:168,RW=mob?0:250;
 const rows=rowsA(),lo=T-S.win,n=S.win,px0=LW,px1=W-RW-8,dx=(px1-px0)/(n-1);
 let y=8,out=[],items=[];rows.forEach(r=>{items.push({h:1,r,y});y+=CH;r.gs.forEach(g=>{items.push({g,y});y+=ROWH})});
 const H=y+24; let mx=0;items.forEach(i=>{if(i.g)for(let k=lo;k<T;k++)mx=Math.max(mx,i.g.share[k]||0)});const sc=(ROWH-8)/mx;
 const X=k=>px0+(k-lo)*dx;
 items.forEach(i=>{ if(i.h){out.push(`<text x="0" y="${i.y+15}" class="big" style="fill:var(--ink3);font-size:12px">${D.chains[i.r.chain]||i.r.chain}</text><line x1="0" x2="${W}" y1="${i.y+CH-2}" y2="${i.y+CH-2}" stroke="var(--line)"/>`);return}
  const g=i.g,cy=i.y+ROWH/2,on=S.sel===g.gid;
  out.push(`<g data-g="${g.gid}" style="cursor:pointer"><rect x="0" y="${i.y}" width="${W}" height="${ROWH}" fill="${on?'var(--card2)':'transparent'}"/>`);
  out.push(`<text x="${mob?4:12}" y="${cy+4}" class="big">${mob?g.name.slice(0,6):g.name}</text>`);
  // 色帶：寬度＝占比、顏色＝當天漲跌
  for(let k=lo;k<T-1;k++){const a=g.share[k]||0,b=g.share[k+1]||0,x0=X(k),x1=X(k+1),c='var(--acc)';
   out.push(`<path d="M${x0},${cy-a*sc/2}L${x1},${cy-b*sc/2}L${x1},${cy+b*sc/2}L${x0},${cy+a*sc/2}Z" fill="${c}" opacity="${S.sel&&!on?0.18:0.5}"/>`)}
  // 累計漲跌線（窗口起點＝0%），每列各自刻度；上漲紅、下跌綠
  const ab=[];for(let k=lo;k<T;k++)ab.push(g.cum[k]/g.cum[lo]*100-100);const amp=Math.max(3,...ab.map(Math.abs)),lc=ab[ab.length-1]>=0?'var(--up)':'var(--down)';
  out.push(`<line x1="${px0}" x2="${px1}" y1="${cy}" y2="${cy}" stroke="var(--line)" stroke-dasharray="2 3"/><polyline fill="none" stroke="${lc}" stroke-width="2.2" stroke-linejoin="round" points="${ab.map((v,j)=>`${X(lo+j)},${cy-v/amp*(ROWH/2-4)}`).join(' ')}"/>`);
  const ct=ab[S.t-lo];if(!mob)out.push(`<text x="${px1+14+190}" y="${cy+4}" text-anchor="end" style="fill:var(${ct>=0?'--up':'--down'});font-weight:600">${f1(ct)}%</text>`);
  if(!mob){const t=S.t;out.push(`<text x="${px1+14}" y="${cy-2}" class="big">${(g.share[t]||0).toFixed(1)}%</text><text x="${px1+14}" y="${cy+13}" style="font-size:12px">占比 ${f2(g.dshare[t])}</text>`);
   out.push(`<text x="${px1+84}" y="${cy-2}" class="big ${cls(g.chg[t])}" style="fill:var(${g.chg[t]>=0?'--up':'--down'})">${f1(g.chg[t])}%</text><text x="${px1+84}" y="${cy+13}" style="font-size:12px">${QL[g.q[t]]||''}</text>`)}
  out.push('</g>')});
 if(!mob)out.push(`<text x="${px1+14}" y="23">占比</text><text x="${px1+84}" y="23">當天</text><text x="${px1+204}" y="23" text-anchor="end">累計</text>`);
 // 游標
 const cx=X(S.t);out.push(`<line x1="${cx}" x2="${cx}" y1="0" y2="${H-18}" stroke="var(--amber)" stroke-width="1.5" stroke-dasharray="4 3"/>`);
 for(let k=lo;k<T;k+=Math.ceil(n/6))out.push(`<text x="${X(k)}" y="${H-4}" text-anchor="middle">${mdl(D.dates[k])}</text>`);
 // 加權指數累計（頂部細線）已在文字標示
 $('#stage').innerHTML=`<svg width="${W}" height="${H}" role="img">${out.join('')}</svg>`;
 $('#stage').querySelectorAll('g[data-g]').forEach(e=>{e.onclick=()=>sel(e.dataset.g);e.onmousemove=ev=>{const g=byId[e.dataset.g],k=Math.max(lo,Math.min(T-1,Math.round(lo+(ev.clientX-$('#stage').getBoundingClientRect().left-px0)/dx)));tip(`<b>${g.name}</b>　${mdl(D.dates[k])}<br>占比 ${(g.share[k]||0).toFixed(1)}%（${f2(g.dshare[k])}）<br>漲跌 <span class="${cls(g.chg[k])}">${f1(g.chg[k])}%</span>　加權 ${f1(D.mkt[k])}%`,ev)};e.onmouseleave=()=>tip(null)})}};
init(proto_a);

</script></body></html>
