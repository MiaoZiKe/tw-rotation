# 板塊分類提案（tide-tw.app 顆粒度對標）—— 尚未生效，等 Andy 校訂後才搬進 groups.yaml
#
# 這份檔案刻意跟 pipeline/groups/groups.yaml 用同一套 schema（meta / groups / chains / benchmarks），
# 所以 Andy 點頭之後可以整段搬過去，不需要改 loader.py 或任何前端。
# 每一檔股票的歸類理由、confidence 與來源寫在 docs/groups_tide_proposal.md，
# 這裡只留「為什麼這個板塊要獨立存在」的一句話。
#
# ★ 這份是提案，不是事實。DECISIONS #43 寫明族群成分由 Andy 校訂，所以不要直接 import。

meta:
  version: 1
  reviewed: "2026-09-20"
  note: >-
    tide-tw.app 的板塊清單被網路出口代理擋住（EGRESS_BLOCKED），抓不到原始名單，
    因此這份是用「證交所／櫃買產業別（本專案資料湖）＋ 公開財經媒體的概念股分類」重建的提案。
    共 109 個板塊、593 檔成分股（去重）。

groups:

  # ---------------------------------------------------------------- 半導體（23 個板塊）
  ip_licensing:
    name: 矽智財 IP 授權
    tier: upstream
    chain: semiconductor
    note: "把電路設計授權給別人用、按量產片數收權利金；自己不賣晶片。"
    codes: ["3529", "6643", "6533"]
  design_service:
    name: 設計服務 / 客製 ASIC
    tier: upstream
    chain: semiconductor
    note: "替客戶做 NRE 與委託設計、再包到量產（turnkey），收的是專案與量產抽成，不是自有晶片。"
    codes: ["3443", "3661", "3035", "7749"]
  soc_compute:
    name: 運算與通訊 SoC
    tier: upstream
    chain: semiconductor
    note: "自有品牌的大型系統單晶片：手機／網通／伺服器管理。營收看終端出貨量與規格升級。"
    codes: ["2454", "2379", "5274", "2388", "3094", "6526"]
  display_driver:
    name: 顯示驅動 IC
    tier: upstream
    chain: semiconductor
    note: "面板的驅動與觸控整合晶片（LDDI／TDDI／AMOLED DDI／T-Con），看面板出貨與規格升級。"
    codes: ["3034", "4961", "3545", "8016", "3592", "3141"]
  analog_power_ic:
    name: 類比與電源管理 IC
    tier: upstream
    chain: semiconductor
    note: "DC-DC、PMIC、驅動器等類比晶片，單價低但用量隨伺服器與 AI PC 放大。"
    codes: ["6415", "8081", "6138", "6719", "2436", "6693"]
  mcu_sensor:
    name: MCU 與感測 IC
    tier: upstream
    chain: semiconductor
    note: "微控制器、觸控、指紋、影像與音訊感測晶片，終端是消費性與工控。"
    codes: ["4919", "5471", "6202", "3227", "2458", "6462", "6679", "6716"]
  high_speed_io:
    name: 高速傳輸介面 IC
    tier: upstream
    chain: semiconductor
    note: "PCIe Switch、Retimer／Redriver、USB4 主控；AI 伺服器與 AI PC 的「訊號延伸」層。"
    codes: ["5269", "4966", "6104", "3014"]
  foundry:
    name: 晶圓代工（矽）
    tier: midstream
    chain: semiconductor
    note: "純矽製程代工，營收看產能利用率與製程節點組合。"
    codes: ["2330", "2303", "5347", "6770"]
  compound_rf:
    name: 化合物半導體射頻代工
    tier: midstream
    chain: semiconductor
    note: "砷化鎵（GaAs）／磷化銦（InP）代工，做手機與基地台的功率放大器與射頻元件。跟矽代工的差別是材料，不是商業模式。"
    codes: ["3105", "8086", "4991"]
  wide_bandgap:
    name: 第三代半導體 SiC / GaN
    tier: midstream
    chain: semiconductor
    note: "碳化矽與氮化鎵的磊晶與代工，終端是電動車、充電、伺服器高壓直流供電。"
    codes: ["3707", "3016"]
  power_discrete:
    name: 功率半導體與分立元件
    tier: midstream
    chain: semiconductor
    note: "MOSFET、二極體、IGBT 等分立元件，營收由電源規格與車用滲透率驅動。"
    codes: ["2481", "8261", "5425", "3675", "6525", "6435"]
  silicon_wafer:
    name: 矽晶圓
    tier: upstream
    chain: semiconductor
    note: "長晶、切片與拋光的矽基板；也是 SiC 基板的主要台廠來源。"
    codes: ["6488", "5483", "6182", "3532", "8028"]
  semi_material:
    name: 半導體製程材料
    tier: upstream
    chain: semiconductor
    note: "靶材、光阻與顯影、特殊氣體、濕式化學、石英與耗材；卡在晶圓廠前面的那一段。"
    codes: ["1785", "4749", "4772", "5234", "8091", "4768", "1560"]
  fab_equipment:
    name: 前段設備與零組件
    tier: upstream
    chain: semiconductor
    note: "晶圓廠前段的濕製程、薄膜與設備代工；營收驅動是客戶的資本支出，不是晶片單價。"
    codes: ["3413", "3131", "3583", "6937", "6829", "8383", "5443"]
  pkg_test_equipment:
    name: 封裝與測試設備
    tier: downstream
    chain: semiconductor
    note: "先進封裝的壓合、點膠、植球、翹曲控制與測試分選；CoWoS 擴產的直接受惠者。"
    codes: ["3680", "6187", "7734", "6640", "7751", "7769"]
  test_interface:
    name: 測試介面（探針卡 / 測試座）
    tier: upstream
    chain: semiconductor
    note: "晶圓測試與成品測試的介面耗材。景氣驅動是「測試次數與腳位數」，不是晶圓廠資本支出。"
    codes: ["6515", "6223", "6510", "6683", "6217"]
  osat:
    name: 封測代工
    tier: downstream
    chain: semiconductor
    note: "打線、封裝與成品測試的委外代工，營收看封裝顆數與測試工時。"
    codes: ["3711", "6239", "2449", "3264", "6257", "2441", "8131", "2329"]
  display_osat:
    name: 驅動 IC 封測（金凸塊 / COF）
    tier: downstream
    chain: semiconductor
    note: "面板驅動 IC 專用的金凸塊、COF 捲帶與測試；跟一般封測的客戶與循環完全不同。"
    codes: ["6147", "8150", "3265"]
  adv_packaging:
    name: 先進封裝與異質整合
    tier: downstream
    chain: semiconductor
    note: "晶圓級封裝、TSV、SiP 與感測器異質整合。台積電的 CoWoS 與日月光的外溢產能留在各自板塊，不在這裡重複計量。"
    codes: ["3374", "6271", "6451", "6789"]
  memory_dram:
    name: 記憶體（自有產能）
    tier: midstream
    chain: semiconductor
    note: "自己有晶圓產能的 DRAM／NOR／NAND 廠，營收由現貨與合約報價驅動。"
    codes: ["2408", "2344", "2337", "3006", "5351", "2342"]
  memory_module:
    name: 記憶體模組與儲存
    tier: downstream
    chain: semiconductor
    note: "買顆粒、做模組與 SSD；沒有自有晶圓，獲利槓桿完全綁在報價與庫存。"
    codes: ["8299", "3260", "4967", "5289", "2451", "8271", "4973", "8088"]
  ic_distribution:
    name: 電子通路（IC 與資通訊）
    tier: downstream
    chain: semiconductor
    note: "半導體與資通訊產品代理，賺的是週轉與帳期，不是設計。"
    codes: ["3036", "3702", "8112", "3033", "3048", "3010", "5434", "3209", "3028", "6227", "8096", "8070", "3055", "2347"]
  semi_facility:
    name: 半導體廠務工程
    tier: upstream
    chain: semiconductor
    note: "無塵室統包、機電與特殊氣體／化學品輸送系統。營收認列跟著建廠進度走，是資本支出鏈最早看到的一段。"
    codes: ["2404", "6139", "6196", "5536", "6691", "6667", "3402", "6613"]

  # ---------------------------------------------------------------- AI 伺服器（18 個板塊）
  ai_server_odm:
    name: AI 伺服器組裝 / 整機櫃
    tier: downstream
    chain: ai_server
    note: "L6～L11 的板卡與整機櫃組裝，營收直接對應 GPU 機櫃出貨量。"
    codes: ["2317", "2382", "6669", "3231", "2356", "2376", "7711", "3706", "6933"]
  server_chassis:
    name: 伺服器機殼與機構件
    tier: midstream
    chain: ai_server
    note: "機殼、背板與機構沖壓件；看的是機櫃出貨量與單櫃用量，不看新機規格。"
    codes: ["8210", "3693", "3013"]
  server_rail:
    name: 伺服器滑軌
    tier: midstream
    chain: ai_server
    note: "機櫃滑軌與樞紐。AI 伺服器重量從 50kg 跳到 100kg 以上，滑軌規格與單價同步升級。"
    codes: ["2059", "6805", "6584", "3376"]
  thermal:
    name: 散熱（氣冷與液冷）
    tier: midstream
    chain: ai_server
    note: "均熱片、風扇、水冷板、分歧管與 CDU。刻意不拆氣冷／液冷：雙鴻的封裝級均熱片與健策的系統級水冷板已經雙向重疊，拆開會把同向的資金流切成兩半。"
    codes: ["3017", "3324", "6230", "2421", "3653", "8996", "2486"]
  server_power:
    name: 伺服器電源
    tier: midstream
    chain: ai_server
    note: "PSU、電源架與高壓直流供電；規格隨 GPU 功耗一路往上。"
    codes: ["2308", "2301", "6409", "6282", "6412"]
  bbu:
    name: 電池備援模組 BBU
    tier: midstream
    chain: ai_server
    note: "AI 機櫃斷電瞬間的備援供電模組，已從選配變成標配。"
    codes: ["6781", "3211", "4931", "3323", "6558", "6121"]
  switch_hw:
    name: 高速交換器
    tier: downstream
    chain: ai_server
    note: "資料中心 800G／1.6T 交換器整機與白牌代工。"
    codes: ["2345", "3380", "6285", "6245"]
  optical_module:
    name: 高速光模組
    tier: midstream
    chain: ai_server
    note: "800G／1.6T 光收發模組與內部的光學次組件。"
    codes: ["4979", "3163", "4977", "6442", "6426", "3234", "7717", "6588"]
  silicon_photonics:
    name: 矽光子 / CPO 元件
    tier: upstream
    chain: ai_server
    note: "共同封裝光學（CPO）用的雷射源、磊晶、光學耦合與封裝零件。"
    codes: ["3081", "2455", "3450", "3363", "4908", "3491"]
  hdi_pcb:
    name: 高階 PCB（伺服器主板 / UBB）
    tier: midstream
    chain: ai_server
    note: "高層數多層板與 UBB／OAM，料號常由 CSP 或 NVIDIA 直接指定（AVL）。"
    codes: ["2368", "4958", "3044", "2313", "6191", "5469", "3715"]
  ic_substrate:
    name: IC 載板（ABF / BT）
    tier: midstream
    chain: ai_server
    note: "CPU／GPU／ASIC 的封裝載板。台股三雄 ABF 與 BT 都做，硬拆成兩個板塊會得到成分幾乎一樣的兩張卡。"
    codes: ["3037", "8046", "3189"]
  ccl:
    name: CCL 銅箔基板
    tier: upstream
    chain: ai_server
    note: "PCB 的基礎材料，佔高階 AI 伺服器 PCB 材料成本五成以上；是這輪行情的「因」。"
    codes: ["2383", "6274", "6213", "6672", "1303"]
  copper_foil:
    name: 銅箔（HVLP）
    tier: upstream
    chain: ai_server
    note: "CCL 的銅面材料，高頻高速用的 HVLP 銅箔是瓶頸料。"
    codes: ["8358"]
  glass_fiber:
    name: 玻纖布 / 玻纖紗
    tier: upstream
    chain: ai_server
    note: "CCL 的補強材料。Low-Dk 玻纖布是 2026 年最缺的一段。"
    codes: ["1815", "5340", "1802"]
  flex_pcb:
    name: 軟板與軟板材料
    tier: midstream
    chain: ai_server
    note: "軟性電路板與其上游的 FCCL、PI 膜。跟硬板的客戶與循環不同（消費性為主）。"
    codes: ["6269", "6153", "8039", "3645", "3354"]
  glass_substrate:
    name: 玻璃基板 / 面板級封裝
    tier: midstream
    chain: ai_server
    note: "玻璃核心基板（GCS）與 TGV 玻璃穿孔，2026 是試產驗證年、2027 才談量產。"
    codes: ["3149", "8064", "4770", "3673"]
  connector_hs:
    name: 高速連接器與線材
    tier: midstream
    chain: ai_server
    note: "GPU 機櫃內的高速背板連接器、銅纜與線束。"
    codes: ["3665", "3533", "3605", "6290", "8103", "6197", "3526", "3023"]
  pcb_equipment:
    name: PCB 與載板設備
    tier: upstream
    chain: ai_server
    note: "載板與高階 PCB 的曝光、壓合、自動化與檢測設備。"
    codes: ["2467", "6664", "6438", "3498", "3580"]

  # ---------------------------------------------------------------- 一般電子（22 個板塊）
  pc_nb:
    name: 個人電腦與筆電品牌
    tier: downstream
    chain: electronics
    note: "自有品牌 PC／NB／主機板／顯示卡，營收看消費性換機與 AI PC 滲透。"
    codes: ["2357", "2353", "2377", "2352", "3515", "2399", "2465"]
  ems:
    name: EMS 電子代工
    tier: downstream
    chain: electronics
    note: "消費性電子與非伺服器的代工組裝，毛利薄、看的是稼動與客戶拉貨。"
    codes: ["2324", "4938", "2312", "4916", "2328"]
  ipc:
    name: 工業電腦
    tier: downstream
    chain: electronics
    note: "工控主機、邊緣運算與垂直應用系統；毛利高、訂單碎、看製造業資本支出。"
    codes: ["2395", "6414", "6166", "8050", "6579", "3088", "8114", "3022", "6206", "3479", "3577", "3005"]
  optical_lens:
    name: 光學鏡頭
    tier: midstream
    chain: electronics
    note: "手機、車用與機器視覺鏡頭；2026 年的新敘事是 AI 眼鏡與機器人之眼。"
    codes: ["3008", "3406", "3019", "3362", "6209", "3504", "4976"]
  panel:
    name: 面板
    tier: midstream
    chain: electronics
    note: "TFT-LCD 面板本體。2026 年的資金故事已經是產線轉型（FOPLP、玻璃核心基板），不是面板報價。"
    codes: ["2409", "3481", "6116"]
  panel_component:
    name: 面板零組件與材料
    tier: upstream
    chain: electronics
    note: "背光模組、偏光板、光學膜與觸控貼合。"
    codes: ["6176", "8215", "4960", "6278"]
  led:
    name: LED
    tier: midstream
    chain: electronics
    note: "LED 磊晶、封裝與導線架；終端是照明、車燈、背光與 MiniLED。"
    codes: ["3714", "2393", "6168", "3437", "3339", "4956", "3031"]
  e_paper:
    name: 電子紙
    tier: midstream
    chain: electronics
    note: "電子紙材料、模組與閱讀器代工；彩色電子紙從電子書走向大尺寸看板與智慧零售。"
    codes: ["8069", "6143"]
  mlcc:
    name: 積層陶瓷電容與晶片電阻
    tier: upstream
    chain: electronics
    note: "MLCC 與晶片電阻。一台 GB200 機櫃的 MLCC 用量約 45 萬顆，是手機的 300 倍。"
    codes: ["2327", "2492", "3026", "6173", "3624", "2478", "6127"]
  alu_capacitor:
    name: 鋁質電解電容
    tier: upstream
    chain: electronics
    note: "電源端的大容值電容；跟 MLCC 的客戶重疊但報價循環不同。"
    codes: ["2375", "2472", "4939", "6449", "5328", "6175"]
  inductor:
    name: 電感與磁性元件
    tier: upstream
    chain: electronics
    note: "功率電感與 EMI 抑制元件。AI 伺服器供電模組用的 TLVR 電感是 2026 年單價漲最兇的一塊。"
    codes: ["3357", "3236", "6155", "6284", "2428"]
  crystal:
    name: 石英與頻率元件
    tier: upstream
    chain: electronics
    note: "石英振盪器與頻率元件，是所有數位系統的時脈來源。"
    codes: ["3042", "2484", "3221"]
  networking_cpe:
    name: 網通設備（電信與消費性）
    tier: downstream
    chain: electronics
    note: "寬頻 CPE、Wi-Fi 與電信端設備。跟資料中心交換器是兩個市場，不要混在一起。"
    codes: ["3704", "5388", "4906", "3596", "2332"]
  telecom:
    name: 電信服務
    tier: downstream
    chain: electronics
    note: "電信三雄。營收穩定、現金流是主角，估值口徑跟製造業不同。"
    codes: ["2412", "3045", "4904"]
  satellite:
    name: 低軌衛星
    tier: midstream
    chain: electronics
    note: "衛星地面站、天線與地面接收板。"
    codes: ["2367", "6285", "5388"]
  peripherals:
    name: 電腦周邊與影音零組件
    tier: downstream
    chain: electronics
    note: "鍵鼠、鏡頭模組、揚聲器與麥克風等終端零組件。"
    codes: ["2385", "4915", "2439", "3311", "3059"]
  casing:
    name: 消費電子機構件 / 金屬機殼
    tier: midstream
    chain: electronics
    note: "筆電與消費電子的金屬機殼與機構件。已與手機新機週期脫鉤，看 CNC 稼動。"
    codes: ["2474", "2354", "5243"]
  robotics:
    name: 機器人與傳動元件
    tier: midstream
    chain: electronics
    note: "滾珠螺桿、線性滑軌、減速機、伺服與控制器；人形機器人只是新增的終端，本業仍是工具機與自動化。"
    codes: ["2049", "1590", "4576", "7750", "4583", "4585", "1597", "4540", "3162"]
  factory_automation:
    name: 工廠自動化與智慧倉儲
    tier: midstream
    chain: electronics
    note: "AMHS 自動搬運、自動倉儲、AI 視覺與產線整合。客戶是晶圓廠與物流業。"
    codes: ["2464", "2359", "6215", "3167", "8027", "6739"]
  machine_tool:
    name: 工具機
    tier: midstream
    chain: electronics
    note: "整機工具機與成型機。跟傳動元件同一條鏈但循環落後一段。"
    codes: ["4526", "1583", "1528", "6603"]
  inspection_equipment:
    name: 檢測與量測設備
    tier: upstream
    chain: electronics
    note: "AOI、電測與量測儀器。客戶橫跨半導體、PCB 與面板。"
    codes: ["2360", "3030", "3563", "3455", "6706"]
  test_lab:
    name: 材料分析與驗證服務
