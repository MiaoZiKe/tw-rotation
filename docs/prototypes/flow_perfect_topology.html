<!doctype html>
<!-- Andy 2026-09-26 提供的「黃金標準」參考稿（原文照錄），網站「資金去向・經典光纖」依此修正。 -->
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>台股資金分流拓撲｜高密度微螢光旗艦版</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #050a14;
      color: #e2f1f8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      user-select: none;
    }
    .topbar {
      height: 48px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(9, 17, 30, 0.88);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(14px);
      flex-shrink: 0;
      z-index: 20;
    }
    .brand-title { font-size: 14px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
    .brand-title span { background: #22d3ee; color: #03131d; font-size: 10px; font-weight: 900; padding: 2px 6px; border-radius: 4px; }
    .topbar-info { font-size: 11.5px; color: #6e8fa6; display: flex; gap: 16px; }
    .topbar-info b { color: #22d3ee; }
    .canvas-wrap { flex: 1; width: 100%; height: calc(100vh - 48px); position: relative; }
    canvas { display: block; width: 100%; height: 100%; }
    .bottom-hint { position: absolute; bottom: 14px; left: 24px; font-size: 11px; color: #55758a; pointer-events: none; display: flex; gap: 14px; }
    .bottom-hint span { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand-title">台股資金分流 <span>OPTICAL FLOW</span></div>
    <div class="topbar-info">
      <div>大盤成交值: <b>6,382 億</b></div>
      <div>半導體: <b>39.6% ▼26%</b></div>
      <div>AI 伺服器: <b>37.7% ▲7%</b></div>
    </div>
  </header>
  <main class="canvas-wrap">
    <canvas id="flowCanvas"></canvas>
    <div class="bottom-hint">
      <div><span style="background:#22d3ee;"></span>半導體 (灰冰藍)</div>
      <div><span style="background:#c084fc;"></span>AI 伺服器 (科技紫)</div>
      <div>• 粒子前進 ➔ 節點碰撞高光 ➔ 毛細分流成分股</div>
    </div>
  </main>
  <script>
    const canvas = document.getElementById('flowCanvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let nodes = [], links = [], particles = [], ripples = [];

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight - 48;
      buildNetwork();
    }
    window.addEventListener('resize', resize);

    function buildNetwork() {
      nodes = []; links = []; particles = []; ripples = [];
      const colRoot = 70;
      const colL1   = width * 0.26;
      const colL2   = width * 0.54;
      const colL3   = width * 0.83;

      const root = { id: 'root', name: '台股成交值 6382 億', x: colRoot, y: height * 0.52, r: 8, color: '#38bdf8', hitFlash: 0 };
      nodes.push(root);

      const l1_semi = { id: 'semi', name: '半導體', share: '39.6%', chg: '▼26%', x: colL1, y: height * 0.28, r: 7.5, color: '#22d3ee', hitFlash: 0 };
      const l1_ai = { id: 'ai', name: 'AI 伺服器', share: '37.7%', chg: '▲7%', x: colL1, y: height * 0.74, r: 7.5, color: '#c084fc', hitFlash: 0 };
      nodes.push(l1_semi, l1_ai);

      links.push({ from: root, to: l1_semi, color: '#22d3ee', weight: 3.8, density: 24 });
      links.push({ from: root, to: l1_ai,   color: '#c084fc', weight: 3.6, density: 22 });

      const semiSub = [
        { name: '晶圓代工', share: '32.2%', chg: '▼22%', color: '#22d3ee', stocks: ['台積電 44.4%', '聯電 29.7%', '穩懋 13.2%'] },
        { name: 'HPC 與網通 IC', share: '20.7%', chg: '▲9%', color: '#ff5470', stocks: ['聯發科 78.8%', '信驊 7.5%', '遠發 7.4%'] },
        { name: '矽晶圓', share: '11.3%', chg: '▼49%', color: '#22d3ee', stocks: ['合晶 39.1%', '環球晶 31.9%', '中美晶 12.1%'] },
        { name: '客製 ASIC 矽智財', share: '10.4%', chg: '▼31%', color: '#22d3ee', stocks: ['創意 46.9%', '力旺 19.7%', '世芯-KY 16.2%'] },
        { name: '封裝量測自動化', share: '9.5%', chg: '▼14%', color: '#22d3ee', stocks: ['鴻勁 32.1%', '致茂 19.1%', '精測 14.8%'] },
        { name: 'HBM 高頻寬記憶體', share: '8.9%', chg: '▼39%', color: '#2ee59d', stocks: ['南亞科 88.8%', '旺宏 7.1%', '力成 3.4%'] },
        { name: '封測代工', share: '7.0%', chg: '▼40%', color: '#22d3ee', stocks: ['南茂 52.2%', '日月光投控 21.3%', '福邦 18.3%'] }
      ];
      const aiSub = [
        { name: 'PCB 載板', share: '32.8%', chg: '▲6%', color: '#ff5470', stocks: ['景碩 53.7%', '欣興 24.6%', '南電 21.7%'] },
        { name: 'CCL 銅箔基板', share: '17.7%', chg: '▲45%', color: '#ff5470', stocks: ['台燿 36.9%', '台光電 27.7%', '聯茂 23.4%'] },
        { name: 'PCB 硬板製造', share: '12.5%', chg: '▼24%', color: '#c084fc', stocks: ['金像電 58.0%', '健鼎-KY 32.6%', '華通 5.2%'] },
        { name: 'AI 伺服器組裝', share: '10.7%', chg: '▲17%', color: '#ff5470', stocks: ['廣達 28.4%', '緯創 22.1%', '鴻海 16.8%'] },
        { name: '液冷散熱', share: '10.1%', chg: '▼3%', color: '#2ee59d', stocks: ['雙鴻 37.4%', '奇鋐 22.6%', '高力 18.1%'] },
        { name: '電源供應器', share: '8.4%', chg: '▼8%', color: '#c084fc', stocks: ['台達電 85.1%', '光寶科 13.2%', '旭隼 1.0%'] },
        { name: '氣冷與核心組件', share: '7.9%', chg: '▲44%', color: '#ff5470', stocks: ['健策 47.6%', '雙鴻 28.7%', '奇鋐 20.9%'] }
      ];

      const totalSlots = semiSub.length + aiSub.length;
      const slotHeight = Math.min(42, (height - 60) / totalSlots);
      const startY = (height - (totalSlots * slotHeight)) / 2 + 10;

      semiSub.forEach((sub, i) => {
        const ny = startY + i * slotHeight;
        const leaf = { id: `semi_${i}`, name: sub.name, share: sub.share, chg: sub.chg, stocks: sub.stocks, x: colL2, y: ny, r: 4.5, color: sub.color, hitFlash: 0 };
        nodes.push(leaf);
        links.push({ from: l1_semi, to: leaf, color: l1_semi.color, weight: 1.3, density: 7 });
        const stockEnd = { id: `end_semi_${i}`, x: colL3, y: ny, r: 0, color: sub.color };
        nodes.push(stockEnd);
        links.push({ from: leaf, to: stockEnd, color: sub.color, weight: 0.8, density: 4, isCapillary: true });
      });
      aiSub.forEach((sub, i) => {
        const ny = startY + (semiSub.length + i) * slotHeight;
        const leaf = { id: `ai_${i}`, name: sub.name, share: sub.share, chg: sub.chg, stocks: sub.stocks, x: colL2, y: ny, r: 4.5, color: sub.color, hitFlash: 0 };
        nodes.push(leaf);
        links.push({ from: l1_ai, to: leaf, color: l1_ai.color, weight: 1.3, density: 7 });
        const stockEnd = { id: `end_ai_${i}`, x: colL3, y: ny, r: 0, color: sub.color };
        nodes.push(stockEnd);
        links.push({ from: leaf, to: stockEnd, color: sub.color, weight: 0.8, density: 4, isCapillary: true });
      });

      links.forEach(link => {
        for (let i = 0; i < link.density; i++) {
          particles.push({
            link: link,
            t: Math.random(),
            speed: (0.0028 + Math.random() * 0.002) * (link.weight > 2 ? 1.35 : 1.05),
            size: link.weight > 2 ? 2.2 : (link.isCapillary ? 1.3 : 1.7)
          });
        }
      });
    }

    function getBezierPoint(p0, p1, t) {
      const dx = p1.x - p0.x;
      const cx1 = p0.x + dx * 0.45, cy1 = p0.y;
      const cx2 = p1.x - dx * 0.45, cy2 = p1.y;
      const u = 1 - t, tt = t * t, uu = u * u;
      return {
        x: uu * u * p0.x + 3 * uu * t * cx1 + 3 * u * tt * cx2 + tt * t * p1.x,
        y: uu * u * p0.y + 3 * uu * t * cy1 + 3 * u * tt * cy2 + tt * t * p1.y
      };
    }

    function render() {
      ctx.fillStyle = 'rgba(5, 10, 20, 0.38)';
      ctx.fillRect(0, 0, width, height);

      links.forEach(link => {
        const p0 = link.from, p1 = link.to, dx = p1.x - p0.x;
        ctx.beginPath();
        ctx.moveTo(p0.x, p0.y);
        ctx.bezierCurveTo(p0.x + dx * 0.45, p0.y, p1.x - dx * 0.45, p1.y, p1.x, p1.y);
        ctx.strokeStyle = link.color;
        ctx.globalAlpha = link.isCapillary ? 0.04 : 0.09;
        ctx.lineWidth = link.weight * 2.4;
        ctx.stroke();
        ctx.globalAlpha = link.isCapillary ? 0.2 : 0.65;
        ctx.lineWidth = link.isCapillary ? 0.7 : 1.1;
        ctx.stroke();
        ctx.globalAlpha = 1.0;
      });

      particles.forEach(p => {
        p.t += p.speed;
        if (p.t >= 1) {
          p.t = 0;
          const hitNode = p.link.to;
          hitNode.hitFlash = Math.min(1.0, hitNode.hitFlash + 0.35);
          if (hitNode.r > 0 && Math.random() > 0.45) {
            ripples.push({ x: hitNode.x, y: hitNode.y, r: hitNode.r, maxR: hitNode.r + 16, alpha: 0.8, color: hitNode.color });
          }
        }
        const pt = getBezierPoint(p.link.from, p.link.to, p.t);
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.shadowBlur = 5;
        ctx.shadowColor = p.link.color;
        ctx.fill();
        ctx.shadowBlur = 0;
      });

      for (let i = ripples.length - 1; i >= 0; i--) {
        const rp = ripples[i];
        rp.r += 0.7;
        rp.alpha -= 0.035;
        if (rp.alpha <= 0 || rp.r >= rp.maxR) { ripples.splice(i, 1); continue; }
        ctx.beginPath();
        ctx.arc(rp.x, rp.y, rp.r, 0, Math.PI * 2);
        ctx.strokeStyle = rp.color;
        ctx.globalAlpha = rp.alpha;
        ctx.lineWidth = 1.2;
        ctx.stroke();
        ctx.globalAlpha = 1.0;
      }

      nodes.forEach(node => {
        if (node.r === 0) return;
        if (node.hitFlash > 0) { node.hitFlash -= 0.035; if (node.hitFlash < 0) node.hitFlash = 0; }
        if (node.hitFlash > 0.02) {
          ctx.beginPath();
          ctx.arc(node.x, node.y, node.r + 5 * node.hitFlash, 0, Math.PI * 2);
          ctx.fillStyle = node.color;
          ctx.globalAlpha = node.hitFlash * 0.45;
          ctx.shadowBlur = 12 * node.hitFlash;
          ctx.shadowColor = node.color;
          ctx.fill();
          ctx.shadowBlur = 0;
          ctx.globalAlpha = 1.0;
        }
        ctx.beginPath();
        ctx.arc(node.x, node.y, node.r, 0, Math.PI * 2);
        ctx.fillStyle = node.hitFlash > 0.3 ? '#ffffff' : node.color;
        ctx.shadowBlur = 6;
        ctx.shadowColor = node.color;
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1;
        ctx.stroke();
        renderInlineBadge(node);
        if (node.stocks) renderStockList(node);
      });

      requestAnimationFrame(render);
    }

    function renderInlineBadge(node) {
      const offsetX = node.x + node.r + 6;
      const centerY = node.y;
      const titleText = node.name;
      const shareText = node.share ? ` ${node.share}` : '';
      const chgText   = node.chg ? ` ${node.chg}` : '';
      ctx.font = '600 11px -apple-system, sans-serif';
      const w1 = ctx.measureText(titleText).width;
      const w2 = ctx.measureText(shareText).width;
      const w3 = ctx.measureText(chgText).width;
      const badgeW = w1 + w2 + w3 + 12;
      const badgeH = 17;
      ctx.beginPath();
      ctx.roundRect(offsetX, centerY - badgeH / 2, badgeW, badgeH, 3);
      ctx.fillStyle = 'rgba(10, 20, 34, 0.88)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.textBaseline = 'middle';
      let curX = offsetX + 5;
      ctx.fillStyle = '#e2f1f8';
      ctx.fillText(titleText, curX, centerY);
      curX += w1;
      if (shareText) { ctx.fillStyle = '#7a9bb3'; ctx.fillText(shareText, curX, centerY); curX += w2; }
      if (chgText) {
        const isUp = chgText.includes('▲') || chgText.includes('+');
        ctx.fillStyle = isUp ? '#ff5470' : '#2ee59d';
        ctx.fillText(chgText, curX, centerY);
      }
    }

    function renderStockList(node) {
      const startX = width * 0.83;
      const baseY = node.y;
      ctx.font = '500 10px monospace';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      node.stocks.forEach((stock, sIdx) => {
        const py = baseY + (sIdx - 1) * 9;
        ctx.beginPath();
        ctx.arc(startX, py, 1.8, 0, Math.PI * 2);
        ctx.fillStyle = node.color;
        ctx.globalAlpha = 0.75;
        ctx.fill();
        ctx.globalAlpha = 1.0;
        ctx.fillStyle = '#8da7bc';
        ctx.fillText(stock, startX + 6, py);
      });
    }

    resize();
    requestAnimationFrame(render);
  </script>
</body>
</html>
